site_name: Connect Labs Help
site_description: User documentation for Connect Labs at labs.connect.dimagi.com
site_url: https://labs.connect.dimagi.com/labs/docs/help/

docs_dir: user_docs

# Connect Safe Mode is no longer shown to users: the restricted MCP address
# (/mcp/no_user_visit/) is the answer we give instead. Excluded rather than deleted
# so the engineering doc's history and docs/SAFE_MODE.md keep their context; nothing
# in the built site links to it, and it is unreachable by URL or search.
exclude_docs: |
  connect-safe-mode.md

theme:
  name: material
  palette:
    primary: blue
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Feature Guides:
      - Audit & QA Review: audit.md
      - Workflow Engine: workflow-engine.md
      - Task Management: task-management.md
      - Solicitations: solicitations.md
      - Simple Microplan: simple-microplan.md
      - AI Features: ai-features.md
  - For Power Users:
      - Reports with Claude: reports-with-claude.md
      - Data Spaces and Raw Data: data-spaces.md
      - The Semantic Layer: semantic-layer.md
      - Benchmarks: benchmarks.md
      - Shared Report Templates: shared-report-templates.md
      - Cross-Programme Reports: cross-program-rollups.md
      - Weekly Trends and Saved Runs: weekly-trends-and-snapshots.md
      - Connect MCP: connect-mcp.md
      - Synthetic Data: synthetic-data.md
      - Embedding Labs in Other Systems: embedding-labs.md
  # Technical pages for engineers on other systems (user_docs/developers/). Written by
  # hand with the interface they describe; never rewritten by automation/update_docs.py.
  - For Developers:
      - Overview: developers/index.md
      - 'Embedding Labs: Integration Guide': developers/embedding.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
