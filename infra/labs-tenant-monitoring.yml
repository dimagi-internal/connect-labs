AWSTemplateFormatVersion: '2010-09-09'

# Tenant alarms for the two application tiers that share the labs ALB and the
# labs RDS instance: canopy-web (/canopy/*) and ace-web (/ace/*).
#
# Why this exists. Until 2026-09-08 the only application-5xx alarm carried the
# bare LoadBalancer dimension, so it paged for any tenant and named none. #1631
# scoped it to the labs web target group — right for Umami, and it silently
# dropped the other two tenants from coverage entirely. Measured on the
# 2026-09-08 storage-full outage (labs-jj-postgres hit 0 bytes free; #1634): of
# ~1,250 target 5xx across the ALB in 45 minutes, canopy-web returned ~1,200
# (109, 373, 83, 217, 103, 25, 298 per 5-minute bucket), the labs web tier
# 1–17, Umami 2. canopy-web's database is on the same RDS instance, so every
# labs storage or connection failure is also a canopy-web outage — and
# canopy-web is the control plane that dispatches the agents who respond.
# After #1631, a repeat pages nobody. One alarm per tenant so the page names
# the service (the whole point of #1628).
#
# Why a separate stack, twice over. (1) The tenants' own templates deploy
# through github-actions-labs-deploy, which has no cloudwatch:* grant; an
# alarm resource there 403s the next deploy and rolls it back (recorded in
# canopy-web.cfn.yaml's target-group comment). This stack deploys by hand with
# an operator profile, like labs-monitoring.yml. (2) labs-monitoring.yml sits
# at CloudFormation's 51,200-byte inline-template limit, so these could not be
# added there without moving every deploy onto an S3 upload. Both reasons
# expire when the labs IaC split lands (canopy-web #729): move these into the
# app stacks once the deploy role carries cloudwatch:PutMetricAlarm.
#
# References, does not own: the ALB, both target groups, and the alert topic
# (imported from labs-monitoring.yml's labs-jj-alert-topic-arn export — so that
# stack must exist first, and cannot be deleted while this one stands).
Description: >-
  Labs tenant alarms: per-target-group application 5xx for canopy-web and
  ace-web, plus canopy-web no-healthy-targets, p95 latency and ECS CPU, publishing to the labs alert topic exported by labs-jj-monitoring.
  Companion to labs-monitoring.yml; see infra/README.md.

Parameters:
  LoadBalancerDimension:
    Type: String
    Default: app/labs-jj-alb/ffecbe258260c7ee
    Description: >-
      CloudWatch LoadBalancer dimension value for the labs ALB (the
      "app/<name>/<id>" suffix of the ALB ARN). Same value as
      labs-monitoring.yml's parameter of the same name.

  CanopyWebTargetGroupDimension:
    Type: String
    Default: targetgroup/labs-jj-canopy-web-tg/baefe18d4fed35b4
    Description: >-
      CloudWatch TargetGroup dimension value for canopy-web, the fleet control
      plane served at /canopy/*. Owned by the canopy-web CloudFormation stack
      (deploy/aws/canopy-web.cfn.yaml in that repo); referenced here.

  AceWebTargetGroupDimension:
    Type: String
    Default: targetgroup/labs-jj-ace-web-tg/02032962660ab09f
    Description: >-
      CloudWatch TargetGroup dimension value for ace-web, served at /ace/*.
      Owned by the ace-web CloudFormation stack; referenced here.

  TenantTarget5xxThreshold:
    Type: Number
    Default: 10
    Description: >-
      Alarm when a tenant target group returns this many 5xx in 5 minutes.
      Matches labs-monitoring.yml's Target5xxThreshold (re-derived 2026-09-09).
      Measured baselines: canopy-web had ONE non-zero 5-minute bucket (3) in
      the 14 days to 09-09 outside the 09-08 outage, during which it ran 83–373
      per bucket; ace-web's 14-day hourly maximum was 4. Both sit far below 10
      on a normal day, so 10 pages within five minutes of a real burst and on
      nothing else in the measured window.

  CanopyWebServiceName:
    Type: String
    Default: labs-jj-canopy-web
    Description: >-
      ECS service name for canopy-web in labs-jj-cluster (the AWS/ECS
      ServiceName dimension for the CPU alarm).

  CanopyWebP95ResponseSeconds:
    Type: Number
    Default: 10
    Description: >-
      Alarm when canopy-web's 5-minute p95 TargetResponseTime stays above this
      in 3 of 4 buckets. Its p95 is naturally high (long MCP and agent
      calls): replayed over 2026-11-11..11-25, the 5-minute p95 had a median of
      2.0s, p90 3.8s, p99 8.0s. At 10s the rule fires on two incidents in those
      14 days, both on 2026-11-24 (from 01:19Z and 13:39Z, the second during the
      HealthyHostCount dips); 8s/3-of-3 fired 5 times, 5s/3-of-3 11 times.

Resources:
  # ── canopy-web: down, slow, saturated (connect-labs, 2026-11-25) ─────
  # canopy-web had one alarm (5xx, below). On 2026-11-23 it ran at 80-92%
  # average CPU for hours and nothing fired. These three are the minimum set
  # that tells someone canopy-web is down, slow or out of headroom, each with
  # OKActions so recovery announces itself like the 5xx alarm.
  #
  # Down: 0 healthy targets in 2 of 3 minutes (labs-jj-web-no-healthy-targets'
  # shape, made M-of-N so one healthy blip mid-outage does not clear it). canopy-web
  # ran ONE task until autoscaling (min 2) landed; in the 14 days before, the
  # target group touched 0 healthy hosts in three isolated one-minute buckets
  # (11-23 17:38Z, 11-24 13:14Z and 13:48Z), none of which this would page on.
  CanopyWebNoHealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-canopy-web-no-healthy-targets
      AlarmDescription: >-
        canopy-web (the fleet control plane) has had no healthy target for 2 minutes:
        canopy-web is down, and with it agent dispatch. FIRST: aws ecs describe-services
        --profile labs-observe --region us-east-1 --cluster labs-jj-cluster --services
        labs-jj-canopy-web --query 'services[0].events[0:8].[createdAt,message]' --output
        text, then the labs-jj-rds alarm states (it shares labs-jj-postgres). A stuck deploy:
        gh run list -R dimagi-internal/canopy-web -w "Deploy to Labs (AWS)". Logs:
        /ecs/labs-jj-canopy-web (labs SSO). Runbook: docs/PERFORMANCE_RUNBOOK.md §10.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
        - Name: TargetGroup
          Value: !Ref CanopyWebTargetGroupDimension
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue labs-jj-alert-topic-arn]
      OKActions: [!ImportValue labs-jj-alert-topic-arn]

  CanopyWebSlowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-canopy-web-p95-slow
      AlarmDescription: >-
        canopy-web's p95 response time was above the threshold in 3 of 4 five-minute
        buckets. Its normal p95 is ~2s (p99 of buckets ~8s), so this is a real slowdown,
        not long agent calls. FIRST: aws cloudwatch describe-alarms --profile labs-observe
        --region us-east-1 --state-value ALARM --query 'MetricAlarms[].AlarmName' --output
        text. labs-jj-canopy-web-cpu-high too means saturated (autoscaling maxed at 4 tasks
        or not keeping up); labs-jj-rds-* means the shared database. Then name the slow route: Logs Insights on
        /labs-jj/observe/alb-requests (runbook docs/PERFORMANCE_RUNBOOK.md §10).
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
        - Name: TargetGroup
          Value: !Ref CanopyWebTargetGroupDimension
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 4
      DatapointsToAlarm: 3
      Threshold: !Ref CanopyWebP95ResponseSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue labs-jj-alert-topic-arn]
      OKActions: [!ImportValue labs-jj-alert-topic-arn]

  # Saturated: autoscaling tracks 55% average CPU across 2-4 tasks, so an
  # average at or above 85% for 15 minutes means it is maxed out or not keeping
  # up. The 14-day history below predates autoscaling (one task) and is not a
  # guide to how often this fires now.
  CanopyWebCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-canopy-web-cpu-high
      AlarmDescription: >-
        canopy-web's ECS service averaged >=85% CPU in 3 of 4 five-minute buckets. Autoscaling targets
        55% across 2-4 tasks, so it is at max capacity or failing to scale. FIRST: aws ecs
        describe-services --profile labs-observe --region us-east-1 --cluster
        labs-jj-cluster --services labs-jj-canopy-web --query
        'services[0].[desiredCount,runningCount]' (4 = maxed). Then what is busy: Logs
        Insights on /labs-jj/observe/alb-requests by route (runbook docs/PERFORMANCE_RUNBOOK.md
        §10). Scaling lives in the canopy-web stack, not here.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: labs-jj-cluster
        - Name: ServiceName
          Value: !Ref CanopyWebServiceName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 4
      DatapointsToAlarm: 3
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue labs-jj-alert-topic-arn]
      OKActions: [!ImportValue labs-jj-alert-topic-arn]

  # OKActions on purpose (unlike labs-jj-alb-target-5xx-high): a recovery on a
  # service nobody is watching in a browser should announce itself, matching
  # labs-jj-web-no-healthy-targets and labs-jj-rds-free-storage-low. The runner
  # suppresses the creation-time OK (canopy-web #713), so deploying does not
  # page.
  #
  # 3 of 4 buckets, not 1 of 1 (connect-labs #2454). canopy-web migrates before
  # cutover and accepts a brief error window, so its own deploys 5xx. Replayed
  # against every 5-minute bucket from 2026-09-01 to 2026-10-13 (441 deploys):
  #   1-of-1: 13 pages, 10 inside a deploy window, 2 isolated 12-count blips
  #   2-of-2:  5 pages, 4 of them deploys (09-13, 10-02, 10-04, 10-09 each ran
  #            two breaching buckets) - not enough
  #   3-of-4:  1 page, the 2026-09-08 storage-full outage (at 23:25Z, ten
  #            minutes after it went sustained, 25 after its first bucket)
  # No deploy in the window produced more than two breaching buckets. A deploy
  # that does (three slow buckets in a row) is worth a page anyway. The cost is
  # up to ~10 minutes of extra latency on a sustained outage.
  CanopyWebTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-canopy-web-target-5xx-high
      AlarmDescription: >-
        canopy-web (the fleet control plane) answered with 5xx in 3 of 4 five-minute
        buckets. Its database is labs-jj-postgres, so FIRST: aws cloudwatch
        describe-alarms --profile labs-observe --region us-east-1 --alarm-name-prefix
        labs-jj-rds --query 'MetricAlarms[].[AlarmName,StateValue]' --output text (on
        2026-09-08 a full disk showed up here as ~1,200 5xx in 45 minutes). Its own
        deploys 5xx for up to two buckets (it migrates before cutover; 2026-10-09 ran
        62 then 89), so a third means a stuck deploy or a real fault: gh run list -R
        dimagi-internal/canopy-web -w "Deploy to Labs (AWS)". If neither, name the
        failing route (no SSO): runbook §10, Logs Insights on /labs-jj/observe/alb-requests.
        Traceback: /ecs/labs-jj-canopy-web (labs SSO). Runbook: docs/PERFORMANCE_RUNBOOK.md §10.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
        - Name: TargetGroup
          Value: !Ref CanopyWebTargetGroupDimension
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 4
      DatapointsToAlarm: 3
      Threshold: !Ref TenantTarget5xxThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue labs-jj-alert-topic-arn]
      OKActions: [!ImportValue labs-jj-alert-topic-arn]

  AceWebTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-ace-web-target-5xx-high
      AlarmDescription: >-
        ace-web (/ace/*) answered with 5xx: the app returned errors, not the ALB
        failing to reach it. It shares the ALB and labs-jj-postgres with labs and
        canopy-web. FIRST: aws cloudwatch describe-alarms --profile labs-observe
        --region us-east-1 --state-value ALARM --query 'MetricAlarms[].AlarmName'
        --output text. RDS or canopy-web alarms firing too means the shared tier, not
        ace-web. Otherwise read /ecs/labs-jj-ace-web (labs SSO). Runbook:
        docs/PERFORMANCE_RUNBOOK.md §10.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
        - Name: TargetGroup
          Value: !Ref AceWebTargetGroupDimension
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref TenantTarget5xxThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue labs-jj-alert-topic-arn]
      OKActions: [!ImportValue labs-jj-alert-topic-arn]

Outputs:
  CanopyWebTarget5xxAlarmName:
    Value: !Ref CanopyWebTarget5xxAlarm
  AceWebTarget5xxAlarmName:
    Value: !Ref AceWebTarget5xxAlarm
