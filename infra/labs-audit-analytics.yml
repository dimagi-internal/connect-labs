AWSTemplateFormatVersion: '2010-09-09'

# Labs audit-trail + first-party analytics infrastructure — second IaC slice
# (see infra/README.md and labs-monitoring.yml for the pattern: standalone
# stack that owns the NEW layer and references — does not own — the core
# infra created out-of-band).
#
# This stack owns:
#   - the self-hosted Umami analytics service (log group, target group, ALB
#     path rule /umami/*, task definition, ECS service)
#   - the CodeBuild project (+ its role) that builds the custom Umami image
#     (BASE_PATH=/umami must be baked at build time — Next.js basePath)
#   - the IAM inline policies that grant the existing ECS task role write
#     access to the audit-archive bucket and the existing execution role read
#     access to the Umami secrets
#
# Referenced, NOT owned (stateful / created out-of-band — creation commands
# documented in infra/README.md):
#   - s3://labs-jj-audit-archive — Object Lock COMPLIANCE mode (6y) bucket;
#     deliberately not in CF: objects are legally undeletable, so stack
#     deletion must never be able to touch it
#   - Secrets Manager: labs-jj-umami-database-url, labs-jj-umami-app-secret
#   - ECR repo labs-jj-umami (holds the built image)
#   - ALB listener, ECS cluster, subnets, security groups, IAM roles
#
# Umami DATABASE_URL note: RDS forces TLS but presents the RDS CA. Two
# different clients inside Umami parse the URL (node-pg's check-db and
# Prisma's engine), so the secret carries BOTH dialects' opt-outs:
#   ?sslmode=no-verify&sslaccept=accept_invalid_certs
# (encrypted, CA verification skipped — in-VPC traffic; same posture as the
# Django app's own RDS connection).
Description: >-
  Labs audit-trail + analytics layer: self-hosted Umami on ECS Fargate behind
  the existing ALB at /umami/*, the CodeBuild image pipeline for it, and IAM
  policies for the audit-archive S3 bucket. References (does not own) the
  Object-Locked archive bucket, secrets, ECR repo, and core cluster/ALB/roles.

Parameters:
  ClusterName:
    Type: String
    Default: labs-jj-cluster
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-024df4c7bcc30cb01
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-06646effb09be2f42,subnet-08a18eb47b48aff54
  ServiceSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0666a5ed512c97d9d
    Description: >-
      Existing ECS task security group (already allows 3000 from the ALB SG).
  HttpsListenerArn:
    Type: String
    Default: >-
      arn:aws:elasticloadbalancing:us-east-1:858923557655:listener/app/labs-jj-alb/824625237/None
    Description: >-
      Overridden at deploy time (see infra/README.md) — the 443 listener of
      labs-jj-alb.
  ListenerRulePriority:
    Type: Number
    Default: 40
  # The upstream release to build. MUST be a real git tag, never a branch.
  #
  # This was `git clone --depth 1` off the default branch with no ref at all,
  # which is not "we track latest" — it is "the running version is whatever main
  # happened to be at build time, and nothing records which." Measured
  # 2026-09-05: the one and only image was built 2026-07-24 from b70eda56, a
  # commit a month PAST the v3.2.0 tag and 18 days BEFORE v3.3.0. Its
  # package.json still said "3.2.0", so the version string the container reports
  # was actively wrong — an unreleased intermediate state wearing the previous
  # release's number. That is the failure mode an unpinned build produces: not a
  # missing answer, a confident wrong one.
  #
  # It also cost a real bug. Umami fixed the concurrent-beacon P2002 race on
  # SessionData in 7c030e4c (2026-07-30, "fix unique constraint on relational
  # session data", upstream #4183) — seven days after our build. connect-labs
  # #1396 chased it as an open question for four days because the repo could not
  # say what version was running.
  UmamiVersion:
    Type: String
    Default: v3.3.1
    AllowedPattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    Description: >-
      Upstream umami-software/umami release tag to build (e.g. v3.3.1).
      Bumping this is a DELIBERATE upgrade: see infra/README.md § Upgrading
      Umami — releases carry Prisma migrations that apply on container start.
  UmamiDatabaseUrlSecretArn:
    Type: String
    Default: >-
      arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-umami-database-url-ryVTel
  UmamiAppSecretArn:
    Type: String
    Default: >-
      arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-umami-app-secret-ZOj9HE
  TaskRoleName:
    Type: String
    Default: labs-jj-ecs-task-role
    Description: Existing ECS task role (app runtime permissions).
  ExecutionRoleName:
    Type: String
    Default: labs-jj-ecs-task-execution-role
    Description: Existing ECS execution role (image pull + secrets injection).
  AuditArchiveBucketName:
    Type: String
    Default: labs-jj-audit-archive
    Description: Existing Object-Locked audit archive bucket (referenced only).

Resources:
  # ── IAM: audit-archive access for the app (web + worker tasks) ────────
  # The nightly archive task PUTs JSONL+digest objects and HEADs them before
  # pruning hot rows. Deliberately NO s3:DeleteObject — Object Lock blocks it
  # anyway; least privilege keeps the intent visible.
  TaskRoleAuditArchivePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: labs-audit-archive
      Roles: [!Ref TaskRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['s3:PutObject', 's3:GetObject']
            Resource: !Sub 'arn:aws:s3:::${AuditArchiveBucketName}/audit-events/*'
          - Effect: Allow
            Action: ['s3:ListBucket']
            Resource: !Sub 'arn:aws:s3:::${AuditArchiveBucketName}'

  # ── IAM: umami secret injection for the execution role ────────────────
  ExecutionRoleUmamiSecretsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: umami-secrets
      Roles: [!Ref ExecutionRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['secretsmanager:GetSecretValue']
            Resource:
              - !Ref UmamiDatabaseUrlSecretArn
              - !Ref UmamiAppSecretArn
              # Admin password, injected into the labs web task so
              # /labs/analytics/ can read the Umami REST API server-side.
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:labs-jj-umami-admin-password-*'

  # ── Umami: logs ───────────────────────────────────────────────────────
  UmamiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/labs-jj-umami
      RetentionInDays: 30

  # ── Umami: load balancing ─────────────────────────────────────────────
  UmamiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: labs-jj-umami-tg
      Protocol: HTTP
      Port: 3000
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /umami/api/heartbeat
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2

  UmamiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          Values: ['/umami', '/umami/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref UmamiTargetGroup

  # ── Umami: ECS ────────────────────────────────────────────────────────
  UmamiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: labs-jj-umami
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ExecutionRoleName}'
      ContainerDefinitions:
        - Name: umami
          # DERIVED from UmamiVersion, never a free-form parameter. This is the
          # structural half of the version pin: a `UmamiImageUri` that could be
          # set independently is exactly how the task definition came to
          # advertise v3.3.1 while running a 2026-07-24 image (#1439). One knob
          # now moves both the image and the label, so drift is not a thing to
          # remember -- it is unrepresentable.
          #
          # Emergency rollback to the PRE-PIN image (the unversioned 2026-07-24
          # build, kept addressable as :pre-pin-2026-07-24) is deliberately NOT
          # expressible here -- it has no release tag and never should. Do it
          # out-of-band with a one-off register-task-definition; ordinary
          # rollback is UmamiVersion -> an earlier release tag.
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/labs-jj-umami:${UmamiVersion}'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              HostPort: 3000
              Protocol: tcp
          Environment:
            - Name: DATABASE_TYPE
              Value: postgresql
            - Name: DISABLE_TELEMETRY
              Value: '1'
            # Safe ONLY because the Image above is derived from this same
            # parameter. Shipped in #1438 while the image was still `:latest`,
            # it read v3.3.1 over a 2026-07-24 container and was reverted the
            # same hour (#1439). It is back because the two are now one knob.
            - Name: UMAMI_BUILD_VERSION
              Value: !Ref UmamiVersion
            # Purely so `aws ecs describe-task-definition` can answer "what
            # version is running". Umami's own package.json cannot: at the
            # 2026-07-24 build it read "3.2.0" while the source was a month of
            # unreleased post-v3.2.0 main. Reading the version from INSIDE the
            # app is therefore not a fallback for this -- it is the thing that
            # was wrong. This value is what the image was actually built from.
            - Name: UMAMI_BUILD_VERSION
              Value: !Ref UmamiVersion
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref UmamiDatabaseUrlSecretArn
            - Name: APP_SECRET
              ValueFrom: !Ref UmamiAppSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref UmamiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: umami

  UmamiService:
    Type: AWS::ECS::Service
    DependsOn: UmamiListenerRule
    Properties:
      ServiceName: labs-jj-umami
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref UmamiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroupId]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - TargetGroupArn: !Ref UmamiTargetGroup
          ContainerName: umami
          ContainerPort: 3000

  # ── Umami image build (rerun on upgrades) ─────────────────────────────
  # BASE_PATH is a Next.js build-time value, so the stock ghcr image cannot
  # serve under /umami — this project clones upstream and bakes it in.
  # Rebuild + force-new-deployment on the service to upgrade Umami.
  UmamiBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: labs-jj-codebuild-umami
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: umami-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ecr:GetAuthorizationToken']
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/labs-jj-umami'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/labs-jj-umami-build*'

  UmamiBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: labs-jj-umami-build
      ServiceRole: !GetAtt UmamiBuildRole.Arn
      TimeoutInMinutes: 45
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_LARGE
        PrivilegedMode: true
      Source:
        Type: NO_SOURCE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                # --branch takes a TAG as well as a branch. Pinned, so a rebuild
                # reproduces the same image instead of silently advancing main.
                - git clone --depth 1 --branch ${UmamiVersion} https://github.com/umami-software/umami.git /tmp/umami
                # Fail loudly if the tag ever moved: a rebuild that silently
                # builds different source is the whole problem being fixed here.
                - cd /tmp/umami && git describe --exact-match --tags HEAD
            build:
              commands:
                - cd /tmp/umami
                # Tag with the VERSION as well as :latest. Previously only
                # :latest existed, so there was exactly one image in ECR and no
                # rollback target -- an upgrade was a one-way door.
                - docker build --build-arg BASE_PATH=/umami -t ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/labs-jj-umami:${UmamiVersion} -t ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/labs-jj-umami:latest .
            post_build:
              commands:
                - docker push ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/labs-jj-umami:${UmamiVersion}
                - docker push ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/labs-jj-umami:latest

Outputs:
  UmamiUrl:
    Value: https://labs.connect.dimagi.com/umami
    Description: Umami dashboard (login is local to Umami; rotate admin pw).
  UmamiTargetGroupArn:
    Value: !Ref UmamiTargetGroup
