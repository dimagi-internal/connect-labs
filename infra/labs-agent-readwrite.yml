AWSTemplateFormatVersion: '2010-09-09'

# Labs agent read-write role (canopy `labs-readwrite`): what an AI agent uses
# when it must be fully operational in labs: debug, deploy, fix. It is the
# `labs` SSO profile cleaned up (Jonathan, 2026-11-24): AWS's
# AdministratorAccess, so raw logs, ECS, RDS, S3, CloudFormation and IAM roles
# all work as they do for a person, minus a short list of guardrails no
# debugging or deploy needs:
#
#   * no Organizations, account or Identity Center change;
#   * no IAM users, access keys, login profiles or identity providers: nothing
#     long-lived that outlives the one-hour session;
#   * no change to the access roles themselves (the agent roles, labs-read,
#     canopy-web's task role, SSO roles) or their policies, so an agent cannot
#     widen its own or another's access;
#   * no CloudTrail stop/delete/update, so every call stays on the record;
#   * production data stays in the account and recoverable: labs-jj-postgres
#     cannot be deleted, automated backups, clusters and snapshots an agent did
#     not make cannot be deleted, and no snapshot is shared or exported.
#
# Its read-only sibling is `labs-read` = labs-jj-observe-readonly
# (labs-observe-readonly.yml): AWS ReadOnlyAccess without secret values.
#
# Who. canopy-web vends it only on a person's passkey-approved grant (or to an
# agent listed as standing). Trust names canopy-web's task role, its sealed role
# key (`canopy-sealed-labs-readwrite`, canopy-sealed-keys.yml: the key an
# approver's browser opens, so canopy-web never holds a usable one) and Identity
# Center users, and every assume must set a SourceIdentity starting `canopy-`
# (canopy-web sets `canopy-agent-<slug>`; it is sticky, so CloudTrail names the
# agent on every call made with these keys). The cloud runners' box brokers are
# NOT trusted: they cannot verify which agent is asking. Sessions last 1 hour.
#
# The labs-jj-agent-pgclient task (a psql box with no secrets and no task role)
# stays as a convenience for querying agent-made database copies.
#
#   aws cloudformation deploy --profile labs --region us-east-1 \
#     --stack-name labs-jj-agent-readwrite \
#     --template-file infra/labs-agent-readwrite.yml \
#     --capabilities CAPABILITY_NAMED_IAM

Description: >-
  Labs agent read-write role (labs-jj-agent-readwrite, canopy labs-readwrite):
  AdministratorAccess minus guardrails (no org/SSO/IAM-user changes, no edits
  to the access roles, no audit tampering, production DB and backups not
  deletable, no snapshot sharing).

Parameters:
  RoleName:
    Type: String
    Default: labs-jj-agent-readwrite
    Description: Name of the role (and the prefix of its managed policies).

  ProductionDbInstance:
    Type: String
    Default: labs-jj-postgres
    Description: The production instance. Never deleted by an agent.

  PgClientImage:
    Type: String
    Default: public.ecr.aws/docker/library/postgres:18
    Description: >-
      Image of the one-off client task. psql must be at least the newest
      server major it will talk to.

  BrokerRoleName:
    Type: String
    Default: canopy-web-task-role
    Description: canopy-web's ECS task role, which vends this role to agents.

  AllowSsoUsers:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      'true' lets an IAM Identity Center role chain into this role (with a
      canopy- SourceIdentity), so a person can test it.

Conditions:
  TrustSso: !Equals [!Ref AllowSsoUsers, 'true']

Resources:
  PgClientLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /labs-jj/agent/pgclient
      RetentionInDays: 14

  PgClientExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${RoleName}-pgclient-exec'
      Description: Execution role of labs-jj-agent-pgclient (pull a public image, write its logs).
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${PgClientLogGroup.Arn}'

  # A psql box with no secrets and no task role: it can reach what the security
  # group the caller passes can reach, and nothing in AWS. The caller supplies
  # the command (overrides) and the connection details; for a restored copy,
  # set its master password with ModifyDBInstance first.
  PgClientTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: labs-jj-agent-pgclient
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt PgClientExecutionRole.Arn
      ContainerDefinitions:
        - Name: pgclient
          Image: !Ref PgClientImage
          Essential: true
          EntryPoint: [sh, -c]
          Command: ['psql --version']
          StopTimeout: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PgClientLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: pgclient

  ReadWriteDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RoleName}-deny'
      # Description is frozen: changing it REPLACES a named managed policy, and
      # the replacement collides with its own name. The document below is current.
      Description: >-
        Backstop for labs-jj-agent-readwrite: production never changes, no
        IAM/Organizations/Identity Center change, no snapshot sharing, no audit
        change, and labs-read's sensitive-read denies.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: NoOrganizationAccountOrIdentityCenter
            Effect: Deny
            Action:
              - organizations:*
              - account:*
              - sso:*
              - sso-directory:*
              - identitystore:*
            Resource: '*'
          - Sid: NoLongLivedCredentials
            Effect: Deny
            Action:
              - iam:CreateUser
              - iam:CreateAccessKey
              - iam:UpdateAccessKey
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
              - iam:CreateServiceSpecificCredential
              - iam:UploadSSHPublicKey
              - iam:UploadSigningCertificate
              - iam:AddUserToGroup
              - iam:AttachUserPolicy
              - iam:PutUserPolicy
              - iam:CreateSAMLProvider
              - iam:UpdateSAMLProvider
              - iam:CreateOpenIDConnectProvider
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
            Resource: '*'
          # The roles that decide who reaches labs, and their policies: read
          # and pass them, never change them.
          - Sid: NoChangingAccessRoles
            Effect: Deny
            NotAction:
              - iam:Get*
              - iam:List*
              - iam:PassRole
              - iam:GenerateServiceLastAccessedDetails
              - iam:Simulate*
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/labs-jj-agent-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/labs-jj-observe-readonly'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BrokerRoleName}'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/labs-jj-agent-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/labs-jj-observe-readonly*'
              # canopy's sealed role keys (canopy-sealed-keys.yml): never deleted,
              # re-keyed or given more rights by an agent.
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/canopy-sealed/*'
          - Sid: NoAuditTampering
            Effect: Deny
            Action:
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:PutEventSelectors
              - cloudtrail:PutInsightSelectors
            Resource: '*'
          - Sid: ProductionDatabaseNotDeletable
            Effect: Deny
            Action: rds:DeleteDBInstance
            Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${ProductionDbInstance}'
          - Sid: NoDeletingSnapshotsAgentsDidNotMake
            Effect: Deny
            Action: rds:DeleteDBSnapshot
            NotResource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:labs-jj-agent-*'
          - Sid: NoBackupOrClusterDeletes
            Effect: Deny
            Action:
              - rds:DeleteDBCluster
              - rds:DeleteDBClusterSnapshot
              - rds:DeleteGlobalCluster
              - rds:DeleteDBInstanceAutomatedBackup
            Resource: '*'
          # A snapshot of production is production data: it stays in the account.
          - Sid: NoSnapshotSharingOrExport
            Effect: Deny
            Action:
              - rds:ModifyDBSnapshotAttribute
              - rds:ModifyDBClusterSnapshotAttribute
              - rds:StartExportTask
            Resource: '*'

  ReadWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >-
        Labs agent read-write (canopy: labs-readwrite). AdministratorAccess
        minus guardrails; production DB and backups kept.
      # Eight hours: a session the approver's browser makes with the sealed key
      # (canopy-sealed-keys.yml) covers a whole grant (480 minutes at most) in one
      # touch. A session canopy-web or a person chains into this role is still an
      # hour at most: STS caps every role-chained session there.
      MaxSessionDuration: 28800
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess'
        - !Ref ReadWriteDenyPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Two statements, not one: AWS authorizes sts:TagSession as its own
          # action, and the sts:SourceIdentity key is absent when it does, so a
          # SourceIdentity condition on TagSession refuses every tagged assume
          # (canopy-web always tags: agent, caller). The session still cannot
          # exist without a canopy- SourceIdentity: AssumeRole carries that test.
          - Sid: CanopyWebAndPeopleWithASourceIdentity
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sts:AssumeRole
              - sts:SetSourceIdentity
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BrokerRoleName}'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/canopy-sealed/canopy-sealed-labs-readwrite'
                  - !If
                    - TrustSso
                    - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*'
                    - !Ref AWS::NoValue
              StringLike:
                sts:SourceIdentity: canopy-*
          - Sid: SameCallersMayTagTheSession
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:TagSession
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BrokerRoleName}'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/canopy-sealed/canopy-sealed-labs-readwrite'
                  - !If
                    - TrustSso
                    - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*'
                    - !Ref AWS::NoValue
      Tags:
        - { Key: purpose, Value: labs-agent-readwrite }

Outputs:
  RoleArn:
    Description: Role an agent assumes to change labs (canopy name labs-readwrite).
    Value: !GetAtt ReadWriteRole.Arn
    Export:
      Name: labs-jj-agent-readwrite-role-arn
  PgClientTaskDefinition:
    Description: psql client task for querying agent-made database copies.
    Value: !Ref PgClientTaskDefinition
