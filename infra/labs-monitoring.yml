AWSTemplateFormatVersion: '2010-09-09'

# Labs operational guardrails — first slice of infrastructure-as-code for the
# connect-labs AWS environment. Standalone monitoring stack: an SNS alert topic
# + a minimal, grounded CloudWatch alarm set that turns the RDS connection-leak /
# slot-exhaustion failure mode (the 2026-06-29 incident; leak fixed in PR #765)
# into an operator signal BEFORE it causes a site-wide outage.
#
# This stack deliberately does NOT own the core infra (RDS instance, ECS
# cluster/services, ALB, redis, IAM) — those were created out-of-band and are
# referenced here by name/id, so the stack is safe to create/update/delete on
# its own. Bringing the core under CloudFormation is a later slice. Modeled on
# dimagi-rad/scout's infra/scout-stack.yml monitoring block. See infra/README.md
# for the deploy command.
Description: >-
  Labs operational guardrails (monitoring): SNS alert topic plus CloudWatch
  alarms over RDS (connections, slot exhaustion, free storage), the web tier
  (CPU, ALB p95 latency, ELB 5xx, target 5xx, healthy targets) and AI
  image-audit runs (empty audits, classifier saturation). Standalone stack that
  references (does not own) the existing RDS instance, ECS services and log
  groups. Tenant alarms: labs-tenant-monitoring.yml. See PR #765.

Parameters:
  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Email address that receives CloudWatch alarm notifications (the
      subscription must be confirmed via the email AWS sends). Leave blank to
      create the alarms + SNS topic without an email subscription (alarms still
      fire to the topic; wire Slack/another endpoint to it later).

  AgentAlarmEmail:
    Type: String
    Default: hal@dimagi-ai.com
    Description: >-
      Second alarm recipient — an agent mailbox that can CONFIRM its own
      subscription. SNS email subscriptions are inert until someone clicks the
      confirmation link, and a Google Group cannot: the group's default posting
      policy rejects mail from an external sender (AWS SNS), so the confirmation
      never lands, and even when it does no member owns clicking it. The link
      also expires in 3 days. Result was a topic with zero confirmed
      subscribers — alarms fired into nothing. An agent mailbox reads its own
      inbox and confirms via the API, so this path stays live. Set to '' to
      skip.

  DbInstanceIdentifier:
    Type: String
    Default: labs-jj-postgres
    Description: RDS instance whose DatabaseConnections metric is alarmed.

  RdsFreeStorageThresholdBytes:
    Type: Number
    Default: 21474836480 # 20 GiB = 20% of the 100GB volume
    Description: >-
      Alarm when RDS FreeStorageSpace falls below this many bytes for 10
      minutes. Sized as ~20% of allocated (100GB as of 2026-09-08), not as a
      round byte count: the visit caches hold ~9GB at peak, so 20GB leaves
      genuine room to act. Re-derive it if AllocatedStorage changes — a fixed
      byte threshold silently becomes a cliff-edge alarm on a bigger volume.
      Origin: 2026-09-08, the instance hit storage-full with no storage alarm
      of any kind and labs went down.

  DbConnectionsThreshold:
    Type: Number
    Default: 90
    Description: >-
      Alarm when DatabaseConnections exceeds this for 10 minutes. Was 120 and
      never fired: the 2026-07-29 incident peaked at 106 and sat in the 90s for
      50 minutes, entirely under the old threshold. Steady state is 5-15, so 90
      is ~6x headroom over normal while actually catching that shape.

      The instance was db.t3.small with ~155 usable slots when this was written.
      On 2026-08-18 it was resized to db.m6g.large and max_connections rose to
      829 (the default parameter group derives it from instance memory), so the
      ceiling moved but the threshold deliberately did NOT: this alarm exists to
      catch a LEAK CLIMBING, and the thing that makes 90 the right number is
      steady state being 5-15, not how far away the ceiling is. Raising it in
      proportion to the new ceiling would only delay the warning.

  WebLogGroupName:
    Type: String
    Default: /ecs/labs-jj-web
    Description: CloudWatch log group for the web (gunicorn/uvicorn) service.

  WorkerLogGroupName:
    Type: String
    Default: /ecs/labs-jj-worker
    Description: CloudWatch log group for the celery worker/beat service.

  DeployRoleName:
    Type: String
    Default: github-actions-labs-deploy
    Description: >-
      Existing GitHub Actions OIDC role (referenced, not owned). Granted
      read-only access to the ECS log groups so the "Run Labs management
      command" workflow can echo a one-off task's output into the Actions log.

  ClusterName:
    Type: String
    Default: labs-jj-cluster
    Description: ECS cluster hosting the web and worker services.

  WebServiceName:
    Type: String
    Default: labs-jj-web
    Description: ECS service for the web tier (the one that saturates).

  LoadBalancerDimension:
    Type: String
    Default: app/labs-jj-alb/ffecbe258260c7ee
    Description: >-
      CloudWatch LoadBalancer dimension value for the labs ALB (the
      "app/<name>/<id>" suffix of the ALB ARN, not the ARN itself).

  TargetGroupDimension:
    Type: String
    Default: targetgroup/labs-jj-target-group/d844a0f01a3b9e70
    Description: >-
      CloudWatch TargetGroup dimension value for the web target group.

  WebCpuThreshold:
    Type: Number
    Default: 90
    Description: >-
      Alarm when the BUSIEST web task stays at/above this for 15 of the last 25
      minutes (the alarm uses Maximum, not Average, and 3-of-5 datapoints rather
      than 3-of-3 — see WebCpuHighAlarm). Median web CPU
      over the 5 days to 2026-07-29 was 0.8%; above 90% accounts for ~1.1h of
      those 5 days and is almost entirely the incident itself.

  LatencyP95Threshold:
    Type: Number
    Default: 10
    Description: >-
      Alarm when the labs web target group's p95 response time (seconds) is
      above this in 3 of 5 judged 5-minute periods (see LatencyMinRequests).

  LatencyMinRequests:
    Type: Number
    Default: 40
    Description: >-
      A 5-minute period is judged for latency only if the labs web target group
      served at least this many requests; below it p95 is one or two slow
      requests, not "users waiting" (#2768). 40 is the knee of a replay over the
      14 days to 2026-10-29 (alarm PR): 0 pages 26x (21 cleared within 5 min),
      20 pages 12x, 40-60 page 6x (5 real slowdowns), 75+ flaps again. 0 turns
      the gate off.

  Elb5xxThreshold:
    Type: Number
    Default: 25
    Description: >-
      Alarm when the ALB itself returns this many 5xx in 5 minutes. ELB-generated
      5xx (as opposed to target 5xx) mean the ALB could not get a usable response
      — the shape seen during the incident, which peaked at 84.

  Target5xxThreshold:
    Type: Number
    Default: 10
    Description: >-
      Alarm when the WEB TIER returns this many 5xx in 5 minutes. Pairs with
      Elb5xxThreshold: opposite failures, neither substitutes. Was 25, derived
      from the 08-31 UMAMI incident this alarm no longer watches, with a caveat
      to re-derive it from web-target-group history. Re-derived 2026-09-09:
      over the 5 days to 09-09 15:00Z the web target group had 20 non-zero
      5-minute buckets of 1440, max 5; 14-day hourly max outside an incident 7.
      In the 2026-09-08 storage-full outage (#1634) it peaked at 17 per bucket
      (17, 13, 17) — at 25 this alarm would NOT have paged for labs' share of
      that outage; at 10 it fires on all three buckets and zero baseline ones.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasAgentAlarmEmail: !Not [!Equals [!Ref AgentAlarmEmail, '']]

Resources:
  # ── IAM: let CI read a one-off task's log stream ───────────────────
  # The "Run Labs management command" workflow runs a command as a one-off
  # Fargate task and echoes its stdout/stderr into the Actions log. The deploy
  # role had NO logs:* permission, so that read failed with AccessDenied on
  # every run — and because the call swallowed stderr, the workflow reported
  # "(no log events found)" instead. A failing command showed an exit code and
  # nothing else; its traceback had to be fetched from CloudWatch by hand.
  #
  # Read-only, and scoped to the two ECS log groups this stack already knows
  # about — CI can read task output, and nothing else.
  DeployRoleLogReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: labs-ecs-log-read
      Roles: [!Ref DeployRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'logs:GetLogEvents'
              - 'logs:FilterLogEvents'
              - 'logs:DescribeLogStreams'
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WebLogGroupName}:*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WorkerLogGroupName}:*'

  # Lets deploy-labs.yml open the CPU-alarm suppression window (the
  # DeployInProgress datapoints DeployInProgressAlarm watches). PutMetricData
  # takes no resource ARN — it is scoped by namespace condition instead, so this
  # grant is confined to the LabsDeploy namespace and cannot be used to forge or
  # overwrite AWS/ECS, AWS/RDS or any other metric the alarms here depend on.
  #
  # Added 2026-09-06 after the first real run of that step failed with
  # "not authorized to perform: cloudwatch:PutMetricData". Worth stating plainly:
  # the deploy role's permissions are NOT inferable from the workflow file, and a
  # step that calls a new AWS API is a new permission until proven otherwise.
  DeployRolePutDeployMetricPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: labs-deploy-put-deploy-metric
      Roles: [!Ref DeployRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: 'cloudwatch:PutMetricData'
            Resource: '*'
            Condition:
              StringEquals:
                'cloudwatch:namespace': 'LabsDeploy'

  # ── Alert topic ────────────────────────────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: labs-jj-alerts
      DisplayName: Labs Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # The subscriber that is actually confirmed and receiving. Subscribe is
  # idempotent for the same topic+protocol+endpoint, so this adopts the live
  # subscription rather than creating a duplicate.
  AgentAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAgentAlarmEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AgentAlarmEmail

  # ── RDS connection-count alarm (the primary early-warning) ──────────
  # The 2026-06-29 incident climbed 43 -> 87 -> exhaustion with NO alert.
  # This is the signal that was missing. Maximum (not Average) so a spike
  # within the period is caught.
  DatabaseConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-rds-connections-high
      AlarmDescription: >-
        RDS DatabaseConnections over 90 (steady state 5-15, ceiling ~829). Usually a
        symptom: each slow web request holds a connection, so a pile-up shows here
        first; a leak (PR #765) climbs without dipping. FIRST: aws cloudwatch
        get-metric-statistics --profile labs-observe --region us-east-1 --namespace
        AWS/RDS --metric-name DatabaseConnections --dimensions
        Name=DBInstanceIdentifier,Value=labs-jj-postgres --statistics Maximum --period
        60 --start-time <page-3h>Z --end-time <page>Z, then web CPU (python3
        tools/perf_triage.py --hours 3). Runbook: docs/PERFORMANCE_RUNBOOK.md §4.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstanceIdentifier
      Statistic: Maximum
      Period: 300
      # 2-of-4, NOT 2-of-2 — same reasoning as the web-CPU alarm below, applied
      # to the rest of the file. Omitting DatapointsToAlarm makes
      # EvaluationPeriods do double duty: 2 breaching periods to fire, and a
      # SINGLE sub-threshold datapoint to clear. A connection count oscillating
      # around the threshold then emits an ALARM/OK pair every few minutes
      # instead of one incident.
      #
      # Fires on the same 2 breaching datapoints as before (marginally earlier,
      # since they need not be consecutive); it simply refuses to resolve on one
      # dip. A leak climbing toward exhaustion does not dip its way to healthy.
      EvaluationPeriods: 4
      DatapointsToAlarm: 2
      Threshold: !Ref DbConnectionsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── Slot-exhaustion log detector (precise terminal-symptom signal) ──
  # When the pool IS exhausted, Postgres rejects new connections with
  # "remaining connection slots are reserved for roles ...". Metric filters
  # on the web + worker log groups feed one metric so the alarm fires no
  # matter which process sees the rejection first.
  WebConnSlotExhaustionMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogGroupName
      FilterPattern: '"remaining connection slots are reserved"'
      MetricTransformations:
        - MetricNamespace: Labs/RDS
          MetricName: ConnectionSlotExhaustion
          MetricValue: '1'
          DefaultValue: 0

  WorkerConnSlotExhaustionMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      FilterPattern: '"remaining connection slots are reserved"'
      MetricTransformations:
        - MetricNamespace: Labs/RDS
          MetricName: ConnectionSlotExhaustion
          MetricValue: '1'
          DefaultValue: 0

  ConnSlotExhaustionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-rds-slot-exhaustion
      AlarmDescription: >-
        Postgres is rejecting connections ("remaining connection slots are
        reserved"): the pool is exhausted now and requests are failing, the terminal
        symptom of a leak or a pile-up. FIRST: aws cloudwatch get-metric-statistics
        --profile labs-observe --region us-east-1 --namespace AWS/RDS --metric-name
        DatabaseConnections --dimensions Name=DBInstanceIdentifier,Value=labs-jj-postgres
        --statistics Maximum --period 60 --start-time <page-1h>Z --end-time <page>Z,
        read against the ~829-slot ceiling. Runbook: docs/PERFORMANCE_RUNBOOK.md §4.
      Namespace: Labs/RDS
      MetricName: ConnectionSlotExhaustion
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ── RDS free storage ──────────────────────────────────────────────
  # On 2026-09-08 labs-jj-postgres ran OUT OF DISK and took labs down, and
  # NOTHING here noticed: this file alarmed on connections and slot
  # exhaustion but never on space. FreeStorageSpace fell 4.9GB -> 0 over
  # eleven hours — the slowest, most predictable failure a database has —
  # and the first signal anyone got was a target-5xx page at 23:03Z, after
  # the disk was already full.
  #
  # It is also SELF-SUSTAINING, which is why it warrants its own alarm
  # rather than being left to the 5xx page. CELERY_BEAT_SCHEDULER is
  # django_celery_beat's DatabaseScheduler, so beat persists last_run_at to
  # Postgres; on a full disk that write fails and beat stops dispatching.
  # The hourly cleanup_expired_sql_cache — the one job that frees space — is
  # therefore the first casualty. Measured: its last_run_at froze at exactly
  # 23:00:00Z, the hour the disk hit zero, and it missed 00:00. A full disk
  # disables its own remedy, so nothing self-heals and only a human resize
  # ends it.
  #
  # Threshold is a PERCENTAGE of allocated, not a fixed byte count, so it
  # keeps meaning something as the volume grows (storage autoscaling was
  # switched on at the same time, max 500GB). 20% of a 100GB volume is 20GB
  # — comfortably more than the ~9GB the visit caches hold at peak, so this
  # fires with room to act rather than at the cliff edge.
  RdsFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-rds-free-storage-low
      AlarmDescription: >-
        RDS free storage is under 20% of allocated. A full disk takes labs down and
        stops the hourly cache cleanup that would free it (beat's DatabaseScheduler
        cannot write), so it does not recover on its own. FIRST, has autoscaling hit
        its ceiling: aws rds describe-db-instances --profile labs-observe --region
        us-east-1 --db-instance-identifier labs-jj-postgres --query
        'DBInstances[0].[AllocatedStorage,MaxAllocatedStorage]'. Then FreeStorageSpace
        Minimum at --period 3600 over 24h for the rate. labs_raw_visit_cache is
        normally the largest table. Runbook: docs/PERFORMANCE_RUNBOOK.md §4.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstanceIdentifier
      Statistic: Minimum
      Period: 300
      # 2-of-3, NOT 2-of-2 — the N-of-N defect fixed file-wide in #1419/#1429.
      # It matters here: the hourly cleanup_expired_sql_cache frees several GB
      # at a stroke and the caches then refill, so free space genuinely
      # oscillates. Under 2-of-2 a single post-cleanup datapoint above the
      # threshold clears the alarm while the trend is still downward.
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref RdsFreeStorageThresholdBytes
      ComparisonOperator: LessThanThreshold
      # NOT notBreaching: an instance sick enough to stop publishing this
      # metric is not an instance we should read as healthy.
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ══════════════════════════════════════════════════════════════════
  # Performance alarms — added after the 2026-07-29 incident
  #
  # For 54 minutes (07:33-08:27 MDT) the single web task sat at 100% CPU,
  # ALB p95 latency ran into the tens of seconds, and Postgres connections
  # climbed to 106. Every alarm in this stack stayed OK the entire time,
  # because all three watched the DATABASE and the problem was the WEB TIER.
  # The DB was healthy throughout: 7-12% CPU, sub-millisecond IO.
  #
  # These three alarms watch the signals that were actually screaming.
  # Thresholds are set from the measured 5-day distribution rather than
  # picked by feel — see each parameter's Description.
  # ══════════════════════════════════════════════════════════════════

  # ── Web tier saturation (the signal that would have caught it first) ──
  WebCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-web-cpu-high
      AlarmDescription: >-
        Raw CPU signal (busiest task's Maximum, Period 60, 4-of-5). NOT wired to
        notifications: a rolling deploy pins the booting task. The page is
        labs-jj-web-cpu-high-actionable. Runbook: docs/PERFORMANCE_RUNBOOK.md §1.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !Ref WebServiceName
      # Maximum, NOT Average: Average is the mean ACROSS TASKS, so at
      # desiredCount=2 one pinned task reads ~50% and never crosses 90 (08-24:
      # 17 periods had Maximum >= 90%, zero had Average >= 90%). README § What
      # the alarms watch.
      Statistic: Maximum
      # Period 60, NOT 300: at 300 Maximum is the peak INSTANT in a bucket, so
      # one breaching minute marks a whole period (#1512, PR #1647). Replay
      # 08-31 -> 09-09: 3of5@300s fired 26x, 4of5@60s 9x and still caught both
      # established incidents. Re-check: python3 tools/alarm_rule_replay.py
      # --metric web-cpu --days 9.
      # KEEP COMMENTS HERE TERSE: this file is near CloudFormation's
      # 51,200-byte INLINE limit (test_template_fits_inline_limit).
      Period: 60
      # 4-of-5, NOT 4-of-4: N-of-N clears on ONE dip, so one pin paged as six
      # incidents a morning (08-31 -> 09-02: 12 firings, 9 cleared in 1-3 min),
      # and each transition dispatches an agent session (#1419). M-of-N fires on
      # the same datapoints and holds through a dip.
      EvaluationPeriods: 5
      DatapointsToAlarm: 4
      Threshold: !Ref WebCpuThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      # NO AlarmActions/OKActions — deliberately. This alarm is now the raw CPU
      # SIGNAL, and WebCpuHighActionableAlarm below is what pages: this one
      # cannot tell a deploy from an outage, so notifying on it directly is what
      # produced 15 firings and zero true findings. See that resource for the
      # measurement. Re-adding actions here re-creates the noise.

  # ── Deploy-awareness for the CPU alarm ─────────────────────────────
  #
  # WHY THIS EXISTS. The web-CPU alarm cannot distinguish a task pinned SERVING
  # TRAFFIC from a task pinned BOOTING during a rolling replacement, and at
  # 1-minute resolution the two are not merely similar, they are indistinguishable:
  #
  #   window                                     1-min datapoints >=90%   longest run
  #   2026-08-24 05:00-10:00Z (real 502 incident)      31 / 300  (10%)        5 min
  #   2026-09-02 10:40-13:20Z (deploy churn)           27 / 160  (17%)        7 min
  #
  # Deploy churn is DENSER than the incident the alarm was written for. So no
  # threshold, period or M-of-N retune can separate them — the shape carries no
  # signal. That is why this is suppression and not another tuning pass.
  #
  # The mechanism the metric hides: Statistic=Maximum over a 300s period records
  # the PEAK INSTANT in that bucket, not a duration. A ~2-minute boot spike
  # therefore fills its whole 5-minute bucket at 100%, and three boot spikes
  # spaced 5 minutes apart — exactly what a rolling replacement produces — are
  # byte-identical to a 15-minute sustained pin. Measured 2026-09-05: the tier
  # was >=90% for FIVE minutes out of ninety, longest consecutive run 2 minutes,
  # and the alarm reported a sustained 15-of-25-minute pin and paged three times.
  #
  # Deploys are frequent here and land from several agents at once; that is the
  # intended workflow, not an abuse of it. Suppressing the CPU alarm for a
  # bounded window around each rollout is therefore the correct trade, and the
  # tier keeps its USER-FACING guards throughout — labs-jj-alb-latency-high and
  # labs-jj-alb-target-5xx-high are never suppressed, and both are structurally
  # immune to this failure anyway, because a booting task is not in the ALB
  # target group until it passes its health check.
  DeployInProgressAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-deploy-in-progress
      AlarmDescription: >-
        Not a fault signal. It is ALARM only while deploy-labs.yml is rolling
        new tasks onto the web service, and its sole job is to suppress
        labs-jj-web-cpu-high-actionable for that window. Never give this alarm
        notification actions.
      Namespace: LabsDeploy
      MetricName: DeployInProgress
      Dimensions:
        - Name: ServiceName
          Value: !Ref WebServiceName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # THE FAIL-SAFE, and the reason this is a metric rather than
      # `disable-alarm-actions`. The deploy publishes a BOUNDED window of
      # datapoints (a fixed number of forward-dated minutes) in one call before
      # it issues the rollout. If the job is then cancelled, times out, or the
      # runner dies, no further datapoints arrive, the window simply runs out and
      # notBreaching returns this to OK on its own. There is no code path that
      # leaves the CPU alarm muted indefinitely, which is exactly the failure a
      # disable/enable pair around the rollout would have — its re-enable step is
      # skipped by the same cancellation this whole issue is about.
      TreatMissingData: notBreaching

  WebCpuHighActionableAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: labs-jj-web-cpu-high-actionable
      # This alarm's description is the ONLY briefing a responder gets: it is
      # pasted into the notification email, and that email pages an agent
      # mailbox, so it is read cold by a session with no prior context.
      AlarmDescription: >-
        A web task was at/over 90% CPU for 4 of the last 5 MINUTES (Maximum, Period
        60) while labs-jj-deploy-in-progress was OK; requests on that 1-vCPU task
        queue. FIRST, is it memory: aws cloudwatch get-metric-statistics --profile
        labs-observe --region us-east-1 --namespace AWS/ECS --metric-name
        MemoryUtilization --dimensions Name=ClusterName,Value=labs-jj-cluster
        Name=ServiceName,Value=labs-jj-web --statistics Maximum --period 60
        --start-time <page-30m>Z --end-time <page>Z. 90%+ means OOM kills and
        re-forking (#1575, runbook §8), not a request path. Then gh run list -w
        deploy-labs.yml: the suppressor lifts 15-20 min after a rollout. An OK a
        minute later is the pin's edge, not a fix. Runbook:
        docs/PERFORMANCE_RUNBOOK.md §1, then §3.
      AlarmRule: !Sub 'ALARM("${WebCpuHighAlarm}") AND NOT ALARM("${DeployInProgressAlarm}")'
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── User-visible slowness ──────────────────────────────────────────
  # p95, not Average: Average is dragged to ~0 by health checks and static
  # assets and stayed unremarkable through the whole incident.
  # Labs' target group, not the LoadBalancer (#2768): the ALB-wide p95 also
  # counts canopy-web, whose night p95 (~14s on 250-400 requests per 5 min)
  # flapped this 10x on 10-28/29 while labs served 0-10 requests at ~0.1s, and
  # whose fast traffic diluted labs' real 10-28 12:25-13:35Z slowdown so it
  # never paged. Gated on request count: labs is sparse (median 15 per 5 min),
  # and on a handful of requests p95 is just the slowest one.
  TargetLatencyHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-alb-latency-high
      AlarmDescription: >-
        Labs web p95 response time over 10s in 3 of 5 five-minute periods, counting
        only periods with 40+ requests: on sparse traffic one slow page IS the p95,
        so quieter periods are not judged (#2768). Labs' target group only; canopy-web
        shares the ALB. FIRST, which route: aws cloudwatch get-metric-data --profile
        labs-observe --region us-east-1 --start-time <page-30m>Z --end-time <page>Z
        --metric-data-queries '[{"Id":"q","Period":300,"Expression":"SELECT
        SUM(RequestLatency) FROM \"Labs/Requests\" GROUP BY route ORDER BY SUM() DESC
        LIMIT 5"}]'. Never lower the 600s timeouts. Runbook:
        docs/PERFORMANCE_RUNBOOK.md §3.
      Metrics:
        - Id: p95
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: TargetResponseTime
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref LoadBalancerDimension
                - Name: TargetGroup
                  Value: !Ref TargetGroupDimension
            Period: 300
            Stat: p95
        - Id: n
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref LoadBalancerDimension
                - Name: TargetGroup
                  Value: !Ref TargetGroupDimension
            Period: 300
            Stat: Sum
        - Id: gated
          Label: labs web p95 (s), 0 when under LatencyMinRequests
          Expression: !Sub 'IF(n >= ${LatencyMinRequests}, p95, 0)'
          ReturnData: true
      # 3-of-5, NOT 3-of-3: p95 oscillates, so 3-of-3 clears on one fast period.
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref LatencyP95Threshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── ALB-generated 5xx (502/503/504) ────────────────────────────────
  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-alb-5xx-high
      AlarmDescription: >-
        The ALB is returning 5xx it generated itself: it got no usable response from
        a target (none healthy, connection refused, idle timeout). Covers every
        service on the ALB; target-5xx counts cannot see it. FIRST, which service lost
        its targets: aws cloudwatch get-metric-data --profile labs-observe --region
        us-east-1 --start-time <page-30m>Z --end-time <page>Z --metric-data-queries
        '[{"Id":"q","Period":60,"Expression":"SELECT MIN(HealthyHostCount) FROM
        SCHEMA(\"AWS/ApplicationELB\", LoadBalancer, TargetGroup) GROUP BY
        TargetGroup"}]'. Then that service's describe-services events. Stopped-task
        reasons age out in ~1h. Runbook: docs/PERFORMANCE_RUNBOOK.md §10.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref Elb5xxThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ── Application-generated 5xx (the app answered 500) ───────────────
  # The COMPLEMENT of Elb5xxAlarm, not a replacement for it. On 2026-07-29
  # target 5xx was 1 while ELB 5xx peaked at 84; on 2026-08-31 the inverse
  # happened -- 410 target 5xx over two hours (all /umami/api/send, a Prisma
  # P2002 race) while ELB 5xx peaked at 19, under Elb5xxThreshold. Nothing
  # paged for two hours. Each metric is blind to the other's failure mode, so
  # both are alarmed.
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-alb-target-5xx-high
      AlarmDescription: >-
        The labs web tier answered with 5xx: the app's own errors (ALB-generated 5xx
        are labs-jj-alb-5xx-high). Scoped to the labs target group, so never Umami,
        canopy-web or ace-web. FIRST, which route: aws cloudwatch get-metric-data
        --profile labs-observe --region us-east-1 --start-time <page-30m>Z --end-time
        <page>Z --metric-data-queries '[{"Id":"q","Period":300,"Expression":"SELECT
        SUM(RequestCount) FROM \"Labs/Requests\" WHERE status_class = '\''5xx'\''
        GROUP BY route ORDER BY SUM() DESC LIMIT 5"}]'. Every route at once: read the
        RDS alarms (shared instance). Runbook: docs/PERFORMANCE_RUNBOOK.md §10.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      # LoadBalancer + TargetGroup, not LoadBalancer alone — see the description.
      # The same pair is used by labs-jj-web-no-healthy-targets below.
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
        - Name: TargetGroup
          Value: !Ref TargetGroupDimension
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref Target5xxThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      # canopy-web and ace-web share this ALB and this RDS instance; their
      # per-target-group 5xx alarms are in labs-tenant-monitoring.yml, which
      # imports AlertTopicArn. Not here: this file is at CloudFormation's
      # 51,200-byte inline-template limit (README § Deploy).

  # ── No healthy target at all ───────────────────────────────────────
  # Fires only when EVERY task is unhealthy: HealthyHostCount is a count, not a
  # per-task metric, so this stays correct as desiredCount changes.
  NoHealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-web-no-healthy-targets
      AlarmDescription: >-
        The labs web target group has no healthy target: labs is down. Every task
        failing its health check at once is the app or a dependency, not a deploy or
        capacity. FIRST: aws ecs describe-services --profile labs-observe --region
        us-east-1 --cluster labs-jj-cluster --services labs-jj-web --query
        'services[0].events[0:8].[createdAt,message]' --output text (task stops and
        starts, dated), then the RDS alarm states. Stopped-task reasons
        (describe-tasks, labs SSO) age out in ~1h. Runbook:
        docs/PERFORMANCE_RUNBOOK.md §10.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
        - Name: TargetGroup
          Value: !Ref TargetGroupDimension
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── AI-review: an audit that reviewed nothing ───────────────────────
  # tasks.py logs "NO IMAGES REVIEWED: all N image(s) were skipped" at ERROR
  # when a run attempts zero images -- nearly always a misconfigured image path
  # or a failing blob fetch, and the audit it produces is silently EMPTY.
  #
  # The diagnostic already existed and worked. Nothing consumed it: on
  # 2026-08-14 four runs skipped all 260 of their images (image_download_failed)
  # and the line sat unread for four days until a manual log review found it.
  # A log nobody reads is not a signal, so this makes it one.
  # ── Web worker crash loop ─────────────────────────────────────────────────
  # gunicorn workers being killed. On 2026-08-24 the web tier killed 453 of them
  # in a day and NOTHING noticed, because the obvious alarm to reach for -- memory
  # -- would not have caught it: MemoryUtilization read 29-35% throughout. The
  # spike is per-REQUEST (one request materialised 61,917 visit rows), so the
  # process is reaped between two 1-minute metric samples and the gauge never
  # moves. Workers were dying 22-90 seconds after booting.
  #
  # So the signal has to be the restart itself, counted from the log, not memory
  # observed after the fact. This is the alarm that would have caught it.
  WebWorkerKilledMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogGroupName
      FilterPattern: '"was sent SIGKILL"'
      MetricTransformations:
        - MetricNamespace: Labs/Web
          MetricName: WorkerKilled
          MetricValue: '1'
          DefaultValue: 0

  WebWorkerCrashLoopAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-web-worker-crash-loop
      AlarmDescription: >-
        gunicorn workers on the web tier are being killed: 5+ in a 5-minute period,
        in 2 of the last 4. Each kill drops its in-flight requests. The memory gauge
        misses a per-request spike, which is why this counts restarts. FIRST: aws
        cloudwatch get-metric-statistics --profile labs-observe --region us-east-1
        --namespace Labs/Web --metric-name WorkerKilled --statistics Sum --period 60
        --start-time <page-1h>Z --end-time <page>Z, beside AWS/ECS MemoryUtilization
        Maximum for labs-jj-web. Seen causes: one request loading a whole opp's
        visits (a large "[SQL] Loaded N visits"), or many workers rebuilding one
        RawVisitCache at once (#1361). A repeat is the same incident. Runbook:
        docs/PERFORMANCE_RUNBOOK.md §8.
      Namespace: Labs/Web
      MetricName: WorkerKilled
      Statistic: Sum
      # 5 kills per 5 minutes, sustained over two periods. Calibrated against the
      # 2026-08-24 incident (58/71/160 per hour through 12:00-14:00, i.e. ~5-13 per
      # 5 min) so it fires on that, while a stray one-off kill -- which happens on
      # ordinary days and is not actionable -- does not.
      Period: 300
      # 2-of-4, NOT 2-of-2. This alarm reported OK while workers were still
      # dying, which is worse than the noise problem it shares with the others.
      #
      # 2026-09-03: fired at 10:34:34 UTC on 7 kills at 10:24 and 5 at 10:29,
      # then cleared at 10:35:34 — sixty seconds later — because ONE datapoint
      # came in under the threshold. That datapoint was 3.0. Three workers were
      # killed in that period, a rate of ~36/hour, against a post-#1293 baseline
      # of NINE PER DAY (measured 2026-08-27 on #1290). The condition had not
      # gone away; the alarm resolved anyway, because omitting DatapointsToAlarm
      # means a single sub-threshold datapoint clears it.
      #
      # The dangerous half is not the spurious OK notification, it is what
      # follows: returning to ALARM needs 2 CONSECUTIVE breaching datapoints, so
      # a loop that settles at 3-4 kills per period stays invisible indefinitely
      # while killing workers around the clock.
      #
      # 2-of-4 fires on the same 2 breaching datapoints (marginally earlier —
      # they need not be consecutive) and needs 3 of the last 4 to be clean
      # before it resolves. Checked against the known normal-day pattern so this
      # does not turn noisy: #1290 measured 9 kills/day as two ~1-minute bursts
      # at 09:51 and 13:34, 3.7 hours apart — far outside a 4-period (20 min)
      # window, so they will not join up to fire this.
      EvaluationPeriods: 4
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── Web worker SUSTAINED kill rate ────────────────────────────────────────
  # The crash-loop alarm above catches an ACUTE loop: 5 kills in a 5-minute
  # period, twice in four. Nothing catches a rate that never reaches that bar
  # and simply never stops — which its own comment already names as the
  # dangerous shape ("a loop that settles at 3-4 kills per period stays
  # invisible indefinitely while killing workers around the clock").
  #
  # Measured 2026-09-07: 32 kills across the day against a post-#1293 baseline
  # of NINE PER DAY, including 12:15-12:55 at 4/3/3/2/2/2/2/1 per 5-min period
  # — 19 kills in 45 minutes, ~25/hour — with a single period touching 5. The
  # crash-loop alarm needs two such periods, so it stayed OK the entire time
  # and had not transitioned since 2026-09-03. A 3.5x-baseline day was
  # completely unobserved; it was found only because a user reported an
  # unrelated 404 and the kills happened to be in the same log window.
  #
  # So this is a COVERAGE gap, not the N-of-N config defect fixed in #1429 —
  # every alarm in this file was audited for that on 2026-09-07 and only
  # labs-jj-web-no-healthy-targets still omits DatapointsToAlarm, which #1429
  # held back deliberately (60s period, availability-critical).
  #
  # Cause, when this fires: almost certainly the RawVisitCache stampede in
  # #1361 — N gunicorn workers each paginating the SAME opportunity's whole
  # visit export concurrently, so peak memory is N x per-request on a 4096 MB
  # task. The tell is in /ecs/labs-jj-web: user_visits/?page_size=2500 fetches
  # whose last_id cursors REPEAT across log streams. On 2026-09-07 that was 53
  # fetches over 16 distinct cursors, every cursor 2-6x, across both tasks.
  #
  # Calibration, from 30-minute windows over the 14 days to 2026-09-07. The
  # acute incidents sit at 28/25/21/14; this day sits at 12 and 7; every
  # ordinary-day window at or above 6 is an ISOLATED singleton. So 6-in-30min
  # twice within 90 minutes fires on both real incidents and on this day,
  # and no ordinary day in the sample produces two such windows in a row.
  WebWorkerKillRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-web-worker-kill-rate
      AlarmDescription: >-
        Raw sustained-kill signal. Deploy rollouts also kill workers, so this one is
        NOT wired to notifications; see labs-jj-web-worker-kill-rate-actionable.
      Namespace: Labs/Web
      MetricName: WorkerKilled
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 6
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      # NO AlarmActions/OKActions — deliberately, same split as
      # labs-jj-web-cpu-high. The composite below carries the notification.

  WebWorkerKillRateActionableAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: labs-jj-web-worker-kill-rate-actionable
      # This description is the ONLY briefing a responder gets — it is pasted
      # into the notification email, which pages an agent mailbox and is read
      # cold by a session with no prior context.
      AlarmDescription: >-
        Web-tier gunicorn workers are dying at a SUSTAINED rate: 6+ per 30-minute
        window in 2 of the last 3, and no deploy is rolling (the acute 5-in-5 loop is
        labs-jj-web-worker-crash-loop). These are kernel OOM kills; a 1-minute memory
        gauge misses them. FIRST: aws cloudwatch get-metric-statistics --profile
        labs-observe --region us-east-1 --namespace Labs/Web --metric-name
        WorkerKilled --statistics Sum --period 300 --start-time <page-2h>Z --end-time
        <page>Z: one burst or a steady trickle. Prime suspect: the RawVisitCache
        stampede (#1361). Runbook: docs/PERFORMANCE_RUNBOOK.md §8.
      AlarmRule: !Sub 'ALARM("${WebWorkerKillRateAlarm}") AND NOT ALARM("${DeployInProgressAlarm}")'
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  WebEmptyAiAuditMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogGroupName
      FilterPattern: '"NO IMAGES REVIEWED"'
      MetricTransformations:
        - MetricNamespace: Labs/AIReview
          MetricName: EmptyAudit
          MetricValue: '1'
          DefaultValue: 0

  WorkerEmptyAiAuditMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      FilterPattern: '"NO IMAGES REVIEWED"'
      MetricTransformations:
        - MetricNamespace: Labs/AIReview
          MetricName: EmptyAudit
          MetricValue: '1'
          DefaultValue: 0

  EmptyAiAuditAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-ai-review-empty-audit
      AlarmDescription: >-
        An AI image-audit run reviewed ZERO images: every image was skipped and the
        audit is empty, though the run reports success. FIRST: aws cloudwatch
        get-metric-statistics --profile labs-observe --region us-east-1 --namespace
        Labs/AIReview --metric-name EmptyAudit --statistics Sum --period 300
        --start-time <page-1h>Z --end-time <page>Z (how many runs, when). Then read
        the job's result.ai_review.skip_reasons (no AWS): no_reviewer_reading is a
        field-path misconfig, image_download_failed a blob fetch. Runbook:
        docs/PERFORMANCE_RUNBOOK.md §9.
      Namespace: Labs/AIReview
      MetricName: EmptyAudit
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ── AI-review: classifier gateway saturation ────────────────────────
  # base.py logs one "[classifier] ... outcome=timeout ..." line per call that
  # hit the 60s client timeout. A trickle is normal; a burst means the shared
  # gateway is saturated and the run is producing an audit with no verdicts.
  #
  # Threshold sized off measured history (2026-08-11..18): a quiet day totals
  # ~22 timeouts across the WHOLE day, while the bad episodes did 464 (08-14)
  # and 136 (08-17) in a few hours. 25 in a 15-minute window sits far above the
  # baseline and well below the failure shape. See #1231 -- one cause is that
  # concurrent runs each get their own pool, so overlapping runs multiply load.
  # It is not the only one: the first firing (2026-10-20 21:24Z) had exactly one
  # run in flight, so the description sends responders to count runs first.
  WorkerClassifierTimeoutMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      FilterPattern: '"[classifier]" "outcome=timeout"'
      MetricTransformations:
        - MetricNamespace: Labs/AIReview
          MetricName: ClassifierTimeout
          MetricValue: '1'
          DefaultValue: 0

  WebClassifierTimeoutMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogGroupName
      FilterPattern: '"[classifier]" "outcome=timeout"'
      MetricTransformations:
        - MetricNamespace: Labs/AIReview
          MetricName: ClassifierTimeout
          MetricValue: '1'
          DefaultValue: 0

  ClassifierSaturationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-ai-classifier-saturation
      AlarmDescription: >-
        The AI classifier gateway is timing out in bulk (25+ in 15 minutes): a
        running image audit gets errors instead of verdicts, 60s each. FIRST: aws
        cloudwatch get-metric-statistics --profile labs-observe --region us-east-1
        --namespace Labs/AIReview --metric-name ClassifierTimeout --statistics Sum
        --period 300 --start-time <page-2h>Z --end-time <page>Z (one burst or
        sustained). Then count runs in flight (python3 tools/classifier_outcomes.py,
        labs SSO): 2+ overlapping is #1231; ONE run means the gateway itself was slow
        (2026-10-20). Runbook: docs/PERFORMANCE_RUNBOOK.md §9.
      Namespace: Labs/AIReview
      MetricName: ClassifierTimeout
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  AlertTopicArn:
    Description: SNS topic that all labs alarms publish to (wire Slack/PagerDuty here).
    Value: !Ref AlertTopic
    Export:
      Name: labs-jj-alert-topic-arn
