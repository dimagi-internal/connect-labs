AWSTemplateFormatVersion: '2010-09-09'

# Labs operational guardrails — first slice of infrastructure-as-code for the
# connect-labs AWS environment. Standalone monitoring stack: an SNS alert topic
# + a minimal, grounded CloudWatch alarm set that turns the RDS connection-leak /
# slot-exhaustion failure mode (the 2026-06-29 incident; leak fixed in PR #765)
# into an operator signal BEFORE it causes a site-wide outage.
#
# This stack deliberately does NOT own the core infra (RDS instance, ECS
# cluster/services, ALB, redis, IAM) — those were created out-of-band and are
# referenced here by name/id, so the stack is safe to create/update/delete on
# its own. Bringing the core under CloudFormation is a later slice. Modeled on
# dimagi-rad/scout's infra/scout-stack.yml monitoring block. See infra/README.md
# for the deploy command.
Description: >-
  Labs operational guardrails (monitoring): SNS alert topic plus CloudWatch
  alarms over RDS (connections, slot exhaustion), the web tier (CPU, ALB p95
  latency, ELB 5xx, healthy targets) and AI image-audit runs (empty audits,
  classifier saturation). Standalone stack that references (does not own) the
  existing RDS instance, ECS services and log groups. See PR #765.

Parameters:
  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Email address that receives CloudWatch alarm notifications (the
      subscription must be confirmed via the email AWS sends). Leave blank to
      create the alarms + SNS topic without an email subscription (alarms still
      fire to the topic; wire Slack/another endpoint to it later).

  AgentAlarmEmail:
    Type: String
    Default: hal@dimagi-ai.com
    Description: >-
      Second alarm recipient — an agent mailbox that can CONFIRM its own
      subscription. SNS email subscriptions are inert until someone clicks the
      confirmation link, and a Google Group cannot: the group's default posting
      policy rejects mail from an external sender (AWS SNS), so the confirmation
      never lands, and even when it does no member owns clicking it. The link
      also expires in 3 days. Result was a topic with zero confirmed
      subscribers — alarms fired into nothing. An agent mailbox reads its own
      inbox and confirms via the API, so this path stays live. Set to '' to
      skip.

  DbInstanceIdentifier:
    Type: String
    Default: labs-jj-postgres
    Description: RDS instance whose DatabaseConnections metric is alarmed.

  DbConnectionsThreshold:
    Type: Number
    Default: 90
    Description: >-
      Alarm when DatabaseConnections exceeds this for 10 minutes. Was 120 and
      never fired: the 2026-07-29 incident peaked at 106 and sat in the 90s for
      50 minutes, entirely under the old threshold. Steady state is 5-15, so 90
      is ~6x headroom over normal while actually catching that shape.

      The instance was db.t3.small with ~155 usable slots when this was written.
      On 2026-08-18 it was resized to db.m6g.large and max_connections rose to
      829 (the default parameter group derives it from instance memory), so the
      ceiling moved but the threshold deliberately did NOT: this alarm exists to
      catch a LEAK CLIMBING, and the thing that makes 90 the right number is
      steady state being 5-15, not how far away the ceiling is. Raising it in
      proportion to the new ceiling would only delay the warning.

  WebLogGroupName:
    Type: String
    Default: /ecs/labs-jj-web
    Description: CloudWatch log group for the web (gunicorn/uvicorn) service.

  WorkerLogGroupName:
    Type: String
    Default: /ecs/labs-jj-worker
    Description: CloudWatch log group for the celery worker/beat service.

  DeployRoleName:
    Type: String
    Default: github-actions-labs-deploy
    Description: >-
      Existing GitHub Actions OIDC role (referenced, not owned). Granted
      read-only access to the ECS log groups so the "Run Labs management
      command" workflow can echo a one-off task's output into the Actions log.

  ClusterName:
    Type: String
    Default: labs-jj-cluster
    Description: ECS cluster hosting the web and worker services.

  WebServiceName:
    Type: String
    Default: labs-jj-web
    Description: ECS service for the web tier (the one that saturates).

  LoadBalancerDimension:
    Type: String
    Default: app/labs-jj-alb/ffecbe258260c7ee
    Description: >-
      CloudWatch LoadBalancer dimension value for the labs ALB (the
      "app/<name>/<id>" suffix of the ALB ARN, not the ARN itself).

  TargetGroupDimension:
    Type: String
    Default: targetgroup/labs-jj-target-group/d844a0f01a3b9e70
    Description: >-
      CloudWatch TargetGroup dimension value for the web target group.

  WebCpuThreshold:
    Type: Number
    Default: 90
    Description: >-
      Alarm when the BUSIEST web task stays at/above this for 15 minutes (the
      alarm uses Maximum, not Average — see WebCpuHighAlarm). Median web CPU
      over the 5 days to 2026-07-29 was 0.8%; above 90% accounts for ~1.1h of
      those 5 days and is almost entirely the incident itself.

  LatencyP95Threshold:
    Type: Number
    Default: 10
    Description: >-
      Alarm when ALB p95 target response time (seconds) stays above this for 15
      minutes. Median p95 over the same 5 days was 0.23s and only 1.7% of
      5-minute buckets exceeded 10s, so this is a rare, meaningful signal.

  Elb5xxThreshold:
    Type: Number
    Default: 25
    Description: >-
      Alarm when the ALB itself returns this many 5xx in 5 minutes. ELB-generated
      5xx (as opposed to target 5xx) mean the ALB could not get a usable response
      — the shape seen during the incident, which peaked at 84.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasAgentAlarmEmail: !Not [!Equals [!Ref AgentAlarmEmail, '']]

Resources:
  # ── IAM: let CI read a one-off task's log stream ───────────────────
  # The "Run Labs management command" workflow runs a command as a one-off
  # Fargate task and echoes its stdout/stderr into the Actions log. The deploy
  # role had NO logs:* permission, so that read failed with AccessDenied on
  # every run — and because the call swallowed stderr, the workflow reported
  # "(no log events found)" instead. A failing command showed an exit code and
  # nothing else; its traceback had to be fetched from CloudWatch by hand.
  #
  # Read-only, and scoped to the two ECS log groups this stack already knows
  # about — CI can read task output, and nothing else.
  DeployRoleLogReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: labs-ecs-log-read
      Roles: [!Ref DeployRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'logs:GetLogEvents'
              - 'logs:FilterLogEvents'
              - 'logs:DescribeLogStreams'
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WebLogGroupName}:*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WorkerLogGroupName}:*'

  # ── Alert topic ────────────────────────────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: labs-jj-alerts
      DisplayName: Labs Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # The subscriber that is actually confirmed and receiving. Subscribe is
  # idempotent for the same topic+protocol+endpoint, so this adopts the live
  # subscription rather than creating a duplicate.
  AgentAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAgentAlarmEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AgentAlarmEmail

  # ── RDS connection-count alarm (the primary early-warning) ──────────
  # The 2026-06-29 incident climbed 43 -> 87 -> exhaustion with NO alert.
  # This is the signal that was missing. Maximum (not Average) so a spike
  # within the period is caught.
  DatabaseConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-rds-connections-high
      AlarmDescription: >-
        RDS DatabaseConnections is elevated — likely a connection leak climbing
        toward slot exhaustion (the failure mode fixed in PR #765). Investigate
        before it reaches the ceiling (829 slots since the 2026-08-18 resize to
        db.m6g.large; it was ~155) and 500s everywhere.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstanceIdentifier
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref DbConnectionsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── Slot-exhaustion log detector (precise terminal-symptom signal) ──
  # When the pool IS exhausted, Postgres rejects new connections with
  # "remaining connection slots are reserved for roles ...". Metric filters
  # on the web + worker log groups feed one metric so the alarm fires no
  # matter which process sees the rejection first.
  WebConnSlotExhaustionMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogGroupName
      FilterPattern: '"remaining connection slots are reserved"'
      MetricTransformations:
        - MetricNamespace: Labs/RDS
          MetricName: ConnectionSlotExhaustion
          MetricValue: '1'
          DefaultValue: 0

  WorkerConnSlotExhaustionMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      FilterPattern: '"remaining connection slots are reserved"'
      MetricTransformations:
        - MetricNamespace: Labs/RDS
          MetricName: ConnectionSlotExhaustion
          MetricValue: '1'
          DefaultValue: 0

  ConnSlotExhaustionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-rds-slot-exhaustion
      AlarmDescription: >-
        Postgres is rejecting connections ("remaining connection slots are
        reserved") — the pool is exhausted RIGHT NOW and requests are failing.
        This is the terminal symptom of the connection leak; page immediately.
      Namespace: Labs/RDS
      MetricName: ConnectionSlotExhaustion
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ══════════════════════════════════════════════════════════════════
  # Performance alarms — added after the 2026-07-29 incident
  #
  # For 54 minutes (07:33-08:27 MDT) the single web task sat at 100% CPU,
  # ALB p95 latency ran into the tens of seconds, and Postgres connections
  # climbed to 106. Every alarm in this stack stayed OK the entire time,
  # because all three watched the DATABASE and the problem was the WEB TIER.
  # The DB was healthy throughout: 7-12% CPU, sub-millisecond IO.
  #
  # These three alarms watch the signals that were actually screaming.
  # Thresholds are set from the measured 5-day distribution rather than
  # picked by feel — see each parameter's Description.
  # ══════════════════════════════════════════════════════════════════

  # ── Web tier saturation (the signal that would have caught it first) ──
  WebCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-web-cpu-high
      AlarmDescription: >-
        A web task has been pinned near 100% CPU for 15 minutes. Each task has
        1 vCPU, so a pinned task means its requests are queueing behind CPU-bound
        Python and every user routed to it is stalled. Usual cause is a request
        path fanning out remote calls in a loop. Check the web log group for one
        URL repeating at high volume before reaching for a scale-up.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !Ref WebServiceName
      # Maximum, NOT Average — Average is the mean ACROSS TASKS, and the service
      # no longer runs one.
      #
      # This alarm was written when desiredCount was 1, where Average and Maximum
      # are the same number. At desiredCount=2 they diverge exactly when it
      # matters: one task pinned at 100% while the other idles reads as ~50%, and
      # a threshold of 90 can never be reached no matter how long the pinned task
      # stays pinned. Nothing about that looks broken — the alarm sits green and
      # the graph looks half-loaded.
      #
      # Measured over 2026-08-24 05:00-10:00 UTC, sixty 5-minute periods:
      # SEVENTEEN had Maximum >= 90%; ZERO had Average >= 90%; the highest
      # Average seen was 58.1%. The tier served 502s to real users across that
      # window (labs-jj-alb-5xx-high caught those, four separate times) and this
      # alarm — the one whose whole job is to name saturation as the cause —
      # never left OK.
      #
      # The same reasoning is why the latency alarm below is p95 and not Average:
      # an aggregate that averages away the bad half cannot alarm on the bad half.
      # It applies across tasks for exactly the reason it applies across requests.
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref WebCpuThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── User-visible slowness ──────────────────────────────────────────
  # p95, not Average: Average is dragged to ~0 by health checks and static
  # assets and stayed unremarkable through the whole incident.
  TargetLatencyHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-alb-latency-high
      AlarmDescription: >-
        ALB p95 target response time has been above threshold for 15 minutes —
        real users are waiting tens of seconds. Deliberately NOT a timeout
        change: long-running audit work legitimately needs the 600s gunicorn
        and ALB idle timeouts. This alarm is how we find out that the long
        requests are hurting, since the timeouts will never tell us.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref LatencyP95Threshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── ALB-generated 5xx (502/503/504) ────────────────────────────────
  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-alb-5xx-high
      AlarmDescription: >-
        The ALB is returning 5xx it generated itself — it could not get a usable
        response from the web task (no healthy target, connection refused, or the
        idle timeout elapsed). Distinct from target 5xx, which mean the app
        answered with an error; during the 2026-07-29 incident target 5xx was 1
        while ELB 5xx peaked at 84, so watching only application errors misses it.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref Elb5xxThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ── No healthy target at all ───────────────────────────────────────
  # Fires only when EVERY task is unhealthy: HealthyHostCount is a count, not a
  # per-task metric, so this stays correct as desiredCount changes.
  NoHealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-web-no-healthy-targets
      AlarmDescription: >-
        The web target group has no healthy target — labs is down. Every task
        is failing its health check at once, which a rolling deploy does not
        cause, so this is the app or its dependencies, not capacity.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerDimension
        - Name: TargetGroup
          Value: !Ref TargetGroupDimension
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ── AI-review: an audit that reviewed nothing ───────────────────────
  # tasks.py logs "NO IMAGES REVIEWED: all N image(s) were skipped" at ERROR
  # when a run attempts zero images -- nearly always a misconfigured image path
  # or a failing blob fetch, and the audit it produces is silently EMPTY.
  #
  # The diagnostic already existed and worked. Nothing consumed it: on
  # 2026-08-14 four runs skipped all 260 of their images (image_download_failed)
  # and the line sat unread for four days until a manual log review found it.
  # A log nobody reads is not a signal, so this makes it one.
  # ── Web worker crash loop ─────────────────────────────────────────────────
  # gunicorn workers being killed. On 2026-08-24 the web tier killed 453 of them
  # in a day and NOTHING noticed, because the obvious alarm to reach for -- memory
  # -- would not have caught it: MemoryUtilization read 29-35% throughout. The
  # spike is per-REQUEST (one request materialised 61,917 visit rows), so the
  # process is reaped between two 1-minute metric samples and the gauge never
  # moves. Workers were dying 22-90 seconds after booting.
  #
  # So the signal has to be the restart itself, counted from the log, not memory
  # observed after the fact. This is the alarm that would have caught it.
  WebWorkerKilledMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogGroupName
      FilterPattern: '"was sent SIGKILL"'
      MetricTransformations:
        - MetricNamespace: Labs/Web
          MetricName: WorkerKilled
          MetricValue: '1'
          DefaultValue: 0

  WebWorkerCrashLoopAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-web-worker-crash-loop
      AlarmDescription: >-
        gunicorn workers are being killed repeatedly on the web tier. Almost always
        a single request allocating far too much at once -- the 2026-08-24 case was
        requests materialising a whole opportunity's visits to answer a one-row
        question. Look in /ecs/labs-jj-web for a "[SQL] Loaded N visits" line near
        the kills, and for the request that triggered it. NOTE the memory graph will
        probably look fine: the spike is shorter than a metric sample, which is why
        this alarm counts restarts instead.
      Namespace: Labs/Web
      MetricName: WorkerKilled
      Statistic: Sum
      # 5 kills per 5 minutes, sustained over two periods. Calibrated against the
      # 2026-08-24 incident (58/71/160 per hour through 12:00-14:00, i.e. ~5-13 per
      # 5 min) so it fires on that, while a stray one-off kill -- which happens on
      # ordinary days and is not actionable -- does not.
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  WebEmptyAiAuditMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogGroupName
      FilterPattern: '"NO IMAGES REVIEWED"'
      MetricTransformations:
        - MetricNamespace: Labs/AIReview
          MetricName: EmptyAudit
          MetricValue: '1'
          DefaultValue: 0

  WorkerEmptyAiAuditMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      FilterPattern: '"NO IMAGES REVIEWED"'
      MetricTransformations:
        - MetricNamespace: Labs/AIReview
          MetricName: EmptyAudit
          MetricValue: '1'
          DefaultValue: 0

  EmptyAiAuditAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-ai-review-empty-audit
      AlarmDescription: >-
        An AI image-audit run reviewed ZERO images and produced an empty audit —
        every image was skipped. Usually a misconfigured comparison/image field
        path or a failing blob fetch. The run reports success, so nobody notices
        without this. Check the [AIReview:<id>] lines for the skip breakdown.
      Namespace: Labs/AIReview
      MetricName: EmptyAudit
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ── AI-review: classifier gateway saturation ────────────────────────
  # base.py logs one "[classifier] ... outcome=timeout ..." line per call that
  # hit the 60s client timeout. A trickle is normal; a burst means the shared
  # gateway is saturated and the run is producing an audit with no verdicts.
  #
  # Threshold sized off measured history (2026-08-11..18): a quiet day totals
  # ~22 timeouts across the WHOLE day, while the bad episodes did 464 (08-14)
  # and 136 (08-17) in a few hours. 25 in a 15-minute window sits far above the
  # baseline and well below the failure shape. See #1231 -- the cause is that
  # concurrent runs each get their own pool, so overlapping runs multiply load.
  WorkerClassifierTimeoutMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      FilterPattern: '"[classifier]" "outcome=timeout"'
      MetricTransformations:
        - MetricNamespace: Labs/AIReview
          MetricName: ClassifierTimeout
          MetricValue: '1'
          DefaultValue: 0

  WebClassifierTimeoutMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogGroupName
      FilterPattern: '"[classifier]" "outcome=timeout"'
      MetricTransformations:
        - MetricNamespace: Labs/AIReview
          MetricName: ClassifierTimeout
          MetricValue: '1'
          DefaultValue: 0

  ClassifierSaturationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-ai-classifier-saturation
      AlarmDescription: >-
        The AI classifier gateway is timing out in bulk — an image audit running
        now is producing errors instead of verdicts, and each timeout costs a
        full 60s. Most likely several AI-review runs are overlapping (see
        #1231); check how many [AIReview:<id>] runs started recently.
      Namespace: Labs/AIReview
      MetricName: ClassifierTimeout
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  AlertTopicArn:
    Description: SNS topic that all labs alarms publish to (wire Slack/PagerDuty here).
    Value: !Ref AlertTopic
    Export:
      Name: labs-jj-alert-topic-arn
