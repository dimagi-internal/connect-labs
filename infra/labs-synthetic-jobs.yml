AWSTemplateFormatVersion: '2010-09-09'

# Labs synthetic jobs -- each one on a standalone Fargate task of its own (see
# infra/README.md for the pattern: a standalone stack that owns a NEW layer and
# references the core infra created out-of-band).
#
# Why this exists. Synthetic profiling and generation ran on the worker SERVICE,
# and every labs deploy replaces the worker: ECS sends SIGTERM and kills it 30
# seconds later. A job that takes ten minutes or an hour never survived one, and
# labs deploys several times a day. connect_labs/labs/synthetic/ecs_runner.py now
# starts each job with ecs:RunTask from the worker's current task definition. A
# standalone task belongs to no service, so a deploy does not touch it; it is
# billed per second while it runs and exits when the job is done.
#
# Owns: one inline IAM policy on the existing ECS task role, letting the app
#   start, list and stop its own synthetic tasks on the labs cluster; and two
#   alarms on those tasks (below), here rather than in labs-monitoring.yml, which
#   is at CloudFormation's 51,200-byte inline-template limit.
# References, does NOT own: the task role, the execution role, the cluster, the
#   worker log group, the alert topic (labs-monitoring.yml's export).
#
# Deploy (needs CAPABILITY_NAMED_IAM; ship it before the app change turns
# SYNTHETIC_JOBS_ON_ECS on):
#
#   aws cloudformation deploy \
#     --region us-east-1 --profile labs \
#     --stack-name labs-jj-synthetic-jobs \
#     --template-file infra/labs-synthetic-jobs.yml \
#     --capabilities CAPABILITY_NAMED_IAM

Parameters:
  TaskRoleName:
    Type: String
    Default: labs-jj-ecs-task-role
    Description: Existing ECS task role (app runtime permissions), web and worker.
  ExecutionRoleName:
    Type: String
    Default: labs-jj-ecs-task-execution-role
    Description: Existing ECS task execution role (image pull, secrets, logs).
  ClusterName:
    Type: String
    Default: labs-jj-cluster
  WorkerFamily:
    Type: String
    Default: labs-jj-worker
    Description: Task definition family a synthetic job runs from (the worker's).
  WorkerLogGroupName:
    Type: String
    Default: /ecs/labs-jj-worker
    Description: Log group a synthetic task (and the worker's reaper) logs to.

Resources:
  TaskRoleSyntheticJobsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: labs-synthetic-jobs
      Roles: [!Ref TaskRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Start a job: only from the worker's task definition, only on this cluster.
          - Effect: Allow
            Action: ['ecs:RunTask']
            Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${WorkerFamily}:*'
            Condition:
              ArnEquals:
                ecs:cluster: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
          # Count running jobs (the cap) and stop one (cancel).
          - Effect: Allow
            Action: ['ecs:ListTasks', 'ecs:StopTask', 'ecs:DescribeTasks']
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
          # Read the worker service's current task definition and network config.
          - Effect: Allow
            Action: ['ecs:DescribeServices']
            Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/*'
          - Effect: Allow
            Action: ['ecs:DescribeTaskDefinition']
            Resource: '*'
          # RunTask hands the task the same two roles the worker runs with.
          - Effect: Allow
            Action: ['iam:PassRole']
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${TaskRoleName}'
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ExecutionRoleName}'
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  # ── How a machine turns off, and the alarms when it did not ───────────────
  # A standalone task stops only when its command exits; it has no lifetime of
  # its own (8 vCPU / 32 GB at the most, ~$0.47/hour). The job arms a wall-clock
  # limit (SYNTHETIC_ECS_MAX_RUNTIME_SECONDS) and the reap-synthetic-job-tasks
  # beat stops any task that outlives it; both log "synthetic job overran"
  # (connect_labs/labs/synthetic/ecs_runner.py). A job hitting the limit is worth
  # a human look, so every one notifies.
  #
  # The same runner (connect_labs/labs/ecs_tasks.py) now also runs long-running MCP
  # tools that declare job_runner="standalone" (connect_labs/mcp/jobs.py, its
  # mcp-job-housekeeping beat, MCP_JOB_STANDALONE_MAX_RUNTIME_SECONDS). Those log
  # "long-running job overran", matched below too. Their tasks carry startedBy
  # "mcp-job" and run from the same worker task definition, so the IAM policy
  # above covers them unchanged; their dead-machine line carries the same
  # "its task stopped without a result" phrase as synthetic jobs'.
  JobOverranMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      FilterPattern: '?"synthetic job overran" ?"long-running job overran"'
      MetricTransformations:
        - MetricNamespace: Labs/Synthetic
          MetricName: JobOverran
          MetricValue: '1'
          DefaultValue: 0

  JobOverranAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-synthetic-job-overran
      AlarmDescription: >-
        A synthetic job's own Fargate machine ran past
        SYNTHETIC_ECS_MAX_RUNTIME_SECONDS and was stopped; the job is marked failed.
        FIRST, before stopped tasks age out (~1h), capture the task ids: aws ecs
        list-tasks --profile labs-observe --region us-east-1 --cluster labs-jj-cluster
        --family labs-jj-worker --desired-status STOPPED. Then search
        /ecs/labs-jj-worker (labs SSO) for "synthetic job overran" (MCP jobs:
        "long-running job overran") for the job id, and its stream
        worker/worker/<task id> for where it stalled. A cohort that legitimately needs
        longer: raise the setting. Runbook: docs/PERFORMANCE_RUNBOOK.md §9.
      Namespace: Labs/Synthetic
      MetricName: JobOverran
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue labs-jj-alert-topic-arn]

  # A machine that stopped before its job recorded an ending: killed for memory,
  # an image that would not pull, a task stopped by hand. The reaper fails the
  # job and logs why; ECS's stop reason (e.g. OutOfMemoryError) is in that line.
  MachineDiedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      FilterPattern: '"its task stopped without a result"'
      MetricTransformations:
        - MetricNamespace: Labs/Synthetic
          MetricName: MachineDied
          MetricValue: '1'
          DefaultValue: 0

  MachineDiedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: labs-jj-synthetic-job-machine-died
      AlarmDescription: >-
        A synthetic job's own Fargate machine stopped before the job recorded how it
        ended; the reap-synthetic-job-tasks beat marked the job failed. FIRST, before
        stopped tasks age out (~1h), capture the task ids: aws ecs list-tasks
        --profile labs-observe --region us-east-1 --cluster labs-jj-cluster --family
        labs-jj-worker --desired-status STOPPED. Then search /ecs/labs-jj-worker (labs
        SSO) for "its task stopped without a result": the line carries ECS's stop
        reason. OutOfMemoryError means a larger machine (SYNTHETIC_ECS_MEMORY);
        "stopped by user" is someone stopping it by hand. Runbook:
        docs/PERFORMANCE_RUNBOOK.md §9.
      Namespace: Labs/Synthetic
      MetricName: MachineDied
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue labs-jj-alert-topic-arn]
