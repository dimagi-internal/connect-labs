# KMC Layer 2 — case properties, one row per baby.
#
# The workbook's Layer 2 (kmc_metrics_framework.xlsx, "Case properties" tab),
# expressed as SQL over the visit-level extraction the pipeline already emits.
#
# WHY THIS FILE EXISTS
# The existing kmc_programme_metrics dashboard derives all of this in the browser,
# in JavaScript, over one row per baby carrying a weights array. That forces Layer 3
# to be in-memory too, because none of these properties exist in the database to
# GROUP BY. Moving them here makes the indicator layer a GROUP BY, and makes the
# definitions readable by a second engine (Neal's local Python) instead of being
# trapped in render code.
#
# CONTRACT
# - `sql` is evaluated per baby, in the `props` CTE, over the aggregates in `visit_agg`.
# - `visit_agg` columns are produced by the aggregates block below.
# - Every expression is portable Postgres over NAMED COLUMNS — no JSONB, no paths.
#   Layer 1 (paths -> columns) stays in the pipeline schema, per Scout's precedent.
#
# Parity target: connect_labs/workflow/templates/kmc_programme_metrics_render.js
# lines ~560-680. Constants match that file exactly.

version: 1
entity: baby

constants:
  ELIG_DAYS: 28 # eligibility gate, days from FIRST VISIT
  # Neal's demo compute spec (2026-09-05, "Connect KMC - demo metrics") sets THREE
  # maturity gates rather than one, all measured from the first VISIT:
  #   outcome 28 . growth/visits 42 . completion 90
  # ELIG_DAYS above stays 28 and keeps every C0x/C1x indicator exactly where it was
  # (PARITY.md's 5,698 checks depend on it). These are additive, and only the N-series
  # measures below use them.
  MATURITY_OUTCOME_DAYS: 28
  MATURITY_GROWTH_DAYS: 42
  MATURITY_COMPLETION_DAYS: 90
  GA_MIN: 20 # gestational age plausible range, weeks (spec section 2)
  GA_MAX: 45
  SWING: 0.3 # max fractional change between consecutive weights (render js: SWING = 0.3)
  GROWTH_LO_DAY: 21 # early-growth window, lower bound (days from first visit)
  GROWTH_HI_DAY: 35 # early-growth window, upper bound
  PLAUSIBLE_LO: 10 # g/kg/day - PROVISIONAL, not the workbook's definition
  PLAUSIBLE_HI: 20 # g/kg/day - PROVISIONAL
  WMIN: 250 # implausible weight floor (g). 250, not 400: these are preterm
  # babies and a 400g floor silently discards real low-birth-weight readings.
  WMAX: 8000 # implausible weight ceiling (g)

# ---------------------------------------------------------------------------
# Per-baby aggregates over the visit series. These replace the JS `series` map
# and the client-side reduce over wrows.
# ---------------------------------------------------------------------------
aggregates:
  - name: num_visits
    sql: 'COUNT(*)'
  - name: first_visit
    sql: 'MIN(visit_date)'
  - name: last_visit
    sql: 'MAX(visit_date)'
  - name: reg_date
    sql: 'MIN(reg_date::timestamp) FILTER (WHERE reg_date IS NOT NULL)'
  - name: birth_weight_g
    sql: 'MIN(birth_weight_g) FILTER (WHERE birth_weight_g IS NOT NULL)'
  - name: enrollment_weight_g
    sql: 'MIN(enrollment_weight_g) FILTER (WHERE enrollment_weight_g IS NOT NULL)'
  - name: days_discharge_to_reg
    sql: 'MIN(days_discharge_to_reg) FILTER (WHERE days_discharge_to_reg IS NOT NULL)'
  - name: kmc_hours_mean
    sql: 'AVG(kmc_hours_mean)'
  # Counts of visits carrying a positive marker. The pipeline's `count` aggregation
  # already applies the yes-filter at Layer 1, so these are plain counts here.
  - name: death_visits
    sql: 'COUNT(*) FILTER (WHERE child_alive_no)'
  - name: danger_visits
    sql: 'COUNT(*) FILTER (WHERE danger_sign_yes)'
  - name: referral_visits
    sql: 'COUNT(*) FILTER (WHERE referred_yes)'
  - name: self_referral_visits
    sql: 'COUNT(*) FILTER (WHERE self_referral_yes)'
  - name: ebf_visits
    sql: 'COUNT(*) FILTER (WHERE ebf_recorded)'
  # Registration vs follow-up. Without this C01/C02/C05 are mathematically
  # identical, because every case is in the table BECAUSE it has a visit.
  - name: n_reg_forms
    sql: "COUNT(*) FILTER (WHERE form_name ~* 'regist')"
  - name: n_followups
    sql: "COUNT(*) FILTER (WHERE form_name !~* 'regist')"
  - name: n_form_names
    sql: 'COUNT(*) FILTER (WHERE form_name IS NOT NULL)'
  # C31 is a sum over weight READINGS, not over day-collapsed days. The render code
  # reads n_weight_readings straight off the pipeline and counts round values over the
  # RAW weights array, so both must be computed here before the day collapse -- using
  # n_weight_days here would silently change the denominator of the rounding rate.
  - name: n_weight_readings
    sql: 'COUNT(*) FILTER (WHERE weight_g IS NOT NULL)'
  - name: n_weights_round_100_raw
    sql: 'COUNT(*) FILTER (WHERE weight_g IS NOT NULL AND weight_g::numeric % 100 = 0)'

# ---------------------------------------------------------------------------
# Weight-series properties. These are the two the browser does with a loop; in
# SQL they are window functions over the per-DAY weight series (the JS collapses
# multiple readings on one day before iterating, so `weight_days` does too).
# ---------------------------------------------------------------------------
weight_series:
  day_collapse: 'AVG(weight_g)' # one reading per (baby, day)
  valid: 'weight_g BETWEEN :WMIN AND :WMAX'
  derived:
    - name: n_weight_days
      sql: 'COUNT(*)'
    - name: weight_span_days
      sql: 'MAX(day)::date - MIN(day)::date'
    - name: first_weight_g
      sql: 'ROUND((ARRAY_AGG(w ORDER BY day ASC))[1])'
    - name: last_weight_g
      sql: 'ROUND((ARRAY_AGG(w ORDER BY day DESC))[1])'
    # |w[i] - w[i-1]| > SWING * w[i-1] on ANY consecutive pair -> inconsistent.
    # The JS breaks out of the loop on the first offender; bool_and is equivalent.
    - name: no_implausible_swing
      sql: 'BOOL_AND(prev_w IS NULL OR ABS(w - prev_w) <= :SWING * prev_w)'
    # Early growth: w0 is the first reading, w28 the LAST reading whose age falls
    # in the window. Matches the JS, which overwrites w28 on each in-window hit.
    - name: growth_w0
      sql: '(ARRAY_AGG(w ORDER BY day ASC))[1]'
    - name: growth_w0_day
      sql: '(ARRAY_AGG(day ORDER BY day ASC))[1]'
    - name: growth_w28
      sql: '(ARRAY_AGG(w ORDER BY day DESC) FILTER (WHERE age_days BETWEEN :GROWTH_LO_DAY AND :GROWTH_HI_DAY))[1]'
    - name: growth_w28_day
      sql: '(ARRAY_AGG(day ORDER BY day DESC) FILTER (WHERE age_days BETWEEN :GROWTH_LO_DAY AND :GROWTH_HI_DAY))[1]'

# ---------------------------------------------------------------------------
# The workbook's Layer 2 properties.
# ---------------------------------------------------------------------------
properties:
  - name: registered
    type: bool
    sql: 'CASE WHEN n_form_names > 0 THEN n_reg_forms >= 1 ELSE num_visits >= 1 END'
    notes: 'Registration form exists. Falls back to the old rule for apps whose export carries no form name, rather than reporting every baby unregistered.'

  - name: started
    type: bool
    sql: 'CASE WHEN n_form_names > 0 THEN n_followups >= 1 ELSE num_visits >= 1 END'
    notes: 'At least one follow-up visit after registration.'

  - name: days_since_first_visit
    type: int
    sql: 'FLOOR(EXTRACT(EPOCH FROM ((:as_of)::timestamp - first_visit::timestamp)) / 86400)::int'

  - name: days_first_to_last
    type: int
    sql: 'ROUND(EXTRACT(EPOCH FROM (last_visit::timestamp - first_visit::timestamp)) / 86400)::int'

  - name: eligible
    type: bool
    sql: 'started AND first_visit IS NOT NULL AND days_since_first_visit >= :ELIG_DAYS'
    notes: '28 days from FIRST VISIT, not reg_date. Workbook section 4.1 anchor decision.'

  - name: died
    type: bool
    sql: 'death_visits > 0'

  - name: outcome_known
    type: bool
    sql: 'died OR (days_first_to_last IS NOT NULL AND days_first_to_last >= :ELIG_DAYS)'
    notes: "Case-properties tab verbatim: died, or seen at least 28 days after first visit. FALSE means lost to follow-up. Reading it as 'child_alive was ever recorded' makes it true for nearly every case and reports C15 as ~0."

  - name: early_exit
    type: bool
    sql: 'died AND days_first_to_last IS NOT NULL AND days_first_to_last < :ELIG_DAYS'
    notes: "Died before its eligibility date. The death visit's own date is not carried at entity stage, but a death is recorded AT a visit, so a died case whose last visit precedes day 28 died before eligibility. Deliberate under-count rather than a guess at the death date."

  - name: n_weights
    type: int
    sql: 'COALESCE(n_weight_days, 0)'

  - name: weight_computable
    type: bool
    sql: 'COALESCE(n_weight_days, 0) >= 2 AND COALESCE(weight_span_days, 0) >= 7'

  - name: weight_consistent
    type: bool
    sql: 'weight_computable AND COALESCE(no_implausible_swing, TRUE)'

  - name: early_g_per_kg_day
    type: number
    sql: >-
      CASE WHEN weight_computable
                AND growth_w28 IS NOT NULL
                AND growth_w28_day <> growth_w0_day
                AND (growth_w28_day::date - growth_w0_day::date) > 0
           THEN (growth_w28 - growth_w0) / (growth_w0 / 1000.0)
                / (growth_w28_day::date - growth_w0_day::date)
           ELSE NULL END

  - name: weight_gain_data_sufficient
    type: bool
    sql: 'early_g_per_kg_day IS NOT NULL AND weight_consistent'

  - name: growth_class
    type: categorical
    sql: >-
      CASE WHEN NOT weight_gain_data_sufficient THEN NULL
           WHEN early_g_per_kg_day < :PLAUSIBLE_LO THEN 'slow'
           WHEN early_g_per_kg_day > :PLAUSIBLE_HI THEN 'fast'
           ELSE 'plausible' END
    notes: "PROVISIONAL. The workbook's bands are birth-weight-band-specific and that table does not exist yet; the UI labels this provisional."

  # -------------------------------------------------------------------------
  # Neal's demo spec, additive. The C-series above is unchanged and keeps its
  # parity guarantee; everything from here down is read only by the N-series
  # measures in indicators.yml.
  # -------------------------------------------------------------------------

  - name: has_discharge_date
    type: bool
    sql: 'days_discharge_to_reg IS NOT NULL'
    notes: 'The denominator condition for the within-3-days metric. days_discharge_to_reg is what Layer 1 carries to entity stage; the raw discharge date is not aggregated there.'

  - name: birthweight_band
    type: categorical
    sql: >-
      CASE WHEN birth_weight_g IS NULL THEN NULL
           WHEN birth_weight_g < :WMIN OR birth_weight_g > :WMAX THEN NULL
           WHEN birth_weight_g < 1000 THEN '<1000'
           WHEN birth_weight_g < 1500 THEN '1000-1499'
           WHEN birth_weight_g < 2000 THEN '1500-1999'
           WHEN birth_weight_g < 2500 THEN '2000-2499'
           ELSE '2500+' END
    notes: "Null when birth weight is missing or implausible. A missing birthweight EXCLUDES a case from the growth-quality denominator; it does not make it 'incomplete'."

  # The plausible early-growth range is BIRTH-WEIGHT-BAND SPECIFIC. growth_class
  # above uses a flat 10-20 marked PROVISIONAL precisely because this table did
  # not exist; it does now. A flat band is wrong at both ends - it calls a healthy
  # 2,500g baby fast (real ceiling 18) and a struggling sub-1,000g baby plausible
  # (real floor 9).
  - name: growth_plausible_lo
    type: number
    sql: >-
      CASE birthweight_band
           WHEN '<1000' THEN 9 WHEN '1000-1499' THEN 6 WHEN '1500-1999' THEN 6
           WHEN '2000-2499' THEN 5 WHEN '2500+' THEN 0 ELSE NULL END

  - name: growth_plausible_hi
    type: number
    sql: >-
      CASE birthweight_band
           WHEN '<1000' THEN 30 WHEN '1000-1499' THEN 28 WHEN '1500-1999' THEN 24
           WHEN '2000-2499' THEN 20 WHEN '2500+' THEN 18 ELSE NULL END

  - name: growth_class_banded
    type: categorical
    sql: >-
      CASE WHEN NOT weight_gain_data_sufficient THEN NULL
           WHEN birthweight_band IS NULL THEN NULL
           WHEN early_g_per_kg_day < growth_plausible_lo THEN 'slow'
           WHEN early_g_per_kg_day > growth_plausible_hi THEN 'fast'
           ELSE 'plausible' END
    notes: 'The banded counterpart of growth_class. Computed only when the case is sufficient AND banded, so slow/plausible/fast plus not-sufficient partition the qualifying set exactly.'

  - name: eligible_28d
    type: bool
    sql: 'started AND first_visit IS NOT NULL AND days_since_first_visit >= :MATURITY_OUTCOME_DAYS'

  - name: eligible_42d
    type: bool
    sql: 'started AND first_visit IS NOT NULL AND days_since_first_visit >= :MATURITY_GROWTH_DAYS'
    notes: 'Growth and visits-per-case maturity. A case registered 40 days ago but first visited 20 days ago is NOT eligible - maturity anchors on the first VISIT.'

  - name: eligible_90d
    type: bool
    sql: 'started AND first_visit IS NOT NULL AND days_since_first_visit >= :MATURITY_COMPLETION_DAYS'

  - name: qualifying_svn
    type: bool
    sql: 'eligible_42d AND birthweight_band IS NOT NULL'
    notes: 'The single shared denominator for the four growth-quality shares, which sum to 100% over it.'

  - name: ever_danger_sign
    type: bool
    sql: 'danger_visits > 0'

  - name: referred
    type: bool
    sql: 'referral_visits > 0'

  - name: self_referral_count
    type: int
    sql: 'COALESCE(self_referral_visits, 0)'

  - name: enrolled_within_3d
    type: bool
    sql: 'CASE WHEN days_discharge_to_reg IS NULL THEN NULL ELSE days_discharge_to_reg <= 3 END'

  - name: enrollment_is_birth_copy
    type: bool
    sql: >-
      CASE WHEN birth_weight_g IS NOT NULL AND enrollment_weight_g IS NOT NULL
           THEN ABS(birth_weight_g - enrollment_weight_g) < 1
           ELSE NULL END
