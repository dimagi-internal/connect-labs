# KMC Layer 2 — case properties, one row per baby.
#
# The workbook's Layer 2 (kmc_metrics_framework.xlsx, "Case properties" tab),
# expressed as SQL over the visit-level extraction the pipeline already emits.
#
# WHY THIS FILE EXISTS
# The existing kmc_programme_metrics dashboard derives all of this in the browser,
# in JavaScript, over one row per baby carrying a weights array. That forces Layer 3
# to be in-memory too, because none of these properties exist in the database to
# GROUP BY. Moving them here makes the indicator layer a GROUP BY, and makes the
# definitions readable by a second engine (Neal's local Python) instead of being
# trapped in render code.
#
# CONTRACT
# - `sql` is evaluated per baby, in the `props` CTE, over the aggregates in `visit_agg`.
# - `visit_agg` columns are produced by the aggregates block below.
# - Every expression is portable Postgres over NAMED COLUMNS — no JSONB, no paths.
#   Layer 1 (paths -> columns) stays in the pipeline schema, per Scout's precedent.
#
# DEFINITIONS: Neal Lesh's metrics framework workbook (kmc_metrics_framework.xlsx,
# as revised 2026-10-03: Case properties + Case indicators tabs). It supersedes the
# v3 compute spec where they differ -- see indicators.yml for the list. They are
# working definitions and are expected to change.

version: 1

# ---------------------------------------------------------------------------
# The MODEL: what one row of `props` is, and where its visit rows come from. The
# engine used to know all of this as constants (connect_labs/semantic/model.py);
# KMC now declares it like any other registry. Records saved before this section
# existed get these same values from connect_labs/semantic/legacy.py -- this file
# must never need that.
# ---------------------------------------------------------------------------
entity:
  name: baby # also names the row key, baby_id = opportunity_id|baby_case_id
  plural: babies
  key: baby_case_id
  # Registration, falling back to the first visit. reg_date is a FILTERed MIN, so a
  # baby whose rows never carried one aggregates to NULL; truncating reg_date alone
  # dropped those cases out of every month.
  cohort_date: 'COALESCE(reg_date, first_visit::timestamp)'

# Derived per-visit columns Layer 1 adds. The pipeline emits the markers as strings
# and applies them as `contains_word` at aggregation time; at visit level the same
# test is materialised so the aggregates below can just count them.
visit_columns:
  - name: child_alive_no
    word_match: { column: death_visits, word: 'no' }
  - name: danger_sign_yes
    word_match: { column: danger_visits, word: 'yes' }
  - name: referred_yes
    word_match: { column: referral_visits, word: 'yes' }
  - name: self_referral_yes
    word_match: { column: self_referral_visits, word: 'yes' }
  - name: ebf_recorded
    sql: 'ebf_visits IS NOT NULL'
  - name: form_name
    column: form_names
  # --- read by the case states (see "Case states" below). `optional`: NULL until
  # the entity pipeline carries the fields they read (referral_answer, ds_*/dsl_*,
  # kmc_hours_total) -- the states then simply never hold.
  # The visit's explicit referral answer: "not referred" needs the no.
  - name: referred_no
    optional: true
    word_match: { column: referral_answer, word: 'no' }
  # Which danger signs the visit recorded, in words (NULL when none).
  - name: danger_signs
    optional: true
    labels:
      - { column: ds_convulsions, word: 'yes', label: 'convulsions (fits)' }
      - {
          column: ds_chest_indrawing,
          word: 'yes',
          label: 'severe chest indrawing',
        }
      - {
          column: ds_lethargic,
          word: 'yes',
          label: 'floppy or unusually sleepy',
        }
      - { column: ds_bluish, word: 'yes', label: 'blue lips or face' }
      - { column: dsl_hypoxia, word: 'ok', label: 'low oxygen' }
      - { column: dsl_fever, word: 'ok', label: 'fever' }
      - { column: dsl_hypothermia, word: 'ok', label: 'low body temperature' }
      - { column: dsl_fast_breathing, word: 'ok', label: 'fast breathing' }
      - { column: dsl_slow_breathing, word: 'ok', label: 'slow breathing' }
      - { column: ds_noisy_breathing, word: 'yes', label: 'noisy breathing' }
      - { column: dsl_low_heart_rate, word: 'ok', label: 'slow heart rate' }
      - { column: ds_poor_feeding, word: 'yes', label: 'not feeding well' }
      - {
          column: ds_pus,
          word: 'yes',
          label: 'pus in the eyes, skin or belly button',
        }
      - { column: ds_jaundice, word: 'yes', label: 'yellow skin or eyes' }
  # The weight a visit recorded: the visit's own weighing, and on the registration
  # form the registration weight (follow-ups repeat it as a case property, so it is
  # never read there).
  - name: visit_weight_g
    optional: true
    sql: "CASE WHEN form_names ~* 'regist' THEN COALESCE(weight_g, enrollment_weight_g) ELSE weight_g END"
  - name: skin_to_skin_h
    optional: true
    column: kmc_hours_total
  # The referral answer as recorded, for a case's visit lines -- through a visit
  # column so it reads NULL, not an error, until the pipeline carries the field.
  - name: referral_text
    optional: true
    column: referral_answer

# Layer 1 is generated from the `children` pipeline. The per-visit weight is NOT in
# it: the dashboard reads the series from a second pipeline ("KMC Weight Series"),
# whose `weight_g` has its own fallback paths.
pipelines:
  entity: children
  extra_fields:
    weight_g: visits

constants:
  # Maturity, measured from the first VISIT. The workbook (2026-10-03) has ONE
  # gate: `eligible` = started AND 28 days since the first visit, for outcomes,
  # growth and visits alike. The 42-day growth gate of the v3 spec is retired;
  # MATURITY_GROWTH_DAYS stays only so eligible_42d keeps compiling for saved
  # runs that name it -- no indicator reads it. Completion waits on its own gate.
  MATURITY_OUTCOME_DAYS: 28
  MATURITY_GROWTH_DAYS: 42
  MATURITY_COMPLETION_DAYS: 90
  STARTED_MIN_VISITS: 1 # started = 1 or more follow-up visits (workbook 2026-10-03; was 2)
  REFERRAL_WINDOW_DAYS: 28 # referred_within_28d: first referral within 28 days of registration
  DIP_MIN_RATIO: 0.85 # expected dip: enrolment weight 1-15% below birth weight
  DIP_MAX_RATIO: 0.99
  GA_MIN: 20 # gestational age plausible range, weeks (spec section 2)
  GA_MAX: 45
  WMIN: 250 # implausible weight floor (g). 250, not 400: these are preterm
  # babies and a 400g floor silently discards real low-birth-weight readings.
  WMAX: 8000 # implausible weight ceiling (g)
  SERIES_WINDOW_DAYS: 21 # growth window: first 21 days of the measured series
  VELOCITY_MIN_SPAN: 5 # velocity needs >=2 in-window weigh-days spanning >=5 days
  THIN_MIN_DAYS: 3 # thin: <3 measured weigh-days
  INCONSISTENT_RATIO: 0.6 # inconsistent: first-visit wt < 0.60 x birth wt
  IMPOSSIBLE_LO: -20 # impossible step: visit-to-visit change outside -20..45 g/kg/day
  IMPOSSIBLE_HI: 45
  IMPOSSIBLE_GAP_MIN: 1 # checked only between visits 1-90 days apart
  IMPOSSIBLE_GAP_MAX: 90
  # Case states (see "Case states" below). A state counts when its evidence falls
  # within STATE_RECENT_DAYS of the report date.
  STATE_RECENT_DAYS: 30
  CASE_WMIN: 800 # a weighing outside 800-5000 g is not a KMC baby's weight
  CASE_WMAX: 5000
  SAME_WEIGHT_TOLERANCE_G: 0.5 # "the same weight" three weighings running
  THRIVING_MIN_GAIN: 15 # every interval of 3+ days at 15 g/kg/day or more ...
  THRIVING_MIN_GAP_DAYS: 3 # (shorter intervals are scale noise, not growth)
  THRIVING_MIN_RISE: 0.2 # ... and the latest weight 20% above the first
  FALTERING_MAX_GAIN: 5 # under 5 g/kg/day over the last two intervals

# ---------------------------------------------------------------------------
# Per-baby aggregates over the visit series. These replace the JS `series` map
# and the client-side reduce over wrows.
# ---------------------------------------------------------------------------
aggregates:
  - name: num_visits
    label: 'Visits'
    means: 'Number of form submissions for the baby, registration included.'
    sql: 'COUNT(*)'
  - name: first_visit
    label: 'First visit date'
    means: "Date of the baby's first visit."
    sql: 'MIN(visit_date)'
  - name: last_visit
    label: 'Last visit date'
    means: "Date of the baby's most recent visit."
    sql: 'MAX(visit_date)'
  - name: reg_date
    label: 'Registration date'
    means: 'Date the baby was registered.'
    sql: 'MIN(reg_date::timestamp) FILTER (WHERE reg_date IS NOT NULL)'
  - name: birth_weight_g
    label: 'Birthweight (g)'
    means: 'Birthweight recorded for the baby, in grams.'
    sql: 'MIN(birth_weight_g) FILTER (WHERE birth_weight_g IS NOT NULL)'
  - name: enrollment_weight_g
    label: 'Enrolment weight (g)'
    means: 'Weight recorded at enrolment, in grams.'
    sql: 'MIN(enrollment_weight_g) FILTER (WHERE enrollment_weight_g IS NOT NULL)'
  - name: gestational_age_wks
    label: 'Gestational age (weeks)'
    means: 'Gestational age at birth as recorded.'
    sql: 'MIN(gestational_age_wks) FILTER (WHERE gestational_age_wks IS NOT NULL)'
  - name: days_discharge_to_reg
    label: 'Reported days from discharge'
    means: "The form's own count of days from hospital discharge to registration."
    sql: 'MIN(days_discharge_to_reg) FILTER (WHERE days_discharge_to_reg IS NOT NULL)'
  # The RAW discharge date, which Layer 1 extracts and this stage used to drop.
  # Dropping it forced the enrolment indicators onto `days_discharge_to_reg` -- a value the FORM
  # pre-computes (child_age_at_reg_discharge_date) rather than one we derive. Two
  # apps never populate that field at all, so EHA and GHI scored 0% coverage while
  # holding real discharge dates for 35% and 46% of their cases.
  - name: hospital_discharge_date
    label: 'Hospital discharge date'
    means: 'Date the baby left hospital.'
    sql: 'MIN(hospital_discharge_date::timestamp) FILTER (WHERE hospital_discharge_date IS NOT NULL)'
  - name: kmc_hours_mean
    label: 'Daily KMC hours'
    means: "Average hours of skin-to-skin care per day reported across the baby's visits."
    sql: 'AVG(kmc_hours_mean)'
  # Counts of visits carrying a positive marker. The pipeline's `count` aggregation
  # already applies the yes-filter at Layer 1, so these are plain counts here.
  - name: death_visits
    label: 'Visits recording death'
    means: 'Visits that recorded the baby as not alive.'
    sql: 'COUNT(*) FILTER (WHERE child_alive_no)'

  - name: death_date
    label: 'Date death recorded'
    means: 'Date of the first visit that recorded the baby as not alive.'
    sql: 'MIN(visit_date) FILTER (WHERE child_alive_no)'
  - name: danger_visits
    label: 'Visits with a danger sign'
    means: 'Visits that recorded a danger sign.'
    sql: 'COUNT(*) FILTER (WHERE danger_sign_yes)'
  - name: referral_visits
    label: 'Visits with a referral'
    means: 'Visits that recorded a referral.'
    sql: 'COUNT(*) FILTER (WHERE referred_yes)'

  - name: first_referral_date
    label: 'First referral date'
    means: 'Date of the first visit that recorded a referral.'
    sql: 'MIN(visit_date) FILTER (WHERE referred_yes)'
  - name: self_referral_visits
    label: 'Visits with a self-referral'
    means: 'Visits that recorded a self-referral.'
    sql: 'COUNT(*) FILTER (WHERE self_referral_yes)'
  - name: ebf_visits
    label: 'Visits recording breastfeeding'
    means: 'Visits that recorded exclusive breastfeeding.'
    sql: 'COUNT(*) FILTER (WHERE ebf_recorded)'
  # Registration vs follow-up. Without this registered/started/total are mathematically
  # identical, because every case is in the table BECAUSE it has a visit.
  - name: n_reg_forms
    label: 'Registration forms'
    means: 'Number of registration forms submitted for the baby.'
    sql: "COUNT(*) FILTER (WHERE form_name ~* 'regist')"
  - name: n_followups
    label: 'Follow-up forms'
    means: 'Number of non-registration forms submitted for the baby.'
    sql: "COUNT(*) FILTER (WHERE form_name !~* 'regist')"
  - name: n_form_names
    label: 'Forms with a name'
    means: 'Visits whose form name is known.'
    sql: 'COUNT(*) FILTER (WHERE form_name IS NOT NULL)'
  # weight_rounding_rate is a sum over weight READINGS, not over day-collapsed days. The render code
  # reads n_weight_readings straight off the pipeline and counts round values over the
  # RAW weights array, so both must be computed here before the day collapse -- using
  # n_weight_days here would silently change the denominator of the rounding rate.
  - name: n_weight_readings
    label: 'Weight readings'
    means: 'Number of visits that recorded a weight.'
    sql: 'COUNT(*) FILTER (WHERE weight_g IS NOT NULL)'
  - name: n_weights_round_100_raw
    label: 'Weight readings rounded to 100 g'
    means: 'Weight readings that are an exact multiple of 100 g, a sign of rounding rather than reading the scale.'
    # MOD(), not the % operator. psycopg2 reads % as a parameter placeholder, so a
    # literal modulo makes cursor.execute raise 'tuple index out of range' before the
    # query ever reaches Postgres. The parity tests never saw it because they use RAW
    # psycopg2, which only interpolates when params are passed; the endpoint goes
    # through Django's cursor, which is the path that trips. MOD is standard SQL and
    # has no such ambiguity — connect-labs#1470 follow-up.
    sql: 'COUNT(*) FILTER (WHERE weight_g IS NOT NULL AND MOD(weight_g::numeric, 100) = 0)'

  # --- read by the case states ---
  - name: case_name
    label: 'Name'
    means: 'The name the visits give the baby (the latest one).'
    sql: '(ARRAY_AGG(entity_name ORDER BY visit_date DESC) FILTER (WHERE entity_name IS NOT NULL))[1]'
  - name: implausible_weight_date
    label: 'Last implausible weighing'
    means: 'The latest visit whose recorded weight is outside 800-5000 g.'
    sql: 'MAX(visit_date) FILTER (WHERE visit_weight_g < :CASE_WMIN OR visit_weight_g > :CASE_WMAX)'
  - name: implausible_weight_g
    label: 'Implausible weight (g)'
    means: 'The most recent recorded weight outside 800-5000 g.'
    sql: '(ARRAY_AGG(visit_weight_g ORDER BY visit_date DESC) FILTER (WHERE visit_weight_g < :CASE_WMIN OR visit_weight_g > :CASE_WMAX))[1]'
  - name: unreferred_danger_date
    label: 'Danger sign, not referred'
    means: 'The latest visit that recorded a danger sign and answered that the baby was not referred.'
    sql: 'MAX(visit_date) FILTER (WHERE danger_signs IS NOT NULL AND referred_no)'
  - name: unreferred_danger_signs
    label: 'Signs recorded, not referred'
    means: 'The danger signs that visit recorded.'
    sql: '(ARRAY_AGG(danger_signs ORDER BY visit_date DESC) FILTER (WHERE danger_signs IS NOT NULL AND referred_no))[1]'
  - name: unreferred_danger_visits
    label: 'Visits with a danger sign and no referral'
    means: 'Visits that recorded a danger sign and answered that the baby was not referred.'
    sql: 'COUNT(*) FILTER (WHERE danger_signs IS NOT NULL AND referred_no)'
  - name: s2s_last_h
    label: 'Latest skin-to-skin hours'
    means: 'Skin-to-skin hours over the last 24 h at the latest visit that recorded them.'
    sql: '(ARRAY_AGG(skin_to_skin_h ORDER BY visit_date DESC) FILTER (WHERE skin_to_skin_h IS NOT NULL))[1]'
  - name: s2s_prev_h
    label: 'Previous skin-to-skin hours'
    means: 'Skin-to-skin hours at the visit before that.'
    sql: '(ARRAY_AGG(skin_to_skin_h ORDER BY visit_date DESC) FILTER (WHERE skin_to_skin_h IS NOT NULL))[2]'
  - name: s2s_last_date
    label: 'Latest skin-to-skin visit'
    means: 'Date of the latest visit that recorded skin-to-skin hours.'
    sql: '(ARRAY_AGG(visit_date ORDER BY visit_date DESC) FILTER (WHERE skin_to_skin_h IS NOT NULL))[1]'
  - name: s2s_prev_date
    label: 'Previous skin-to-skin visit'
    means: 'Date of the visit before that.'
    sql: '(ARRAY_AGG(visit_date ORDER BY visit_date DESC) FILTER (WHERE skin_to_skin_h IS NOT NULL))[2]'

# ---------------------------------------------------------------------------
# Weight-series properties. These are the two the browser does with a loop; in
# SQL they are window functions over the per-DAY weight series (the JS collapses
# multiple readings on one day before iterating, so `weight_days` does too).
# ---------------------------------------------------------------------------
weight_series:
  value_column: weight_g # the Layer-1 column the series reads
  day_collapse: 'AVG(weight_g)' # one reading per (baby, day)
  valid: 'weight_g BETWEEN :WMIN AND :WMAX'
  # The series is the ENROLMENT weight at reg_date plus every visit weight
  # (same-day visit wins; an enrolment weight within 1 g of birth weight is a
  # re-entry, not a measurement). It enters as a SEED reading: is_seed = TRUE,
  # never paired with a visit reading. It counts toward "thin" (n_measured_days)
  # and nothing else -- velocity and the impossible-step check read visits only.
  seed_reading:
    day: reg_date
    value: enrollment_weight_g
    exclude: 'ABS(weight_g - birth_weight_g) < 1'
  derived:
    - name: n_weight_days
      sql: 'COUNT(*) FILTER (WHERE NOT is_seed)'
    - name: n_measured_days
      sql: 'COUNT(*)'
      # measured weigh-days INCLUDING the enrolment reading -- the spec's "thin"
    - name: first_weight_g
      sql: 'ROUND((ARRAY_AGG(w ORDER BY day ASC) FILTER (WHERE NOT is_seed))[1])'
    - name: last_weight_g
      sql: 'ROUND((ARRAY_AGG(w ORDER BY day DESC) FILTER (WHERE NOT is_seed))[1])'
    # Spec section 2b: the first SERIES_WINDOW_DAYS days of the measured series,
    # counted from the first weighing (series_day), not from the first visit.
    # Velocity = (last - first) / span / (mean / 1000) over that window.
    - name: win_n
      sql: 'COUNT(*) FILTER (WHERE NOT is_seed AND series_day <= :SERIES_WINDOW_DAYS)'
    - name: win_first_w
      sql: '(ARRAY_AGG(w ORDER BY day ASC) FILTER (WHERE NOT is_seed AND series_day <= :SERIES_WINDOW_DAYS))[1]'
    - name: win_last_w
      sql: '(ARRAY_AGG(w ORDER BY day DESC) FILTER (WHERE NOT is_seed AND series_day <= :SERIES_WINDOW_DAYS))[1]'
    - name: win_span_days
      sql: 'MAX(day) FILTER (WHERE NOT is_seed AND series_day <= :SERIES_WINDOW_DAYS) - MIN(day) FILTER (WHERE NOT is_seed AND series_day <= :SERIES_WINDOW_DAYS)'
    - name: win_mean_w
      sql: 'AVG(w) FILTER (WHERE NOT is_seed AND series_day <= :SERIES_WINDOW_DAYS)'
    # An impossible STEP is a per-pair rate in g/kg/day -- the change between two
    # consecutive weighings divided by the MEAN of the two readings in kg and by
    # the days between them -- outside IMPOSSIBLE_LO..HI, checked only inside the
    # window and only between weighings 1-90 days apart. The enrolment weight is
    # not in this series, so the spec's enrolment->visit-1 exclusion holds by
    # construction. Per kg of the PREVIOUS reading overstated every gain and ran
    # 2-6 points high on every LLO; with the pair mean, %impossible matched Neal's
    # v3 section 5 to one decimal on all seven rows (verified 2026-09-11: PIPN 9.3,
    # EHA 4.2 vs 4.3, NAMA 15.9 vs 15.7, GHI 3.1, Kikapu 42.5, BERI 12.2, All 10.0).
    - name: any_impossible_step
      sql: >-
        BOOL_OR(NOT is_seed AND prev_day IS NOT NULL
                AND series_day <= :SERIES_WINDOW_DAYS
                AND (day - prev_day) BETWEEN :IMPOSSIBLE_GAP_MIN AND :IMPOSSIBLE_GAP_MAX
                AND prev_w > 0
                AND ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day))
                    NOT BETWEEN :IMPOSSIBLE_LO AND :IMPOSSIBLE_HI)
    # --- read by the case states: over the WHOLE series, not the growth window.
    # A step's rate is the registry's impossible-step rule (pair mean, 1-90 days).
    - name: any_bad_step
      sql: 'BOOL_OR(NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) BETWEEN :IMPOSSIBLE_GAP_MIN AND :IMPOSSIBLE_GAP_MAX AND prev_w > 0 AND ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) NOT BETWEEN :IMPOSSIBLE_LO AND :IMPOSSIBLE_HI)'
    - name: step_to_date
      sql: '(ARRAY_AGG(day ORDER BY GREATEST(((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) - :IMPOSSIBLE_HI, :IMPOSSIBLE_LO - ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day))) DESC, day DESC) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) BETWEEN :IMPOSSIBLE_GAP_MIN AND :IMPOSSIBLE_GAP_MAX AND prev_w > 0 AND ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) NOT BETWEEN :IMPOSSIBLE_LO AND :IMPOSSIBLE_HI))[1]'
    - name: step_from_date
      sql: '(ARRAY_AGG(prev_day ORDER BY GREATEST(((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) - :IMPOSSIBLE_HI, :IMPOSSIBLE_LO - ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day))) DESC, day DESC) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) BETWEEN :IMPOSSIBLE_GAP_MIN AND :IMPOSSIBLE_GAP_MAX AND prev_w > 0 AND ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) NOT BETWEEN :IMPOSSIBLE_LO AND :IMPOSSIBLE_HI))[1]'
    - name: step_change_g
      sql: '(ARRAY_AGG(w - prev_w ORDER BY GREATEST(((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) - :IMPOSSIBLE_HI, :IMPOSSIBLE_LO - ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day))) DESC, day DESC) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) BETWEEN :IMPOSSIBLE_GAP_MIN AND :IMPOSSIBLE_GAP_MAX AND prev_w > 0 AND ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) NOT BETWEEN :IMPOSSIBLE_LO AND :IMPOSSIBLE_HI))[1]'
    - name: step_days
      sql: '(ARRAY_AGG(day - prev_day ORDER BY GREATEST(((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) - :IMPOSSIBLE_HI, :IMPOSSIBLE_LO - ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day))) DESC, day DESC) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) BETWEEN :IMPOSSIBLE_GAP_MIN AND :IMPOSSIBLE_GAP_MAX AND prev_w > 0 AND ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) NOT BETWEEN :IMPOSSIBLE_LO AND :IMPOSSIBLE_HI))[1]'
    - name: step_rate
      sql: '(ARRAY_AGG(((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) ORDER BY GREATEST(((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) - :IMPOSSIBLE_HI, :IMPOSSIBLE_LO - ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day))) DESC, day DESC) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) BETWEEN :IMPOSSIBLE_GAP_MIN AND :IMPOSSIBLE_GAP_MAX AND prev_w > 0 AND ((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) NOT BETWEEN :IMPOSSIBLE_LO AND :IMPOSSIBLE_HI))[1]'
    - name: same3_date
      sql: 'MAX(day) FILTER (WHERE NOT is_seed AND prev2_w IS NOT NULL AND ABS(w - prev_w) < :SAME_WEIGHT_TOLERANCE_G AND ABS(prev_w - prev2_w) < :SAME_WEIGHT_TOLERANCE_G)'
    - name: same3_from_date
      sql: '(ARRAY_AGG(prev2_day ORDER BY day DESC) FILTER (WHERE NOT is_seed AND prev2_w IS NOT NULL AND ABS(w - prev_w) < :SAME_WEIGHT_TOLERANCE_G AND ABS(prev_w - prev2_w) < :SAME_WEIGHT_TOLERANCE_G))[1]'
    - name: same3_w
      sql: '(ARRAY_AGG(w ORDER BY day DESC) FILTER (WHERE NOT is_seed AND prev2_w IS NOT NULL AND ABS(w - prev_w) < :SAME_WEIGHT_TOLERANCE_G AND ABS(prev_w - prev2_w) < :SAME_WEIGHT_TOLERANCE_G))[1]'
    - name: n_gap3_steps
      sql: 'COUNT(*) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) >= :THRIVING_MIN_GAP_DAYS AND prev_w > 0)'
    - name: min_rate_gap3
      sql: 'MIN(((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day))) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) >= :THRIVING_MIN_GAP_DAYS AND prev_w > 0)'
    - name: avg_rate_gap3
      sql: 'SUM(((w - prev_w) / (((w + prev_w) / 2.0) / 1000.0) / (day - prev_day)) * (day - prev_day)) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) >= :THRIVING_MIN_GAP_DAYS AND prev_w > 0) / NULLIF(SUM(day - prev_day) FILTER (WHERE NOT is_seed AND prev_day IS NOT NULL AND (day - prev_day) >= :THRIVING_MIN_GAP_DAYS AND prev_w > 0), 0)'
    - name: first_weigh_date
      sql: 'MIN(day) FILTER (WHERE NOT is_seed)'
    - name: last_weigh_date
      sql: 'MAX(day) FILTER (WHERE NOT is_seed)'
    # The reading two before the latest -- the enrolment weighing included, so a
    # baby weighed at registration and twice since has two intervals to judge.
    - name: third_last_w
      sql: '(ARRAY_AGG(w ORDER BY day DESC))[3]'
    - name: third_last_date
      sql: '(ARRAY_AGG(day ORDER BY day DESC))[3]'

# ---------------------------------------------------------------------------
# Layer 2: the per-baby properties every indicator is built from.
# ---------------------------------------------------------------------------
properties:
  - name: registered
    label: 'Registered'
    means: 'The baby has a registration form.'
    type: bool
    sql: 'CASE WHEN n_form_names > 0 THEN n_reg_forms >= 1 ELSE num_visits >= 1 END'
    notes: 'Registration form exists. Falls back to any visit for apps whose export carries no form name, rather than reporting every baby unregistered.'

  - name: followup_visits
    label: 'Follow-up visits'
    means: 'Number of follow-up visits, not counting registration.'
    type: int
    sql: 'CASE WHEN n_form_names > 0 THEN n_followups ELSE num_visits END'

  - name: started
    label: 'Started'
    means: 'The baby has at least 1 follow-up visit -- a delivered case, as opposed to a registration that was never visited.'
    type: bool
    sql: 'followup_visits >= :STARTED_MIN_VISITS'
    notes: >-
      Workbook 2026-10-03: changed from 2 visits, which hid one-and-done cases
      from every denominator. A one-visit baby now fails
      weight_gain_data_computable instead of vanishing (on prod run 21114 the
      2-visit rule had dropped 388 babies, 69 of whom died, from mortality).

  - name: days_since_first_visit
    label: 'Days since first visit'
    means: "Days from the baby's first visit to the report date."
    type: int
    sql: 'FLOOR(EXTRACT(EPOCH FROM ((:as_of)::timestamp - first_visit::timestamp)) / 86400)::int'

  - name: days_first_to_last
    label: 'Days followed'
    means: "Days between the baby's first and last visit."
    type: int
    sql: 'ROUND(EXTRACT(EPOCH FROM (last_visit::timestamp - first_visit::timestamp)) / 86400)::int'

  - name: eligible_28d
    label: 'Eligible (followed 28+ days)'
    means: 'Started, and the first visit was at least 28 days before the report date.'
    type: bool
    sql: 'started AND first_visit IS NOT NULL AND days_since_first_visit >= :MATURITY_OUTCOME_DAYS'
    notes: "The workbook's `eligible`, THE default gate for outcomes, growth and visits. Maturity anchors on the first VISIT, not reg_date: a baby registered 40 days ago but first visited 20 days ago is not eligible."

  - name: eligible_42d
    label: 'Followed 42+ days'
    means: 'Started, and the first visit was at least 42 days before the report date.'
    type: bool
    sql: 'started AND first_visit IS NOT NULL AND days_since_first_visit >= :MATURITY_GROWTH_DAYS'
    notes: 'Retired as a gate (workbook 2026-10-03: growth is gated on `eligible`, 28 days). Kept so a saved run that names it still compiles; no indicator reads it.'

  - name: eligible_90d
    label: 'Followed 90+ days'
    means: 'Started, and the first visit was at least 90 days before the report date.'
    type: bool
    sql: 'started AND first_visit IS NOT NULL AND days_since_first_visit >= :MATURITY_COMPLETION_DAYS'
    notes: 'The completion gate. No indicator reads it yet: completion waits on its definition.'

  - name: died
    label: 'Died'
    means: 'A visit recorded the baby as not alive.'
    type: bool
    sql: 'death_visits > 0'

  - name: outcome_known
    label: 'Outcome known'
    means: 'The baby died, or was still being seen at least 28 days after the first visit. Otherwise the baby is lost to follow-up.'
    type: bool
    sql: 'died OR (days_first_to_last IS NOT NULL AND days_first_to_last >= :MATURITY_OUTCOME_DAYS)'
    notes: "Died, or seen at least 28 days after the first visit. FALSE means lost to follow-up. Reading it as 'child_alive was ever recorded' makes it true for nearly every case."

  - name: early_exit
    label: 'Died before eligibility'
    means: 'The baby died before its eligibility date (28 days after the first visit).'
    type: bool
    sql: >-
      died AND death_date IS NOT NULL AND first_visit IS NOT NULL
      AND FLOOR(EXTRACT(EPOCH FROM (death_date::timestamp - first_visit::timestamp)) / 86400) < :MATURITY_OUTCOME_DAYS
    notes: >-
      Workbook: a modifier, not part of eligible. Applied only where the baby had
      to survive to produce what is measured -- the weight funnel. Not mortality,
      where death IS the event, and not loss to follow-up. Graduation is
      logically the same but not counted: recording is unreliable, so counting
      it would let an LLO shrink its own denominator.

  - name: n_weights
    label: 'Days weighed'
    means: 'Number of distinct days with a valid weight reading.'
    type: int
    sql: 'COALESCE(n_weight_days, 0)'

  - name: days_to_enrolment
    label: 'Days from discharge to enrolment'
    means: 'Days between hospital discharge and registration in the programme.'
    type: float
    sql: >-
      COALESCE(
        (reg_date::date - hospital_discharge_date::date)::float,
        days_discharge_to_reg
      )
    notes: >-
      The spec derives this from the two dates. The form's own
      child_age_at_reg_discharge_date is a CALCULATED field two of the six apps
      never write, so reading it alone gave EHA and GHI 0% coverage while they
      carried discharge dates on 35% and 46% of cases. Dates first, the reported
      value as a fallback: coverage is a superset of either source alone.

  - name: has_discharge_date
    label: 'Discharge date known'
    means: 'The hospital discharge date is recorded, so time to enrolment can be measured.'
    type: bool
    sql: 'days_to_enrolment IS NOT NULL'

  - name: enrolled_within_3d
    label: 'Enrolled within 3 days'
    means: 'Registered 0 to 3 days after hospital discharge.'
    type: bool
    sql: >-
      CASE WHEN days_to_enrolment IS NULL THEN NULL
           ELSE days_to_enrolment >= 0 AND days_to_enrolment <= 3 END
    notes: 'The spec rule is 0 <= days <= 3. Without the lower bound a case registered BEFORE its recorded discharge -- a data error, not early enrolment -- counted as on time.'

  - name: gestational_age_plausible
    label: 'Gestational age (weeks)'
    means: 'Gestational age at birth, when it is between 20 and 45 weeks; otherwise treated as missing.'
    sql: 'CASE WHEN gestational_age_wks BETWEEN :GA_MIN AND :GA_MAX THEN gestational_age_wks END'

  - name: birthweight_band
    label: 'Birthweight band'
    means: "The baby's birthweight group: under 1000 g, 1000-1499, 1500-1999, 2000-2499, or 2500 g and over. Missing when birthweight is missing or outside 250-8000 g."
    type: categorical
    sql: >-
      CASE WHEN birth_weight_g IS NULL THEN NULL
           WHEN birth_weight_g < :WMIN OR birth_weight_g > :WMAX THEN NULL
           WHEN birth_weight_g < 1000 THEN '<1000'
           WHEN birth_weight_g < 1500 THEN '1000-1499'
           WHEN birth_weight_g < 2000 THEN '1500-1999'
           WHEN birth_weight_g < 2500 THEN '2000-2499'
           ELSE '2500+' END
    notes: "A missing birthweight EXCLUDES a baby from the growth denominator; it does not make it 'incomplete'."

  # The plausible early-growth range is birthweight-band specific (spec section 3).
  # A flat 10-20 g/kg/day, which an earlier version carried as provisional, calls a
  # healthy 2,500 g baby fast (real ceiling 18) and a struggling sub-1,000 g baby
  # plausible (real floor 9).
  - name: growth_plausible_lo
    label: 'Lowest plausible gain for the band'
    means: "The slowest early weight gain (g/kg/day) expected for the baby's birthweight band."
    type: number
    sql: >-
      CASE birthweight_band
           WHEN '<1000' THEN 9 WHEN '1000-1499' THEN 6 WHEN '1500-1999' THEN 6
           WHEN '2000-2499' THEN 5 WHEN '2500+' THEN 0 ELSE NULL END

  - name: growth_plausible_hi
    label: 'Highest plausible gain for the band'
    means: "The fastest early weight gain (g/kg/day) expected for the baby's birthweight band."
    type: number
    sql: >-
      CASE birthweight_band
           WHEN '<1000' THEN 30 WHEN '1000-1499' THEN 28 WHEN '1500-1999' THEN 24
           WHEN '2000-2499' THEN 20 WHEN '2500+' THEN 18 ELSE NULL END

  - name: early_velocity
    label: 'Early weight gain (g/kg/day)'
    means: 'Weight gained per kilogram per day over the 21 days after the first weighing. Needs at least 2 weighings at least 5 days apart.'
    type: number
    sql: >-
      CASE WHEN COALESCE(win_n, 0) >= 2
                AND COALESCE(win_span_days, 0) >= :VELOCITY_MIN_SPAN
                AND win_mean_w > 0
           THEN (win_last_w - win_first_w) / win_span_days / (win_mean_w / 1000.0)
           ELSE NULL END
    notes: 'Spec 2b: (last_in_window - first) / days / (mean_in_window / 1000); null under 2 in-window points or a span under 5 days.'

  - name: velocity_computable
    label: 'Weight gain computable'
    means: 'Early weight gain could be calculated.'
    type: bool
    sql: 'early_velocity IS NOT NULL'

  - name: flag_thin
    label: 'Too few weighings'
    means: 'Fewer than 3 days with a weight reading.'
    type: bool
    sql: 'COALESCE(n_measured_days, 0) < :THIN_MIN_DAYS'

  - name: flag_inconsistent
    label: 'First weight far below birthweight'
    means: 'The first weighing is under 60 percent of the recorded birthweight.'
    type: bool
    sql: 'birth_weight_g IS NOT NULL AND first_weight_g IS NOT NULL AND first_weight_g < :INCONSISTENT_RATIO * birth_weight_g'

  - name: flag_impossible
    label: 'Impossible weight change'
    means: 'Within 21 days of the first weighing, two consecutive weighings imply a change below -20 or above 45 g/kg/day.'
    type: bool
    sql: 'COALESCE(any_impossible_step, FALSE)'

  - name: weight_gain_data_computable
    label: 'Growth computable'
    means: 'A growth number can be produced: birthweight band known, plus 2+ visit weighings spanning 5+ days in the first 21 days.'
    type: bool
    sql: 'birthweight_band IS NOT NULL AND velocity_computable'
    notes: "Workbook name (was 'classified')."

  - name: weight_gain_data_consistent
    label: 'Readings hold up'
    means: 'The weight readings are not thin (3+ weighing days), not inconsistent (first weight at least 60 percent of birthweight) and contain no impossible step.'
    type: bool
    sql: 'NOT flag_thin AND NOT flag_inconsistent AND NOT flag_impossible'
    notes: "Workbook name (was 'verifiable')."

  - name: weight_gain_data_sufficient
    label: 'Good weight data'
    means: 'Both computable and consistent: this baby counts toward the weight-gain trajectory.'
    type: bool
    sql: 'weight_gain_data_computable AND weight_gain_data_consistent'
    notes: 'THE one field every growth indicator filters on (workbook).'

  - name: growth_data_sufficient
    label: 'Good weight data (velocity)'
    means: 'Weight gain computable, with at least 3 weighing days and no inconsistent or impossible readings.'
    type: bool
    sql: 'velocity_computable AND NOT flag_thin AND NOT flag_inconsistent AND NOT flag_impossible'
    notes: 'The velocity-only half of weight_gain_data_sufficient, kept because growth_class reads it. Indicators filter on weight_gain_data_sufficient.'

  - name: growth_class
    label: 'Growth class'
    means: "Slow, plausible or fast early weight gain, judged against the range for the baby's birthweight band. Blank when the weight data is incomplete."
    type: categorical
    sql: >-
      CASE WHEN NOT growth_data_sufficient THEN NULL
           WHEN birthweight_band IS NULL THEN NULL
           WHEN early_velocity < growth_plausible_lo THEN 'slow'
           WHEN early_velocity > growth_plausible_hi THEN 'fast'
           ELSE 'plausible' END

  - name: growth_eligible
    label: 'In the growth funnel'
    means: 'Eligible (started, first visit 28+ days ago) and did not die before the eligibility date.'
    type: bool
    sql: 'eligible_28d AND NOT early_exit'
    notes: >-
      Workbook growth funnel: eligible AND NOT early_exit -> % computable ->
      % consistent -> % sufficient -> % plausible / slow / fast, each
      denominator the previous numerator, which separates a coverage failure
      from a quality failure. Lost to follow-up STAYS in -- only death (and,
      later, graduation) is a legitimate exit. Replaces growth_qualifying
      (42+ days, band known, computable), whose four shares summed to 100.

  - name: ever_danger_sign
    label: 'Danger sign recorded'
    means: 'At least one visit recorded a danger sign.'
    type: bool
    sql: 'danger_visits > 0'

  - name: referred
    label: 'Referred'
    means: 'At least one visit recorded a referral.'
    type: bool
    sql: 'referral_visits > 0'

  - name: referred_within_28d
    label: 'Referred within 28 days'
    means: 'The first referral was recorded within 28 days of registration.'
    type: bool
    sql: >-
      first_referral_date IS NOT NULL
      AND FLOOR(EXTRACT(EPOCH FROM (first_referral_date::timestamp - COALESCE(reg_date, first_visit)::timestamp)) / 86400) <= :REFERRAL_WINDOW_DAYS
    notes: 'Workbook C19. Registration falls back to the first visit where the app recorded no registration date.'

  - name: self_referral_count
    label: 'Self-referrals'
    means: 'Number of visits that recorded a self-referral.'
    type: int
    sql: 'COALESCE(self_referral_visits, 0)'

  - name: enrollment_is_birth_copy
    label: 'Enrolment weight copies birthweight'
    means: 'The weight recorded at enrolment is identical to the birthweight, which suggests it was copied rather than measured.'
    type: bool
    sql: >-
      CASE WHEN birth_weight_g IS NOT NULL AND enrollment_weight_g IS NOT NULL
           THEN ABS(birth_weight_g - enrollment_weight_g) < 1
           ELSE NULL END

  - name: enrollment_weight_credible
    label: 'Enrolment weight credible'
    means: 'Birthweight and enrolment weight are both plausible (250-8000 g) and the enrolment weight is not a copy of the birthweight.'
    type: bool
    sql: >-
      birth_weight_g BETWEEN :WMIN AND :WMAX
      AND enrollment_weight_g BETWEEN :WMIN AND :WMAX
      AND ABS(birth_weight_g - enrollment_weight_g) >= 1
    notes: "Workbook name (was 'assessable', which promised far more than it checked)."

  - name: expected_dip
    label: 'Expected dip'
    means: 'The enrolment weight sits 1 to 15 percent below the birthweight -- the normal early weight loss.'
    type: bool
    sql: >-
      enrollment_weight_credible
      AND enrollment_weight_g BETWEEN :DIP_MIN_RATIO * birth_weight_g AND :DIP_MAX_RATIO * birth_weight_g

  # ---------------------------------------------------------------------------
  # Case states (semantic/case_states.py): a baby's condition AS OF the report date, for
  # a coach to talk to its worker about. Each is a bool property with `case_state:` meta.
  # A series holding anything hard to believe is a weight check and nothing else --
  # every other state reads the weights, so on such a series the noise is the story.
  # The states are mutually exclusive, so the per-worker counts add up.
  # ---------------------------------------------------------------------------
  - name: weight_series_believable
    label: 'Weights hold up'
    means: 'No impossible step between weighings, no weight outside 800-5000 g, and no weight recorded identically three times running.'
    type: bool
    sql: 'NOT COALESCE(any_bad_step, FALSE) AND implausible_weight_date IS NULL AND same3_date IS NULL'

  - name: check_from_date
    label: 'Weighing to check: from'
    means: 'Where the weighing to check starts: the earlier reading of an impossible step, or the first of three identical readings.'
    sql: >-
      CASE WHEN COALESCE(any_bad_step, FALSE) THEN step_from_date
           WHEN implausible_weight_date IS NOT NULL THEN implausible_weight_date::date
           ELSE same3_from_date END

  - name: check_to_date
    label: 'Weighing to check'
    means: 'The date of the weighing to check.'
    sql: >-
      CASE WHEN COALESCE(any_bad_step, FALSE) THEN step_to_date
           WHEN implausible_weight_date IS NOT NULL THEN implausible_weight_date::date
           ELSE same3_date END

  - name: weight_gain_g
    label: 'Weight gained (g)'
    means: 'Latest weighing minus the first.'
    type: number
    sql: 'last_weight_g - first_weight_g'

  - name: faltering_rate
    label: 'Recent gain (g/kg/day)'
    means: 'Weight gained per kilogram per day over the last two intervals between weighings.'
    type: number
    sql: >-
      CASE WHEN third_last_w > 0 AND last_weigh_date > third_last_date
           THEN (last_weight_g - third_last_w) / (third_last_w / 1000.0) / (last_weigh_date - third_last_date)
           ELSE NULL END

  - name: case_state_weight_check
    label: 'A weighing that is hard to believe'
    means: 'One weight recorded for this baby is hard to believe next to the others: a very large jump or drop in a few days, a weight no baby in KMC has, or exactly the same weight three visits in a row.'
    type: bool
    sql: 'NOT weight_series_believable AND COALESCE(check_to_date >= (:as_of)::date - :STATE_RECENT_DAYS, FALSE)'
    case_state:
      tone: check
      priority: 20
      date: check_to_date
      evidence:
        [
          step_change_g,
          step_days,
          step_from_date,
          step_to_date,
          step_rate,
          implausible_weight_g,
          implausible_weight_date,
          same3_w,
          same3_date,
        ]
      facts:
        - when: any_bad_step
          text: 'Weight changed by {step_change_g|signed} g in {step_days|days} between {step_from_date|date} and {step_to_date|date}, about {step_rate|int} g/kg/day; the programme counts a change outside -20 to 45 g/kg/day as impossible.'
        - when: implausible_weight_date
          text: 'Weight was recorded as {implausible_weight_g|grams} g on {implausible_weight_date|day}; a baby in KMC weighs 800 to 5,000 g.'
        - text: 'Weight was recorded as exactly {same3_w|grams} g at three weighings in a row, the last on {same3_date|day}.'
      picture:
        type: series_highlight_step
        series: weight
        title: 'Check this weighing'
        highlight:
          from: check_from_date
          to: check_to_date
          label:
            - {
                when: any_bad_step,
                text: '{step_change_g|signed} g in {step_days|days}?',
              }
            - {
                when: implausible_weight_date,
                text: '{implausible_weight_g|grams} g?',
              }
            - { text: '{same3_w|grams} g three times?' }
        checklist_title: 'Weighing checklist'
        checklist:
          - 'Set the scale to zero'
          - 'Weigh baby without clothes'
          - 'Read the number when baby is still'
          - 'Write it down straight away'
      coach:
        approach: 'This is about how the weighing was done, never about honesty. Say the number looks unusual and ask, without judgement: "Can you walk me through how you weighed baby on this visit?" Listen for the scale not set to zero, clothes or a blanket left on, the baby moving, the number read too early, or the number written down later from memory.'
        next_steps: 'Agree to use the weighing checklist at the next visit: set the scale to zero, weigh baby without clothes, read the number when baby is still, and write it down straight away. If the worker thinks the number was right, agree to weigh carefully next visit to confirm.'
        limits: 'An unusual number is a reason to ask, not proof of a mistake. Babies do sometimes gain or lose quickly when unwell.'

  - name: case_state_danger_unreferred
    label: 'Danger sign recorded, no referral'
    means: 'At a recent visit the worker recorded a danger sign for this baby, and the visit shows the baby was not referred.'
    type: bool
    sql: 'weight_series_believable AND COALESCE(unreferred_danger_date::date >= (:as_of)::date - :STATE_RECENT_DAYS, FALSE)'
    case_state:
      tone: urgent
      priority: 10
      date: unreferred_danger_date
      evidence:
        [
          unreferred_danger_date,
          unreferred_danger_signs,
          unreferred_danger_visits,
        ]
      facts: 'On {unreferred_danger_date|day} the visit recorded {unreferred_danger_signs}, and the baby was not referred.'
      picture:
        type: sign_card
        title: 'Danger sign, not referred'
        badge: 'NOT REFERRED'
        date: unreferred_danger_date
        signs: unreferred_danger_signs
        sign_text:
          'convulsions (fits)':
            {
              title: 'Convulsions (fits)',
              why: 'A baby who has had a fit needs a health facility now.',
            }
          'severe chest indrawing':
            {
              title: 'Chest pulling in with each breath',
              why: 'A sign of possible serious illness, such as a chest infection.',
            }
          'floppy or unusually sleepy':
            {
              title: 'Floppy or hard to wake',
              why: 'A baby who moves only when touched, or not at all, may be seriously ill.',
            }
          'blue lips or face':
            {
              title: 'Blue lips or face',
              why: 'The baby may not be getting enough oxygen.',
            }
          'low oxygen':
            {
              title: 'Low oxygen',
              why: 'The baby may not be getting enough oxygen.',
            }
          'fever':
            {
              title: 'Fever',
              why: 'In a young baby, fever can be a sign of serious infection.',
            }
          'low body temperature':
            {
              title: 'Cold body',
              why: 'A small baby who is too cold can become seriously ill.',
            }
          'fast breathing':
            {
              title: 'Fast breathing',
              why: 'Breathing fast can be a sign of a chest infection.',
            }
          'slow breathing':
            {
              title: 'Slow breathing',
              why: 'Breathing too slowly is a sign of possible serious illness.',
            }
          'noisy breathing':
            {
              title: 'Noisy breathing',
              why: 'Grunting or noisy breathing can mean the baby is struggling.',
            }
          'slow heart rate':
            {
              title: 'Slow heart rate',
              why: 'A slow heartbeat in a young baby needs checking at a facility.',
            }
          'not feeding well':
            {
              title: 'Not feeding well',
              why: 'A baby who stops feeding well may be seriously ill.',
            }
          'pus in the eyes, skin or belly button':
            {
              title: 'Pus in eyes, skin or belly button',
              why: 'Pus is a sign of infection, which can spread quickly in a small baby.',
            }
          'yellow skin or eyes':
            {
              title: 'Yellow skin or eyes',
              why: 'Strong yellowing in a young baby needs checking at a facility.',
            }
        why: 'Danger signs in a young baby can mean serious illness. A health facility should see the baby.'
        actions_title: 'What to do'
        actions:
          - 'Visit the family as soon as you can'
          - 'Check the baby for the sign again'
          - 'If the sign is still there, refer the baby to a health facility'
      coach:
        approach: 'Explain in simple words that this sign can mean the baby is seriously ill and needs care at a health facility, more than a home visit can give. Then ask what happened at that visit and how the baby is now.'
        next_steps: 'Agree that the worker will check in with the family as soon as possible and, if the sign is still there or the baby seems unwell, refer the baby to the health facility the same day.'
        limits: 'You do not know how the baby is today, and the family may already have gone to a facility. Never diagnose and never give treatment advice. If the worker says the baby is very ill now, escalate (safety).'

  - name: case_state_faltering
    label: 'Weight has stalled and skin-to-skin time is falling'
    means: 'The baby has gained little or no weight over the last visits, and the hours of skin-to-skin care the family reports have gone down.'
    type: bool
    sql: >-
      weight_series_believable AND NOT case_state_danger_unreferred
      AND COALESCE(faltering_rate < :FALTERING_MAX_GAIN, FALSE)
      AND COALESCE(s2s_last_h < s2s_prev_h, FALSE)
      AND COALESCE(last_weigh_date >= (:as_of)::date - :STATE_RECENT_DAYS, FALSE)
    case_state:
      tone: concern
      priority: 30
      date: last_weigh_date
      evidence:
        [
          third_last_w,
          third_last_date,
          last_weight_g,
          last_weigh_date,
          faltering_rate,
          s2s_prev_h,
          s2s_prev_date,
          s2s_last_h,
          s2s_last_date,
        ]
      facts: 'Weight went from {third_last_w|grams} g on {third_last_date|date} to {last_weight_g|grams} g on {last_weigh_date|date}, about {faltering_rate|1dp} g/kg/day; healthy growth is 15-20 g/kg/day. Skin-to-skin fell from {s2s_prev_h} h on {s2s_prev_date|date} to {s2s_last_h} h on {s2s_last_date|date}.'
      picture:
        type: series_with_bars
        series: weight
        title: 'Weight has stalled'
        reference: { low: 15, high: 20, label: 'healthy growth' }
        bars: skin_to_skin
        bars_title: 'Skin-to-skin hours each visit'
      coach:
        approach: 'Ask how the family is managing with this baby and what has changed at home. Ask about feeding and about the skin-to-skin hours: what makes long hours hard for this family right now.'
        next_steps: 'Agree a sooner follow-up visit, and one thing the worker will reinforce with the family: more hours of skin-to-skin care (who else in the family can help hold the baby) and frequent breastfeeding. If the baby seems unwell, the family should go to a health facility.'
        limits: 'Slow gain has many causes. Never blame the mother or the worker, and never diagnose.'

  - name: case_state_thriving
    label: 'Baby is growing well'
    means: 'The baby has gained weight steadily at every weighing, at or above a healthy rate, and may have reached a milestone such as 2.5 kg.'
    type: bool
    sql: >-
      weight_series_believable AND NOT case_state_danger_unreferred
      AND COALESCE(n_gap3_steps, 0) >= 1
      AND COALESCE(min_rate_gap3 >= :THRIVING_MIN_GAIN, FALSE)
      AND COALESCE(last_weight_g >= first_weight_g * (1 + :THRIVING_MIN_RISE), FALSE)
      AND COALESCE(last_weigh_date >= (:as_of)::date - :STATE_RECENT_DAYS, FALSE)
    case_state:
      tone: celebrate
      priority: 40
      date: last_weigh_date
      evidence:
        [
          first_weight_g,
          first_weigh_date,
          last_weight_g,
          last_weigh_date,
          weight_gain_g,
          avg_rate_gap3,
        ]
      facts: 'Weight rose from {first_weight_g|grams} g on {first_weigh_date|date} to {last_weight_g|grams} g on {last_weigh_date|date}, about {avg_rate_gap3|int} g/kg/day on average; healthy growth is 15-20 g/kg/day.'
      picture:
        type: series_vs_reference
        series: weight
        title: 'Growing well'
        badge: 'Great work!'
        reference: { low: 15, high: 20, label: 'healthy growth' }
        gain_label: '{weight_gain_g|signed} g since {first_weigh_date|date}'
      coach:
        approach: "This is a celebration. Open by recognising the worker's effort with this family in specific words (name the gain). Then ask what they think worked with this family. Listen, and reflect it back. There is nothing to correct."
        next_steps: 'Agree how the worker will keep it going: keep up the follow-up visits, help the family get vaccines on time, and support exclusive breastfeeding until 6 months.'
        limits: 'Good growth so far does not mean visits can stop. Never call the baby "out of danger" or "healthy" in general.'

# One line about a case, as a coach is told it (semantic/case_states.py `about`).
case_about:
  - when: birth_weight_g
    text: 'Birth weight {birth_weight_g|grams} g; registered {reg_date|day}; {num_visits} visits, the last on {last_visit|day}.'
  - text: 'Birth weight not recorded; registered {reg_date|day}; {num_visits} visits, the last on {last_visit|day}.'

# ---------------------------------------------------------------------------
# A case's visits, as a coach is told them and a case picture draws them
# (semantic/case_states.py `case_visits`): one line per visit, oldest first.
# ---------------------------------------------------------------------------
case_series:
  - {
      name: weight,
      column: visit_weight_g,
      label: Weight,
      unit: g,
      format: grams,
      line: 'weight {value} g',
      missing: 'weight not recorded',
    }
  - {
      name: skin_to_skin,
      column: skin_to_skin_h,
      label: Skin-to-skin,
      unit: h,
      format: hours,
      line: 'skin-to-skin {value} h in the last 24 h',
      missing: 'skin-to-skin not recorded',
    }
  - {
      name: danger_signs,
      column: danger_signs,
      label: Danger signs,
      format: text,
      line: 'danger signs: {value}',
      missing: 'danger signs: none',
    }
  - {
      name: referred,
      column: referral_text,
      label: Referred,
      format: text,
      line: 'referred: {value}',
      missing: 'referred: not asked',
    }
