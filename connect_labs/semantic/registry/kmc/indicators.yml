# KMC Layer 3 — the indicator registry, in Cube measure syntax.
#
# ONE indicator set, following Neal Lesh's metrics framework workbook as revised
# 2026-10-03 (kmc_metrics_framework.xlsx, Case indicators C01-C33). It supersedes
# the v3 compute spec that #2004 adopted wherever the two differ:
#   started      1+ follow-up visit (v3 said 2+, which hid one-and-done cases)
#   maturity     ONE gate, eligible = started + 28 days since the first visit, for
#                outcomes, growth and visits (v3 waited 42 for growth and visits)
#   growth       a chained funnel: eligible AND NOT early_exit -> % computable
#                (C07) -> % consistent (C08) -> % sufficient (C09) -> % plausible
#                / slow / fast among the sufficient (C10-C12). v3 used one shared
#                base whose four shares summed to 100.
#   early_exit   death before the eligibility date leaves the growth funnel only
#   floor        a minimum denominator of 25 (v3 said 20); 100 for reading rates
#   bands        the workbook's; TBD rows are unbanded rather than guessed
#   FLW flags    flw_applicable marks the workbook's nine "FLW indicator: Yes"
#                rows that can turn a worker red
# Kept from v3: velocity and birthweight-band classes, true medians.
# NOT yet built (no data, or the workbook leaves the rule TBD): C18 completion and
# C22 EBF at completion (completion gate unsettled), C32 GPS mismatch (no GPS in
# the pipeline; threshold unset), C33 repeat vitals (vitals not enumerated), C04
# visits per month and C06 cases per FLW per month (activity views, not
# per-baby measures).
#
# THESE ARE WORKING DEFINITIONS. They will keep changing as the programme learns;
# each carries its own caveats. Ids are plain names and carry no provenance -- add
# an indicator by appending one, never by reusing a name.
#
# NOTATION: Cube (cube.dev) measure syntax, restricted to Cube's REAL measure types --
# count, count_distinct, count_distinct_approx, sum, avg, min, max, number. No
# extensions. Scout's semantic model stays inside the same vocabulary (its
# SemanticField.MeasureType, even after a migration named expand_measure_types, has no
# first/last), and anything we invented here no Cube tool would ever validate.
#
# Nothing runs Cube. This is a notation, not a runtime: connect-labs compiles these to
# SQL, and a second engine can read the same file.
#
# SHAPE: every indicator is three measures -- a numerator, a denominator, and a
# `type: number` value over the two. That is how Scout shapes its rate KPIs, and it
# enforces the workbook's "no bare numbers" rule structurally: a value cannot be
# rendered without the denominator that produced it.

version: 1
cube: kmc_case
description: >-
  One row per baby (see properties.yml). Measures are evaluated with GROUP BY over
  whatever scope the caller selects -- programme, LLO, opportunity, FLW or month.

# The floor a measure is graded against when it declares no min_denominator of its
# own: below it a cell reads "insufficient volume" rather than a number (spec 0).
defaults:
  min_denominator: 25 # workbook: 25 cases; reading-based rates set 100 on the measure

# One family. Declared, because ids are names rather than codes and a name's
# letters say nothing about which family it is in.
series: [KMC]

# How a GENERIC indicator report (indicator_programme_report and its cascade)
# reads this registry -- see semantic/display.py. The KMC templates keep their own
# page code and ignore it; the per-indicator `headline` / `target` / `label` /
# `credibility` keys above are the same five tiles the KMC report hand-codes.
display:
  title: Kangaroo Mother Care programme
  entity: { name: baby, plural: babies }
  organisation: { name: organisation, plural: organisations }
  categories:
    [Scale, Case mix, Follow-up, Growth quality, Outcome, Care, Data quality]
  case_fields:
    - { field: reg_date, label: Registered, format: date }
    - { field: first_visit_date, label: First visit, format: date }
    - { field: last_visit_date, label: Last visit, format: date }
    - { field: total_visits, label: Visits, format: count }
    - { field: birth_weight_g, label: Birth weight, format: count, unit: g }
    - { field: last_weight_g, label: Latest weight, format: count, unit: g }
    - { field: last_kmc_status, label: Status, format: text }
  reading: { column: weight_g, label: Weight, unit: g }

measures:
  # ── Scale ────────────────────────────────────────────────────────────────
  - name: total_cases
    title: Total cases
    type: number
    sql: '{total_cases_numerator}'
    meta:
      {
        indicator: total_cases,
        plain: 'Every baby with any registration or visit record.',
        category: Scale,
        prominence: Top,
        unit: n,
        direction: none,
      }
  - name: total_cases_numerator
    type: count
  - name: total_cases_denominator
    type: count

  - name: registered_cases
    title: Registered
    type: number
    sql: '{registered_cases_numerator}'
    meta:
      {
        indicator: registered_cases,
        plain: 'Babies with a registration form.',
        category: Scale,
        prominence: Top,
        unit: n,
        direction: none,
      }
  - name: registered_cases_numerator
    type: count
    filters: [{ sql: '{CUBE}.registered' }]
  - name: registered_cases_denominator
    type: count

  - name: started_cases
    title: Started
    type: number
    sql: '{started_cases_numerator}'
    meta:
      {
        indicator: started_cases,
        headline: 1,
        label: 'Started cases',
        plain: 'Babies with at least one follow-up visit (registration excluded): delivered cases.',
        category: Scale,
        prominence: Top,
        unit: n,
        direction: none,
      }
  - name: started_cases_numerator
    type: count
    filters: [{ sql: '{CUBE}.started' }]
  - name: started_cases_denominator
    type: count

  - name: cumulative_svns_reached
    title: Cumulative SVNs reached
    type: number
    sql: '{cumulative_svns_reached_numerator}'
    meta:
      {
        indicator: cumulative_svns_reached,
        plain: 'The running total of started babies by registration month; the snapshot value equals total started.',
        category: Scale,
        prominence: Top,
        unit: n,
        direction: none,
      }
  - name: cumulative_svns_reached_numerator
    type: count
    filters: [{ sql: '{CUBE}.started' }]
  - name: cumulative_svns_reached_denominator
    type: count

  # ── Case mix ─────────────────────────────────────────────────────────────
  - name: median_gestational_age
    title: Median gestational age (wks)
    type: number
    sql: '{median_gestational_age_numerator}'
    meta:
      {
        indicator: median_gestational_age,
        plain: 'Median gestational age at birth in weeks, over babies with a plausible value (20 to 45 weeks).',
        category: Case mix,
        prominence: Top,
        unit: wks,
        direction: none,
      }
  - name: median_gestational_age_numerator
    type: number
    sql: 'PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY {CUBE}.gestational_age_plausible)'
  - name: median_gestational_age_denominator
    type: count
    filters: [{ sql: '{CUBE}.gestational_age_plausible IS NOT NULL' }]

  - name: median_birthweight
    title: Median birthweight (g)
    type: number
    sql: '{median_birthweight_numerator}'
    meta:
      {
        indicator: median_birthweight,
        plain: 'Median birthweight in grams, over babies with a recorded birthweight.',
        category: Case mix,
        prominence: Top,
        unit: g,
        direction: none,
      }
  - name: median_birthweight_numerator
    type: number
    sql: 'PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY {CUBE}.birth_weight_g)'
  - name: median_birthweight_denominator
    type: count
    filters: [{ sql: '{CUBE}.birth_weight_g IS NOT NULL' }]

  # ── Follow-up ────────────────────────────────────────────────────────────
  - name: visits_per_case
    title: Mean visits per case
    type: number
    sql: '{visits_per_case_numerator} / NULLIF({visits_per_case_denominator}, 0)'
    meta:
      {
        indicator: visits_per_case,
        plain: 'Mean number of follow-up visits per eligible baby (started, first visit at least 28 days ago).',
        category: Follow-up,
        prominence: Top,
        unit: n,
        direction: higher,
        flw_applicable: true,
        note: 'Workbook C24: dosage per case, over eligible babies. Bands TBD in the workbook, so unbanded.',
      }
  - name: visits_per_case_numerator
    type: sum
    sql: 'CASE WHEN {CUBE}.eligible_28d THEN {CUBE}.followup_visits ELSE 0 END'
  - name: visits_per_case_denominator
    type: count
    filters: [{ sql: '{CUBE}.eligible_28d' }]

  - name: pct_enrolled_within_3d
    title: '% first visit within 3 days of discharge'
    type: number
    sql: '100.0 * {pct_enrolled_within_3d_numerator} / NULLIF({pct_enrolled_within_3d_denominator}, 0)'
    meta:
      {
        indicator: pct_enrolled_within_3d,
        plain: 'Share of started babies with a hospital discharge date whose registration fell 0 to 3 days after discharge. Footnoted where under 45 percent of started babies carry a discharge date.',
        inputs: [days_discharge_to_reg],
        min_input_coverage: 0.45,
        coverage_denominator: started_cases,
        category: Follow-up,
        prominence: Top,
        unit: '%',
        direction: higher,
        bands: [50, 30],
        bands_source: 'the workbook thresholds (0.5/0.3), rescaled fraction to percent',
        flw_applicable: false,
        note: 'Workbook C16. Not an FLW indicator: enrolment timing depends on other people. Gated on started, not eligible, so it reports a month earlier than the eligible rows.',
      }
  - name: pct_enrolled_within_3d_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.enrolled_within_3d' },
        { sql: '{CUBE}.started AND {CUBE}.has_discharge_date' },
      ]
  - name: pct_enrolled_within_3d_denominator
    type: count
    filters: [{ sql: '{CUBE}.started AND {CUBE}.has_discharge_date' }]

  - name: median_days_to_enrolment
    title: Median days to enrolment
    type: number
    sql: '{median_days_to_enrolment_numerator}'
    meta:
      {
        indicator: median_days_to_enrolment,
        plain: 'Median days from hospital discharge to registration, over started babies with a discharge date.',
        inputs: [days_discharge_to_reg],
        category: Follow-up,
        prominence: Lower,
        unit: d,
        direction: lower,
        bands: [3, 7],
        note: 'Workbook C17, as a true median (PERCENTILE_CONT).',
      }
  - name: median_days_to_enrolment_numerator
    type: number
    sql: >-
      PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY {CUBE}.days_to_enrolment)
        FILTER (WHERE {CUBE}.started AND {CUBE}.has_discharge_date)
  - name: median_days_to_enrolment_denominator
    type: count
    filters: [{ sql: '{CUBE}.started AND {CUBE}.has_discharge_date' }]

  - name: lost_by_day_28
    title: Loss to follow-up by day 28
    type: number
    sql: '100.0 * {lost_by_day_28_numerator} / NULLIF({lost_by_day_28_denominator}, 0)'
    meta:
      {
        indicator: lost_by_day_28,
        headline: 5,
        label: 'Lost by day 28',
        target: 10,
        plain: 'Started babies whose first visit was at least 28 days ago and whose outcome is unknown: neither died nor seen at least 28 days after the first visit.',
        category: Follow-up,
        prominence: Top,
        unit: '%',
        direction: lower,
        bands: [10, 25],
        flw_applicable: true,
        note: 'Workbook C15. Lost to follow-up STAYS in the growth funnel too: only death is a legitimate exit.',
      }
  - name: lost_by_day_28_numerator
    type: count
    filters:
      [{ sql: 'NOT {CUBE}.outcome_known' }, { sql: '{CUBE}.eligible_28d' }]
  - name: lost_by_day_28_denominator
    type: count
    filters: [{ sql: '{CUBE}.eligible_28d' }]

  # ── Growth quality ───────────────────────────────────────────────────────
  # The workbook's growth funnel. Each denominator is the previous numerator:
  #   growth_eligible (eligible AND NOT early_exit)
  #     -> computable (C07) -> consistent (C08, of computable) -> sufficient (C09)
  #     -> plausible / slow / fast (C10-C12, of sufficient)
  # so a coverage failure (C07) reads apart from a quality failure (C08).
  - name: pct_slow_growth
    title: '% slow growth'
    type: number
    sql: '100.0 * {pct_slow_growth_numerator} / NULLIF({pct_slow_growth_denominator}, 0)'
    meta:
      {
        indicator: pct_slow_growth,
        bands_source: 'workbook C11',
        plain: 'Share of babies with good weight data (eligible, not an early death, growth computable and consistent) whose early velocity is below the plausible range for their birthweight band.',
        inputs: [weights],
        category: Growth quality,
        prominence: Top,
        unit: '%',
        direction: lower,
        bands: [15, 30],
      }
  - name: pct_slow_growth_numerator
    type: count
    filters:
      [
        { sql: "{CUBE}.growth_class = 'slow'" },
        {
          sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_sufficient',
        },
      ]
  - name: pct_slow_growth_denominator
    type: count
    filters:
      [{ sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_sufficient' }]
  - name: pct_healthy_growth
    title: '% healthy growth'
    type: number
    sql: '100.0 * {pct_healthy_growth_numerator} / NULLIF({pct_healthy_growth_denominator}, 0)'
    meta:
      {
        indicator: pct_healthy_growth,
        headline: 2,
        label: 'Healthy growth',
        target: 70,
        bands_source: 'workbook C10, the central quality signal',
        plain: 'Share of babies with good weight data (eligible, not an early death, growth computable and consistent) whose early velocity is within the plausible range for their birthweight band.',
        inputs: [weights],
        category: Growth quality,
        prominence: Top,
        unit: '%',
        direction: higher,
        bands: [70, 50],
      }
  - name: pct_healthy_growth_numerator
    type: count
    filters:
      [
        { sql: "{CUBE}.growth_class = 'plausible'" },
        {
          sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_sufficient',
        },
      ]
  - name: pct_healthy_growth_denominator
    type: count
    filters:
      [{ sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_sufficient' }]
  - name: pct_fast_growth
    title: '% fast growth'
    type: number
    sql: '100.0 * {pct_fast_growth_numerator} / NULLIF({pct_fast_growth_denominator}, 0)'
    meta:
      {
        indicator: pct_fast_growth,
        bands_source: 'workbook C12 (mid-range best; high reads as measurement error)',
        plain: 'Share of babies with good weight data whose early velocity is above the plausible range for their birthweight band. High fast rates usually mean measurement error.',
        inputs: [weights],
        category: Growth quality,
        prominence: Lower,
        unit: '%',
        direction: lower,
        bands: [15, 30],
      }
  - name: pct_fast_growth_numerator
    type: count
    filters:
      [
        { sql: "{CUBE}.growth_class = 'fast'" },
        {
          sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_sufficient',
        },
      ]
  - name: pct_fast_growth_denominator
    type: count
    filters:
      [{ sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_sufficient' }]
  - name: pct_incomplete_growth_data
    title: '% readings that do not hold up'
    type: number
    sql: '100.0 * {pct_incomplete_growth_data_numerator} / NULLIF({pct_incomplete_growth_data_denominator}, 0)'
    meta:
      {
        indicator: pct_incomplete_growth_data,
        bands_source: 'the complement of workbook C08 (80/60)',
        note: 'Kept under its old id so reports that name it keep working; the workbook reads it as 100 minus C08.',
        plain: 'Share of babies with computable growth whose readings fail a check -- thin (under 3 weigh-days), inconsistent (first weight under 60 percent of birthweight) or an impossible step. The complement of % consistent (C08).',
        inputs: [weights],
        category: Growth quality,
        prominence: Lower,
        unit: '%',
        direction: lower,
        bands: [20, 40],
      }
  - name: pct_incomplete_growth_data_numerator
    type: count
    filters:
      [
        {
          sql: '{CUBE}.weight_gain_data_computable AND NOT {CUBE}.weight_gain_data_consistent',
        },
        {
          sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_computable',
        },
      ]
  - name: pct_incomplete_growth_data_denominator
    type: count
    filters:
      [{ sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_computable' }]
  - name: mean_early_growth_rate
    title: Mean early growth rate
    type: number
    sql: '{mean_early_growth_rate_numerator}'
    meta: {
        indicator: mean_early_growth_rate,
        headline: 3,
        label: 'Early growth rate',
        target: 15,
        # A mean growth rate says nothing about how big an opportunity is, so it
        # is publishable as an anonymised peer figure. Declared rather than
        # inferred from the unit, which cannot tell a mean from a count.
        benchmarkable: true,
        plain: 'Mean early growth velocity in g per kg per day over the babies with good weight data: the first 21 days of the weight series, per kg of the mean weight.',
        inputs: [weights],
        category: Growth quality,
        prominence: Top,
        unit: g/kg/d,
        direction: higher,
        bands: [15, 13],
        bands_source: 'workbook C13: WHO catch-up target 15 g/kg/day',
        note: 'Over the same babies the growth classes judge (C10-C12).',
      }
  - name: mean_early_growth_rate_numerator
    type: avg
    sql: '{CUBE}.early_velocity'
    filters:
      [{ sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_sufficient' }]
  - name: mean_early_growth_rate_denominator
    type: count
    filters:
      [{ sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_sufficient' }]

  - name: pct_growth_computable
    title: '% with computable growth'
    type: number
    sql: '100.0 * {pct_growth_computable_numerator} / NULLIF({pct_growth_computable_denominator}, 0)'
    meta:
      {
        indicator: pct_growth_computable,
        bands_source: 'workbook C07 (PROPOSED)',
        plain: 'Share of eligible babies who did not die before eligibility for whom a growth number can be produced: birthweight band known and 2+ visit weighings spanning 5+ days. Low means visits too few or too bunched.',
        inputs: [weights],
        category: Growth quality,
        prominence: Lower,
        unit: '%',
        direction: higher,
        bands: [75, 55],
      }
  - name: pct_growth_computable_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.weight_gain_data_computable' },
        { sql: '{CUBE}.growth_eligible' },
      ]
  - name: pct_growth_computable_denominator
    type: count
    filters: [{ sql: '{CUBE}.growth_eligible' }]

  - name: pct_growth_consistent
    title: '% with consistent readings'
    type: number
    sql: '100.0 * {pct_growth_consistent_numerator} / NULLIF({pct_growth_consistent_denominator}, 0)'
    meta:
      {
        indicator: pct_growth_consistent,
        bands_source: 'workbook C08 (PROPOSED)',
        plain: 'Share of babies with computable growth whose readings hold up: not thin, not inconsistent, no impossible step. Low means the readings themselves are bad.',
        inputs: [weights],
        category: Growth quality,
        prominence: Lower,
        unit: '%',
        direction: higher,
        bands: [80, 60],
      }
  - name: pct_growth_consistent_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.weight_gain_data_consistent' },
        {
          sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_computable',
        },
      ]
  - name: pct_growth_consistent_denominator
    type: count
    filters:
      [{ sql: '{CUBE}.growth_eligible AND {CUBE}.weight_gain_data_computable' }]

  - name: pct_growth_sufficient
    title: '% with good weight data'
    type: number
    sql: '100.0 * {pct_growth_sufficient_numerator} / NULLIF({pct_growth_sufficient_denominator}, 0)'
    meta:
      {
        indicator: pct_growth_sufficient,
        label: 'Good weight data',
        bands_source: 'workbook C09 (PROPOSED)',
        note: 'Excludes babies still inside their 28-day window and early deaths, so a recent scale-up does not read as a data collapse. Show n beside it.',
        plain: 'Share of eligible babies who did not die before eligibility whose weight data is sufficient to judge growth (computable and consistent). The top of the growth funnel: how much of the programme we can see.',
        inputs: [weights],
        category: Growth quality,
        prominence: Top,
        unit: '%',
        direction: higher,
        bands: [60, 40],
      }
  - name: pct_growth_sufficient_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.weight_gain_data_sufficient' },
        { sql: '{CUBE}.growth_eligible' },
      ]
  - name: pct_growth_sufficient_denominator
    type: count
    filters: [{ sql: '{CUBE}.growth_eligible' }]
  # ── Outcome ──────────────────────────────────────────────────────────────
  - name: mortality
    title: Mortality
    type: number
    sql: '100.0 * {mortality_numerator} / NULLIF({mortality_denominator}, 0)'
    meta:
      {
        indicator: mortality,
        headline: 4,
        target: 4,
        credibility: mortality_recording_credible,
        plain: 'Deaths as a share of started babies whose first visit was at least 28 days ago and whose outcome is known. Two-sided: under about 2 percent usually means deaths are not being recorded. Shown only where death recording is credible.',
        scope_note: 'All LLOs pooled, including those that do not record deaths credibly. A figure gated to the credible recorders reads higher, because non-recorders add denominator without deaths.',
        category: Outcome,
        prominence: Top,
        unit: '%',
        direction: mid2,
        bands: [[4, 12], [2, 16]],
        note: 'Workbook C14: died over eligible babies whose outcome is known. Since started became 1+ visit (2026-10-03), a baby who died after a single follow-up is back in the denominator. Not comparable across LLOs on current recording.',
      }
  - name: mortality_numerator
    type: count
    filters:
      [{ sql: '{CUBE}.died AND {CUBE}.eligible_28d AND {CUBE}.outcome_known' }]
  - name: mortality_denominator
    type: count
    filters: [{ sql: '{CUBE}.eligible_28d AND {CUBE}.outcome_known' }]

  # ── Care ─────────────────────────────────────────────────────────────────
  - name: danger_sign_incidence
    title: Danger-sign incidence
    type: number
    sql: '100.0 * {danger_sign_incidence_numerator} / NULLIF({danger_sign_incidence_denominator}, 0)'
    meta:
      {
        indicator: danger_sign_incidence,
        plain: 'Share of eligible babies (started, first visit 28+ days ago) with at least one visit recording a danger sign.',
        inputs: [ever_danger_sign],
        category: Care,
        prominence: Lower,
        unit: '%',
        direction: mid,
        bands: null,
        note: 'Workbook C20, over eligible babies. Read with the referral rate. Bands TBD.',
      }
  - name: danger_sign_incidence_numerator
    type: count
    filters:
      [{ sql: '{CUBE}.ever_danger_sign' }, { sql: '{CUBE}.eligible_28d' }]
  - name: danger_sign_incidence_denominator
    type: count
    filters: [{ sql: '{CUBE}.eligible_28d' }]

  - name: pct_danger_signs_referred
    title: '% referred for danger signs'
    type: number
    sql: '100.0 * {pct_danger_signs_referred_numerator} / NULLIF({pct_danger_signs_referred_denominator}, 0)'
    meta:
      {
        indicator: pct_danger_signs_referred,
        plain: 'Share of eligible babies (started, first visit 28+ days ago) whose first FLW-initiated referral came within 28 days of registration.',
        inputs: [referred],
        category: Care,
        prominence: Top,
        unit: '%',
        direction: mid,
        bands: null,
        note: 'Workbook C19: referred_within_28d over eligible babies (it was referrals among danger-sign babies). Both directions are ambiguous -- an investigation trigger, not a target. Bands TBD.',
      }
  - name: pct_danger_signs_referred_numerator
    type: count
    filters:
      [{ sql: '{CUBE}.referred_within_28d' }, { sql: '{CUBE}.eligible_28d' }]
  - name: pct_danger_signs_referred_denominator
    type: count
    filters: [{ sql: '{CUBE}.eligible_28d' }]
  - name: self_referrals_per_100
    title: Self-referrals per 100 cases
    type: number
    sql: '{self_referrals_per_100_numerator}'
    meta:
      {
        indicator: self_referrals_per_100,
        plain: 'Visits recording a self-referral per 100 eligible babies (started, first visit 28+ days ago).',
        inputs: [self_referral_count],
        category: Care,
        prominence: Lower,
        unit: '/100',
        direction: higher,
        bands: null,
        note: 'Workbook C21, over eligible babies. A proxy for caregiver empowerment. Bands TBD.',
      }
  - name: self_referrals_per_100_numerator
    type: avg
    sql: '{CUBE}.self_referral_count * 100'
    filters: [{ sql: '{CUBE}.eligible_28d' }]
  - name: self_referrals_per_100_denominator
    type: count
    filters: [{ sql: '{CUBE}.eligible_28d' }]

  - name: mean_kmc_hours
    title: Mean skin-to-skin hours
    type: number
    sql: '{mean_kmc_hours_numerator}'
    meta:
      {
        indicator: mean_kmc_hours,
        plain: 'Mean daily hours of skin-to-skin care reported, over eligible babies (started, first visit 28+ days ago).',
        inputs: [kmc_hours_mean],
        category: Care,
        prominence: Lower,
        unit: h,
        direction: higher,
        bands: null,
        note: 'Workbook C23, over eligible babies. Self-reported; both clients and FLWs tend to overstate. Bands TBD.',
      }
  - name: mean_kmc_hours_numerator
    type: avg
    sql: '{CUBE}.kmc_hours_mean'
    filters: [{ sql: '{CUBE}.eligible_28d' }]
  - name: mean_kmc_hours_denominator
    type: count
    filters:
      [{ sql: '{CUBE}.eligible_28d AND {CUBE}.kmc_hours_mean IS NOT NULL' }]

  # ── Data quality ─────────────────────────────────────────────────────────
  - name: weight_rounding_rate
    title: Weight rounding rate
    type: number
    sql: '100.0 * {weight_rounding_rate_numerator} / NULLIF({weight_rounding_rate_denominator}, 0)'
    meta:
      {
        indicator: weight_rounding_rate,
        plain: 'Weight readings that are exact multiples of 100 g, as a share of all visit weight readings. High values mean coarse or estimated readings rather than a scale read.',
        inputs: [weights],
        category: Data quality,
        prominence: Top,
        unit: '%',
        direction: lower,
        min_denominator: 100,
        flw_applicable: true,
        note: 'Workbook C31. Sum-over-sum over weight READINGS, not babies, so the floor is 100 readings. Unbanded: the workbook blocks the bands on the weight-precision setting (grams or 10 g steps).',
      }
  - name: weight_rounding_rate_numerator
    type: sum
    sql: '{CUBE}.n_weights_round_100_raw'
  - name: weight_rounding_rate_denominator
    type: sum
    sql: '{CUBE}.n_weight_readings'

  - name: pct_impossible_weight_changes
    title: '% impossible weight changes'
    type: number
    sql: '100.0 * {pct_impossible_weight_changes_numerator} / NULLIF({pct_impossible_weight_changes_denominator}, 0)'
    meta:
      {
        indicator: pct_impossible_weight_changes,
        plain: 'Babies with at least one impossible weight step (a visit-to-visit change outside minus 20 to plus 45 g per kg per day, between weighings 1 to 90 days apart, inside the first 21 days of the series), as a share of babies with computable growth.',
        inputs: [weights],
        category: Data quality,
        prominence: Top,
        unit: '%',
        direction: lower,
        bands: [5, 15],
        bands_source: 'workbook C27 (PROPOSED)',
        flw_applicable: true,
      }
  - name: pct_impossible_weight_changes_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.flag_impossible' },
        { sql: '{CUBE}.weight_gain_data_computable' },
      ]
  - name: pct_impossible_weight_changes_denominator
    type: count
    filters: [{ sql: '{CUBE}.weight_gain_data_computable' }]
  - name: birth_copy_rate
    title: Birth-copy rate
    type: number
    sql: '100.0 * {birth_copy_rate_numerator} / NULLIF({birth_copy_rate_denominator}, 0)'
    meta:
      {
        indicator: birth_copy_rate,
        plain: 'Babies whose enrolment weight is identical to their birthweight, suggesting it was copied rather than measured.',
        inputs: [birth_weight_g, enrollment_weight_g],
        category: Data quality,
        prominence: Top,
        unit: '%',
        direction: lower,
        bands: [10, 20],
        bands_source: 'workbook C28: the existing 20% marker',
        flw_applicable: true,
      }
  - name: birth_copy_rate_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.enrollment_is_birth_copy' },
        { sql: '{CUBE}.enrollment_is_birth_copy IS NOT NULL' },
      ]
  - name: birth_copy_rate_denominator
    type: count
    filters: [{ sql: '{CUBE}.enrollment_is_birth_copy IS NOT NULL' }]

  - name: pct_thin
    title: '% thin weight series'
    type: number
    sql: '100.0 * {pct_thin_numerator} / NULLIF({pct_thin_denominator}, 0)'
    meta:
      {
        indicator: pct_thin,
        plain: 'Share of babies with computable growth whose weight series has fewer than 3 weighing days (enrolment included).',
        inputs: [weights],
        category: Data quality,
        prominence: Lower,
        unit: '%',
        direction: lower,
        bands: [10, 25],
        bands_source: 'workbook C25 (PROPOSED)',
        flw_applicable: true,
      }
  - name: pct_thin_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.flag_thin' },
        { sql: '{CUBE}.weight_gain_data_computable' },
      ]
  - name: pct_thin_denominator
    type: count
    filters: [{ sql: '{CUBE}.weight_gain_data_computable' }]

  - name: pct_inconsistent
    title: '% inconsistent first weight'
    type: number
    sql: '100.0 * {pct_inconsistent_numerator} / NULLIF({pct_inconsistent_denominator}, 0)'
    meta:
      {
        indicator: pct_inconsistent,
        plain: 'Share of babies with computable growth whose first visit weight is under 60 percent of their birthweight.',
        inputs: [weights],
        category: Data quality,
        prominence: Lower,
        unit: '%',
        direction: lower,
        bands: [5, 15],
        bands_source: 'workbook C26 (PROPOSED)',
        flw_applicable: true,
      }
  - name: pct_inconsistent_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.flag_inconsistent' },
        { sql: '{CUBE}.weight_gain_data_computable' },
      ]
  - name: pct_inconsistent_denominator
    type: count
    filters: [{ sql: '{CUBE}.weight_gain_data_computable' }]

  - name: pct_enrollment_weight_credible
    title: '% credible enrolment weight'
    type: number
    sql: '100.0 * {pct_enrollment_weight_credible_numerator} / NULLIF({pct_enrollment_weight_credible_denominator}, 0)'
    meta:
      {
        indicator: pct_enrollment_weight_credible,
        plain: 'Share of babies with computable growth whose birthweight and enrolment weight are both plausible and the enrolment weight is not a copy of the birthweight.',
        inputs: [birth_weight_g, enrollment_weight_g],
        category: Data quality,
        prominence: Lower,
        unit: '%',
        direction: higher,
        bands: null,
        bands_source: 'workbook C29: TBD',
        flw_applicable: false,
      }
  - name: pct_enrollment_weight_credible_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.enrollment_weight_credible' },
        { sql: '{CUBE}.weight_gain_data_computable' },
      ]
  - name: pct_enrollment_weight_credible_denominator
    type: count
    filters: [{ sql: '{CUBE}.weight_gain_data_computable' }]

  - name: pct_expected_dip
    title: '% expected dip'
    type: number
    sql: '100.0 * {pct_expected_dip_numerator} / NULLIF({pct_expected_dip_denominator}, 0)'
    meta:
      {
        indicator: pct_expected_dip,
        plain: 'Share of babies with a credible enrolment weight whose enrolment weight sits 1 to 15 percent below birthweight -- the normal early loss.',
        inputs: [birth_weight_g, enrollment_weight_g],
        category: Data quality,
        prominence: Lower,
        unit: '%',
        direction: higher,
        bands: null,
        bands_source: 'workbook C30: TBD',
        flw_applicable: false,
      }
  - name: pct_expected_dip_numerator
    type: count
    filters:
      [
        { sql: '{CUBE}.expected_dip' },
        { sql: '{CUBE}.enrollment_weight_credible' },
      ]
  - name: pct_expected_dip_denominator
    type: count
    filters: [{ sql: '{CUBE}.enrollment_weight_credible' }]

  # ── Input-availability gates ─────────────────────────────────────────────
  # Not indicators (no `meta`), so they are emitted as columns but never treated
  # as one. They reproduce the render's inputState(): an indicator whose input the
  # scope never records must read n/a, not 0. At programme level every input
  # exists somewhere, so this only bites on a drill -- 268 of 5,302 per-FLW checks
  # disagreed until these were added, all on the danger-sign and self-referral
  # indicators.
  #
  # `max` over a 0/1 expression, staying inside Cube's measure vocabulary.
  # ZERO_IS_ABSENT fields (referred, ever_danger_sign, self_referral_count) test
  # for a TRUTHY value: a recorded zero means "nothing was recorded", not a real 0.
  - name: anyrec_weights
    gate: true
    type: max
    sql: 'CASE WHEN COALESCE({CUBE}.n_weights, 0) > 0 THEN 1 ELSE 0 END'
  - name: anyrec_days_discharge_to_reg
    gate: true
    type: max
    sql: 'CASE WHEN {CUBE}.has_discharge_date THEN 1 ELSE 0 END'
  - name: anyrec_referred
    gate: true
    type: max
    sql: 'CASE WHEN {CUBE}.referred THEN 1 ELSE 0 END'
  - name: anyrec_ever_danger_sign
    gate: true
    type: max
    sql: 'CASE WHEN {CUBE}.ever_danger_sign THEN 1 ELSE 0 END'
  - name: anyrec_self_referral_count
    gate: true
    type: max
    sql: 'CASE WHEN COALESCE({CUBE}.self_referral_count, 0) > 0 THEN 1 ELSE 0 END'
  - name: anyrec_kmc_hours_mean
    gate: true
    type: max
    sql: 'CASE WHEN {CUBE}.kmc_hours_mean IS NOT NULL THEN 1 ELSE 0 END'
  - name: anyrec_birth_weight_g
    gate: true
    type: max
    sql: 'CASE WHEN {CUBE}.birth_weight_g IS NOT NULL THEN 1 ELSE 0 END'
  - name: anyrec_enrollment_weight_g
    gate: true
    type: max
    sql: 'CASE WHEN {CUBE}.enrollment_weight_g IS NOT NULL THEN 1 ELSE 0 END'

# ---------------------------------------------------------------------------
# Suppression: whether a computed number may be shown at all. NOT bands.
# Source: kmc_metrics_framework.xlsx, "Targets & settings".
# ---------------------------------------------------------------------------
suppression:
  - indicator: mortality
    setting: mortality_recording_credible
    scope: llo
    when_false: not_credible
    note: >-
      Pooling every LLO reads LOWER than the credible recorders alone, because
      non-recorders add denominator without deaths. Render greyed with the caveat
      rather than blank: a blank cell reads as "no data", which is wrong.
