{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>OES Supply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'supply/supply.css' %}" />
  </head>
  <body>
    <div id="supply-root"></div>

    {{ bootstrap|json_script:"supply-bootstrap" }}

    <script>
      window.SUPPLY_MAPBOX_TOKEN = "{{ mapbox_token|escapejs }}";
    </script>

    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
    <script src="https://unpkg.com/deck.gl@9.3.7/dist.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="{% static 'bundles/js/supply-bundle.js' %}"></script>
  </body>
</html>
