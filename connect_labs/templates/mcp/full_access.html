{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <div class="bg-white rounded-xl shadow-sm p-8 space-y-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center flex-shrink-0">
        <i class="fa-solid fa-fingerprint text-indigo-600 text-lg"></i>
      </div>
      <h1 class="text-2xl font-semibold text-brand-deep-purple">Full-access approval</h1>
    </div>

    {% if refused %}
      <p class="text-sm text-gray-700" data-testid="full-access-refused">{{ refused }}</p>
    {% else %}
      {% include "mcp/_full_access_notice.html" with notice=notice %}
    {% endif %}

    <p class="text-sm text-gray-500">
      <a href="{% url 'labs:mcp_tokens_index' %}" class="text-indigo-600 hover:text-indigo-800 underline">Back to your MCP tokens</a>
    </p>
  </div>
</div>
{% endblock %}
