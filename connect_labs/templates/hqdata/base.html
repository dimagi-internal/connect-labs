{% extends "base.html" %}
{% block title %}CommCare data · Connect Labs{% endblock %}
{% block content %}
  <div class="mx-auto max-w-5xl py-6">
    <header class="mb-6 flex items-center justify-between">
      <a href="{% url 'hq:home' %}" class="text-xl font-semibold text-brand-indigo">CommCare data</a>
      {% if request.user.is_authenticated %}
        <div class="text-sm text-gray-600">
          {{ request.user.name|default:request.user.username }}
          <a class="ml-3 underline" href="{% url 'hq:tokens' %}">Access tokens</a>
          <a class="ml-3 underline" href="{% url 'hq:logout' %}">Sign out</a>
        </div>
      {% endif %}
    </header>
    {% block hq_content %}{% endblock %}
  </div>
{% endblock %}
