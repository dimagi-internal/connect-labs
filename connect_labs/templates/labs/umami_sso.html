{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-16 max-w-lg text-center">
  {% if sso_error %}
    <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-4">
      <i class="fa-solid fa-triangle-exclamation mr-2"></i>{{ sso_error }}
    </div>
    <a href="/umami" class="inline-block mt-4 text-blue-600 hover:underline text-sm">Open the Umami login instead</a>
  {% else %}
    <p class="text-gray-500"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Signing you into Umami…</p>
    {{ umami_token|json_script:"umami-sso-token" }}
    <script>
      (function () {
        var token = JSON.parse(document.getElementById('umami-sso-token').textContent);
        // Umami reads its JWT from same-origin localStorage as a JSON-encoded string.
        localStorage.setItem('umami.auth', JSON.stringify(token));
        window.location.replace('{{ umami_target|escapejs }}');
      })();
    </script>
  {% endif %}
</div>
{% endblock %}
