{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-7xl">
  <!-- Header -->
  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">
      <i class="fa-solid fa-book text-teal-600 mr-3"></i>
      Documentations
    </h1>
    <p class="text-xl text-gray-600 max-w-3xl mx-auto">
      Project-wise technical documentation, available to everyone regardless of program or opportunity context
    </p>
  </div>

  <div class="bg-white rounded-xl shadow-sm p-8 mb-8">
    <div class="flex items-center justify-between mb-6 pb-4 border-b-2 border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 flex items-center">
        <i class="fa-solid fa-folder-open text-teal-600 mr-3"></i>
        Projects
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      {% for doc in doc_projects %}
      <a href="{{ doc.url }}" class="group h-full">
        <div class="border-2 border-gray-200 hover:border-{{ doc.color }}-500 rounded-lg p-5 transition-all hover:shadow-md bg-gray-50 hover:bg-white h-full flex flex-col">
          <div class="flex items-center mb-3">
            <div class="w-10 h-10 bg-{{ doc.color }}-100 rounded-lg flex items-center justify-center mr-3 flex-shrink-0">
              <i class="fa-solid {{ doc.icon }} text-lg text-{{ doc.color }}-600"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 group-hover:text-{{ doc.color }}-600">
              {{ doc.name }}
            </h3>
          </div>
          <p class="text-sm text-gray-600 leading-snug mb-3 flex-grow">{{ doc.description }}</p>
          <div class="flex items-center text-{{ doc.color }}-600 text-sm font-semibold mt-auto">
            <span>Open</span>
            <i class="fa-solid fa-chevron-right ml-1 text-xs group-hover:translate-x-1 transition-transform"></i>
          </div>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
