{% extends "base.html" %}

{% block content %}
<style>
  /* Fit the standalone doc inside the labs chrome (fixed header + sidenav).
     The doc's own body rules lose to Tailwind's classes on <body>, so restore
     its colors scoped to the embed — but keep the labs font (Work Sans)
     throughout so the page matches the rest of labs. */
  .docs-embed{
    background:var(--bg); color:var(--ink);
    font-size:16px; line-height:1.65;
    border-radius:0.75rem; overflow:clip; box-shadow:var(--shadow);
  }
  .docs-embed h1,.docs-embed h2,.docs-embed h3,.docs-embed h4,
  .docs-embed .brand .word,.docs-embed .topbar .word{font-family:inherit}
  .docs-embed .shell{min-height:calc(100vh - 6rem)}
  /* The doc assumes a 1rem offset; clear the labs fixed header instead. */
  .docs-embed section,.docs-embed .sub,.docs-embed .steps>li[id]{scroll-margin-top:5rem}
  .docs-embed .sidebar{top:4rem; height:calc(100vh - 4rem)}
  .docs-embed .topbar{top:4rem}
  /* The doc styles bare elements globally (a, h1-h4); undo that for the labs
     chrome outside the embed. */
  a:not(.docs-embed a){color:inherit;text-decoration:inherit}
  h1:not(.docs-embed h1),h2:not(.docs-embed h2),
  h3:not(.docs-embed h3),h4:not(.docs-embed h4){font-family:inherit;margin:0}

  /* ── Click-to-copy values in the doc ─────────────────────────────────── */
  .docs-embed code.copyable{cursor:pointer; border-style:dashed; position:relative}
  .docs-embed code.copyable:hover{background:var(--accent-soft); border-color:var(--accent)}
  .docs-embed code.copyable.copied{background:var(--ok-soft); border-color:var(--ok)}
  /* Copy blocked by the browser — the text is selected instead. */
  .docs-embed code.copyable.copy-failed{background:var(--amber-soft); border-color:var(--amber)}

  /* ── Comments: Google-Docs-style right rail ──────────────────────────── */
  :root{--docs-rail-w:340px}

  /* Anchor affordance next to each commentable heading. */
  .docs-embed .dc-anchor{
    margin-left:.5rem; background:none; border:0; padding:.1rem .3rem; cursor:pointer;
    color:var(--muted); font:inherit; font-size:.8rem; opacity:0; transition:opacity .12s;
    border-radius:5px; vertical-align:middle;
  }
  .docs-embed .dc-anchor:hover{background:var(--chip); color:var(--accent-ink)}
  .docs-embed h2:hover .dc-anchor,.docs-embed h3:hover .dc-anchor,
  .docs-embed .dc-anchor:focus-visible{opacity:1}
  .docs-embed .dc-anchor.has-comments{opacity:1; color:var(--accent-ink); font-weight:600}
  .dc-flash{animation:dc-flash 1.6s ease-out}
  @keyframes dc-flash{0%,35%{background:var(--accent-soft)}100%{background:transparent}}

  .dc-rail{
    position:fixed; top:4rem; right:0; bottom:0; width:var(--docs-rail-w); z-index:25;
    background:var(--raise); border-left:1px solid var(--line);
    display:flex; flex-direction:column; transform:translateX(100%);
    transition:transform .18s ease-out; box-shadow:-2px 0 12px rgba(28,40,35,.08);
  }
  .dc-rail.open{transform:none}
  /* Narrow the document rather than letting the rail sit on top of it. */
  #docs-body{transition:margin-right .18s ease-out}
  body.dc-rail-open #docs-body{margin-right:var(--docs-rail-w)}
  @media (prefers-reduced-motion: reduce){ .dc-rail{transition:none} }
  .dc-rail-head{
    display:flex; align-items:center; gap:.5rem;
    padding:.85rem 1rem; border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .dc-rail-head strong{font-size:1rem}
  .dc-rail-head .n{color:var(--muted); font-size:.82rem}
  .dc-rail-head button.close{
    margin-left:auto; background:none; border:0; cursor:pointer;
    color:var(--muted); font-size:1.1rem; line-height:1; padding:.2rem .35rem; border-radius:5px;
  }
  .dc-rail-head button.close:hover{background:var(--chip); color:var(--ink)}
  .dc-scroll{flex:1 1 auto; overflow-y:auto; padding:.9rem 1rem 2rem}

  .dc-compose{border-bottom:1px solid var(--line); padding:.9rem 1rem; flex:0 0 auto}
  .dc-compose .target{
    display:flex; align-items:baseline; gap:.4rem; margin-bottom:.45rem;
    font-size:.78rem; color:var(--muted);
  }
  .dc-compose .target b{color:var(--accent-ink); font-weight:600}
  .dc-compose textarea{
    width:100%; min-height:4.5rem; resize:vertical; padding:.55rem .7rem;
    font:inherit; font-size:.9rem; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:8px;
  }
  .dc-compose textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
  .dc-compose .row{display:flex; align-items:center; gap:.6rem; margin-top:.5rem}
  .dc-compose button.post{
    background:var(--accent); color:#fff; border:0; border-radius:7px;
    padding:.4rem .9rem; font:inherit; font-size:.86rem; font-weight:600; cursor:pointer;
  }
  .dc-compose button.post:disabled{opacity:.55; cursor:default}
  .dc-compose button.clear{
    background:none; border:0; color:var(--muted); font:inherit; font-size:.8rem;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .dc-msg{font-size:.8rem; color:var(--muted)}
  .dc-msg.error{color:var(--red)}

  .dc-group{margin-bottom:1.3rem}
  .dc-group > button.jump{
    display:block; width:100%; text-align:left; background:none; border:0; cursor:pointer;
    padding:0 0 .4rem; font:inherit; font-size:.76rem; font-weight:700;
    letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink);
  }
  .dc-group > button.jump:hover{text-decoration:underline}
  .dc-card{
    background:var(--bg); border:1px solid var(--line); border-radius:9px;
    padding:.6rem .75rem; margin-bottom:.5rem;
  }
  .dc-card .meta{display:flex; align-items:baseline; gap:.45rem; margin-bottom:.25rem}
  .dc-card .who{font-weight:600; font-size:.85rem}
  .dc-card .when{color:var(--muted); font-size:.72rem}
  .dc-card .body{white-space:pre-wrap; margin:0; font-size:.88rem}
  .dc-card button.del{
    margin-left:auto; background:none; border:0; padding:0; cursor:pointer;
    color:var(--muted); font:inherit; font-size:.74rem; text-decoration:underline;
  }
  .dc-card button.del:hover{color:var(--red)}
  .dc-empty{color:var(--muted); font-size:.88rem}

  /* Toggle pill, bottom-right. */
  .dc-toggle{
    position:fixed; right:1.25rem; bottom:1.25rem; z-index:26;
    display:inline-flex; align-items:center; gap:.45rem;
    background:var(--accent); color:#fff; border:0; border-radius:999px;
    padding:.6rem 1.1rem; font:inherit; font-size:.88rem; font-weight:600;
    cursor:pointer; box-shadow:0 2px 10px rgba(28,40,35,.25);
  }
  .dc-toggle:hover{filter:brightness(1.07)}
  .dc-toggle.rail-open{right:calc(var(--docs-rail-w) + 1.25rem)}
  @media print{ .dc-toggle,.dc-rail,.docs-embed .dc-anchor{display:none} }
  @media (max-width:880px){
    :root{--docs-rail-w:100vw}
    /* Full-width rail on small screens — overlay instead of squeezing. */
    body.dc-rail-open #docs-body{margin-right:0}
    .dc-toggle.rail-open{right:1.25rem; bottom:auto; top:4.5rem}
  }
</style>

<div class="docs-embed mb-8" id="docs-body">
  {% include "labs/docs/chc_content.html" %}
</div>

<aside class="dc-rail" id="dc-rail" aria-label="Comments" data-list-url="{% url 'labs:docs_comments' doc_key %}" data-csrf="{{ csrf_token }}">
  <div class="dc-rail-head">
    <strong>Comments</strong><span class="n" id="dc-count"></span>
    <button type="button" class="close" id="dc-close" aria-label="Close comments">&times;</button>
  </div>

  <div class="dc-compose">
    <div class="target">Commenting on <b id="dc-target-label">the whole page</b>
      <button type="button" class="clear" id="dc-target-clear" hidden>whole page instead</button>
    </div>
    <label for="dc-body" class="dc-msg">Your comment is visible to everyone on Labs.</label>
    <textarea id="dc-body" maxlength="5000" placeholder="Add a comment…"></textarea>
    <div class="row">
      <button type="button" class="post" id="dc-post">Comment</button>
      <span class="dc-msg" id="dc-msg"></span>
    </div>
  </div>

  <div class="dc-scroll" id="dc-list"></div>
</aside>

<button type="button" class="dc-toggle" id="dc-toggle" aria-expanded="false" aria-controls="dc-rail">
  <i class="fa-regular fa-comments"></i><span id="dc-toggle-label">Comments</span>
</button>

<script>
(function () {
  var rail = document.getElementById("dc-rail");
  if (!rail) return;

  var listUrl = rail.dataset.listUrl;
  var csrf = rail.dataset.csrf;
  var listEl = document.getElementById("dc-list");
  var input = document.getElementById("dc-body");
  var postBtn = document.getElementById("dc-post");
  var msg = document.getElementById("dc-msg");
  var countEl = document.getElementById("dc-count");
  var toggle = document.getElementById("dc-toggle");
  var toggleLabel = document.getElementById("dc-toggle-label");
  var targetLabel = document.getElementById("dc-target-label");
  var targetClear = document.getElementById("dc-target-clear");

  var currentUser = "";
  var comments = [];
  var target = { id: "", label: "" };   // "" == the page as a whole

  function say(text, isError) {
    msg.textContent = text || "";
    msg.classList.toggle("error", !!isError);
  }

  function when(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleString(undefined, {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
    });
  }

  function openRail(open) {
    rail.classList.toggle("open", open);
    toggle.classList.toggle("rail-open", open);
    document.body.classList.toggle("dc-rail-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  }

  /* ---- anchoring -------------------------------------------------------- */

  // Commentable blocks are the doc's own sections and sub-sections; both carry
  // an id already because the doc's nav links to them.
  function anchors() {
    return Array.prototype.slice.call(
      document.querySelectorAll("#docs-body section[id], #docs-body .sub[id], #docs-body .steps>li[id]")
    );
  }

  function headingOf(block) {
    return block.querySelector("h2, h3, h4");
  }

  function labelOf(block) {
    var h = headingOf(block);
    if (!h) return block.id;
    // Strip the injected button and any badge text from the visible label.
    var clone = h.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll("button, .badge, .tag"), function (n) {
      n.remove();
    });
    return clone.textContent.trim().replace(/\s+/g, " ");
  }

  function setTarget(id, label) {
    target = { id: id || "", label: label || "" };
    targetLabel.textContent = target.id ? target.label : "the whole page";
    targetClear.hidden = !target.id;
  }

  function injectAnchorButtons() {
    anchors().forEach(function (block) {
      var h = headingOf(block);
      if (!h || h.querySelector(".dc-anchor")) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dc-anchor";
      btn.dataset.sectionId = block.id;
      btn.title = "Comment on this section";
      btn.textContent = "💬";
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        setTarget(block.id, labelOf(block));
        openRail(true);
        input.focus();
      });
      h.appendChild(btn);
    });
  }

  function markAnchorsWithComments() {
    var counts = {};
    comments.forEach(function (c) {
      if (c.section_id) counts[c.section_id] = (counts[c.section_id] || 0) + 1;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".dc-anchor"), function (btn) {
      var n = counts[btn.dataset.sectionId] || 0;
      btn.classList.toggle("has-comments", n > 0);
      btn.textContent = n > 0 ? "💬 " + n : "💬";
      btn.title = n > 0 ? n + " comment(s) on this section" : "Comment on this section";
    });
  }

  function scrollToSection(id) {
    var el = id && document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("dc-flash");
    void el.offsetWidth;            // restart the animation
    el.classList.add("dc-flash");
  }

  /* ---- rendering ------------------------------------------------------- */

  // textContent throughout — comment bodies are user input and must never be
  // parsed as HTML.
  function card(c) {
    var wrap = document.createElement("div");
    wrap.className = "dc-card";

    var meta = document.createElement("div");
    meta.className = "meta";
    var who = document.createElement("span");
    who.className = "who";
    who.textContent = c.author_name;
    var ts = document.createElement("span");
    ts.className = "when";
    ts.textContent = when(c.created_at);
    meta.appendChild(who);
    meta.appendChild(ts);

    if (c.author_username && c.author_username === currentUser) {
      var del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "Delete";
      del.addEventListener("click", function () { remove(c.id, del); });
      meta.appendChild(del);
    }

    var body = document.createElement("p");
    body.className = "body";
    body.textContent = c.body;

    wrap.appendChild(meta);
    wrap.appendChild(body);
    return wrap;
  }

  function render() {
    countEl.textContent = comments.length ? "(" + comments.length + ")" : "";
    toggleLabel.textContent = comments.length ? "Comments (" + comments.length + ")" : "Comments";
    listEl.textContent = "";

    if (!comments.length) {
      var empty = document.createElement("p");
      empty.className = "dc-empty";
      empty.textContent = "No comments yet. Hover any section heading and click 💬 to comment on it.";
      listEl.appendChild(empty);
      markAnchorsWithComments();
      return;
    }

    // Group by section, in document order, with page-wide comments last.
    var order = anchors().map(function (b) { return b.id; });
    var groups = {};
    comments.forEach(function (c) {
      var key = c.section_id || "";
      (groups[key] = groups[key] || []).push(c);
    });

    var keys = Object.keys(groups).sort(function (a, b) {
      if (a === "") return 1;
      if (b === "") return -1;
      var ia = order.indexOf(a), ib = order.indexOf(b);
      // Sections no longer in the document sort after the ones that are.
      if (ia === -1) ia = order.length;
      if (ib === -1) ib = order.length;
      return ia - ib;
    });

    keys.forEach(function (key) {
      var group = document.createElement("div");
      group.className = "dc-group";

      var head = document.createElement("button");
      head.type = "button";
      head.className = "jump";
      var block = key && document.getElementById(key);
      var label = key
        ? (block ? labelOf(block) : (groups[key][0].section_label || key) + " (section not found)")
        : "Whole page";
      head.textContent = label;
      head.title = key ? "Jump to this section" : "Comments on the page as a whole";
      head.addEventListener("click", function () {
        if (key) scrollToSection(key);
      });
      group.appendChild(head);

      groups[key].forEach(function (c) { group.appendChild(card(c)); });
      listEl.appendChild(group);
    });

    markAnchorsWithComments();
  }

  /* ---- network --------------------------------------------------------- */

  function errorFrom(response, payload) {
    return (payload && payload.error) || ("Request failed (" + response.status + ")");
  }

  function asJson(r) {
    return r.json().then(function (j) { return { r: r, j: j }; });
  }

  function load() {
    fetch(listUrl, { headers: { "Accept": "application/json" } })
      .then(asJson)
      .then(function (res) {
        if (!res.r.ok) throw new Error(errorFrom(res.r, res.j));
        currentUser = res.j.current_username || "";
        comments = res.j.comments || [];
        render();
      })
      .catch(function (e) { say(e.message, true); });
  }

  function post() {
    var body = input.value.trim();
    if (!body) { say("Write something first.", true); return; }
    postBtn.disabled = true;
    say("Saving…");
    fetch(listUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
      body: JSON.stringify({ body: body, section_id: target.id, section_label: target.label })
    })
      .then(asJson)
      .then(function (res) {
        if (!res.r.ok) throw new Error(errorFrom(res.r, res.j));
        input.value = "";
        say("");
        load();
      })
      .catch(function (e) { say(e.message, true); })
      .finally(function () { postBtn.disabled = false; });
  }

  function remove(id, btn) {
    if (!window.confirm("Delete this comment?")) return;
    btn.disabled = true;
    fetch(listUrl + id + "/delete/", { method: "POST", headers: { "X-CSRFToken": csrf } })
      .then(asJson)
      .then(function (res) {
        if (!res.r.ok) throw new Error(errorFrom(res.r, res.j));
        load();
      })
      .catch(function (e) { say(e.message, true); btn.disabled = false; });
  }

  /* ---- wiring ---------------------------------------------------------- */

  postBtn.addEventListener("click", post);
  targetClear.addEventListener("click", function () { setTarget("", ""); input.focus(); });
  document.getElementById("dc-close").addEventListener("click", function () { openRail(false); });
  toggle.addEventListener("click", function () { openRail(!rail.classList.contains("open")); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && rail.classList.contains("open")) openRail(false);
  });

  injectAnchorButtons();
  setTarget("", "");
  load();

  /* ---- click-to-copy on values marked copyable in the doc -------------- */

  // execCommand fallback: the async clipboard API is rejected outside a secure
  // or focused context, and a value the reader cannot copy defeats the point of
  // documenting it. If both paths fail, select the text so Ctrl/Cmd-C works.
  function copyText(text, el) {
    var flash = function (ok) {
      el.classList.add(ok ? "copied" : "copy-failed");
      setTimeout(function () { el.classList.remove("copied", "copy-failed"); }, 1200);
      if (!ok) {
        var range = document.createRange();
        range.selectNodeContents(el);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    };
    var legacy = function () {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      ta.remove();
      flash(ok);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(true); }, legacy);
    } else {
      legacy();
    }
  }

  document.addEventListener("click", function (e) {
    var code = e.target.closest && e.target.closest("#docs-body code.copyable");
    if (code) copyText(code.dataset.copy || code.textContent, code);
  });
})();
</script>
{% endblock %}
