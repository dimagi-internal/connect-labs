{% comment %}What the source marks mean, once per page.{% endcomment %}
<div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-600" data-testid="source-legend" aria-label="Where each fact came from">
  <span class="inline-flex items-center"><span class="src-mark src-mark--person" aria-hidden="true"></span>Recorded</span>
  <span class="inline-flex items-center"><span class="src-mark src-mark--ai" aria-hidden="true"></span>From an email, recorded by AI</span>
  {% if not no_calc %}<span class="inline-flex items-center"><span class="src-mark src-mark--calc" aria-hidden="true"></span>Calculated</span>{% endif %}
</div>
