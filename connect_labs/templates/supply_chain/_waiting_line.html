{% load supply_chain_extras %}{% if line.lines %}<div data-testid="{{ testid }}" class="mb-1"><strong>{{ line.heading }}</strong>:<ul data-testid="silent-suppliers" class="pl-3">{% for name, days in line.lines %}<li data-testid="{% if line.heading == 'No reply' %}silent-supplier{% else %}waiting-item{% endif %}">{{ name }}{% if days %} <span class="text-gray-600">({{ days }})</span>{% endif %}</li>{% endfor %}</ul></div>{% else %}<span data-testid="{{ testid }}" class="block mb-1">{{ line|lead_in }}</span>{% endif %}
