{% extends 'supply_chain/market/_shell.html' %}
{% block title %}{{ org.name }}{% endblock %}
{% block body %}
<div class="bg-white rounded-lg shadow-sm p-5 max-w-xl">
  <h1 class="text-xl font-semibold">{{ org.name }}</h1>
  <p class="text-sm text-gray-600 mt-2">{{ org.name }} is not a supplier on the marketplace yet.</p>
  {% if admin %}
    <form method="post" class="mt-4">
      {% csrf_token %}<input type="hidden" name="action" value="create_profile"><input type="hidden" name="org" value="{{ org.pk }}">
      <button class="px-4 py-2 text-sm bg-brand-indigo text-white rounded-md">Add a supplier profile for {{ org.name }}</button>
    </form>
  {% else %}
    <p class="text-sm text-gray-600 mt-2">An admin of {{ org.name }} can add one.</p>
  {% endif %}
</div>
{% endblock %}
