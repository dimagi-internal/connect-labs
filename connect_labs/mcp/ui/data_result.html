<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Query result</title>
    <!--
  ui://labs/data-result — an MCP Apps View (SEP-1865, 2026-01-26).

  Rendered by a host (canopy) for a data_query result: the rows as a table, a chart of
  them, and the SQL that produced them, with a link that opens the query on Labs' Data
  page.

  The rows are not in the tool result. Labs keeps the result (connect_labs/mcp/kept_results.py)
  and the tool result names it with a `resource_link` (labs-result://<id>); this View reads
  it back with `resources/read`, AS ITS VIEWER, a page at a time (?page=&page_size=), and
  sorts within the page (and says so). In a sensitive conversation the host keeps nothing
  else of the result (`_meta["canopy/withheld"]`), and the link is all this View needs. A
  kept result is a snapshot Labs never changes, so the View does not subscribe to it. It
  never runs the query itself.

  A refused read says why: expired (ask again in the chat -- with the sample the tool
  result carried, said plainly to be a sample, when there is one), not yours to see, or
  sensitive data that stays in Labs. When Labs withheld production rows from the agent, the kept
  result holds none either and the View offers the Data page, where the person runs the
  query inside Labs.

  Self-contained on purpose: no network load of any kind. Every call goes to the host
  over postMessage. The chart is drawn here, as SVG, so no library has to load.
-->
    <style>
      <style > :root {
        color-scheme: light dark;
        --color-background-primary: light-dark(#ffffff, #171717);
        --color-background-secondary: light-dark(#f6f7f9, #222326);
        --color-text-primary: light-dark(#171717, #f2f2f2);
        --color-text-secondary: light-dark(#5b6470, #a8b0ba);
        --color-text-warning: light-dark(#7a5300, #f3c969);
        --color-border-primary: light-dark(#d9dde3, #3a3d42);
        --color-border-secondary: light-dark(#eceff3, #2c2f33);
        --brand: light-dark(#16006d, #a99bff);
        --brand-soft: light-dark(#eef2ff, #24204a);
        --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --s1: light-dark(#3f4fa0, #9aa8ff);
        --s2: light-dark(#c26a1e, #f0a560);
        --s3: light-dark(#1d6b3a, #8fdcaa);
        --s4: light-dark(#9b2c6f, #f29ccc);
        --s5: light-dark(#5b6470, #a8b0ba);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.4;
        color: var(--color-text-primary);
        background: var(--color-background-primary);
      }
      #app {
        padding: 10px 12px 12px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-bottom: 8px;
      }
      .title {
        font-weight: 600;
      }
      .sub {
        color: var(--color-text-secondary);
        font-size: 12px;
      }
      .warn {
        color: var(--color-text-warning);
      }
      .err {
        color: #b42318;
      }
      .spacer {
        flex: 1;
      }
      .tabs {
        display: inline-flex;
        border: 1px solid var(--color-border-primary);
        border-radius: 6px;
        overflow: hidden;
      }
      .tabs button {
        font: inherit;
        font-size: 12px;
        padding: 3px 10px;
        border: 0;
        background: none;
        color: var(--color-text-secondary);
        cursor: pointer;
      }
      .tabs button[aria-selected='true'] {
        background: var(--brand-soft);
        color: var(--brand);
        font-weight: 600;
      }
      .btn {
        font: inherit;
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 6px;
        border: 1px solid var(--color-border-primary);
        background: var(--color-background-primary);
        color: var(--brand);
        cursor: pointer;
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--color-background-primary);
      }
      .wrap {
        overflow: auto;
        max-height: 70vh;
        border: 1px solid var(--color-border-secondary);
        border-radius: 6px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--color-background-secondary);
        text-align: left;
        font-weight: 600;
        padding: 5px 8px;
        border-bottom: 1px solid var(--color-border-primary);
        white-space: nowrap;
      }
      td {
        padding: 4px 8px;
        border-bottom: 1px solid var(--color-border-secondary);
        vertical-align: top;
        max-width: 360px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      td.num {
        text-align: right;
      }
      td.null {
        color: var(--color-text-secondary);
      }
      pre {
        margin: 0;
        padding: 10px;
        font: 12px/1.5 var(--font-mono);
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--color-background-secondary);
        border-radius: 6px;
      }
      .notes {
        margin: 8px 0 0;
        padding-left: 18px;
        color: var(--color-text-secondary);
        font-size: 12px;
      }
      .chart-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;

      }

        font: inherit;
        font-size: 12px;
      }

        fill: var(--color-text-secondary);
        font-size: 11px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 12px;
        margin-top: 4px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      .pager {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-top: 6px;
        font-size: 12px;
        color: var(--color-text-secondary);
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      th[data-sort] {
        cursor: pointer;
        user-select: none;
      }
      th .dir {
        color: var(--brand);
        margin-left: 3px;
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="sub">Loading…</div></div>
    <script>
      (function () {
        'use strict';

        var PROTOCOL_VERSION = '2026-01-26';
        var SCHEME = 'labs-result://';
        var SERIES = ['--s1', '--s2', '--s3', '--s4', '--s5'];
        var MAX_BARS = 30;
        var PAGE_SIZES = [50, 100, 250, 500, 1000];
        var META_KEY = 'labs/result';

        // ---------------------------------------------------------------- transport
        var nextId = 1;
        var pending = {};
        function post(message) {
          window.parent.postMessage(message, '*');
        }
        function request(method, params) {
          var id = nextId++;
          return new Promise(function (resolve, reject) {
            pending[id] = { resolve: resolve, reject: reject };
            post({
              jsonrpc: '2.0',
              id: id,
              method: method,
              params: params || {},
            });
          });
        }
        function notify(method, params) {
          post({ jsonrpc: '2.0', method: method, params: params || {} });
        }
        window.addEventListener('message', function (event) {
          if (event.source !== window.parent) return;
          var msg = event.data;
          if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;
          if (
            msg.method === undefined &&
            msg.id !== undefined &&
            pending[msg.id]
          ) {
            var p = pending[msg.id];
            delete pending[msg.id];
            if (msg.error)
              p.reject(
                new Error((msg.error && msg.error.message) || 'Request failed'),
              );
            else p.resolve(msg.result);
            return;
          }
          if (typeof msg.method !== 'string') return;
          if (msg.id !== undefined) {
            if (msg.method === 'ui/resource-teardown' || msg.method === 'ping')
              post({ jsonrpc: '2.0', id: msg.id, result: {} });
            else
              post({
                jsonrpc: '2.0',
                id: msg.id,
                error: { code: -32601, message: 'Method not found' },
              });
            return;
          }
          var handler = notifications[msg.method];
          if (handler) handler(msg.params || {});
        });

        // ---------------------------------------------------------------- state
        var state = {
          initialized: false,
          canRead: false, // the host reads resources for this View (hostCapabilities.serverResources)
          args: null, // the agent's arguments: opportunity_ids, sql, max_rows
          facts: null, // what the tool result said, when the host passed it on
          uri: '', // the kept result: labs-result://<id>, without a page
          result: null, // the page on screen: {columns, rows, sql_executed, ...} or a withheld note
          paging: null, // {page, pages, page_size, row_count}
          pageSize: 100,
          sort: { col: -1, dir: 1 }, // within the page
          tab: 'table',
          x: null,
          ys: [],
          error: '',
          sensitive: false, // the refusal was labs keeping sensitive data in Labs
          expired: false, // the full result expired; what is on screen is the facts' sample
          loading: false,
        };

        function esc(v) {
          return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
            return {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            }[c];
          });
        }
        function parseText(result) {
          var text = ((result && result.content) || [])
            .map(function (c) {
              return c && c.type !== 'resource_link' && c.text;
            })
            .filter(Boolean)
            .join('');
          try {
            return JSON.parse(text);
          } catch (e) {
            return null;
          }
        }
        function cellText(v) {
          if (v === null || v === undefined) return 'null';
          if (typeof v === 'object') return JSON.stringify(v);
          if (typeof v === 'number') return v.toLocaleString();
          return String(v);
        }
        function isNum(v) {
          return typeof v === 'number' && isFinite(v);
        }
        function looksLikeDate(v) {
          return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v);
        }
        function hasRows(r) {
          return r && Array.isArray(r.columns) && Array.isArray(r.rows);
        }
        function openUrl() {
          return (
            (state.result && state.result.open_on_page) ||
            (state.facts && state.facts.open_on_page) ||
            ''
          );
        }

        // ---------------------------------------------------------------- the kept result
        function resultLink(params) {
          var links = ((params && params.content) || []).filter(function (c) {
            return (
              c &&
              c.type === 'resource_link' &&
              typeof c.uri === 'string' &&
              c.uri.indexOf(SCHEME) === 0
            );
          });
          return links.length ? links[0].uri.split('?')[0] : '';
        }
        // Why a read was refused, as the person should read it. Labs names its refusals
        // (`expired`, `forbidden`, `not_found`); the host passes them on (`host_refused: …`).
        function refusal(message) {
          var m = String(message || '');
          state.sensitive = false;
          if (/\bexpired\b/.test(m))
            return 'This result has expired — ask again in the chat.';
          if (/\bnot_found\b/.test(m))
            return 'This result is no longer kept — ask again in the chat.';
          if (/\bforbidden\b/.test(m)) {
            if (/sensitive/i.test(m)) {
              state.sensitive = true;
              return 'This result holds sensitive data, which stays in Labs. Open the query on the Data page to see it there.';
            }
            return 'This result is not yours to see: only the person it was run for, and people who could run the same query themselves, can read it.';
          }
          return 'Could not read the result: ' + m;
        }
        function read(page) {
          if (!state.uri || !state.initialized) return;
          if (!state.canRead) {
            showSample();
            return;
          }
          state.loading = true;
          render();
          var uri =
            state.uri + '?page=' + (page || 1) + '&page_size=' + state.pageSize;
          request('resources/read', { uri: uri }).then(
            function (res) {
              state.loading = false;
              var c = ((res && res.contents) || [])[0];
              var body = null;
              try {
                body =
                  c && typeof c.text === 'string' ? JSON.parse(c.text) : null;
              } catch (e) {
                body = null;
              }
              if (!body) {
                state.error = 'The result could not be read.';
                render();
                return;
              }
              var meta = (c._meta && c._meta[META_KEY]) || {};
              var first = !state.result;
              state.result = body;
              state.paging = hasRows(body)
                ? {
                    page: meta.page || 1,
                    pages: meta.pages || 1,
                    page_size: meta.page_size || state.pageSize,
                    row_count:
                      meta.row_count != null
                        ? meta.row_count
                        : body.rows.length,
                  }
                : null;
              state.error = '';
              if (first || state.x === null) pickAxes();
              // No resources/subscribe: Labs never changes a kept result and never sends
              // "it changed" (add one here when it does).
              render();
            },
            function (err) {
              state.loading = false;
              var message = String((err && err.message) || '');
              // The full result is gone, but the tool result carried a sample of it:
              // show that, and say plainly that it is only a sample.
              if (
                /\b(expired|not_found)\b/.test(message) &&
                !state.result &&
                sampleOf(state.facts)
              ) {
                state.expired = true;
                showSample();
                return;
              }
              state.error = refusal(message);
              render();
            },
          );
        }
        // A host that cannot read resources still gets the facts' sample (an ordinary
        // conversation passes the tool result on).
        function sampleOf(f) {
          return (
            f &&
            Array.isArray(f.columns) &&
            (Array.isArray(f.rows) || Array.isArray(f.sample_rows))
          );
        }
        function showSample() {
          var f = state.facts;
          if (!f || !Array.isArray(f.columns)) {
            state.error =
              'This host cannot read the result back. Ask again in the chat.';
            render();
            return;
          }
          var rows = Array.isArray(f.rows)
            ? f.rows
            : (f.sample_rows || []).map(function (r) {
                return f.columns.map(function (c) {
                  return r[c];
                });
              });
          state.result = Object.assign({}, f, { rows: rows });
          state.paging = {
            page: 1,
            pages: 1,
            page_size: rows.length,
            row_count: f.row_count != null ? f.row_count : rows.length,
            sample: rows.length < (f.row_count || 0),
          };
          pickAxes();
          render();
        }
        function pickAxes() {
          var r = state.result;
          state.x = null;
          state.ys = [];
          if (!hasRows(r) || !r.rows.length) return;
          var numeric = r.columns.map(function (_c, i) {
            return r.rows.every(function (row) {
              return row[i] === null || isNum(row[i]);
            });
          });
          var x = numeric.indexOf(false);
          state.x = x >= 0 ? x : 0;
          numeric.forEach(function (n, i) {
            if (n && i !== state.x && state.ys.length < SERIES.length)
              state.ys.push(i);
          });
        }
        // Sorted within the page on screen: the order the query gave is the order the
        // pages come in.
        function compare(a, b) {
          if (a === b) return 0;
          if (a === null || a === undefined) return 1;
          if (b === null || b === undefined) return -1;
          if (isNum(a) && isNum(b)) return a - b;
          return cellText(a).localeCompare(cellText(b), undefined, {
            numeric: true,
          });
        }
        function sortedRows() {
          var r = state.result;
          var rows = r.rows.slice();
          var col = state.sort.col;
          if (col < 0) return rows;
          var dir = state.sort.dir;
          return rows.sort(function (a, b) {
            var c = compare(a[col], b[col]);
            // nulls stay last whichever way the column is sorted
            if (a[col] == null || b[col] == null) return c;
            return dir * c;
          });
        }

        // ---------------------------------------------------------------- chart (SVG)
        function chart() {
          var r = state.result;
          if (!hasRows(r) || state.x === null || !state.ys.length)
            return '<div class="sub">Nothing to chart: the result needs a numeric column.</div>';
          var rows = sortedRows().slice(0, 500);
          var line =
            rows.length > 1 &&
            rows.every(function (row) {
              return looksLikeDate(row[state.x]);
            });
          if (!line && rows.length > MAX_BARS) rows = rows.slice(0, MAX_BARS);
          var w = Math.max(
            320,
            Math.min(document.documentElement.clientWidth - 30, 1100),
          );
          var h = 240;
          var pad = { l: 48, r: 10, t: 10, b: line ? 30 : 70 };
          var iw = w - pad.l - pad.r;
          var ih = h - pad.t - pad.b;
          var max = 0;
          rows.forEach(function (row) {
            state.ys.forEach(function (i) {
              if (isNum(row[i]) && row[i] > max) max = row[i];
            });
          });
          if (max <= 0) max = 1;
          // Round gridlines: a step of 1, 2 or 5 times a power of ten, and an axis that
          // ends on one.
          var raw = max / 4;
          var mag = Math.pow(10, Math.floor(Math.log10(raw)));
          var step = [1, 2, 5, 10]
            .map(function (k) {
              return k * mag;
            })
            .filter(function (v) {
              return v >= raw;
            })[0];
          var ticks = Math.ceil(max / step);
          max = ticks * step;
          function yPos(v) {
            return pad.t + ih - (ih * (isNum(v) ? v : 0)) / max;
          }
          var out = [
            '<svg width="' +
              w +
              '" height="' +
              h +
              '" role="img" aria-label="Chart of the result">',
          ];
          for (var g = 0; g <= ticks; g++) {
            var gv = step * g;
            var gy = yPos(gv);
            out.push(
              '<line x1="' +
                pad.l +
                '" x2="' +
                (w - pad.r) +
                '" y1="' +
                gy +
                '" y2="' +
                gy +
                '" stroke="var(--color-border-secondary)"/>',
              '<text x="' +
                (pad.l - 6) +
                '" y="' +
                (gy + 4) +
                '" text-anchor="end">' +
                esc(
                  gv >= 1000 ? Math.round(gv).toLocaleString() : +gv.toFixed(2),
                ) +
                '</text>',
            );
          }
          var n = rows.length;
          if (line) {
            state.ys.forEach(function (col, s) {
              var pts = rows.map(function (row, i) {
                var px = pad.l + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
                return px.toFixed(1) + ',' + yPos(row[col]).toFixed(1);
              });
              out.push(
                '<polyline fill="none" stroke-width="2" stroke="var(' +
                  SERIES[s] +
                  ')" points="' +
                  pts.join(' ') +
                  '"/>',
              );
            });
            [0, Math.floor((n - 1) / 2), n - 1].forEach(function (i, k, all) {
              if (k && i === all[k - 1]) return;
              var px = pad.l + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
              out.push(
                '<text x="' +
                  px +
                  '" y="' +
                  (h - 10) +
                  '" text-anchor="middle">' +
                  esc(String(rows[i][state.x]).slice(0, 10)) +
                  '</text>',
              );
            });
          } else {
            var band = iw / n;
            var bw = Math.max(2, (band * 0.8) / state.ys.length);
            rows.forEach(function (row, i) {
              state.ys.forEach(function (col, s) {
                var bx = pad.l + band * i + band * 0.1 + bw * s;
                var by = yPos(row[col]);
                out.push(
                  '<rect x="' +
                    bx.toFixed(1) +
                    '" y="' +
                    by.toFixed(1) +
                    '" width="' +
                    bw.toFixed(1) +
                    '" height="' +
                    Math.max(0, pad.t + ih - by).toFixed(1) +
                    '" fill="var(' +
                    SERIES[s] +
                    ')"><title>' +
                    esc(
                      cellText(row[state.x]) +
                        ' · ' +
                        r.columns[col] +
                        ': ' +
                        cellText(row[col]),
                    ) +
                    '</title></rect>',
                );
              });
              var lx = pad.l + band * i + band / 2;
              out.push(
                '<text transform="translate(' +
                  lx.toFixed(1) +
                  ',' +
                  (pad.t + ih + 10) +
                  ') rotate(40)" text-anchor="start">' +
                  esc(cellText(row[state.x]).slice(0, 18)) +
                  '</text>',
              );
            });
          }
          out.push('</svg>');
          var legend = state.ys
            .map(function (col, s) {
              return (
                '<span><i style="background:var(' +
                SERIES[s] +
                ')"></i>' +
                esc(r.columns[col]) +
                '</span>'
              );
            })
            .join('');
          var cut =
            r.rows.length > rows.length
              ? '<div class="sub">Charting the first ' +
                rows.length +
                ' rows.</div>'
              : '';
          return (
            controls() +
            out.join('') +
            '<div class="legend">' +
            legend +
            '</div>' +
            cut
          );
        }
        function controls() {
          var r = state.result;
          var xs = r.columns
            .map(function (c, i) {
              return (
                '<option value="' +
                i +
                '"' +
                (i === state.x ? ' selected' : '') +
                '>' +
                esc(c) +
                '</option>'
              );
            })
            .join('');
          var ys = r.columns
            .map(function (c, i) {
              if (i === state.x) return '';
              var on = state.ys.indexOf(i) >= 0;
              return (
                '<label><input type="checkbox" data-y="' +
                i +
                '"' +
                (on ? ' checked' : '') +
                '> ' +
                esc(c) +
                '</label>'
              );
            })
            .join(' ');
          return (
            '<div class="chart-controls"><label>x <select id="x">' +
            xs +
            '</select></label>' +
            ys +
            '</div>'
          );
        }

        // ---------------------------------------------------------------- render
        function table() {
          var r = state.result;
          var head = r.columns
            .map(function (c, i) {
              var dir =
                state.sort.col === i ? (state.sort.dir > 0 ? '▲' : '▼') : '';
              return (
                '<th data-sort="' +
                i +
                '" title="Sort the rows on this page by ' +
                esc(c) +
                '">' +
                esc(c) +
                (dir ? '<span class="dir">' + dir + '</span>' : '') +
                '</th>'
              );
            })
            .join('');
          var body = sortedRows()
            .map(function (row) {
              return (
                '<tr>' +
                row
                  .map(function (v) {
                    var cls = v === null ? 'null' : isNum(v) ? 'num' : '';
                    return (
                      '<td class="' +
                      cls +
                      '" title="' +
                      esc(cellText(v)) +
                      '">' +
                      esc(cellText(v)) +
                      '</td>'
                    );
                  })
                  .join('') +
                '</tr>'
              );
            })
            .join('');
          return (
            '<div class="wrap"><table><thead><tr>' +
            head +
            '</tr></thead><tbody>' +
            body +
            '</tbody></table></div>'
          );
        }
        function pager() {
          var p = state.paging;
          if (!p) return '';
          if (state.expired)
            return (
              '<div class="pager warn">The full result has expired. This is only the sample of ' +
              p.page_size +
              ' of ' +
              p.row_count.toLocaleString() +
              ' rows the query returned to the chat — ask again in the chat for every row.</div>'
            );
          if (p.sample)
            return (
              '<div class="pager">Showing the first ' +
              p.page_size +
              ' of ' +
              p.row_count.toLocaleString() +
              ' rows.</div>'
            );
          var from = p.row_count ? (p.page - 1) * p.page_size + 1 : 0;
          var to = Math.min(p.row_count, p.page * p.page_size);
          var sizes = PAGE_SIZES.map(function (n) {
            return (
              '<option value="' +
              n +
              '"' +
              (n === state.pageSize ? ' selected' : '') +
              '>' +
              n +
              '</option>'
            );
          }).join('');
          return (
            '<div class="pager">' +
            '<button class="btn" id="prev"' +
            (p.page <= 1 || state.loading ? ' disabled' : '') +
            '>Previous</button>' +
            '<span>Rows ' +
            from.toLocaleString() +
            '–' +
            to.toLocaleString() +
            ' of ' +
            p.row_count.toLocaleString() +
            ' · page ' +
            p.page +
            ' of ' +
            p.pages +
            '</span>' +
            '<button class="btn" id="next"' +
            (p.page >= p.pages || state.loading ? ' disabled' : '') +
            '>Next</button>' +
            '<label>Rows per page <select id="size">' +
            sizes +
            '</select></label>' +
            (state.sort.col >= 0 && p.pages > 1
              ? '<span class="sub">Sorted within this page only</span>'
              : '') +
            (state.loading ? '<span>Loading…</span>' : '') +
            '</div>'
          );
        }
        function openButton(primary) {
          return openUrl()
            ? '<button class="btn' +
                (primary ? ' primary' : '') +
                '" id="open">Open on the Data page</button>'
            : '';
        }
        function sqlText() {
          var r = state.result || {};
          return (
            r.sql_executed ||
            (state.facts && state.facts.sql_executed) ||
            (state.args && state.args.sql) ||
            ''
          );
        }
        function render() {
          var app = document.getElementById('app');
          var r = state.result;
          if (state.error) {
            app.innerHTML =
              '<div class="sub' +
              (state.sensitive ? '' : ' err') +
              '">' +
              esc(state.error) +
              '</div>' +
              (state.sensitive
                ? '<div class="bar" style="margin-top:8px">' +
                  openButton(true) +
                  '</div>'
                : '');
            return reportSize();
          }
          if (!r) {
            app.innerHTML =
              '<div class="sub">' +
              (state.uri ? 'Reading the result…' : 'Waiting for the result…') +
              '</div>';
            return reportSize();
          }
          if (r.withheld) {
            app.innerHTML =
              '<div class="bar"><span class="title">Sensitive data stays in Labs</span></div>' +
              '<div class="sub">' +
              esc(r.message || '') +
              '</div>' +
              '<div class="bar" style="margin-top:8px">' +
              openButton(true) +
              '</div>' +
              (sqlText() ? '<pre>' + esc(sqlText()) + '</pre>' : '');
            return reportSize();
          }
          if (!hasRows(r)) {
            app.innerHTML = '<div class="sub">No rows to show.</div>';
            return reportSize();
          }
          var total = state.paging ? state.paging.row_count : r.rows.length;
          var summary =
            total.toLocaleString() +
            ' row' +
            (total === 1 ? '' : 's') +
            (r.truncated
              ? ' <span class="warn">(cut at the row cap)</span>'
              : '') +
            (r.elapsed_ms != null ? ' · ' + r.elapsed_ms + ' ms' : '') +
            (r.opportunities && r.opportunities.length
              ? ' · ' +
                esc(
                  r.opportunities
                    .map(function (o) {
                      return o.name;
                    })
                    .join(', '),
                )
              : '');
          var tabs =
            '<span class="tabs" role="tablist">' +
            ['table', 'chart', 'sql']
              .map(function (t) {
                return (
                  '<button role="tab" data-tab="' +
                  t +
                  '" aria-selected="' +
                  (state.tab === t) +
                  '">' +
                  { table: 'Table', chart: 'Chart', sql: 'SQL' }[t] +
                  '</button>'
                );
              })
              .join('') +
            '</span>';
          var body =
            state.tab === 'chart'
              ? chart() + pager()
              : state.tab === 'sql'
                ? '<pre>' + esc(sqlText()) + '</pre>'
                : table() + pager();
          var notes = (r.notes || []).length
            ? '<ul class="notes">' +
              r.notes
                .map(function (n) {
                  return '<li>' + esc(n) + '</li>';
                })
                .join('') +
              '</ul>'
            : '';
          app.innerHTML =
            '<div class="bar">' +
            tabs +
            '<span class="sub">' +
            summary +
            '</span><span class="spacer"></span>' +
            '<button class="btn" id="expand" title="Show larger">Expand</button>' +
            openButton(false) +
            '</div>' +
            body +
            notes;
          reportSize();
        }

        document.addEventListener('click', function (e) {
          var t = e.target;
          if (!(t instanceof Element)) return;
          var tab = t.closest('[data-tab]');
          var th = t.closest('[data-sort]');
          if (tab) {
            state.tab = tab.getAttribute('data-tab');
            render();
          } else if (th) {
            var col = Number(th.getAttribute('data-sort'));
            state.sort =
              state.sort.col === col
                ? { col: col, dir: -state.sort.dir }
                : { col: col, dir: 1 };
            render();
          } else if (t.closest('#prev')) {
            if (state.paging && state.paging.page > 1)
              read(state.paging.page - 1);
          } else if (t.closest('#next')) {
            if (state.paging && state.paging.page < state.paging.pages)
              read(state.paging.page + 1);
          } else if (t.closest('#open')) {
            request('ui/open-link', { url: openUrl() }).catch(function () {});
          } else if (t.closest('#expand')) {
            request('ui/request-display-mode', { mode: 'fullscreen' }).catch(
              function () {},
            );
          }
        });
        document.addEventListener('change', function (e) {
          var t = e.target;
          if (!(t instanceof Element)) return;
          if (t.id === 'size') {
            state.pageSize = Number(t.value) || 100;
            read(1);
          } else if (t.id === 'x') {
            state.x = Number(t.value);
            state.ys = state.ys.filter(function (i) {
              return i !== state.x;
            });
            render();
          } else if (t.hasAttribute('data-y')) {
            var i = Number(t.getAttribute('data-y'));
            state.ys = t.checked
              ? state.ys.concat([i]).slice(-SERIES.length)
              : state.ys.filter(function (y) {
                  return y !== i;
                });
            render();
          }
        });

        // ---------------------------------------------------------------- theme + size
        function applyHostContext(ctx) {
          if (!ctx) return;
          var root = document.documentElement;
          var vars = ctx.styles && ctx.styles.variables;
          if (vars)
            Object.keys(vars).forEach(function (k) {
              if (vars[k] != null && k.indexOf('--') === 0)
                root.style.setProperty(k, String(vars[k]));
            });
          if (ctx.theme === 'light' || ctx.theme === 'dark')
            root.style.colorScheme = ctx.theme;
          if (ctx.displayMode && state.result && state.tab === 'chart')
            render();
        }
        var lastSize = '';
        function reportSize() {
          if (!state.initialized) return;
          var w = Math.ceil(document.documentElement.scrollWidth);
          var hgt = Math.ceil(document.documentElement.scrollHeight);
          var key = w + 'x' + hgt;
          if (key === lastSize) return;
          lastSize = key;
          notify('ui/notifications/size-changed', { width: w, height: hgt });
        }
        if (typeof ResizeObserver === 'function')
          new ResizeObserver(reportSize).observe(document.documentElement);

        // ---------------------------------------------------------------- lifecycle
        // The result is read from the link the tool result carries, never from the rows
        // a host passed on and never by running the query again.
        var notifications = {
          'ui/notifications/tool-input': function (params) {
            if (!state.args) state.args = params.arguments || {};
          },
          'ui/notifications/tool-result': function (params) {
            params = params || {};
            var sc = params.structuredContent || parseText(params);
            var withheld = !!(params._meta && params._meta['canopy/withheld']);
            if (sc && !withheld) state.facts = sc;
            if (params.isError) {
              state.error =
                (sc && (sc.message || (sc.error && sc.error.message))) ||
                'The query failed.';
              return render();
            }
            var uri = resultLink(params);
            if (uri) {
              if (uri === state.uri && state.result) return;
              state.uri = uri;
              state.result = null;
              state.error = '';
              return read(1);
            }
            // No link: a result from before Labs kept its results. Show what arrived;
            // there is nothing to read back.
            if (sc && (hasRows(sc) || sc.withheld)) {
              state.result = sc;
              state.paging = hasRows(sc)
                ? {
                    page: 1,
                    pages: 1,
                    page_size: sc.rows.length,
                    row_count: sc.rows.length,
                  }
                : null;
              pickAxes();
              return render();
            }
            state.error =
              'This result is no longer kept — ask again in the chat.';
            render();
          },
          'notifications/resources/updated': function (params) {
            var uri = String((params && params.uri) || '').split('?')[0];
            if (uri && uri === state.uri)
              read(state.paging ? state.paging.page : 1);
          },
          'ui/notifications/host-context-changed': function (params) {
            applyHostContext(params);
          },
        };

        request('ui/initialize', {
          protocolVersion: PROTOCOL_VERSION,
          appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
          clientInfo: { name: 'labs-data-result', version: '2.0.0' },
        }).then(
          function (result) {
            result = result || {};
            applyHostContext(result.hostContext || {});
            var caps = result.hostCapabilities || {};
            state.canRead = !!caps.serverResources;
            notify('ui/notifications/initialized', {});
            state.initialized = true;
            // A link that arrived before the host answered is read now.
            if (state.uri && !state.result && !state.error) read(1);
            else render();
          },
          function (err) {
            document.getElementById('app').innerHTML =
              '<div class="sub err">Could not start: ' +
              esc(err.message) +
              '</div>';
          },
        );
      })();
    </script>
  </body>
</html>
