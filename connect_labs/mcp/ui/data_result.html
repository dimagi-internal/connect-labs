    <title>Query result</title>
    <!--
  ui://labs/data-result — an MCP Apps View (SEP-1865, 2026-01-26).

  Rendered by a host (canopy) for a data_query result: the rows as a table, a chart of
  them, and the SQL that produced them, with a link that opens the query on Labs' Data
  page.

  The rows are not in the tool result. Labs keeps the result (connect_labs/mcp/kept_results.py)
  and the tool result names it with a `resource_link` (labs-result://<id>); this View reads
  it back with `resources/read`, AS ITS VIEWER, a page at a time (?page=&page_size=); a
  sort of a result with more than one page is Labs' (?sort=&dir=), over every row. In a sensitive conversation the host keeps nothing
  else of the result (`_meta["canopy/withheld"]`), and the link is all this View needs. A
  kept result is a snapshot Labs never changes, so the View does not subscribe to it. It
  never runs the query itself.

  A refused read says why, from Labs' structured refusal (`error.data.code`): expired (ask
  again in the chat -- with the sample the tool result carried, said plainly to be a
  sample, when there is one), not yours to see, Connect could not confirm access right
  now (try again), or sensitive data that stays in Labs. When Labs withheld production
  rows from the agent, the kept result holds none either and the View offers the Data
  page, where the person runs the query inside Labs.

  What it shows comes from the kept result, never the tool input (a sensitive
  conversation keeps none): the agent's `display` (labels, formats, chart:
  labsdata/display.py), the SQL laid out (`sql_formatted`) and how fresh the data is
  (`opportunities[].cached_at`). Download CSV and Save open the Data page with
  `ui/open-link` (`open_on_page` + run/download/save hints): the page runs the query
  again, as the person, and nothing downloads or saves without their click there. The
  card never serves rows or builds a download itself.

  Self-contained on purpose: no network load of any kind. Every call goes to the host
  over postMessage. The chart is drawn here, as SVG, so no library has to load: by the
  module the Data page draws a saved query's chart with (static/labsdata/result_chart.js),
  which Labs inlines at the `@include` marker when it serves this View
  (connect_labs/mcp/ui/__init__.py), so the served document stays one file.
-->
    <style>

  <body>
    <div id="app"><div class="sub">Loading…</div></div>
    <script>
      /*@include:labsdata/result_chart.js*/
      (function () {
        'use strict';

        var PROTOCOL_VERSION = '2026-01-26';
        var SCHEME = 'labs-result://';
        var SERIES = LabsResultChart.SERIES;
        var PAGE_SIZE = 100;
        var META_KEY = 'labs/result';

        // ---------------------------------------------------------------- transport
        var nextId = 1;
        var pending = {};
        function post(message) {
          window.parent.postMessage(message, '*');
        }
        function request(method, params) {
          var id = nextId++;
          return new Promise(function (resolve, reject) {
            pending[id] = { resolve: resolve, reject: reject };
            post({
              jsonrpc: '2.0',
              id: id,
              method: method,
              params: params || {},
            });
          });
        }
        function notify(method, params) {
          post({ jsonrpc: '2.0', method: method, params: params || {} });
        }
        window.addEventListener('message', function (event) {
          if (event.source !== window.parent) return;
          var msg = event.data;
          if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;
          if (
            msg.method === undefined &&
            msg.id !== undefined &&
            pending[msg.id]
          ) {
            var p = pending[msg.id];
            delete pending[msg.id];
            if (msg.error) {
              var failure = new Error(msg.error.message || 'Request failed');
              // Labs' refusal, structured (`data.code`), when the host passes it on.
              failure.data = msg.error.data;
              p.reject(failure);
            } else p.resolve(msg.result);
            return;
          }
          if (typeof msg.method !== 'string') return;
          if (msg.id !== undefined) {
            if (msg.method === 'ui/resource-teardown' || msg.method === 'ping')
              post({ jsonrpc: '2.0', id: msg.id, result: {} });
            else
              post({
                jsonrpc: '2.0',
                id: msg.id,
                error: { code: -32601, message: 'Method not found' },
              });
            return;
          }
          var handler = notifications[msg.method];
          if (handler) handler(msg.params || {});
        });

        // ---------------------------------------------------------------- state
        var state = {
          initialized: false,
          canRead: false, // the host reads resources for this View (hostCapabilities.serverResources)
          args: null, // the agent's arguments: opportunity_ids, sql, max_rows
          facts: null, // what the tool result said, when the host passed it on
          uri: '', // the kept result: labs-result://<id>, without a page
          result: null, // the page on screen: {columns, rows, sql_executed, ...} or a withheld note
          paging: null, // {page, pages, page_size, row_count}
          pageSize: PAGE_SIZE,
          // The column sorted by. With more than one page Labs sorts the whole result
          // (`server`: resources/read ?sort=&dir=); with one, the card sorts it here.
          sort: { col: -1, dir: 1, server: false },
          chartType: '', // bar, line or stat: the agent's chart, else picked from the rows
          // The tab on screen: the chart when the agent's display asked for one (it
          // is what they meant the person to see), else the table. Once the person
          // picks a tab (`tabPicked`) a later read never moves them off it.
          tab: 'table',
          tabPicked: false,
          x: null,
          ys: [],
          error: '',
          problem: null, // the query failed: {message, code, hint}
          json: null, // the JSON cell open below the table: {row, col}
          modes: [], // the host's availableDisplayModes
          displayMode: 'inline',
          asked: false, // "Ask again" was sent
          sensitive: false, // the refusal was labs keeping sensitive data in Labs
          expired: false, // the full result expired; what is on screen is the facts' sample
          loading: false,
        };

        function esc(v) {
          return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
            return {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            }[c];
          });
        }
        function parseText(result) {
          var text = ((result && result.content) || [])
            .map(function (c) {
              return c && c.type !== 'resource_link' && c.text;
            })
            .filter(Boolean)
            .join('');
          try {
            return JSON.parse(text);
          } catch (e) {
            return null;
          }
        }
        // How a result reads -- column kinds, the agent's labels and formats -- and the
        // chart: one module shared with the Data page (static/labsdata/result_chart.js),
        // inlined above where Labs serves this View. V() binds it to the result on screen.
        var cellText = LabsResultChart.cellText;
        var isNum = LabsResultChart.isNum;
        var columnKinds = LabsResultChart.columnKinds;
        var isNumeric = LabsResultChart.isNumeric;
        var bound = null;
        function V() {
          var d = shownAs();
          if (!bound || bound.result !== state.result || bound.display !== d)
            bound = LabsResultChart.view(state.result, d);
          return bound;
        }
        // How the agent said the result reads (data_query's `display`, checked by Labs
        // and kept in the result: labsdata/display.py): labels, formats, a chart.
        function shownAs() {
          var d =
            (state.result && state.result.display) ||
            (state.facts && state.facts.display) ||
            null;
          return d && typeof d === 'object' ? d : null;
        }
        function heading(name) {
          return V().heading(name);
        }
        function cell(v, kind, name) {
          return V().cell(v, kind, name);
        }

        // ------------------------------------------------------------ provenance
        // How old the data is: when each opportunity's visits were loaded from Connect
        // (`opportunities[].cached_at`). The oldest leads; the rest are on hover.
        function ago(iso) {
          var t = Date.parse(iso);
          if (!isFinite(t)) return '';
          var mins = Math.max(0, Math.round((Date.now() - t) / 60000));
          if (mins < 1) return 'just now';
          if (mins < 60) return mins + ' min ago';
          var hours = Math.round(mins / 60);
          if (hours < 48) return hours + ' h ago';
          return Math.round(hours / 24) + ' days ago';
        }
        function freshness(r) {
          var opps = ((r && r.opportunities) || []).filter(function (o) {
            return o && typeof o.cached_at === 'string' && ago(o.cached_at);
          });
          if (!opps.length) return '';
          opps.sort(function (a, b) {
            return Date.parse(a.cached_at) - Date.parse(b.cached_at);
          });
          var title = opps
            .map(function (o) {
              return (
                (o.name || '#' + o.id) + ': data as of ' + ago(o.cached_at)
              );
            })
            .join('\n');
          return (
            ' · <span class="fresh" title="' +
            esc(title) +
            '">Data as of ' +
            esc(ago(opps[0].cached_at)) +
            (opps.length > 1 ? ' (oldest)' : '') +
            '</span>'
          );
        }

        function hasRows(r) {
          return r && Array.isArray(r.columns) && Array.isArray(r.rows);
        }
        function openUrl() {
          return (
            (state.result && state.result.open_on_page) ||
            (state.facts && state.facts.open_on_page) ||
            ''
          );
        }

        // ---------------------------------------------------------------- the kept result
        function resultLink(params) {
          var links = ((params && params.content) || []).filter(function (c) {
            return (
              c &&
              c.type === 'resource_link' &&
              typeof c.uri === 'string' &&
              c.uri.indexOf(SCHEME) === 0
            );
          });
          return links.length ? links[0].uri.split('?')[0] : '';
        }
        // Why a read was refused: Labs' structured code (`error.data.code`: expired,
        // not_found, forbidden, unavailable, bad_uri; `data.sensitive` for its
        // sensitive-data rule). A host that passes on only the message (canopy:
        // `host_refused: <site> refused: <code>: <why>`) still carries the code at the
        // head of Labs' own message, so it is read from there -- never by searching the
        // words of the reason.
        function refusalOf(err) {
          var data = err && err.data;
          if (data && typeof data === 'object' && typeof data.code === 'string')
            return { code: data.code, sensitive: data.sensitive === true };
          var m = String((err && err.message) || '');
          var hit =
            /(?:^|refused: )(expired|not_found|forbidden|unavailable|bad_uri): (.*)$/.exec(
              m,
            );
          if (!hit) return { code: '', sensitive: false };
          return {
            code: hit[1],
            sensitive:
              hit[1] === 'forbidden' &&
              /^this result holds sensitive data/.test(hit[2]),
          };
        }
        function refusal(err) {
          var r = refusalOf(err);
          state.sensitive = false;
          if (r.code === 'expired')
            return 'This result has expired — ask again in the chat.';
          if (r.code === 'not_found')
            return 'This result is no longer kept — ask again in the chat.';
          if (r.code === 'unavailable')
            return 'Connect couldn’t confirm your access right now — try again in a moment.';
          if (r.code === 'forbidden') {
            if (r.sensitive) {
              state.sensitive = true;
              return 'This result holds sensitive data, which stays in Labs. Open the query on the Data page to see it there.';
            }
            return 'This result is not yours to see: only the person it was run for, and people who could run the same query themselves, can read it.';
          }
          return (
            'Could not read the result: ' + String((err && err.message) || '')
          );
        }
        function read(page) {
          if (!state.uri || !state.initialized) return;
          if (!state.canRead) {
            showSample();
            return;
          }
          state.loading = true;
          render();
          var uri =
            state.uri + '?page=' + (page || 1) + '&page_size=' + state.pageSize;
          // Sorted by Labs over the whole result, before the page is cut.
          var cols = state.result && state.result.columns;
          if (state.sort.server && state.sort.col >= 0 && cols)
            uri +=
              '&sort=' +
              encodeURIComponent(cols[state.sort.col]) +
              '&dir=' +
              (state.sort.dir > 0 ? 'asc' : 'desc');
          request('resources/read', { uri: uri }).then(
            function (res) {
              state.loading = false;
              var c = ((res && res.contents) || [])[0];
              var body = null;
              try {
                body =
                  c && typeof c.text === 'string' ? JSON.parse(c.text) : null;
              } catch (e) {
                body = null;
              }
              if (!body) {
                state.error = 'The result could not be read.';
                render();
                return;
              }
              var meta = (c._meta && c._meta[META_KEY]) || {};
              var first = !state.result;
              state.result = body;
              state.paging = hasRows(body)
                ? {
                    page: meta.page || 1,
                    pages: meta.pages || 1,
                    page_size: meta.page_size || state.pageSize,
                    row_count:
                      meta.row_count != null
                        ? meta.row_count
                        : body.rows.length,
                  }
                : null;
              state.error = '';
              if (first || state.x === null) pickAxes();
              // No resources/subscribe: Labs never changes a kept result and never sends
              // "it changed" (add one here when it does).
              render();
            },
            function (err) {
              state.loading = false;
              var code = refusalOf(err).code;
              // The full result is gone, but the tool result carried a sample of it:
              // show that, and say plainly that it is only a sample.
              if (
                (code === 'expired' || code === 'not_found') &&
                !state.result &&
                sampleOf(state.facts)
              ) {
                state.expired = true;
                showSample();
                return;
              }
              state.error = refusal(err);
              state.expired = code === 'expired' || code === 'not_found';
              render();
            },
          );
        }
        // A host that cannot read resources still gets the facts' sample (an ordinary
        // conversation passes the tool result on).
        function sampleOf(f) {
          return (
            f &&
            Array.isArray(f.columns) &&
            (Array.isArray(f.rows) || Array.isArray(f.sample_rows))
          );
        }
        function showSample() {
          var f = state.facts;
          if (!f || !Array.isArray(f.columns)) {
            state.error =
              'This host cannot read the result back. Ask again in the chat.';
            render();
            return;
          }
          var rows = Array.isArray(f.rows)
            ? f.rows
            : (f.sample_rows || []).map(function (r) {
                return f.columns.map(function (c) {

          },
          'notifications/resources/updated': function (params) {
            var uri = String((params && params.uri) || '').split('?')[0];
            if (uri && uri === state.uri)
              read(state.paging ? state.paging.page : 1);
          },
          'ui/notifications/host-context-changed': function (params) {
            applyHostContext(params);
          },
        };

        request('ui/initialize', {
          protocolVersion: PROTOCOL_VERSION,
          appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
          clientInfo: { name: 'labs-data-result', version: '2.0.0' },
        }).then(
          function (result) {
            result = result || {};
            applyHostContext(result.hostContext || {});
            var caps = result.hostCapabilities || {};
            state.canRead = !!caps.serverResources;
            notify('ui/notifications/initialized', {});
            state.initialized = true;
            // A link that arrived before the host answered is read now.
            if (state.uri && !state.result && !state.error) read(1);
            else render();
          },
          function (err) {
            document.getElementById('app').innerHTML =
              '<div class="sub err">Could not start: ' +
              esc(err.message) +
              '</div>';
          },
        );
      })();
    </script>
  </body>
</html>
