# Synthetic clone cohort: the 11 production KMC opportunities -> one labs-only
# "KMC (Synthetic)" program.
#
# This is a CLONE cohort spec (distinct from the synthetic_env_ensure templates in
# ../envs/, which seed workflows into opps that already exist). It is consumed by the
# two-phase clone via the connect_labs MCP tools:
#
#   1. synthetic_clone_profile(spec_yaml = <this file's contents>)
#        Phase 1 (reads the real opps server-side, writes aggregate bundles to GDrive).
#        Returns the spec with bundle_root resolved to gdrive:<folder_id>.
#   2. synthetic_clone_generate(spec_yaml = <the returned spec>)
#        Phase 2 (offline) — builds the labs-only opps, each with a NEW id (>= 10000)
#        stamped cloned_from = <source id>; never reuses source ids.
#
# program_id is omitted -> auto-allocated on first generate. bundle_root "gdrive:" ->
# Phase 1 creates a Drive run folder and resolves it. (See docs/synthetic-kmc-clone-runbook.md)
# The KMC demo programme: its 12 opportunities (10122-10133), the KMC registry,
# the programme / partner / worker reports and the Coach demo all read it. Pinned
# so a refresh regenerates THESE opportunities in place (a source's clone in this
# program is the one rewritten), keeping their ids, so every report and link
# keeps working. The older copy, 10011, is no longer refreshed by this spec.
program_id: 10121
program_name: 'KMC (Synthetic) Oct 2026'
org_name: 'Dimagi-KMC (Synthetic)'
bundle_root: 'gdrive:'
# Curate Phase-1 profiling for analytics signal (floor flag rates + degenerate clinical
# categoricals, per-opp varied) — the real KMC opps are ~100% approved with ~0 recorded
# danger signs, which leaves those dimensions with no variance for Scout's modeling.
# Numeric bounds + text fabrication apply regardless of this flag. See issue #670.
curate: true
# Modelled case timelines: each worker keeps its caseload, and each child's growth,
# visit spacing and outcome are drawn from models of the source's children, so the
# weight-vs-age growth curve reproduces without any real child's series being copied.
case_timelines: true
# 2166 (PIPN) was in the LLO map from the start but never in the clone list, so
# the programme had eleven synthetic sites for twelve real ones (Jon, 2026-09-10).
# Invented names for each clone's cases (Phase 2, generator/fixtures/person_names.py):
# the mother's name and the baby's, written at the KMC app's own questions,
# deterministic per case id so a regenerated clone keeps them. Never a real name --
# the profiler refuses identifier paths, so without this a clone has none and every
# case reads "Beneficiary 694". Locale by the source's country (and Kano for EHA).
person_names:
  paths:
    mother: [form.mothers_details.mother_name]
    child: [form.child_details.child_name]
    sex: [form.child_details.child_gender, form.case.update.child_gender]
  locale_by_source:
    1236: ng_hausa # EHA, Kano
    1790: ng # BERI
    523: ug # NAMA
    938: ug
    1488: ug
    524: ug # PIPN
    874: ug
    1487: ug
    2166: ug
    675: ke # GHI
    1234: ke
    1739: ke # Kikapu
opportunity_ids:
  [523, 524, 675, 874, 938, 1234, 1236, 1487, 1488, 1739, 1790, 2166]
# Phase-2 image behaviour. Applied at replay time, never baked into a bundle:
# a bundle is a MEASUREMENT of the real opp, and the real opp says nothing about
# which photo corpus we want or which demo cases to stage.
#
# probability 0.0 => the cohort's own visits get NO photos. Only the showcase
# cases below carry images, which is what makes them findable rather than four
# needles in ~38k visits.
image_config:
  corpus: kmc-scale
  measurement_field_match: weight
  # These are the generator's dot paths. The AUDIT names the same fields WITHOUT
  # the `form.` prefix and with slashes, because extract_images_with_question_ids
  # unwraps form_json["form"] before building the id, and data_access matches
  # image_path by exact equality. So an audit over this data is configured with:
  #   image_path       anthropometric/upload_weight_image
  #   comparison_field anthropometric/child_weight_visit
  # A `form/` prefix silently yields an audit with no images and no error.
  # Pinned by tests/test_showcase_audit_paths.py.
  question_path: form.anthropometric.upload_weight_image
  reading_path: form.anthropometric.child_weight_visit
  probability: 0.0
  good_image_count: 83
  bad_image_count: 10
  # The photo cases end on each opportunity's last day of data, so after every
  # regeneration they are as recent as the data and a report on the latest data
  # finds each one in its coaching situation. Unset, they sat in the first month.
  showcase_last_visit_on: end
  showcase:
    # One case per coaching situation the Coach button starts from (the KMC
    # registry's case states). The clean ones are on flw_001, so a demo opens that
    # worker and finds them with a photo at every weighing; the one with a wrong
    # number sits with flw_007, the photo audit's suspect worker, because a wrong
    # number on flw_001 would leave the audit no all-clean worker to show. Each replays one REAL
    # infant's series from the corpus; what the coaching story turns on beyond
    # the weights (skin-to-skin hours, a danger sign, a wrong number) is declared
    # here at the app's own paths, not left to the template case it clones.
    # Series chosen for steps under 45 g/kg/day, the programme's ceiling for a
    # believable weekly gain (normal_03/04/07 exceed it and would read as a
    # weighing to check on their own).
    #
    # Growing well (case_state_thriving): gains 27-30 g/kg/day every week.
    - name: 'KMC Demo — Steady Gain'
      trajectory: normal_02
      flw: flw_001
      outcome: pass
      answers:
        0:
          {
            form.kmc_24-hour_recall.total_kmc_hours: 16,
            form.kmc_24-hour_recall.kmc_hours: 16,
          }
        1:
          {
            form.kmc_24-hour_recall.total_kmc_hours: 17,
            form.kmc_24-hour_recall.kmc_hours: 17,
          }
        2:
          {
            form.kmc_24-hour_recall.total_kmc_hours: 18,
            form.kmc_24-hour_recall.kmc_hours: 18,
          }
        3:
          {
            form.kmc_24-hour_recall.total_kmc_hours: 18,
            form.kmc_24-hour_recall.kmc_hours: 18,
          }
    # Weight stalled, skin-to-skin falling (case_state_faltering): +70 g over two
    # weeks and a fall on the last visit, while skin-to-skin goes 14 -> 12 -> 9 h.
    - name: 'KMC Demo — Faltering Growth'
      trajectory: slow_03
      flw: flw_001
      outcome: pass
      answers:
        0:
          {
            form.kmc_24-hour_recall.total_kmc_hours: 14,
            form.kmc_24-hour_recall.kmc_hours: 14,
          }
        1:
          {
            form.kmc_24-hour_recall.total_kmc_hours: 12,
            form.kmc_24-hour_recall.kmc_hours: 12,
          }
        2:
          {
            form.kmc_24-hour_recall.total_kmc_hours: 9,
            form.kmc_24-hour_recall.kmc_hours: 9,
          }
    # A weighing to check (case_state_weight_check): a steady grower whose LAST
    # weight was entered wrong -- an impossible jump next to the others, while
    # the photo shows the true reading.
    - name: 'KMC Demo — Weighing to Check'
      trajectory: normal_08
      flw: flw_007
      outcome: fail_number
      outcome_at: [-1]
    # Danger sign, not referred (case_state_danger_unreferred): severe chest
    # indrawing recorded at the last visit, referral answered no.
    - name: 'KMC Demo — Danger Sign Not Referred'
      trajectory: normal_01
      flw: flw_001
      outcome: pass
      answers:
        -1:
          form.danger_signs_checklist.danger_sign_positive: 'yes'
          form.danger_signs_checklist.chest_indraw_grp.Severe_chest_indrawing: 'yes'
          form.danger_signs_checklist.child_referred: 'no'
    # The photo-audit stories, on their own worker: a wrong NUMBER on a readable
    # photo at every weighing (payment integrity) vs an unusable PHOTO.
    - name: 'KMC Demo — Transcription Error'
      trajectory: normal_05
      flw: flw_007
      outcome: fail_number
    - name: 'KMC Demo — Unusable Photo'
      trajectory: slow_10
      flw: flw_007
      outcome: fail_photo
