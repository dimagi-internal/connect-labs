# Nutrition Demo — Central Cluster (opp 10011, NM Bakary Diallo)
#
# The "bad MUAC distributions" NM (Jon's brief: NM2 has two bad-looking MUAC
# distributions). Eight FLWs screen cleanly; two — kadi_c and lola_c — screen
# almost no malnourished children (cherry-picked near-health-post households), so
# their MUAC distributions trip sam_low/mam_low and they're flagged + audited.
# Central reads BELOW on the PAR aggregate. Modeled on par-northern's hawa_n arc.

opportunity_id: 10011
opportunity_name: Central Cluster
random_seed: 100110

timeline:
  start_date: 2026-05-04
  end_date: 2026-06-01
  weeks: 4
  visit_cadence_per_week_per_flw: { mean: 17, stddev: 3 }

flw_personas:
  - id: bakary_nm
    display_name: Bakary Diallo
    archetype: steady
    accuracy_distribution: { mean: 0.97, stddev: 0.0 }
    completeness_distribution: { mean: 0.99, stddev: 0.0 }
    flag_rate: 0.0
    notes: Central Cluster network manager (first-persona stand-in for flag/task attribution).

  # Eight solid FLWs.
  - id: mina_c
    display_name: Mina Conteh
    archetype: steady
    accuracy_distribution: { mean: 0.93, stddev: 0.02 }
    completeness_distribution: { mean: 0.95, stddev: 0.02 }
    flag_rate: 0.0
  - id: nadia_c
    display_name: Nadia Ojo
    archetype: rockstar
    accuracy_distribution: { mean: 0.95, stddev: 0.02 }
    completeness_distribution: { mean: 0.97, stddev: 0.02 }
    flag_rate: 0.0
  - id: oma_c
    display_name: Oma Asante
    archetype: steady
    accuracy_distribution: { mean: 0.92, stddev: 0.02 }
    completeness_distribution: { mean: 0.94, stddev: 0.02 }
    flag_rate: 0.0
  - id: pita_c
    display_name: Pita Turay
    archetype: steady
    accuracy_distribution: { mean: 0.93, stddev: 0.02 }
    completeness_distribution: { mean: 0.95, stddev: 0.02 }
    flag_rate: 0.0
  - id: rania_c
    display_name: Rania Adebayo
    archetype: rockstar
    accuracy_distribution: { mean: 0.96, stddev: 0.02 }
    completeness_distribution: { mean: 0.97, stddev: 0.02 }
    flag_rate: 0.0
  - id: safi_c
    display_name: Safi Kamara
    archetype: steady
    accuracy_distribution: { mean: 0.93, stddev: 0.02 }
    completeness_distribution: { mean: 0.95, stddev: 0.02 }
    flag_rate: 0.0
  - id: tania_c
    display_name: Tania Bello
    archetype: steady
    accuracy_distribution: { mean: 0.94, stddev: 0.02 }
    completeness_distribution: { mean: 0.96, stddev: 0.02 }
    flag_rate: 0.0
  - id: uba_c
    display_name: Uba Sani
    archetype: steady
    accuracy_distribution: { mean: 0.93, stddev: 0.02 }
    completeness_distribution: { mean: 0.95, stddev: 0.02 }
    flag_rate: 0.0

  # --- kadi_c: bad MUAC distribution flagged wk index 1, coached to a clean
  #     close (improver_closed_satisfactory). ---
  - id: kadi_c
    display_name: Kadi Fofana
    archetype: struggling
    accuracy_distribution: { mean: 0.81, stddev: 0.03 }
    completeness_distribution: { mean: 0.90, stddev: 0.02 }
    flag_rate: 0.4
    improvement_arc: { intervention_week: 3, post_intervention_lift: 0.12 }
    notes: Flagged wk1 for a bad MUAC distribution (near-health-post screening); coached + resolved.

  # --- lola_c: bad MUAC distribution flagged wk index 2, investigation STILL
  #     OPEN (the "incomplete" drill target). ---
  - id: lola_c
    display_name: Lola Kargbo
    archetype: struggling
    accuracy_distribution: { mean: 0.78, stddev: 0.03 }
    completeness_distribution: { mean: 0.87, stddev: 0.02 }
    flag_rate: 0.5
    notes: Flagged wk2 for a bad MUAC distribution (far compounds unreached); coaching still in progress (open task).

beneficiary_cohorts:
  - id: under5_screened
    size: 200
    field_distributions:
      'form.service_delivery.muac_group.soliciter_muac':
        { distribution: normal, mean: 13.3, stddev: 0.9 }
      'form.additional_case_info.childs_gender':
        { distribution: binary, rate: 0.5 }
    progression: improvement_curve

anomalies:
  # kadi_c: bad MUAC distribution, completed week index 1, audited.
  - id: kadi_muac_wk1
    type: field_outlier
    flw_ids: [kadi_c]
    field_path: form.service_delivery.muac_group.soliciter_muac
    week: 1
    detection_path: form.service_delivery.muac_group.soliciter_muac
    reviewer_visible_in: [audit]
  # lola_c: bad MUAC distribution, completed week index 2, audited.
  - id: lola_muac_wk2
    type: field_outlier
    flw_ids: [lola_c]
    field_path: form.service_delivery.muac_group.soliciter_muac
    week: 2
    detection_path: form.service_delivery.muac_group.soliciter_muac
    reviewer_visible_in: [audit]

kpi_config:
  - kpi: sam_rate
    field_path: form.service_delivery.muac_group.soliciter_muac
    aggregation: validated_rate
    threshold_underperform: 0.01
    threshold_target: 0.02
  - kpi: gender_balance
    field_path: form.additional_case_info.childs_gender
    aggregation: non_null_rate
    threshold_underperform: 0.40
    threshold_target: 0.50

coaching_arcs:
  # kadi_c — bad MUAC distribution, coached to a clean close. wk index 1
  # (week_triggered 2), follow_up_outcome_week set -> closed_satisfactory "good".
  - flw_id: kadi_c
    week_triggered: 2
    persona: coaching_resolved_clean__bad_muac_distribution
    target_behavior: Bad MUAC distribution
    follow_up_outcome_week: 3
    transcript:
      - role: bot
        text: "Hi {flw_name}, your supervisor flagged this week's screening numbers — almost none of the children you measured screened as malnourished, which is unusual for your area. Can we talk through which households you visited?"
        ts: 2026-05-12T09:02:00
      - role: flw
        text: 'Mostly the compounds near the health post — they are the quickest to reach and I can do more visits in a day.'
        ts: 2026-05-12T09:18:00
      - role: bot
        text: "That explains the pattern. The families closest to the health post tend to be better off — the children most at risk are usually in the farther households. Could you plan next week's route to include the outer settlements?"
        ts: 2026-05-12T09:21:00
      - role: flw
        text: 'Yes, I can do the far side on Tuesday and Wednesday when I have more time for the walk.'
        ts: 2026-05-12T09:29:00
      - role: bot
        text: "Checking back in — this week's screening profile looks much more like the area's expected picture, including two referrals that got children into treatment. That's exactly the change we hoped for."
        ts: 2026-05-19T08:40:00
      - role: flw
        text: 'The route plan helped. The far households take longer but those visits matter more.'
        ts: 2026-05-19T08:52:00
      - role: bot
        text: 'Agreed. Closing this task as resolved — keep that route rotation going, {flw_name}.'
        ts: 2026-05-19T09:01:00

  # lola_c — bad MUAC distribution, investigation STILL OPEN. wk index 2
  # (week_triggered 3). No follow_up_outcome_week -> investigating "incomplete".
  - flw_id: lola_c
    week_triggered: 3
    persona: coaching_in_progress__bad_muac_distribution
    target_behavior: Incomplete household screening coverage
    transcript:
      - role: bot
        text: "Hi {flw_name}, your supervisor asked me to follow up on this week's review. Your screening numbers came in much lower than expected — almost no children flagged as malnourished, which is unusual for your area. Can you walk me through which households you reached this week?"
        ts: 2026-05-19T10:02:00
      - role: flw
        text: 'Mostly the ones along the main road. The rains made the paths to the far compounds difficult.'
        ts: 2026-05-19T10:21:00
      - role: bot
        text: "That's understandable — but the far compounds are where most of the at-risk children live. Were any of the far households reachable on foot, even if it takes longer?"
        ts: 2026-05-19T10:24:00
      - role: flw
        text: 'Some of them, yes. I can try the dry path on the school side and see which ones I can reach.'
        ts: 2026-05-19T10:33:00
      - role: bot
        text: 'Please do — map out which of the far households you can reach this week and reply here. Once I have your list, your supervisor and I will decide whether the remaining ones need a re-visit plan.'
        ts: 2026-05-19T10:36:00

image_config:
  question_path: form.service_delivery.muac_group.muac_display_group_1.muac_photo
  good_image_count: 15
  bad_image_count: 10
  default_bad_rate: 0.0
  probability: 0.9
  flw_bad_rates:
    kadi_c: 0.4
    lola_c: 0.5
