# Nutrition Demo — Northern Cluster (opp 10010, NM Amara Nwosu)
#
# The "on top of things" NM: all ten FLWs screen cleanly, no flags → the PAR
# aggregate reads SOP MET. Modeled on par-northern.yaml but with NO improver/
# flagged FLWs (Jon's brief: NM1 looks good for all FLWs).

opportunity_id: 10010
opportunity_name: Northern Cluster
random_seed: 100100

timeline:
  start_date: 2026-05-04
  end_date: 2026-06-01
  weeks: 4
  visit_cadence_per_week_per_flw: { mean: 18, stddev: 3 }

flw_personas:
  # Network manager FIRST (flag/task attribution stand-in; not a field worker).
  - id: amara_nm
    display_name: Amara Nwosu
    archetype: steady
    accuracy_distribution: { mean: 0.97, stddev: 0.0 }
    completeness_distribution: { mean: 0.99, stddev: 0.0 }
    flag_rate: 0.0
    notes: Northern Cluster network manager (first-persona stand-in for flag/task attribution).

  # Ten solid FLWs — high accuracy, no flags.
  - id: amina_n
