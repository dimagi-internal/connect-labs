# Nutrition Demo — Eastern Cluster (opp 10012, NM Chidi Eze)
#
# The "bad audit images the AI review flags" NM (Jon's brief: NM3 has two bad-
# looking images in the audit that are detected by the AI review). Eight FLWs
# screen cleanly; two submit misleading MUAC photos (tape on a finger / on cloth)
# that the AI image reviewer flags:
#   - vida_e: repeat offender, misleading photos wks 0 + 2, suspended (completed;
#     the drill-through target).
#   - uche_e: misleading photos on the CURRENT (in-progress) week — the LIVE
#     manager-flow FLW the manager audits on camera (ensurers skip her; the
#     recorder creates her audit live).
# Eastern reads BELOW on the PAR aggregate. Modeled on par-southern's rina_s +
# par-northern's jumoke_n (the live-current-week FLW).

opportunity_id: 10012
opportunity_name: Eastern Cluster
random_seed: 100120

timeline:
  start_date: 2026-05-04
  end_date: 2026-06-01
  weeks: 4
  visit_cadence_per_week_per_flw: { mean: 16, stddev: 3 }

flw_personas:
  - id: chidi_nm
    display_name: Chidi Eze
    archetype: steady
    accuracy_distribution: { mean: 0.97, stddev: 0.0 }
    completeness_distribution: { mean: 0.99, stddev: 0.0 }
    flag_rate: 0.0
    notes: Eastern Cluster network manager (first-persona stand-in for flag/task attribution).

  # Eight solid FLWs.
  - id: wale_e
    display_name: Wale Achterberg
    archetype: steady
    accuracy_distribution: { mean: 0.93, stddev: 0.02 }
    completeness_distribution: { mean: 0.95, stddev: 0.02 }
    flag_rate: 0.0
  - id: xola_e
    display_name: Xola Ibrahim
    archetype: rockstar
    accuracy_distribution: { mean: 0.95, stddev: 0.02 }
    completeness_distribution: { mean: 0.97, stddev: 0.02 }
    flag_rate: 0.0
  - id: yara_e
    display_name: Yara Asante
    archetype: steady
    accuracy_distribution: { mean: 0.92, stddev: 0.02 }
    completeness_distribution: { mean: 0.94, stddev: 0.02 }
    flag_rate: 0.0
  - id: zina_e
    display_name: Zina Turay
    archetype: steady
    accuracy_distribution: { mean: 0.93, stddev: 0.02 }
    completeness_distribution: { mean: 0.95, stddev: 0.02 }
    flag_rate: 0.0
  - id: abena_e
    display_name: Abena Adebayo
    archetype: rockstar
    accuracy_distribution: { mean: 0.96, stddev: 0.02 }
    completeness_distribution: { mean: 0.97, stddev: 0.02 }
    flag_rate: 0.0
  - id: bisi_e
    display_name: Bisi Conteh
    archetype: steady
    accuracy_distribution: { mean: 0.93, stddev: 0.02 }
    completeness_distribution: { mean: 0.95, stddev: 0.02 }
    flag_rate: 0.0
  - id: cira_e
    display_name: Cira Mensah
    archetype: steady
    accuracy_distribution: { mean: 0.94, stddev: 0.02 }
    completeness_distribution: { mean: 0.96, stddev: 0.02 }
    flag_rate: 0.0
  - id: dede_e
    display_name: Dede Owusu
    archetype: steady
    accuracy_distribution: { mean: 0.93, stddev: 0.02 }
    completeness_distribution: { mean: 0.95, stddev: 0.02 }
    flag_rate: 0.0

  # --- vida_e: suspended_fraudulent — misleading photos flagged wks 0 then 2. ---
  - id: vida_e
    display_name: Vida Kargbo
    archetype: struggling
    accuracy_distribution: { mean: 0.55, stddev: 0.04 }
    completeness_distribution: { mean: 0.78, stddev: 0.03 }
    flag_rate: 0.8
    notes: Suspected fraud — misleading MUAC photos wk0 (warning) then wk2 (suspension).

  # --- uche_e: the LIVE manager-flow FLW. Misleading photos on the CURRENT week
  #     (index 4, outside the completed window). Ensurers skip it; the recorder
  #     creates her audit + coaching live (improver_warned, bad images). ---
  - id: uche_e
    display_name: Uche Fofana
    archetype: struggling
    accuracy_distribution: { mean: 0.62, stddev: 0.04 }
    completeness_distribution: { mean: 0.80, stddev: 0.03 }
    flag_rate: 0.6
    notes: Live manager-flow FLW — misleading photos flagged on the current (in-progress) week; audit created on camera.

beneficiary_cohorts:
  - id: under5_screened
    size: 200
    field_distributions:
      'form.service_delivery.muac_group.soliciter_muac':
        { distribution: normal, mean: 13.2, stddev: 0.9 }
      'form.additional_case_info.childs_gender':
        { distribution: binary, rate: 0.5 }
    progression: improvement_curve

anomalies:
  # vida_e: misleading photos (fraud), completed weeks 0 + 2, audited (repeat).
  - id: vida_misleading_repeat
    type: duplicate_submission
    flw_ids: [vida_e]
    field_path: form.service_delivery.muac_group.muac_display_group_1.muac_photo
    weeks: [0, 2]
    detection_path: form.service_delivery.muac_group.muac_display_group_1.muac_photo
    reviewer_visible_in: [audit]
  # uche_e: misleading photos on the CURRENT week (index 4). Outside the completed
  # window — ensurers skip it; the live manager flow films it.
  - id: uche_misleading_current
    type: duplicate_submission
    flw_ids: [uche_e]
    field_path: form.service_delivery.muac_group.muac_display_group_1.muac_photo
    week: 4
    detection_path: form.service_delivery.muac_group.muac_display_group_1.muac_photo
    reviewer_visible_in: [audit]

kpi_config:
  - kpi: sam_rate
    field_path: form.service_delivery.muac_group.soliciter_muac
    aggregation: validated_rate
    threshold_underperform: 0.01
    threshold_target: 0.02
  - kpi: gender_balance
    field_path: form.additional_case_info.childs_gender
    aggregation: non_null_rate
    threshold_underperform: 0.40
    threshold_target: 0.50

coaching_arcs:
  # vida_e — fraud, suspension. Second flag wk index 2 (week_triggered 3).
  # Closed as suspended (follow_up_outcome_week set).
  - flw_id: vida_e
    week_triggered: 3
    persona: coaching_repeat_offense_fraud_suspension
    target_behavior: Misleading MUAC photos (suspected fraud)
    follow_up_outcome_week: 4
    # AI-flagged photo fraud -> a SUSPENSION close (not a clean resolution): seeds a
    # closed_suspended_fraud task (red "closed · suspended" pill) + a
    # completed_fail_misleading audit (5/5 failed photos), and flips Eastern's PAR
    # aggregate to BELOW even though every week ran.
    follow_up_outcome_action: suspended
    transcript:
      - role: bot
        text: 'Hi {flw_name}. We need to discuss the audit findings on your recent visits. The reviewers flagged a serious concern.'
        ts: 2026-05-19T13:00:00
      - role: flw
        text: 'Okay, what did they find?'
        ts: 2026-05-19T13:13:00
      - role: bot
        text: "Multiple photos this week appear to show the MUAC tape on objects that don't look like a child's arm — the reviewer noted the tape was visibly on a finger in one image and on a piece of cloth in another. Combined with your warning two weeks ago, this is a pattern we can't continue with."
        ts: 2026-05-19T13:16:00
      - role: flw
        text: 'I... had trouble reaching some of the households this week.'
        ts: 2026-05-19T13:24:00
      - role: bot
        text: "I hear you. Reaching every household is hard, but submitting photos that aren't real measurements is a line we can't move on. Real children with SAM get missed when measurements aren't taken."
        ts: 2026-05-19T13:27:00
      - role: flw
        text: 'I understand. What now?'
        ts: 2026-05-19T13:35:00
      - role: bot
        text: "Suspension from the active roster, effective immediately. Your supervisor will reach out about next steps. There's a path back through retraining and a probationary period — but the audit team needs to be confident this won't recur before you'd resume visits."
        ts: 2026-05-19T13:38:00
      - role: flw
        text: 'I understand.'
        ts: 2026-05-19T13:46:00
      - role: bot
        text: "Closing this task as 'suspended'. I know this is hard news — your supervisor will follow up tomorrow."
        ts: 2026-05-26T08:50:00

image_config:
  question_path: form.service_delivery.muac_group.muac_display_group_1.muac_photo
  good_image_count: 15
  bad_image_count: 10
  default_bad_rate: 0.0
  probability: 0.9
  flw_bad_rates:
    vida_e: 1.0
    uche_e: 0.7
