name: Regenerate Confluence Summaries

on:
  workflow_dispatch:

# Least-privilege token: this job only reads the repo and calls out to
# Confluence/Anthropic with their own secrets — it never needs a writable
# GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Regenerate all Confluence summary pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
        run: python automation/regenerate_confluence.py
