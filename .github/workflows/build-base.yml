name: Build Base Image

on:
  push:
    branches: [main]
    paths:
      - 'requirements/*.txt'
      - 'requirements/*.in'
      - 'Dockerfile.base'
      - 'docker/*'

  workflow_dispatch:
    inputs:
      mirror_only:
        description: 'Copy the CURRENT ECR base-latest to GHCR (same digest) without rebuilding'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: labs-jj-commcare-connect
  ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-base:
    name: Build & Push Base Image
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write # the GHCR copy of the image

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Compute requirements hash
        id: req-hash
        run: |
          HASH=$(cat requirements/base.txt | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Publishes the GHCR copy resolve-base-images looks for, without a rebuild:
      # the digest stays the same, so every image already built on it still
      # matches the deploy's foundations check. Also the way out when a rebuild
      # is blocked (public.ecr.aws 429s anonymous pulls from GitHub runners).
      - name: Copy base-latest to GHCR without rebuilding
        if: inputs.mirror_only
        run: |
          set -euo pipefail
          SRC="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:base-latest"
          DIGEST=$(docker buildx imagetools inspect "$SRC" --format '{{json .Manifest}}' | jq -r .digest)
          HASH_TAG=$(aws ecr describe-images --repository-name "${{ env.ECR_REPOSITORY }}" \
                       --image-ids imageDigest="$DIGEST" --query 'imageDetails[0].imageTags' --output json \
                     | jq -r '[.[] | select(startswith("base-") and . != "base-latest")][0] // empty')
          TAGS=(--tag ghcr.io/dimagi-internal/connect-labs-base:base-latest)
          [ -n "$HASH_TAG" ] && TAGS+=(--tag "ghcr.io/dimagi-internal/connect-labs-base:$HASH_TAG")
          docker buildx imagetools create "${TAGS[@]}" "$SRC"
          GOT=$(docker buildx imagetools inspect ghcr.io/dimagi-internal/connect-labs-base:base-latest --format '{{json .Manifest}}' | jq -r .digest)
          echo "ECR $DIGEST -> GHCR $GOT"
          [ "$GOT" = "$DIGEST" ]

      - name: Set up Docker Buildx
        if: ${{ !inputs.mirror_only }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Also published to GHCR (same build, so the same digest): app builds run on
      # GitHub-hosted runners and pull these as FROM images, and pulling them from
      # ECR is AWS internet egress (~1.5 TB/month, Oct 2026). Pulls from GHCR are
      # free. ECR stays the source of truth resolve-base-images reads digests from.
      - name: Build and push base image
        if: ${{ !inputs.mirror_only }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.base
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:base-latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:base-${{ steps.req-hash.outputs.hash }}
            ghcr.io/dimagi-internal/connect-labs-base:base-latest
            ghcr.io/dimagi-internal/connect-labs-base:base-${{ steps.req-hash.outputs.hash }}
          # Cache in GitHub's cache, not ECR: a registry cache read from a
          # GitHub-hosted runner is pulled out of AWS on every build.
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max
