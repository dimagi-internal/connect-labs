name: Run Labs management command

# Runs a one-off Django management command on the deployed Labs environment as a
# Fargate task (same mechanism the deploy workflow uses for migrations). Use it for
# data loads and admin commands that must run with prod's secrets/DB — e.g.
#   load_geopode_from_drive --iso NGA
#   clear_cache
# The task uses the CURRENTLY REGISTERED web task definition, so it runs the code +
# secrets that are live in prod. Output goes to the web service's CloudWatch log group.
#
# OUTPUT NEVER LANDS IN THIS LOG IN PLAINTEXT. An Actions log is readable by every
# reader of the repo for ~90 days, and a command run against prod's DB prints
# whatever it reads (audit rows, FLW usernames, visit values, tracebacks echoing
# them). So:
#   * with `recipient` (a base64 raw X25519 public key the dispatcher made for this
#     run and holds the private half of in memory -- hal's bin/hal-labs-prod-read
#     does this), the command runs under `manage.py run_sealed` and only the sealed
#     envelope is printed here; the plaintext is in neither this log nor CloudWatch.
#   * without it, the command runs as before and this log carries only its exit
#     code and the size of what it printed. Read the output itself in CloudWatch
#     (the stream is named below) with AWS access, or re-run with a recipient.
#
# AWS auth is the GitHub OIDC role (secrets.AWS_ROLE_ARN); no local creds needed.
#
# SECURITY: the `guard` job gates only the REF (must be main) — it does NOT gate
# the command string, which is a free-text dispatch input run verbatim as
# `python manage.py <input>` against prod's DB and secrets. Anyone who can
# dispatch this workflow therefore has prod-code-execution-equivalent access
# (e.g. `shell -c ...`, `dumpdata`). This is intentional operator tooling, but
# do not mistake the main-guard for a command allowlist. A required-reviewer
# GitHub Environment gate is tracked in the security-audit issue.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'manage.py command + args (without "python manage.py"), e.g. "load_geopode_from_drive --iso NGA"'
        type: string
        required: true
      recipient:
        description: 'Optional base64 raw X25519 public key. When set, output is printed here only sealed to it (manage.py run_sealed). Without it, output is NOT printed here (CloudWatch only).'
        type: string
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: labs-jj-cluster
  ECS_WEB_SERVICE: labs-jj-web

jobs:
  guard:
    name: Guard — branch must be main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse runs from non-main refs
        run: |
          ref="${GITHUB_REF:-}"
          echo "triggered on ref=$ref"
          if [ "$ref" != "refs/heads/main" ]; then
            echo "::error::Only runnable from main. Got: $ref"
            exit 1
          fi

  run-command:
    name: Run management command
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ONE SOURCE OF TRUTH for the task network: the SERVICE's own configuration.
      #
      # These run-task calls exist to run the same container in the same place as
      # the web service, so reading the network config off that service is not a
      # convenience — it is the definition. The literals this replaces had already
      # drifted: they pinned ONE subnet while the service spans two, so every
      # migration, drift-check and one-off management command has been running in
      # a single AZ. That is invisible until that AZ is the one having a bad day,
      # and then it fails at the least convenient moment. The same value was
      # hardcoded in four places (twice in deploy-labs.yml, once in
      # run-labs-command.yml, once as a CloudFormation parameter default in
      # infra/labs-audit-analytics.yml) and three of them had no way to learn that
      # the fourth had changed.
      #
      # DELIBERATELY NOT A GITHUB SECRET, and this is the part worth keeping.
      # Subnet, security-group and VPC IDs are IDENTIFIERS, not credentials —
      # inert without an IAM principal, which is why AWS puts them in console URLs
      # and does not treat an account ID as sensitive. Filing them as secrets buys
      # no protection and costs real debuggability, because GitHub MASKS secret
      # values in logs: every --network-configuration line this workflow prints
      # would render as '***', and the drift described above — the actual bug —
      # becomes undiagnosable from a run log. Non-secret shared config belongs in
      # env:/vars:, or better, is read from the infrastructure itself, which is
      # what this step does.
      #
      # Credentials still go in secrets: AWS_ROLE_ARN above, and every runtime
      # secret stays a Secrets Manager ARN reference in the task definitions,
      # never a value.
      #
      # --output text on a list is TAB-separated, hence the tr. No embedded
      # python: an unindented heredoc body inside a `run: |` block scalar is a
      # YAML syntax error, and the parse failure names a line number nowhere near
      # the cause.
      - name: Read task network config from the web service
        id: netcfg
        run: |
          NET_QUERY='services[0].networkConfiguration.awsvpcConfiguration'
          SUBNETS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_WEB_SERVICE }} \
            --query "$NET_QUERY.subnets" --output text | tr '\t' ',')
          SGS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_WEB_SERVICE }} \
            --query "$NET_QUERY.securityGroups" --output text | tr '\t' ',')
          PUBIP=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_WEB_SERVICE }} \
            --query "$NET_QUERY.assignPublicIp" --output text)
          if [ -z "$SUBNETS" ] || [ "$SUBNETS" = "None" ] \
             || [ -z "$SGS" ] || [ "$SGS" = "None" ]; then
            echo "::error::Could not read the web service's awsvpc network configuration."
            echo "::error::run-task cannot be placed without it; refusing to guess."
            exit 1
          fi
          [ -n "$PUBIP" ] && [ "$PUBIP" != "None" ] || PUBIP=ENABLED
          CFG="awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=$PUBIP}"
          echo "Task network: $CFG"
          echo "net_config=$CFG" >> "$GITHUB_OUTPUT"

      - name: Run command as a one-off Fargate task
        env:
          MGMT_CMD: ${{ github.event.inputs.command }}
          RECIPIENT: ${{ github.event.inputs.recipient }}
        run: |
          # Build the container command array safely from the input (via env, not
          # shell interpolation, so args can't break out of the JSON / shell).
          # With a recipient the command is wrapped in run_sealed, so the task's
          # own stdout -- and therefore CloudWatch and this log -- holds only
          # ciphertext.
          if [ -n "$RECIPIENT" ] && ! printf '%s' "$RECIPIENT" | grep -Eq '^[A-Za-z0-9+/]{43}=$'; then
            echo "::error::recipient must be a base64 raw X25519 public key (44 chars)"
            exit 1
          fi
          OVERRIDES=$(python3 -c "
          import json, os, shlex
          cmd = shlex.split(os.environ['MGMT_CMD'])
          r = os.environ.get('RECIPIENT', '')
          wrap = ['run_sealed', '--recipient', r, '--'] if r else []
          print(json.dumps({'containerOverrides': [{'name': 'web', 'command': ['python', 'manage.py'] + wrap + cmd}]}))
          ")
          # Name the command, not its arguments: a snippet or an --email arg is
          # the dispatcher's business, not every repo reader's.
          CMD_NAME=$(python3 -c "import os,shlex; a=shlex.split(os.environ['MGMT_CMD']); print(f'{a[0]} ({len(a)-1} args)' if a else '(empty)')")
          if [ -n "$RECIPIENT" ]; then MODE=sealed; else MODE=masked; fi
          echo "Command: $CMD_NAME | output mode: $MODE"

          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_WEB_SERVICE }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "${{ steps.netcfg.outputs.net_config }}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)
          echo "Task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Exit code: $EXIT_CODE | stoppedReason: $REASON"

          # Read the task's OWN stream, not a time filter over the whole group:
          # /ecs/labs-jj-web is shared with the live web service. The awslogs
          # driver names one stream per task, "<prefix>/<container>/<task-id>",
          # and both halves are read off the task definition rather than assumed.
          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[?name==`web`].logConfiguration.options | [0]' \
            --output json)
          LOG_GROUP=$(printf '%s' "$LOG_OPTS" | python3 -c "import sys,json; print(json.load(sys.stdin)['awslogs-group'])")
          LOG_PREFIX=$(printf '%s' "$LOG_OPTS" | python3 -c "import sys,json; print(json.load(sys.stdin)['awslogs-stream-prefix'])")
          LOG_STREAM="$LOG_PREFIX/web/$TASK_ID"

          # Fetch the stream to a file on the runner (never echoed), paging
          # until the forward token stops moving. Retry: CloudWatch ingestion
          # lags task stop by a few seconds. Errors are NOT silenced -- a missing
          # logs:GetLogEvents grant must not look like a command that printed
          # nothing.
          OUT_FILE="$RUNNER_TEMP/task-output.txt"
          : > "$OUT_FILE"
          for _ in 1 2 3 4 5 6 7 8; do
            if LOG_GROUP="$LOG_GROUP" LOG_STREAM="$LOG_STREAM" OUT_FILE="$OUT_FILE" python3 -c "
          import json, os, subprocess
          args = ['aws', 'logs', 'get-log-events', '--log-group-name', os.environ['LOG_GROUP'],
                  '--log-stream-name', os.environ['LOG_STREAM'], '--start-from-head', '--output', 'json']
          token, lines = None, []
          while True:
              page = json.loads(subprocess.run(args + (['--next-token', token] if token else []),
                                               check=True, capture_output=True, text=True).stdout)
              lines += [e['message'] for e in page.get('events', [])]
              nxt = page.get('nextForwardToken')
              if not page.get('events') or nxt == token:
                  break
              token = nxt
          open(os.environ['OUT_FILE'], 'w').write('\n'.join(lines))
          "; then
              [ -s "$OUT_FILE" ] && break
            else
              echo "::warning::could not read $LOG_STREAM; retrying"
            fi
            sleep 8
          done

          BYTES=$(wc -c < "$OUT_FILE" | tr -d ' ')
          LINES=$(wc -l < "$OUT_FILE" | tr -d ' ')
          echo "----- command output ($LOG_GROUP : $LOG_STREAM) -----"
          if [ "$MODE" = sealed ]; then
            # Print ONLY the envelope. Anything else in the stream (Django log
            # records on stderr) stays in CloudWatch.
            if grep -q '__SEALED_OUTPUT_BEGIN__' "$OUT_FILE"; then
              sed -n '/__SEALED_OUTPUT_BEGIN__ v/,/__SEALED_OUTPUT_END__/p' "$OUT_FILE"
            else
              echo "(no sealed envelope in the task's output: $LINES lines, $BYTES bytes, not shown;"
              echo " the task likely failed before run_sealed ran -- e.g. the deployed image predates it)"
            fi
          else
            echo "(output not shown: $LINES lines, $BYTES bytes. It is in CloudWatch at the stream above;"
            echo " re-run with a 'recipient' public key to receive it sealed here.)"
          fi
          echo "-------------------------------------------------------------------"
          rm -f "$OUT_FILE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Command failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Command completed successfully"
