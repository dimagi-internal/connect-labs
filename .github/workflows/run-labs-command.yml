name: Run Labs management command

# Runs a one-off Django management command on the deployed Labs environment as a
# Fargate task (same mechanism the deploy workflow uses for migrations). Use it for
# data loads and admin commands that must run with prod's secrets/DB — e.g.
#   load_geopode_from_drive --iso NGA
#   clear_cache
# The task uses the CURRENTLY REGISTERED web task definition, so it runs the code +
# secrets that are live in prod. Output goes to the web service's CloudWatch log group.
#
# AWS auth is the GitHub OIDC role (secrets.AWS_ROLE_ARN); no local creds needed.
#
# SECURITY: the `guard` job gates only the REF (must be main) — it does NOT gate
# the command string, which is a free-text dispatch input run verbatim as
# `python manage.py <input>` against prod's DB and secrets. Anyone who can
# dispatch this workflow therefore has prod-code-execution-equivalent access
# (e.g. `shell -c ...`, `dumpdata`). This is intentional operator tooling, but
# do not mistake the main-guard for a command allowlist. A required-reviewer
# GitHub Environment gate is tracked in the security-audit issue.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'manage.py command + args (without "python manage.py"), e.g. "load_geopode_from_drive --iso NGA"'
        type: string
        required: true

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: labs-jj-cluster
  ECS_WEB_SERVICE: labs-jj-web

jobs:
  guard:
    name: Guard — branch must be main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse runs from non-main refs
        run: |
          ref="${GITHUB_REF:-}"
          echo "triggered on ref=$ref"
          if [ "$ref" != "refs/heads/main" ]; then
            echo "::error::Only runnable from main. Got: $ref"
            exit 1
          fi

  run-command:
    name: Run management command
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run command as a one-off Fargate task
        env:
          MGMT_CMD: ${{ github.event.inputs.command }}
        run: |
          # Build the container command array safely from the input (via env, not
          # shell interpolation, so args can't break out of the JSON / shell).
          OVERRIDES=$(python3 -c "import json,os,shlex; print(json.dumps({'containerOverrides':[{'name':'web','command':['python','manage.py']+shlex.split(os.environ['MGMT_CMD'])}]}))")
          echo "Overrides: $OVERRIDES"

          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_WEB_SERVICE }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-06646effb09be2f42],securityGroups=[sg-0666a5ed512c97d9d],assignPublicIp=ENABLED}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)
          echo "Task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Exit code: $EXIT_CODE | stoppedReason: $REASON"

          # Tail the task's stdout/stderr into the Actions log so command OUTPUT is
          # visible here. Read the task's OWN stream, not a time filter over the
          # whole group: /ecs/labs-jj-web is shared with the live web service, so
          # a group-wide filter buries the command's output in request logs and
          # pages through a very large result set. The awslogs driver names one
          # stream per task, "<awslogs-stream-prefix>/<container>/<task-id>", and
          # both halves are read off the task definition rather than assumed.
          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[?name==`web`].logConfiguration.options | [0]' \
            --output json)
          LOG_GROUP=$(printf '%s' "$LOG_OPTS" | python3 -c "import sys,json; print(json.load(sys.stdin)['awslogs-group'])")
          LOG_PREFIX=$(printf '%s' "$LOG_OPTS" | python3 -c "import sys,json; print(json.load(sys.stdin)['awslogs-stream-prefix'])")
          LOG_STREAM="$LOG_PREFIX/web/$TASK_ID"

          echo "----- command output ($LOG_GROUP : $LOG_STREAM) -----"
          # Retry: CloudWatch ingestion lags task stop by a few seconds.
          #
          # Errors are deliberately NOT silenced. This block used to end in
          # "2>/dev/null || true", which made a MISSING logs:GetLogEvents grant
          # look identical to a command that simply printed nothing — the role
          # had no logs:* permission at all, so every run of this workflow
          # reported "(no log events found)" and the actual output (including
          # tracebacks from failed commands) was never visible here.
          OUT=""
          for i in 1 2 3 4 5 6 7 8; do
            OUT=$(aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$LOG_STREAM" \
              --start-from-head \
              --query 'events[*].message' --output text) || {
                echo "::warning::could not read $LOG_STREAM (see error above); retrying"
                OUT=""
              }
            [ -n "$OUT" ] && break
            sleep 8
          done
          echo "${OUT:-(no log events found in $LOG_STREAM)}"
          echo "-------------------------------------------------------------------"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Command failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Command completed successfully"
