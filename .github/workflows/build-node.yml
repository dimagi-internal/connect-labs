name: Build Node Image

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'webpack/**'
      - 'components/**'
      - 'lib/**'
      - 'tailwind/**'
      - 'tsconfig.json'
      - 'connect_labs/static/js/**'
      - 'connect_labs/static/css/**'
      - 'connect_labs/static/campaign/**'
      - 'connect_labs/templates/**'
      - 'Dockerfile.node'

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: labs-jj-commcare-connect
  ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-node:
    name: Build & Push Node Image
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write # the GHCR copy of the image

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Compute frontend files hash
        id: fe-hash
        run: |
          HASH=$(find package.json package-lock.json webpack/ components/ lib/ tailwind/ tsconfig.json \
            connect_labs/static/js/ connect_labs/static/css/ connect_labs/templates/ \
            connect_labs/static/campaign/ \
            -type f 2>/dev/null | sort | xargs cat | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Also published to GHCR (same build, so the same digest): app builds run on
      # GitHub-hosted runners and pull these as FROM images, and pulling them from
      # ECR is AWS internet egress (~1.5 TB/month, Oct 2026). Pulls from GHCR are
      # free. ECR stays the source of truth resolve-base-images reads digests from.
      - name: Build and push node image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.node
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:node-latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:node-${{ steps.fe-hash.outputs.hash }}
            ghcr.io/dimagi-internal/connect-labs-node:node-latest
            ghcr.io/dimagi-internal/connect-labs-node:node-${{ steps.fe-hash.outputs.hash }}
          # Cache in GitHub's cache, not ECR: a registry cache read from a
          # GitHub-hosted runner is pulled out of AWS on every build.
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max
