name: CI

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

# Least-privilege GITHUB_TOKEN. CI only reads the repo (checkout, lint, tests);
# it never writes contents, comments, or checks. Without this block the token
# inherits the repo/org default (often read-write), and the linter/pytest jobs
# run PR-branch code (pre-commit hooks, pip installs) — no reason to hand that a
# writable token.
permissions:
  contents: read

# No paths-ignore: the linter/pytest jobs are required status checks on main
# (branch ruleset), and a path-filtered workflow never reports its checks on a
# docs-only PR — which would leave that PR permanently unmergeable. Running CI
# on docs changes costs a few runner-minutes; a stuck PR costs more.
on:
  pull_request:
    branches: ['main']

  push:
    branches: ['main']

  # REQUIRED BY THE MERGE QUEUE, and it must land BEFORE the queue is switched
  # on. GitHub runs the required checks against the QUEUED MERGE RESULT — this
  # PR rebased onto the queue head — which arrives as a `merge_group` event on a
  # `gh-readonly-queue/...` ref, not as a `pull_request` on the branch. Without
  # this trigger `linter` and `pytest` never report for a queued entry, every
  # entry sits until `check_response_timeout_minutes` expires, and NOTHING in
  # the repository can merge. Enabling the queue first also deadlocks the fix:
  # the PR that adds this line would itself be stuck in the queue.
  merge_group:

concurrency:
  # `head_ref` is empty for `merge_group` (and for `push`), so the group falls
  # back to the unique `run_id` and a queued build is never cancelled by a
  # sibling. That is the behaviour the queue needs — a cancelled required check
  # is a check that never reports — and it is why this expression is left alone
  # rather than being "simplified" to a bare `github.ref`, which WOULD collide
  # across queue entries.
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Run pre-commit directly (instead of pre-commit/action@v3.0.0, which pins the
      # deprecated actions/cache@v3 → Node 20 warning) with a current cache action.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  # The KMC render is a JSX template string transpiled by Babel IN THE BROWSER, so
  # no Python test can execute it -- which is how a duplicated 87-line block reached
  # main, and why every edit to it has been validated by opening the dashboard.
  # These checks are cheap and catch the whole class: a file that does not parse and
  # a name that does not resolve.
  #
  # Deliberately NOT `npm test`: context_picker.test.mjs has been failing on main
  # ("workflow shows opps only (pathFilters)") and nothing ran it, so turning the
  # whole suite on here would block every PR on an unrelated pre-existing failure.
  # Widen this once that is green.
  render-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Just the parser, not the project's dependency tree. `npm ci` cannot run
      # here: package-lock.json is already out of sync with package.json on main
      # ("Missing: jiti@2.7.0 from lock file"), which predates this job and is not
      # this job's to fix. Installing the one package the check imports keeps the
      # check honest and independent of that.
      - name: Install the JSX parser
        run: npm install --no-save --no-audit --no-fund @babel/core@^7 @babel/preset-react@^7

      - name: Check the workflow render templates
        run: node --test connect_labs/workflow/templates/__tests__/kmc_render.test.mjs

  pytest:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
      postgres:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      CELERY_BROKER_URL: 'redis://localhost:6379/0'
      REDIS_URL: 'redis://localhost:6379/0'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
      # Deliberately fake: pydantic-ai agent construction requires the var to
      # exist (funder_dashboard agent tests), but unit tests must never be able
      # to reach the real API — a test that actually calls Anthropic should
      # fail loudly here, not silently spend money.
      ANTHROPIC_API_KEY: 'sk-ant-ci-dummy-key-not-real'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install Geo Dependencies
        # --no-install-recommends: Django reaches libgdal/libgeos through ctypes, so
        # the recommended extras (docs, python bindings) are downloaded and unpacked
        # for nothing on every run. Hard dependencies are still installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gdal-bin \
            libproj-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          # The real requirement files, not requirements-dev.txt — that is a
          # three-line wrapper that just includes these two and has never changed,
          # so hashing it produced a cache key frozen at whatever the first run
          # downloaded. The key could not invalidate when a dependency changed, and
          # equally could not pick up a newly added one.
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      # The pip cache above only saves the DOWNLOAD; the install still ran in full
      # every time (~70s). Cache the built environment itself, keyed on the same
      # content, so an unchanged dependency set is restored instead of rebuilt. A
      # venv's scripts hard-code absolute paths, which is fine here because the
      # workspace path is identical on every runner.
      - name: Cache the installed environment
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt') }}

      - name: Install Dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Run tests
        # Whole test tree, not a hand-maintained app list — the old explicit list
        # silently skipped campaign, mcp, pages, funder_dashboard, and others as
        # they were added. No -x: report every failure, not just the first.
        #
        # -n auto spreads the suite over the runner's cores. pytest-django gives each
        # worker its own database (test_postgres_gwN), which is what makes this safe
        # for a suite that talks to Postgres in almost every test — and is also why
        # it removes a class of order-dependent failure rather than adding one.
        run: |
          .venv/bin/pytest connect_labs/ -n auto
