name: CI

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

# Least-privilege GITHUB_TOKEN. CI only reads the repo (checkout, lint, tests);
# it never writes contents, comments, or checks. Without this block the token
# inherits the repo/org default (often read-write), and the linter/pytest jobs
# run PR-branch code (pre-commit hooks, pip installs) — no reason to hand that a
# writable token.
permissions:
  contents: read

# No paths-ignore: the linter/pytest jobs are required status checks on main
# (branch ruleset), and a path-filtered workflow never reports its checks on a
# docs-only PR — which would leave that PR permanently unmergeable. Running CI
# on docs changes costs a few runner-minutes; a stuck PR costs more.
on:
  pull_request:
    branches: ['main']

  push:
    branches: ['main']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Run pre-commit directly (instead of pre-commit/action@v3.0.0, which pins the
      # deprecated actions/cache@v3 → Node 20 warning) with a current cache action.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  pytest:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
      postgres:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      CELERY_BROKER_URL: 'redis://localhost:6379/0'
      REDIS_URL: 'redis://localhost:6379/0'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
      # Deliberately fake: pydantic-ai agent construction requires the var to
      # exist (funder_dashboard agent tests), but unit tests must never be able
      # to reach the real API — a test that actually calls Anthropic should
      # fail loudly here, not silently spend money.
      ANTHROPIC_API_KEY: 'sk-ant-ci-dummy-key-not-real'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Install Geo Dependencies
        # --no-install-recommends: Django reaches libgdal/libgeos through ctypes, so
        # the recommended extras (docs, python bindings) are downloaded and unpacked
        # for nothing on every run. Hard dependencies are still installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gdal-bin \
            libproj-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          # The real requirement files, not requirements-dev.txt — that is a
          # three-line wrapper that just includes these two and has never changed,
          # so hashing it produced a cache key frozen at whatever the first run
          # downloaded. The key could not invalidate when a dependency changed, and
          # equally could not pick up a newly added one.
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      # The pip cache above only saves the DOWNLOAD; the install still ran in full
      # every time (~70s). Cache the built environment itself, keyed on the same
      # content, so an unchanged dependency set is restored instead of rebuilt. A
      # venv's scripts hard-code absolute paths, which is fine here because the
      # workspace path is identical on every runner.
      - name: Cache the installed environment
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt') }}

      - name: Install Dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Run tests
        # Whole test tree, not a hand-maintained app list — the old explicit list
        # silently skipped campaign, mcp, pages, funder_dashboard, and others as
        # they were added. No -x: report every failure, not just the first.
        #
        # -n auto spreads the suite over the runner's cores. pytest-django gives each
        # worker its own database (test_postgres_gwN), which is what makes this safe
        # for a suite that talks to Postgres in almost every test — and is also why
        # it removes a class of order-dependent failure rather than adding one.
        run: |
          .venv/bin/pytest connect_labs/ -n auto
