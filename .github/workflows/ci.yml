name: CI

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

# Least-privilege GITHUB_TOKEN. CI only reads the repo (checkout, lint, tests);
# it never writes contents, comments, or checks. Without this block the token
# inherits the repo/org default (often read-write), and the linter/pytest jobs
# run PR-branch code (pre-commit hooks, pip installs) — no reason to hand that a
# writable token.
permissions:
  contents: read

# No paths-ignore: the linter/pytest jobs are required status checks on main
# (branch ruleset), and a path-filtered workflow never reports its checks on a
# docs-only PR — which would leave that PR permanently unmergeable. Running CI
# on docs changes costs a few runner-minutes; a stuck PR costs more.
on:
  pull_request:
    branches: ['main']

  # THE FULL SUITE RUNS ON EVERY PUSH TO MAIN, AFTER THE FACT. This is the
  # trade made on 2026-09-10 when the merge queue was switched off: a green PR
  # merges the moment its own checks pass, against whatever main is by then,
  # and the commit that actually landed is tested HERE, asynchronously, with
  # nobody waiting on it. The queue's re-run of the same suite against the
  # queued merge result was a median 4.3 minutes of every merge's wall-clock
  # (measured over the 30 merges before the switch), spent almost always
  # confirming that two independently green PRs were also green together.
  # When they are not, this run goes red within ~3 minutes of the merge and
  # the fix is a forward commit -- the accepted cost, in exchange for those
  # minutes back on every one of the ~100 merges a week.
  #
  # Two things this run also does that nothing else would:
  # - It is the only run that writes this workflow's caches under `main`, the
  #   one scope every PR run can restore from. A PR run's caches live on
  #   `refs/pull/N/merge` and are invisible to the next PR. Measured 2026-09-10
  #   after a spell with no push run: zero venv / geo-deb / JSX caches on main
  #   and every pytest job paying the full 60-70s install the caches exist to
  #   skip.
  # - It catches main going red from something outside the repo (a moved
  #   dependency, an expired fixture), which a PR run would attribute to the PR.
  push:
    branches: ['main']

  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily, against whatever main is by then

  # Kept although the merge queue is OFF (2026-09-10): the trigger is inert
  # without a queue, and it must already be here on the day someone switches
  # the queue back on. GitHub runs the required checks against the QUEUED
  # MERGE RESULT, which arrives as a `merge_group` event on a
  # `gh-readonly-queue/...` ref, not as a `pull_request`. Without this trigger
  # `linter` and `pytest` never report for a queued entry, every entry sits
  # until `check_response_timeout_minutes` expires, NOTHING can merge -- and
  # the PR that adds the line back is itself stuck in the queue.
  merge_group:

concurrency:
  # `head_ref` is empty for `merge_group` (and for `schedule` and `push`), so the group
  # falls back to the unique `run_id` and a queued build is never cancelled by a
  # sibling. That is the behaviour the queue needs — a cancelled required check
  # is a check that never reports — and it is why this expression is left alone
  # rather than being "simplified" to a bare `github.ref`, which WOULD collide
  # across queue entries.
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: py
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Run pre-commit directly (instead of pre-commit/action@v3.0.0, which pins the
      # deprecated actions/cache@v3 → Node 20 warning) with a current cache action.
      #
      # The key carries the runner OS and the RESOLVED interpreter version, for
      # the same reason the pytest venv key does: pre-commit builds each hook's
      # environment against the exact python it ran under, and marks an
      # environment unhealthy (and rebuilds it) when that interpreter is gone.
      # Keyed on the config hash alone, this cache was saved once on 2026-07-24
      # and never again -- actions/cache only saves on a miss -- so by September
      # every run "hit" a 42MB entry built for a python the runner no longer
      # ships, printed "[INFO] Installing environment" for six of the eight
      # repos, and threw the rebuilt environments away at the end of the job.
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  # The KMC render is a JSX template string transpiled by Babel IN THE BROWSER, so
  # no Python test can execute it -- which is how a duplicated 87-line block reached
  # main, and why every edit to it has been validated by opening the dashboard.
  # These checks are cheap and catch the whole class: a file that does not parse and
  # a name that does not resolve.
  #
  # Deliberately NOT `npm test`: context_picker.test.mjs has been failing on main
  # ("workflow shows opps only (pathFilters)") and nothing ran it, so turning the
  # whole suite on here would block every PR on an unrelated pre-existing failure.
  # Widen this once that is green.
  render-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Just the parser, not the project's dependency tree. `npm ci` cannot run
      # here: package-lock.json is already out of sync with package.json on main
      # ("Missing: jiti@2.7.0 from lock file"), which predates this job and is not
      # this job's to fix. Installing the one package the check imports keeps the
      # check honest and independent of that.
      # 20s of this 30s job was re-downloading the same two packages.
      - name: Cache the JSX parser
        uses: actions/cache@v4
        with:
          path: node_modules
          key: jsx-parser-${{ runner.os }}-node20-babel7-v1

      - name: Install the JSX parser
        run: |
          if [ ! -d node_modules/@babel/preset-react ]; then
            npm install --no-save --no-audit --no-fund @babel/core@^7 @babel/preset-react@^7
          fi

      - name: Check the workflow render templates
        run: node --test connect_labs/workflow/templates/__tests__/kmc_render.test.mjs

  # Build the deployable image WHILE the tests run, so the deploy that follows
  # the merge finds it already in ECR and skips its own ~100s build (the build
  # was ~25% of a 7-minute deploy; the rest is the ECS rollout, which nothing
  # here can shorten).
  #
  # ADDRESSED BY TREE HASH, not commit SHA. A pull_request run checks out the
  # PR's merge commit (refs/pull/N/merge); its commit SHA is a throwaway nobody
  # deploys, but its TREE is byte-for-byte what a squash-merge of this PR
  # produces on main -- provided main has not moved since. So the image is
  # pushed as `:tree-<tree hash>`, and the deploy looks up main's own tree
  # hash: a hit means "the tree on main is exactly what CI built and tested",
  # and a miss (main moved, so the merge produced a tree nobody built) means
  # the deploy builds it, as it always did. With the merge queue on, the same
  # job runs on merge_group and the tree hit is guaranteed; the `:<sha>` tag
  # is pushed too in that case, for the same lookup by SHA.
  #
  # Same-repo PRs only: the OIDC deploy role is not handed to a fork's code
  # (and id-token is unavailable to fork PRs regardless).
  #
  # Not a required check, on purpose: if this fails the PR still merges and the
  # deploy builds the image itself. The deploy also refuses to reuse an image
  # whose recorded base/node digests differ from the current base-latest /
  # node-latest (see the labels in build-app-image), so an image built here
  # just before a requirements or frontend change landed cannot ship stale.
  build-image:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read # gh run list/watch in resolve-base-images
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: labs-jj-commcare-connect
      ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve the base and node images
        id: bases
        uses: ./.github/actions/resolve-base-images
        with:
          github-token: ${{ github.token }}
          registry: ${{ env.ECR_REGISTRY }}
          repository: ${{ env.ECR_REPOSITORY }}

      - name: Compute the tree hash this image will be addressed by
        id: tree
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "HEAD $(git rev-parse HEAD) has tree $TREE"
          IMG="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
          TAGS="$IMG:tree-$TREE"
          # On a merge_group run the SHA is the one that lands on main; tag it too.
          if [ "${{ github.event_name }}" = merge_group ]; then
            TAGS="$TAGS"$'\n'"$IMG:${{ github.sha }}"
          fi
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build and push the image for this tree
        uses: ./.github/actions/build-app-image
        with:
          registry: ${{ env.ECR_REGISTRY }}
          repository: ${{ env.ECR_REPOSITORY }}
          tags: ${{ steps.tree.outputs.tags }}
          base_image: ${{ steps.bases.outputs.base_image }}
          node_image: ${{ steps.bases.outputs.node_image }}
          base_digest: ${{ steps.bases.outputs.base_digest }}
          node_digest: ${{ steps.bases.outputs.node_digest }}
          app_release: ${{ github.sha }}

  pytest:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
      postgres:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      CELERY_BROKER_URL: 'redis://localhost:6379/0'
      REDIS_URL: 'redis://localhost:6379/0'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
      # Deliberately fake: pydantic-ai agent construction requires the var to
      # exist (funder_dashboard agent tests), but unit tests must never be able
      # to reach the real API — a test that actually calls Anthropic should
      # fail loudly here, not silently spend money.
      ANTHROPIC_API_KEY: 'sk-ant-ci-dummy-key-not-real'
      # Migrate once into a template database and clone it per xdist worker
      # rather than migrating four times. Opt-in, and deliberately opt-in HERE
      # and not by default: it trades wall clock for total work, and it wins
      # only on a loaded machine. This runner is the loaded case -- four shared
      # vCPUs, Postgres in a container, four pytest workers. See
      # connect_labs/testing/db_template.py.
      LABS_TEST_DB_TEMPLATE: '1'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      # ~18s of every run went on `apt-get update` plus a download of the same
      # three packages. Cache the .debs and unpack them instead.
      - name: Cache the geo packages
        uses: actions/cache@v4
        with:
          path: /tmp/geo-debs
          # Bump the version suffix to force a refetch; the runner image's own
          # base libraries move under us occasionally.
          key: geo-debs-${{ runner.os }}-v1

      - name: Install Geo Dependencies
        # --no-install-recommends: Django reaches libgdal/libgeos through ctypes, so
        # the recommended extras (docs, python bindings) are downloaded and unpacked
        # for nothing on every run. Hard dependencies are still installed.
        #
        # A stale cache must never be able to fail this step or, worse, leave a
        # half-installed GDAL that fails later inside pytest with an error about
        # settings. `dpkg -i` is attempted first and ANY problem falls straight
        # through to the plain apt path, which is exactly what this used to do.
        # The import check at the end is the actual contract -- it is what a
        # partial install would break, and it is cheap.
        run: |
          set -u
          install_from_apt() {
            # Only Ubuntu's own archive is needed here. The runner image also
            # carries third-party lists (Chrome, Edge, ...) and a hash-sum
            # mismatch on ANY of them fails `apt-get update` outright -- twice on
            # one PR from dl.google.com alone (#1664). They are not ours to
            # depend on, so they are dropped before the update, which also retries.
            sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' \
              /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
            sudo apt-get update -o Acquire::Retries=3
            # apt refuses to use an archives dir without a `partial` inside it.
            sudo rm -rf /tmp/geo-debs && mkdir -p /tmp/geo-debs/partial
            sudo apt-get install -y --no-install-recommends \
              -o Dir::Cache::archives=/tmp/geo-debs \
              binutils \
              gdal-bin \
              libproj-dev
            sudo chown -R "$USER" /tmp/geo-debs
            rmdir /tmp/geo-debs/partial 2>/dev/null || true
          }

          if compgen -G '/tmp/geo-debs/*.deb' > /dev/null; then
            echo "Restoring geo packages from cache"
            sudo dpkg -i /tmp/geo-debs/*.deb || install_from_apt
          else
            install_from_apt
          fi

          # Prove the shared libraries are actually loadable. Without this a
          # partial restore surfaces 300 lines later as a GDAL error inside
          # pytest, which names neither this step nor the cache.
          python3 -c "
          import ctypes.util, sys
          missing = [n for n in ('gdal', 'geos_c') if ctypes.util.find_library(n) is None]
          sys.exit('geo libraries missing after install: ' + ', '.join(missing) if missing else 0)
          "

      - name: Set up Python
        id: py
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          # The real requirement files, not requirements-dev.txt — that is a
          # three-line wrapper that just includes these two and has never changed,
          # so hashing it produced a cache key frozen at whatever the first run
          # downloaded. The key could not invalidate when a dependency changed, and
          # equally could not pick up a newly added one.
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      # The pip cache above only saves the DOWNLOAD; the install still ran in full
      # every time (~70s). Cache the built environment itself, keyed on the same
      # content, so an unchanged dependency set is restored instead of rebuilt. A
      # venv's scripts hard-code absolute paths, which is fine here because the
      # workspace path is identical on every runner.
      #
      # The key carries the RESOLVED interpreter version, not the '3.11' we
      # asked for. The venv's python is a symlink into the runner's toolcache
      # (/opt/hostedtoolcache/Python/3.11.<patch>/x64), so the day setup-python
      # moves to the next patch release, a cache keyed on '3.11' restores a venv
      # whose interpreter no longer exists -- and every run fails on
      # "No such file or directory" until someone works out that the fix is to
      # bump a cache key.
      - name: Cache the installed environment
        id: venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt') }}

      - name: Install Dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Run tests
        # Whole test tree, not a hand-maintained app list — the old explicit list
        # silently skipped campaign, mcp, pages, funder_dashboard, and others as
        # they were added. No -x: report every failure, not just the first.
        #
        # -n auto spreads the suite over the runner's cores. pytest-django gives each
        # worker its own database (test_postgres_gwN), which is what makes this safe
        # for a suite that talks to Postgres in almost every test — and is also why
        # it removes a class of order-dependent failure rather than adding one.
        run: |
          .venv/bin/pytest connect_labs/ -n auto
