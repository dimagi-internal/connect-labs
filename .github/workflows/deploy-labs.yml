name: Deploy to AWS Labs

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Force database migrations (normally auto-detected from the diff vs the deployed SHA)'
        type: boolean
        required: true
        default: false

# CONCURRENCY LIVES ON THE JOBS, NOT HERE, and the split is the whole point.
#
# HISTORY, because the reasoning has now inverted twice and a stale comment here
# would mislead. This workflow originally did a HARD CUTOVER: stop every running
# task, then force a new deployment. That guaranteed ~10s of downtime on every
# deploy, and two overlapping cutovers could leave 0 healthy tasks behind the ALB
# — a site-wide 503 (observed 2026-07-01: 3 deploys in ~13 min). The response at
# the time was to serialise: one lane, never cancel, queue each cutover behind
# the last.
#
# Then the cutover was replaced by a rolling deploy (see "Deploy services"), and
# the serialisation was dropped with it in favour of one workflow-level group
# with `cancel-in-progress: true` — on the reasoning that when several merges
# land close together only the newest image is worth deploying, so a superseded
# run should stop rather than burn ten minutes shipping stale code.
#
# That reasoning is right about the BUILD and wrong about the ROLLOUT, and the
# single workflow-level group could not tell them apart. Measured over the 27
# cancelled runs to 2026-09-07:
#
#     14  Wait for services to reach steady state   <-- cutover already ISSUED
#      7  Build and push Docker image
#      6  everything else (ECR checks, buildx, setup)
#
# So the majority case was not "stop a wasted build". It was killing the run
# DURING an in-flight ECS rollout — which is precisely the thing the steady-state
# waiter exists to prevent, and its own comment says so: without that block "the
# next queued deploy could start its own cutover on top of an in-flight one — the
# overlap that causes the 503". `cancel-in-progress: true` reintroduced that
# overlap by killing the waiter and releasing the lock early. Two further costs:
# a rollout cancelled at the waiter is never verified (a crash-looping task or a
# circuit-breaker rollback reads as "cancelled — superseded, fine"), and nobody,
# human or agent, can tell from the run whether their code actually shipped. The
# session transcripts show agents doing git-ancestry archaeology to work it out,
# five superseded runs in one session.
#
# Hence two groups, one per phase:
#
#   build   cancel-in-progress: true   — supersede freely. Nothing outside
#                                        GitHub has been touched yet; the only
#                                        loss is runner minutes, which is the
#                                        case the 2026-07 change was right about.
#   release cancel-in-progress: false  — once migrations or an ECS cutover are
#                                        in flight, this run finishes. A newer
#                                        run QUEUES behind it and deploys after.
#
# GitHub keeps at most one pending job per group and cancels an older pending
# one, so "newest wins" still holds — but it is now decided while the superseded
# run is still PENDING and has touched nothing, instead of mid-rollout. Cancelling
# a pending job is free; cancelling a rollout is not. That distinction is the
# entire fix, and collapsing these back into one workflow-level group undoes it.
#
# Ordering is monotonic and does not need a separate lock: two builds share the
# build group, so an older build is cancelled by a newer one and never reaches
# release. A release only ever runs for a build that was the newest at its own
# completion. (The "already live" guard in the release job is a tripwire under
# that argument, not a substitute for it.)

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: labs-jj-cluster
  ECS_WEB_SERVICE: labs-jj-web
  ECS_WORKER_SERVICE: labs-jj-worker
  ECR_REPOSITORY: labs-jj-commcare-connect
  ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com

jobs:
  guard:
    # Hard gate: this workflow only deploys from main. If somebody (human or
    # agent) triggers it on any other branch it fails fast, before pushing an
    # image. The previous behavior — workflow_dispatch on any ref — was easy
    # to misuse: a branch deploy can land code that hasn't been reviewed AND
    # it makes "what is prod running?" ambiguous. main is the canonical
    # source of truth; deploys come from there or not at all.
    #
    # (Legacy note: this repo used to be a fork off commcare-connect, and its
    # canonical deploy branch was 'labs-main'. That label is dead — this is
    # its own repo now and 'main' is the default branch.)
    name: Guard — branch must be main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse deploys from non-main refs
        run: |
          ref="${GITHUB_REF:-}"
          echo "triggered on ref=$ref"
          if [ "$ref" != "refs/heads/main" ]; then
            echo "::error::Deploys are only allowed from main. Got: $ref"
            echo "::error::Land your changes on main first (PR + merge), then re-run this workflow."
            exit 1
          fi
          echo "ref OK — proceeding to deploy"

  # PHASE 1 — build. Cancellable on purpose: nothing here has touched AWS state
  # beyond pushing an image, so a superseded run is pure wasted runner time and
  # stopping it is the right call. Everything that MUTATES the running service
  # lives in `release` below, which is not cancellable.
  build:
    name: Build and push image
    needs: guard
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-labs-build
      cancel-in-progress: true

    permissions:
      id-token: write
      contents: read
      # gh run list/watch in resolve-base-images. Without this the token has
      # no Actions scope, `gh run list` 403s, and the old `2>/dev/null || true`
      # around it read that as "no base build running" — silently.
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Waits for any in-flight Build Base / Build Node Image run (the stale-JS
      # incident, PR #97, lives in the action's comments), then resolves
      # base-latest / node-latest to refs and digests.
      - name: Resolve the base and node images
        id: bases
        uses: ./.github/actions/resolve-base-images
        with:
          github-token: ${{ github.token }}
          registry: ${{ env.ECR_REGISTRY }}
          repository: ${{ env.ECR_REPOSITORY }}

      # ci.yml's `build-image` job builds the image for every same-repo PR run
      # while the tests run, addressed by the TREE hash of the PR's merge commit
      # (`:tree-<hash>`), so by the time a deploy is dispatched the image is
      # usually already here. main's tree after a squash-merge is that same
      # tree exactly when main had not moved between the PR's last CI run and
      # its merge; if it had, the lookup misses and we build, as before. A
      # `:<sha>` tag is tried too, for a merge-queue-built image.
      #
      # Reuse ONLY if the base/node digests the image records in its labels are
      # the ones we would build on right now: an image built a minute before a
      # requirements or frontend change merged carries the OLD foundations, and
      # no diff of paths can see that race. Anything short of a full match
      # falls through to a normal build.
      - name: Reuse the image CI built for this tree, if its foundations match
        id: prebuilt
        env:
          REPO: ${{ env.ECR_REPOSITORY }}
          REGISTRY: ${{ env.ECR_REGISTRY }}
          WANT_BASE: ${{ steps.bases.outputs.base_digest }}
          WANT_NODE: ${{ steps.bases.outputs.node_digest }}
        run: |
          set -euo pipefail
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "main @ ${{ github.sha }} has tree $TREE"
          TAG=""
          for CANDIDATE in "tree-$TREE" "${{ github.sha }}"; do
            if aws ecr describe-images --repository-name "$REPO" \
                 --image-ids imageTag="$CANDIDATE" >/dev/null 2>&1; then
              TAG="$CANDIDATE"; break
            fi
          done
          if [ -z "$TAG" ]; then
            echo "No prebuilt image for tree $TREE or sha ${{ github.sha }} — building here."
            echo "reuse=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          IMAGE="$REGISTRY/$REPO:$TAG"
          echo "Candidate: $IMAGE"
          CONFIG=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>/dev/null || echo '{}')
          read -r HAVE_BASE HAVE_NODE < <(printf '%s' "$CONFIG" | python3 -c '
          import json, sys
          j = json.load(sys.stdin)
          # single-platform: {"config": {...}}; multi-platform: {"<platform>": {"config": {...}}}
          cfg = j.get("config") or next((v.get("config") for v in j.values() if isinstance(v, dict) and "config" in v), {}) or {}
          labels = cfg.get("Labels") or {}
          print(labels.get("labs.base_digest", "?"), labels.get("labs.node_digest", "?"))
          ')
          echo "prebuilt image records base=$HAVE_BASE node=$HAVE_NODE; current base=$WANT_BASE node=$WANT_NODE"
          if [ "$HAVE_BASE" = "$WANT_BASE" ] && [ "$HAVE_NODE" = "$WANT_NODE" ] \
             && [ "$WANT_BASE" != "none" ] && [ "$WANT_NODE" != "none" ]; then
            echo "Foundations match — reusing the CI-built image, skipping the build."
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "Foundations differ or are unrecorded — building here."
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: steps.prebuilt.outputs.reuse != 'true'
        uses: ./.github/actions/build-app-image
        with:
          registry: ${{ env.ECR_REGISTRY }}
          repository: ${{ env.ECR_REPOSITORY }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          base_image: ${{ steps.bases.outputs.base_image }}
          node_image: ${{ steps.bases.outputs.node_image }}
          base_digest: ${{ steps.bases.outputs.base_digest }}
          node_digest: ${{ steps.bases.outputs.node_digest }}
          app_release: ${{ github.sha }}

      # The build tags `:<sha>` and `:latest`; when we reuse, add both tags to
      # the reused manifest ourselves. `:<sha>` is LOAD-BEARING: the task
      # definitions below pin the image to it, so a reused `:tree-…` image
      # without it would register a task definition pointing at nothing.
      # `:latest` keeps meaning "the most recently deployed image". A manifest
      # re-put under a new tag is a metadata write — no pull, no push of layers.
      - name: Tag the reused image as :<sha> and :latest
        if: steps.prebuilt.outputs.reuse == 'true'
        env:
          REPO: ${{ env.ECR_REPOSITORY }}
          SRC_TAG: ${{ steps.prebuilt.outputs.tag }}
        run: |
          set -euo pipefail
          SRC_DIGEST=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$SRC_TAG" \
                         --query 'imageDetails[0].imageDigest' --output text)
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$SRC_TAG" \
                       --query 'images[0].imageManifest' --output text)
          MEDIA_TYPE=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$SRC_TAG" \
                         --query 'images[0].imageManifestMediaType' --output text)
          for TAG in "${{ github.sha }}" latest; do
            HAVE=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" \
                     --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo none)
            if [ "$HAVE" = "$SRC_DIGEST" ]; then
              echo ":$TAG already points at $SRC_DIGEST"; continue
            fi
            aws ecr put-image --repository-name "$REPO" --image-tag "$TAG" \
              --image-manifest "$MANIFEST" --image-manifest-media-type "$MEDIA_TYPE" --output text >/dev/null
            echo ":$TAG -> $SRC_DIGEST"
          done
          # The pinned tag must resolve before the task definitions are registered.
          aws ecr describe-images --repository-name "$REPO" --image-ids imageTag=${{ github.sha }} \
            --query 'imageDetails[0].imageDigest' --output text

  # PHASE 2 — release. NOT cancellable, deliberately. Every step below either
  # writes to the database or moves the running service, and each one has a
  # window in which being killed leaves something half-done that nothing reports:
  #
  #   Run database migrations      the GitHub job dies but the ECS migrate task
  #                                keeps running; a superseding run can then start
  #                                a SECOND concurrent migrate against the same DB
  #   Deploy services              cancel between the web and worker
  #                                `update-service` calls and the two are left on
  #                                different task definitions — new web code, old
  #                                worker, silently
  #   Wait for services to be stable  the rollout is never verified, and the lock
  #                                is released so the next run cuts over on top of
  #                                an in-flight one (14 of 27 cancelled runs)
  #
  # A newer run queues here instead of pre-empting, and deploys once this one is
  # done. The wait is bounded by the steady-state waiter's own ~10 minute cap.
  release:
    name: Migrate and roll out
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-labs-release
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so the migration auto-detect step can diff against the
          # SHA currently deployed (read from the registered task definition).
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # A tripwire, not a mechanism. The build group already guarantees an older
      # run is cancelled before it can reach this job, so this should never fire
      # — but the failure it guards against is a SILENT one (prod quietly moves
      # backwards and every step still reports green), and that class is worth
      # ten lines. Equal SHAs pass: re-deploying the live commit is legitimate.
      - name: Refuse to deploy behind what is already live
        run: |
          SERVICE_TD=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_WEB_SERVICE }} \
            --query 'services[0].taskDefinition' --output text 2>/dev/null) || true
          LIVE=""
          if [ -n "$SERVICE_TD" ] && [ "$SERVICE_TD" != "None" ]; then
            LIVE_IMAGE=$(aws ecs describe-task-definition \
              --task-definition "$SERVICE_TD" \
              --query 'taskDefinition.containerDefinitions[0].image' \
              --output text 2>/dev/null) || true
            LIVE="${LIVE_IMAGE##*:}"
          fi
          if ! echo "$LIVE" | grep -qE '^[0-9a-f]{40}$' || ! git cat-file -e "$LIVE" 2>/dev/null; then
            echo "Live tag '${LIVE:-<none>}' is not a commit we can reason about — skipping the check."
            exit 0
          fi
          if [ "$LIVE" = "$GITHUB_SHA" ]; then
            echo "Re-deploying the live commit ($LIVE) — fine."
          elif git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE"; then
            echo "::error::Production is already running $LIVE, which is AHEAD of this run's $GITHUB_SHA."
            echo "::error::Deploying would move prod backwards. Re-run the workflow on current main."
            exit 1
          else
            echo "This run ($GITHUB_SHA) is ahead of live ($LIVE) — proceeding."
          fi

      # ONE SOURCE OF TRUTH for the task network: the SERVICE's own configuration.
      #
      # These run-task calls exist to run the same container in the same place as
      # the web service, so reading the network config off that service is not a
      # convenience — it is the definition. The literals this replaces had already
      # drifted: they pinned ONE subnet while the service spans two, so every
      # migration, drift-check and one-off management command has been running in
      # a single AZ. That is invisible until that AZ is the one having a bad day,
      # and then it fails at the least convenient moment. The same value was
      # hardcoded in four places (twice in deploy-labs.yml, once in
      # run-labs-command.yml, once as a CloudFormation parameter default in
      # infra/labs-audit-analytics.yml) and three of them had no way to learn that
      # the fourth had changed.
      #
      # DELIBERATELY NOT A GITHUB SECRET, and this is the part worth keeping.
      # Subnet, security-group and VPC IDs are IDENTIFIERS, not credentials —
      # inert without an IAM principal, which is why AWS puts them in console URLs
      # and does not treat an account ID as sensitive. Filing them as secrets buys
      # no protection and costs real debuggability, because GitHub MASKS secret
      # values in logs: every --network-configuration line this workflow prints
      # would render as '***', and the drift described above — the actual bug —
      # becomes undiagnosable from a run log. Non-secret shared config belongs in
      # env:/vars:, or better, is read from the infrastructure itself, which is
      # what this step does.
      #
      # Credentials still go in secrets: AWS_ROLE_ARN above, and every runtime
      # secret stays a Secrets Manager ARN reference in the task definitions,
      # never a value.
      #
      # --output text on a list is TAB-separated, hence the tr. No embedded
      # python: an unindented heredoc body inside a `run: |` block scalar is a
      # YAML syntax error, and the parse failure names a line number nowhere near
      # the cause.
      - name: Read task network config from the web service
        id: netcfg
        run: |
          NET_QUERY='services[0].networkConfiguration.awsvpcConfiguration'
          SUBNETS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_WEB_SERVICE }} \
            --query "$NET_QUERY.subnets" --output text | tr '\t' ',')
          SGS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_WEB_SERVICE }} \
            --query "$NET_QUERY.securityGroups" --output text | tr '\t' ',')
          PUBIP=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_WEB_SERVICE }} \
            --query "$NET_QUERY.assignPublicIp" --output text)
          if [ -z "$SUBNETS" ] || [ "$SUBNETS" = "None" ] \
             || [ -z "$SGS" ] || [ "$SGS" = "None" ]; then
            echo "::error::Could not read the web service's awsvpc network configuration."
            echo "::error::run-task cannot be placed without it; refusing to guess."
            exit 1
          fi
          [ -n "$PUBIP" ] && [ "$PUBIP" != "None" ] || PUBIP=ENABLED
          CFG="awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=$PUBIP}"
          echo "Task network: $CFG"
          echo "net_config=$CFG" >> "$GITHUB_OUTPUT"

      - name: Register task definitions from repo
        id: taskdefs
        run: |
          # The web/worker task definitions are version-controlled in
          # deploy/task-definitions/. Registering them from the repo on every deploy
          # makes the repo the single source of truth: the container command, CPU,
          # env, and roles can no longer silently drift in the AWS console — which is
          # exactly how the MCP broke (docker/start moved to ASGI but the registered
          # command stayed WSGI, and the deploy only reused the in-AWS task def).
          # Secrets stay as Secrets Manager ARN references in the JSON, never values.
          #
          # The image is pinned to the git SHA (not ':latest') at register time:
          # a crash-restarted task then always pulls exactly the code its task
          # def was registered with, even if a newer image has been pushed since,
          # and rollback is just re-registering a previous revision. A GIT_SHA
          # env var is injected alongside so the app can report what it's running
          # (surfaced at /health/).
          PINNED_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          for KIND in web worker; do
            jq --arg img "$PINNED_IMAGE" --arg sha "${{ github.sha }}" '
              .containerDefinitions[0].image = $img
              | .containerDefinitions[0].environment =
                  ([.containerDefinitions[0].environment[]? | select(.name != "GIT_SHA")]
                   + [{"name": "GIT_SHA", "value": $sha}])
            ' "deploy/task-definitions/${KIND}.json" > "/tmp/taskdef-${KIND}.json"
          done
          WEB_TD=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/taskdef-web.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          WORKER_TD=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/taskdef-worker.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered web:    $WEB_TD"
          echo "Registered worker: $WORKER_TD"
          echo "web_td=$WEB_TD" >> "$GITHUB_OUTPUT"
          echo "worker_td=$WORKER_TD" >> "$GITHUB_OUTPUT"

      - name: Decide whether migrations must run
        id: migcheck
        run: |
          # Migrations used to be a human checkbox — which fails exactly when
          # multiple people deploy: dev A merges a migration-bearing PR without
          # deploying, dev B later deploys their own change with the box
          # unchecked, and prod crashes on a missing column. Instead, diff the
          # migrations/ trees between the SHA the web SERVICE is currently
          # running (its task def's image tag — pinned to the git SHA by the
          # register step above) and the SHA being deployed now. Zero cost when
          # nothing changed; automatic when something did. The manual input
          # remains as a force-override only.
          #
          # NB: read the service's task definition, not the latest registered
          # one — the register step above already points that at THIS deploy.
          #
          # This diff is only trustworthy because the release job is serialised.
          # Run concurrently, it samples a service that another run is midway
          # through moving, so "what is deployed" is a moving target and the
          # answer is a skipped migration rather than an error. Queueing behind
          # the previous release means the SHA read here is one that finished.
          if [ "${{ github.event.inputs.run_migrations }}" = "true" ]; then
            echo "Manual override: run_migrations=true"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SERVICE_TD=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_WEB_SERVICE }} \
            --query 'services[0].taskDefinition' --output text 2>/dev/null) || true
          DEPLOYED_IMAGE=""
          if [ -n "$SERVICE_TD" ] && [ "$SERVICE_TD" != "None" ]; then
            DEPLOYED_IMAGE=$(aws ecs describe-task-definition \
              --task-definition "$SERVICE_TD" \
              --query 'taskDefinition.containerDefinitions[0].image' \
              --output text 2>/dev/null) || true
          fi
          DEPLOYED_TAG="${DEPLOYED_IMAGE##*:}"
          echo "Service is running image tag: ${DEPLOYED_TAG:-<none>}"
          if echo "$DEPLOYED_TAG" | grep -qE '^[0-9a-f]{40}$' && git cat-file -e "$DEPLOYED_TAG" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$DEPLOYED_TAG" "$GITHUB_SHA" -- '*/migrations/*.py')
            if [ -n "$CHANGED" ]; then
              echo "Migration files changed since deployed SHA ${DEPLOYED_TAG}:"
              echo "$CHANGED"
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "No migration changes between ${DEPLOYED_TAG} and ${GITHUB_SHA} — skipping migrate."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Tag isn't a known SHA (e.g. ':latest' from before pinning, or an
            # unfetchable commit) — can't prove there's nothing to apply, so
            # run migrate. It's idempotent; a no-op pass costs ~2 minutes once.
            echo "Deployed SHA unknown — running migrate to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # REPORT-ONLY, and built so it cannot become anything else. Django marks a
      # migration applied by NAME, so a row in django_migrations whose file is
      # absent from the repo is a name `migrate` will silently skip -- the deploy
      # still reports success and the table is never created. That is #1264: the
      # audit verdict table did not exist in production for three days across two
      # green deploys, and the page that reads it falls back to an empty index,
      # which renders as "no image was previously audited". A wrong answer, not
      # an error.
      #
      # Runs immediately BEFORE migrate, and under the same condition, so it
      # speaks exactly when a skip is possible and costs nothing on the deploys
      # where no migration is applied.
      #
      # Two independent reasons this can never block a cutover: the step carries
      # continue-on-error, and the script never exits non-zero (the command's own
      # exit code is captured into a variable and reported, never propagated).
      # Flipping it to a gate is a deliberate edit of both, not an accident --
      # and should not happen until it has a track record of being right here.
      # See connect-labs #1267.
      - name: Report migration drift (never blocks)
        if: ${{ steps.migcheck.outputs.run == 'true' }}
        continue-on-error: true
        run: |
          set +e
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition ${{ steps.taskdefs.outputs.web_td }} \
            --launch-type FARGATE \
            --network-configuration "${{ steps.netcfg.outputs.net_config }}" \
            --overrides '{"containerOverrides":[{"name":"web","command":["python","manage.py","check_migration_drift","--skip-checks"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::warning::could not start the drift-check task; skipping the report (the deploy is unaffected)"
            exit 0
          fi
          echo "Drift-check task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN"
          DRIFT_EXIT=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          # Tail the task's OWN stream, not a time filter over the whole group:
          # /ecs/labs-jj-web is shared with the live web service, so a group-wide
          # filter buries this output in request logs.
          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(aws ecs describe-task-definition \
            --task-definition ${{ steps.taskdefs.outputs.web_td }} \
            --query 'taskDefinition.containerDefinitions[?name==`web`].logConfiguration.options | [0]' \
            --output json)
          LOG_GROUP=$(printf '%s' "$LOG_OPTS" | python3 -c "import sys,json; print(json.load(sys.stdin)['awslogs-group'])")
          LOG_PREFIX=$(printf '%s' "$LOG_OPTS" | python3 -c "import sys,json; print(json.load(sys.stdin)['awslogs-stream-prefix'])")
          LOG_STREAM="$LOG_PREFIX/web/$TASK_ID"

          echo "----- migration drift report ($LOG_STREAM) -----"
          OUT=""
          for i in 1 2 3 4 5 6; do
            OUT=$(aws logs get-log-events \
              --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" \
              --start-from-head --query 'events[*].message' --output text)
            [ -n "$OUT" ] && break
            sleep 8
          done
          echo "${OUT:-(no log events found in $LOG_STREAM)}"
          echo "------------------------------------------------"

          # An UNKNOWN command exits non-zero too (a deploy of code predating
          # check_migration_drift), which is why this is a warning about the
          # report rather than a claim about the database.
          if [ "$DRIFT_EXIT" != "0" ]; then
            echo "::warning::check_migration_drift exited $DRIFT_EXIT — read the report above. The deploy is NOT blocked by this."
          else
            echo "No blocking migration drift reported."
          fi
          exit 0

      - name: Run database migrations
        if: ${{ steps.migcheck.outputs.run == 'true' }}
        run: |
          # Run on the task definition registered above so migrations come from
          # the NEW image. (Before SHA-pinning this used the previously
          # registered task def and only picked up new code via the mutable
          # ':latest' tag — pinning would have silently made it migrate with
          # OLD code.)
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition ${{ steps.taskdefs.outputs.web_td }} \
            --launch-type FARGATE \
            --network-configuration "${{ steps.netcfg.outputs.net_config }}" \
            --overrides '{"containerOverrides":[{"name":"web","command":["python","manage.py","migrate_multi","--noinput","--skip-checks"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" == "0" ]; then
            echo "Migrations completed successfully"
          else
            echo "Migrations failed with exit code: $EXIT_CODE"
            echo "Check CloudWatch Logs: https://console.aws.amazon.com/cloudwatch/home?region=${{ env.AWS_REGION }}#logsV2:log-groups/log-group/%2Fecs%2F${{ env.ECS_WEB_SERVICE }}"
            exit 1
          fi

      # Must run BEFORE the rollout, not after — the CPU spike starts the moment
      # ECS begins booting replacement tasks.
      #
      # continue-on-error, and it is NOT belt-and-braces. This step exists to stop
      # a NOTIFICATION, so the worst case if it fails is an alarm email that would
      # have been sent anyway before this feature existed. Letting it gate the
      # rollout trades a real deploy for a cosmetic one, which is strictly the
      # wrong way round.
      #
      # Learned the hard way on the very first live run (34037994076, 2026-09-06):
      # the deploy role had no cloudwatch:PutMetricData, this step exited 254, and
      # the ENTIRE deploy was skipped — "Deploy services" and "Wait for steady
      # state" both `skipped`. Nothing shipped, and the cause was a monitoring
      # nicety. The IAM grant that fixes that lives in infra/labs-monitoring.yml
      # (DeployRolePutDeployMetricPolicy); this line is what makes the class of
      # failure survivable regardless — the next AWS-API-touching step added here
      # should be written the same way unless the deploy genuinely depends on it.
      - name: Open the CPU-alarm suppression window
        continue-on-error: true
        run: |
          # A rolling replacement drives one web task to 100% CPU while it boots
          # Django. labs-jj-web-cpu-high reads Statistic=Maximum across tasks, so
          # that one booting task holds the metric at 100%, and Maximum over a
          # 300s period records the PEAK INSTANT rather than a duration -- so a
          # ~2-minute boot spike fills its entire 5-minute bucket. Three of those
          # in a row are indistinguishable from a 15-minute sustained pin, which
          # is how one 12-minute deploy paged three times on 2026-09-05 and
          # dispatched two agent turns (connect-labs#1461).
          #
          # This publishes a BOUNDED, FORWARD-DATED window of 1-minute datapoints
          # in a single call. labs-jj-deploy-in-progress goes ALARM for the
          # window and suppresses labs-jj-web-cpu-high-actionable; when the
          # datapoints run out it returns to OK by itself.
          #
          # Bounded-and-forward-dated is the whole design. The obvious
          # alternative -- `aws cloudwatch disable-alarm-actions` here and
          # `enable-alarm-actions` at the end -- is silently unsafe in EXACTLY
          # the scenario this addresses: `cancel-in-progress` kills a superseded
          # run mid-rollout, the re-enable never executes, and the CPU alarm is
          # muted forever with nothing to indicate it. A window that expires on
          # its own cannot fail that way. Do not "simplify" this into a
          # disable/enable pair, and do not make it a background loop that has to
          # survive to keep publishing.
          #
          # 14 minutes covers the p100 rollout observed to date (~8 min) with
          # margin for the boot tail. It is deliberately NOT open-ended: an
          # over-long window is a muted alarm by another name.
          #
          # BUT the window is not the suppression DURATION, and if you are tuning
          # this, tune against the measured number rather than this constant.
          # CloudWatch does not return an alarm to OK the instant the datapoints
          # stop; it has to evaluate a period that has none. Measured end-to-end
          # on 2026-09-06: last datapoint 14:30:00Z, labs-jj-deploy-in-progress
          # back to OK at 14:38:16Z — about 8 minutes of evaluation lag, so a
          # 14-minute window suppresses for roughly 22. That is still bounded and
          # still self-clearing, which is the safety property; it just means the
          # real cost per deploy is ~22 minutes of CPU-alarm suppression, and
          # shortening WINDOW_MIN moves that number one-for-one while the lag
          # stays put. Do not shrink it below the rollout duration to claw the lag
          # back — that reopens the window mid-rollout, which is the bug.
          # python3, not a shell loop: building JSON by hand needs `date -u -d @`
          # (GNU-only) and a comma-separator dance whose `[ ... ] && echo` form
          # interacts badly with the `bash -e` these steps run under.
          python3 - <<'PY' > /tmp/deploy-window.json
          import datetime as dt, json
          WINDOW_MIN = 14
          now = dt.datetime.now(dt.timezone.utc).replace(second=0, microsecond=0)
          print(json.dumps([
              {
                  "MetricName": "DeployInProgress",
                  "Value": 1,
                  "Unit": "Count",
                  "Timestamp": (now + dt.timedelta(minutes=i)).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "Dimensions": [{"Name": "ServiceName", "Value": "${{ env.ECS_WEB_SERVICE }}"}],
              }
              # from one minute BEHIND, so a spike that begins between this step
              # and the rollout call is inside the window too
              for i in range(-1, WINDOW_MIN + 1)
          ]))
          PY

          aws cloudwatch put-metric-data \
            --namespace LabsDeploy \
            --metric-data "file:///tmp/deploy-window.json"

          echo "CPU-alarm suppression open for 14 min (expires on its own)."

      - name: Deploy services (rolling, zero downtime)
        run: |
          # ROLLING, NOT A CUTOVER.
          #
          # This step used to stop every running task first -- "instant cutover
          # (no rolling deploy) ... ~10s downtime but avoids waiting for a
          # graceful rolling update". That traded a guaranteed outage window for
          # wall-clock, and it is also what made concurrent deploys dangerous:
          # two overlapping cutovers could leave 0 healthy tasks behind the ALB
          # (observed 2026-07-01, site-wide 503s).
          #
          # Fargate replaces tasks gracefully on its own. update-service with
          # --force-new-deployment starts new tasks, waits for them to pass the
          # ALB health check, and only then drains the old ones, governed by the
          # minimumHealthyPercent/maximumPercent set below. Deleting the stop-task
          # loop removes the downtime AND the reason deploys had to be serialised:
          # ECS supersedes an in-flight deployment safely by design.
          #
          # Why this matters here specifically: deploys are frequent and are
          # triggered by several people working through AI agents. A deploy path
          # that is only safe when exactly one runs at a time is the wrong shape
          # for that; it has to be safe when three land at once.
          echo "Setting rolling deployment policy + circuit breaker..."
          for SERVICE in ${{ env.ECS_WEB_SERVICE }} ${{ env.ECS_WORKER_SERVICE }}; do
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service $SERVICE \
              --deployment-configuration \
                'minimumHealthyPercent=100,maximumPercent=200,deploymentCircuitBreaker={enable=true,rollback=true}' \
              --output text > /dev/null
          done

          echo "Rolling new deployment onto the repo-defined task definitions..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_WEB_SERVICE }} \
            --task-definition ${{ steps.taskdefs.outputs.web_td }} \
            --force-new-deployment \
            --output text > /dev/null

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_WORKER_SERVICE }} \
            --task-definition ${{ steps.taskdefs.outputs.worker_td }} \
            --force-new-deployment \
            --output text > /dev/null

          echo "Cutover issued. Waiting for steady state in the next step..."

      - name: Wait for services to reach steady state
        run: |
          # This is the half of deploy-serialization that the `concurrency`
          # block can't do on its own. The cutover step above only ISSUES the
          # update-service calls; without blocking here the job would exit
          # "success" while ECS is still rolling, releasing the concurrency
          # lock so the next queued deploy could start its own cutover on top
          # of an in-flight one — the overlap that causes the 503.
          #
          # That only holds if this waiter is allowed to FINISH, which is why the
          # release job carries `cancel-in-progress: false`. Under the previous
          # workflow-level `cancel-in-progress: true` a superseding run killed
          # this step and took the lock — reproducing the exact overlap the
          # paragraph above says it prevents, in 14 of 27 cancelled runs to
          # 2026-09-07.
          #
          # `aws ecs wait services-stable` polls (~15s x 40 = up to 10 min)
          # until runningCount == desiredCount and only the PRIMARY deployment
          # remains (rolloutState COMPLETED) for BOTH services. If a new task
          # crash-loops or never passes health checks, the waiter times out and
          # this job fails RED — surfacing a broken deploy instead of the old
          # always-green "Deploy triggered" that hid failures.
          #
          # The short sleep first avoids the known waiter race: called too soon
          # after update-service, it can sample the service before the new
          # deployment registers and return "stable" immediately.
          sleep 15
          echo "Waiting for ${{ env.ECS_WEB_SERVICE }} + ${{ env.ECS_WORKER_SERVICE }} to reach steady state..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_WEB_SERVICE }} ${{ env.ECS_WORKER_SERVICE }}
          echo "Both services stable — deploy complete and healthy."
