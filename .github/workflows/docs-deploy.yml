name: Docs Build Check

# The help site is built into the Labs image and served at /labs/docs/help/
# (see the build-docs stage in Dockerfile and connect_labs/labs/help_site.py).
# This used to deploy to GitHub Pages, which was never enabled after the repo
# moved to dimagi-internal -- so it passed for months while the site 404'd.
# It now only checks that the docs build with no broken internal links.

on:
  pull_request:
    paths:
      - 'user_docs/**'
      - 'mkdocs.yml'
  push:
    branches: [main]
    paths:
      - 'user_docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7

      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir site
