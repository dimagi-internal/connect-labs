name: Sync Connect podcasts

# Once a month, scan the High-Impact Growth podcast page for episodes tagged
# "Connect" and refresh the podcast cards on the Insights page. If the episode
# list changed, open a PR so the Connect team reviews the copy before it ships.
# (Scheduled runs only fire from the default branch, so this activates after it
# merges to main.)
on:
  schedule:
    - cron: '0 9 1 * *' # 09:00 UTC on the 1st of each month
  workflow_dispatch: # Manual: Actions → Sync Connect podcasts → Run workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync podcast cards from dimagi.com/podcast
        run: python3 automation/sync_connect_podcasts.py

      - name: Open a PR if the episode list changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET=connect_labs/templates/prelogin/home.html
          if git diff --quiet -- "$TARGET"; then
            echo "No podcast changes this month." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="automated/connect-podcast-sync-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$TARGET"
          git commit -m "Sync Connect podcast cards from dimagi.com/podcast"
          git push -f -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Sync Connect podcast cards" \
            --body-file .github/podcast-sync-pr-body.md \
            || echo "A PR for $BRANCH is already open; pushed the update to it."
          echo "Podcast list changed — opened/updated PR on $BRANCH." >> "$GITHUB_STEP_SUMMARY"
