name: Set up the pytest environment
description: >-
  Everything the test suite needs on a runner before pytest starts: the geo
  libraries Django's GIS backend loads, Python 3.13, and the installed venv
  (restored from cache when the requirements have not changed). Shared by the
  required `pytest` job and the shifted-clock run in ci.yml, so the two cannot
  drift into testing different environments.

inputs:
  postgres-container:
    description: >-
      The Postgres service container's id (`job.services.postgres.id`). When
      given, the migrated test database template is restored from cache into it
      before pytest starts. Empty: pytest migrates, as it always did.
    required: false
    default: ''

outputs:
  db-template-key:
    description: Cache key of the migrated test database template dump.
    value: ${{ steps.db-template-key.outputs.key }}
  db-template-hit:
    description: "'true' when the template was restored from an exact cache hit."
    value: ${{ steps.db-template-cache.outputs.cache-hit }}
  db-template-dump:
    description: Path of the template dump file on the runner.
    value: ${{ steps.db-template-key.outputs.dump }}
  db-template-manifest:
    description: Path the dump's manifest is cached at, next to the dump.
    value: ${{ steps.db-template-key.outputs.manifest }}
  db-template-current:
    description: Manifest of this checkout's cache-key inputs, to store with a fresh dump.
    value: ${{ steps.db-template-key.outputs.current }}

runs:
  using: composite
  steps:
    # ~18s of every run went on `apt-get update` plus a download of the same
    # three packages. Cache the .debs and unpack them instead.
    - name: Cache the geo packages
      uses: actions/cache@v4
      with:
        path: /tmp/geo-debs
        # Bump the version suffix to force a refetch; the runner image's own
        # base libraries move under us occasionally.
        # v2 (2026-09-30): the v1 debs pinned libcurl4-gnutls-dev to a
        # libcurl the runner image had moved past, and every run failed.
        key: geo-debs-${{ runner.os }}-v2

    - name: Install Geo Dependencies
      # --no-install-recommends: Django reaches libgdal/libgeos through ctypes, so
      # the recommended extras (docs, python bindings) are downloaded and unpacked
      # for nothing on every run. Hard dependencies are still installed.
      #
      # A stale cache must never be able to fail this step or, worse, leave a
      # half-installed GDAL that fails later inside pytest with an error about
      # settings. `dpkg -i` is attempted first and ANY problem falls straight
      # through to the plain apt path, which is exactly what this used to do.
      # The import check at the end is the actual contract -- it is what a
      # partial install would break, and it is cheap.
      shell: bash
      run: |
        set -u
        install_from_apt() {
          # Only Ubuntu's own archive is needed here. The runner image also
          # carries third-party lists (Chrome, Edge, ...) and a hash-sum
          # mismatch on ANY of them fails `apt-get update` outright -- twice on
          # one PR from dl.google.com alone (#1664). They are not ours to
          # depend on, so they are dropped before the update, which also retries.
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3
          # A stale cache can fail `dpkg -i` halfway and leave packages
          # unpacked but unconfigured. apt then refuses every install until
          # that is resolved, so the fallback failed exactly when it was
          # needed (2026-09-30: libcurl4-gnutls-dev against a newer libcurl).
          # Let apt repair it first -- it replaces the stale versions.
          sudo dpkg --configure -a || true
          sudo apt-get install -y -f --no-install-recommends -o Acquire::Retries=3
          # apt refuses to use an archives dir without a `partial` inside it.
          sudo rm -rf /tmp/geo-debs && mkdir -p /tmp/geo-debs/partial
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives=/tmp/geo-debs \
            binutils \
            gdal-bin \
            libproj-dev
          sudo chown -R "$USER" /tmp/geo-debs
          rmdir /tmp/geo-debs/partial 2>/dev/null || true
        }

        if compgen -G '/tmp/geo-debs/*.deb' > /dev/null; then
          echo "Restoring geo packages from cache"
          sudo dpkg -i /tmp/geo-debs/*.deb || install_from_apt
        else
          install_from_apt
        fi

        # Prove the shared libraries are actually loadable. Without this a
        # partial restore surfaces 300 lines later as a GDAL error inside
        # pytest, which names neither this step nor the cache.
        python3 -c "
        import ctypes.util, sys
        missing = [n for n in ('gdal', 'geos_c') if ctypes.util.find_library(n) is None]
        sys.exit('geo libraries missing after install: ' + ', '.join(missing) if missing else 0)
        "

    - name: Set up Python
      id: py
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        # The real requirement files, not requirements-dev.txt — that is a
        # three-line wrapper that just includes these two and has never changed,
        # so hashing it produced a cache key frozen at whatever the first run
        # downloaded. The key could not invalidate when a dependency changed, and
        # equally could not pick up a newly added one.
        cache-dependency-path: |
          requirements/base.txt
          requirements/dev.txt

    # The pip cache above only saves the DOWNLOAD; the install still ran in full
    # every time (~70s). Cache the built environment itself, keyed on the same
    # content, so an unchanged dependency set is restored instead of rebuilt. A
    # venv's scripts hard-code absolute paths, which is fine here because the
    # workspace path is identical on every runner.
    #
    # The key carries the RESOLVED interpreter version, not the '3.13' we
    # asked for. The venv's python is a symlink into the runner's toolcache
    # (/opt/hostedtoolcache/Python/3.13.<patch>/x64), so the day setup-python
    # moves to the next patch release, a cache keyed on '3.13' restores a venv
    # whose interpreter no longer exists -- and every run fails on
    # "No such file or directory" until someone works out that the fix is to
    # bump a cache key.
    - name: Cache the installed environment
      id: venv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt') }}

    - name: Install Dependencies
      if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -r requirements-dev.txt

    # THE MIGRATED TEST DATABASE, FROM CACHE. Building the template that every
    # xdist worker clones (connect_labs/testing/db_template.py) is a full
    # migrate: ~55s of the pytest job's critical path, all four workers waiting
    # on the one doing it. A pg_dump of the result restores in a few seconds and
    # is identical, schema and seeded rows both. test-db-template.sh has the
    # measurements and the failure handling (it can never fail the job).
    #
    # The key is EVERYTHING that decides what a migrate produces: every file
    # under a migrations directory (data migrations included), the few modules
    # migrations import code from, the dependency set (third-party migrations:
    # auth, contenttypes, sites, celery beat ...), the settings, and the
    # template builder itself. Change any of them and the exact key misses.
    #
    # A miss is NOT a cold migrate unless it has to be. The key is the hash of a
    # manifest (sha256 per input file), and the manifest is cached with the
    # dump. On a miss the newest older dump is restored by prefix, and
    # `restore-older` applies only the new migrations to it -- but only when
    # every file that dump was built from is unchanged and everything added is
    # a migration. Anything else (an edited migration, a changed setting) is
    # dropped and pytest migrates cold, as before. A prefix match is never
    # trusted as-is: --reuse-db would believe an older schema.
    #
    # `pg17-3.5` is the postgis service image in ci.yml; bump it with the image.
    #
    # Not on `schedule`: the nightly run migrates from scratch, so the path
    # every cache miss relies on is exercised at least once a day.
    - name: Tune the test Postgres
      if: inputs.postgres-container != ''
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/test-db-template.sh" tune "${{ inputs.postgres-container }}"

    - name: Compute the test database cache key
      id: db-template-key
      if: inputs.postgres-container != '' && github.event_name != 'schedule'
      shell: bash
      run: |
        dir="${{ runner.temp }}/test-db-template"
        mkdir -p "$dir"
        # Tracked files only, sorted, so the manifest is the same on every runner.
        git ls-files -z -- ':(glob)connect_labs/**/migrations/**' \
          connect_labs/program/utils.py connect_labs/opportunity/visit_import.py \
          connect_labs/users/models.py requirements/base.txt requirements/dev.txt \
          config/settings/base.py config/settings/test.py \
          connect_labs/testing/db_template.py .github/actions/setup-pytest/test-db-template.sh \
          | sort -z | xargs -0 sha256sum > "$dir/manifest.current"
        echo "key=test-db-v2-${{ runner.os }}-pg17-3.5-$(sha256sum < "$dir/manifest.current" | cut -c1-64)" >> "$GITHUB_OUTPUT"
        echo "prefix=test-db-v2-${{ runner.os }}-pg17-3.5-" >> "$GITHUB_OUTPUT"
        echo "dump=$dir/template.dump" >> "$GITHUB_OUTPUT"
        echo "manifest=$dir/manifest.txt" >> "$GITHUB_OUTPUT"
        echo "current=$dir/manifest.current" >> "$GITHUB_OUTPUT"

    - name: Restore the test database dump
      id: db-template-cache
      if: steps.db-template-key.outputs.key != ''
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.db-template-key.outputs.dump }}
          ${{ steps.db-template-key.outputs.manifest }}
        key: ${{ steps.db-template-key.outputs.key }}
        restore-keys: ${{ steps.db-template-key.outputs.prefix }}

    - name: Load the migrated test database template
      if: steps.db-template-cache.outputs.cache-hit == 'true'
      shell: bash
      run: >-
        bash "$GITHUB_ACTION_PATH/test-db-template.sh" restore
        "${{ inputs.postgres-container }}" test_postgres_tpl
        "${{ steps.db-template-key.outputs.dump }}"

    - name: Load an older template and apply the new migrations
      if: steps.db-template-cache.outputs.cache-hit != 'true' && steps.db-template-cache.outputs.cache-matched-key != ''
      shell: bash
      run: >-
        bash "$GITHUB_ACTION_PATH/test-db-template.sh" restore-older
        "${{ inputs.postgres-container }}" test_postgres_tpl
        "${{ steps.db-template-key.outputs.dump }}"
        "${{ steps.db-template-key.outputs.manifest }}"
        "${{ steps.db-template-key.outputs.current }}"
