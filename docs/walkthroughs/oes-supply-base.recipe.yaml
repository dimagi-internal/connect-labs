auth:
  # Off-camera personas. dev-login is a hard 403 outside DEBUG — /supply/ has open
  # registration on a public host, so an endpoint that logs a caller in as a
  # procurement admin without a password is only defensible while it refuses in
  # production. So each persona is signed in through the REAL form before
  # recording starts, in a throwaway context, and the recorder swaps cookies
  # before a scene's nav when its `persona:` changes. No login is ever filmed.
  #
  # The password is read from $SUPPLY_DEMO_PASSWORD. The repo's own demo password
  # is deliberately rejected on the deployed site, and a committed spec must not
  # carry a credential either way.
  type: form
  login_url: /supply/login/
  fields:
    email: input[name="email"]
    password: input[name="password"]
  submit: button[type="submit"]
  # Only renders once signed in, so a failed login aborts the render instead of
  # filming a logged-out shell that reads as a product bug.
  success: .navitem
  password_env: SUPPLY_DEMO_PASSWORD
  personas:
    ada: oes-lead@oes.example
    amina: supplier@savanna.example
    tomas: oes-review@oes.example
base_url: https://labs.connect.dimagi.com
narrative_locked: true
review_mode: autonomous
why_brief: oes-supply-base.why_brief.yaml
tagline: Turn a folder of emailed PDFs into a supply base you can query
setup:
  command: python scripts/walkthroughs/oes/ensure_demo.py
  rerun: per_render
  timeout_seconds: 600
scenes:
- id: the-supply-base-before-the-emergency
  concept_claim: A standing supplier registry answers 'who can supply RUTF to north-east Nigeria today'
    from one screen, without opening a folder of emailed PDFs.
  role: overview
  url: /supply/
  show: Ada's console at /supply/ — registry coverage by category, the applications awaiting review, and
    the live solicitations. The question "who is qualified to supply RUTF to north-east Nigeria today"
    is answerable here in one look.
  actions:
  - kind: wait_for
    target: css:.keyfigures
  - kind: hold
    seconds: 2.0
  # The narration reaches "then tenders drawn from it" while the Solicitations
  # panel sat clipped to a header row plus half a line, its only live row six
  # rows below the fold. Frame the second stage when the words arrive at it.
  - kind: scroll_to
    target: css:.card:has-text('Solicitations')
  - kind: hold
    seconds: 1.8
    note: the tenders drawn from the registry — the second of the two stages, framed when the narration names it
  impressive_because: Two stages — expression of interest into a registry, then tenders drawn from it
    — is how UNICEF and WFP actually buy this commodity, and it exists because tendering from cold takes
    longer than a famine gives you.
  ai_quality: Counts are derived from the seeded registry rather than typed; categories match the declared
    round.
- id: ada-opens-a-round-and-names-the-categories
  concept_claim: Declaring the categories up front makes every application arrive in the same comparable
    shape rather than as free-form attachments.
  url: /supply/
  show: The EOI rounds tab — Ada creates the round on camera, naming it and ticking the four categories
    (RUTF, therapeutic milk, road transport, warehousing), then opens it, so the round in the table is
    the one the viewer watched her declare.
  # The act is performed, not narrated over a pre-existing record. The seeder
  # deliberately does NOT create the open round (see demo/solicitations.py) —
  # two judges independently flagged this scene as narrating a declaring act
  # the trace never performed, over a round that pre-existed its declaration.
  actions:
  - kind: click
    target: css:.navitem:has-text('EOI rounds')
  - kind: wait_for
    target: css:.page
  - kind: click
    target: css:button:has-text('New round')
  - kind: wait_for
    target: css:.modal
  - kind: fill
    target: css:.modal .field:has-text('Title') input
    value: OES Supply Base 2026-B
    note: Ada names the round
  - kind: click
    target: css:.modal .check-row:has-text('RUTF')
    note: and declares what they are collecting interest in — category one
  - kind: click
    target: css:.modal .check-row:has-text('Therapeutic milk')
  - kind: click
    target: css:.modal .check-row:has-text('Road transport')
  - kind: click
    target: css:.modal .check-row:has-text('Warehousing')
  - kind: fill
    target: css:.modal .field:has-text('Closes') input
    value: '2026-08-18'
    note: the window applications must land in
  - kind: hold
    seconds: 1.2
    note: the declaration, complete, before it is committed
  - kind: click
    target: css:.modal button:has-text('Create')
  - kind: wait_for
    target: css:.toast
  - kind: hold
    seconds: 1.2
    note: created as a draft — declaring and opening are two acts
  - kind: click
    target: css:tr:has-text('OES Supply Base 2026-B') button:has-text('Open round')
    note: and OPENED, on camera — the lifecycle transition that starts collecting interest
  - kind: hold
    seconds: 1.0
  - kind: snapshot
    note: 'the canonical frame: the round the viewer watched Ada declare, open in the table with its four category pills'
  - kind: hold
    seconds: 2.0
  impressive_because: Because the categories are declared up front, every application arrives in the same
    shape — the difference between a roster you can compare and a folder you have to read.
  ai_quality: The round's lifecycle state is real; categories are the ones submissions are actually filed
    against.
- id: amina-applies-and-the-profile-is-frozen
  concept_claim: The profile a supplier is judged on is frozen at submission, so a later edit to their
    live paperwork cannot change what the reviewer assessed.
  url: /supply/
  show: Amina's side at Savanna Nutrients — she applies to the round on camera, declaring capacity,
    regions and lead time, submits (freezing her profile onto the submission), then renews the UNICEF
    RUTF approval — and the "What the reviewer is assessing" panel shows the frozen column staying put
    while the live one moves, with the renewed certificate marked "changed since".
  # The whole freeze property, produced in front of the viewer: apply → submit
  # (snapshot taken) → edit the live profile → the two columns visibly disagree.
  # Previously the scene held camera moves over an application submitted by the
  # seeder, and the divergence was staged behind the seed too.
  actions:
  - kind: wait_for
    target: css:.page
  - kind: click
    target: css:.navitem:has-text('Expressions of interest')
  - kind: wait_for
    target: css:.data-table
  - kind: click
    target: css:.card:has-text('Open rounds') tr:has-text('OES Supply Base 2026-B') button:has-text('Apply')
    note: the round Ada just opened, on Amina's side
  - kind: wait_for
    target: css:.modal
  - kind: click
    target: css:.modal .check-row:has-text('RUTF')
    note: applying under RUTF
  - kind: click
    target: css:.modal .check-row:has-text('Therapeutic milk')
    note: and therapeutic milk — where the evidence will prove thin
  - kind: click
    target: css:.modal button:has-text('Continue')
  - kind: fill
    target: css:.modal .commit-block:has-text('RUTF') .field:has-text('Capacity') input
    value: 20,000 cartons per month
    note: capacity, as the narration says she declares
  - kind: fill
    target: css:.modal .commit-block:has-text('RUTF') .field:has-text('Regions served') input
    value: NG, BF
    note: the regions they can reach
  - kind: fill
    target: css:.modal .commit-block:has-text('RUTF') .field:has-text('Lead time') input
    value: '21'
    note: and lead time per category
  - kind: hold
    seconds: 1.2
  - kind: click
    target: css:.modal button:has-text('Continue')
  - kind: scroll_to
    target: css:.modal .notice
  - kind: hold
    seconds: 1.8
    note: what submission does — a copy of the profile is frozen onto the application
  - kind: click
    target: css:.modal button:has-text('Submit application')
  - kind: wait_for
    target: css:.toast
  - kind: hold
    seconds: 1.2
    note: submitted — the snapshot is taken at this moment
  - kind: click
    target: css:.navitem:has-text('Organisation')
    note: now the live profile moves — Amina renews the certificate
  - kind: wait_for
    target: css:.page
  - kind: click
    target: css:button:has-text('Add certification')
  - kind: wait_for
    target: css:.modal
  - kind: fill
    target: css:.modal .field:has-text('Certification type') input
    value: UNICEF RUTF approval
  - kind: fill
    target: css:.modal .field:has-text('Issuer') input
    value: UNICEF Supply Division (renewed)
  - kind: fill
    target: css:.modal .field:has-text('Expiry date') input
    value: '2028-07-31'
  - kind: click
    target: css:.modal button:has-text('Add')
  - kind: wait_for
    target: css:.toast
  - kind: hold
    seconds: 1.0
    note: the live profile has changed. The frozen snapshot has not.
  - kind: click
    target: css:.navitem:has-text('Expressions of interest')
  - kind: wait_for
    target: css:.data-table
  - kind: click
    target: css:.card:has-text('Your applications') tr:has-text('OES Supply Base 2026-B')
  - kind: wait_for
    target: css:.modal
  - kind: scroll_to
    target: css:.modal .card:has-text('What the reviewer is assessing')
  - kind: snapshot
    note: 'the canonical frame: frozen beside live, the renewal she just made marked "changed since", and the left column did not move'
  - kind: hold
    seconds: 3.0
    note: frozen beside live — the certificate renewed moments ago is marked, and the left column did not move
  impressive_because: If Savanna updates a certificate next week the live profile changes and the snapshot
    does not, so the decision stays reconstructable a year from now. That is the property an inspector
    general asks about first.
  ai_quality: The snapshot is visibly distinct from the live profile rather than a second render of the
    same data.
- id: tomas-qualifies-the-supplier-per-category-and-with-an-expiry
  concept_claim: A reviewer decides per category and each pass carries an expiry date, so one supplier
    can be qualified for RUTF and declined for therapeutic milk.
  url: /supply/
  show: 'Tomas''s review queue with Savanna''s submission opened — the frozen snapshot he is assessing,
    and the per-category decision made on camera: qualify on ready-to-use therapeutic food with the date
    that qualification expires, decline on therapeutic milk — one supplier and two different answers.'
  actions:
  - kind: wait_for
    target: css:.page
  - kind: click
    target: css:.navitem:has-text('EOI rounds')
  - kind: wait_for
    target: css:.data-table
  - kind: hold
    seconds: 1.2
  - kind: click
    target: css:.card:has-text('Review queue') tr:has-text('Savanna Nutrients Ltd') button:has-text('Review')
    note: the submission the narration names
  - kind: wait_for
    target: css:.modal
  - kind: hold
    seconds: 1.8
    note: the certifications as frozen, and the expiry each one carries
  - kind: click
    target: css:.modal .decision-row:has-text('RUTF') button:has-text('Qualify')
    note: passes on ready-to-use therapeutic food
  - kind: hold
    seconds: 1.2
  - kind: click
    target: css:.modal .decision-row:has-text('Therapeutic milk') button:has-text('Reject')
    note: declined where the evidence is thin — no plant, no approval
  - kind: hold
    seconds: 2.4
    note: two different answers for one supplier, and the date the pass expires beside the one that carries
      it
  - kind: snapshot
    note: 'the canonical frame is the decision state — both verdicts set, the expiry on screen — not the
      aftermath after the modal closed'
  - kind: click
    target: css:.modal button:has-text('Record decision')
    note: RECORD it. Qualify and Reject only set local state — the POST fires from this button
      alone — so the pivotal act of the whole narrative left no trace, and the next scene's
      registry still showed the OLD expiry while the narration claimed the one just granted.
  - kind: wait_for
    target: css:.toast
  - kind: hold
    seconds: 1.8
    note: the decision is now a fact about the organisation, not a state in a form
  impressive_because: One supplier, two different answers per category — which is how this actually works.
    And a roster that never expires quietly becomes a list of former suppliers.
  ai_quality: Per-category decisions are independent; the expiry is a real date, not a label.
- id: the-registry-answers-who-can-supply-today
  concept_claim: The registry IS the set of live qualifications, so a lapsed certification removes a supplier
    without anyone maintaining a list.
  url: /supply/
  show: The Supplier registry tab — organisations listed by live qualification, with category, country
    and expiry filters, and the expiring-soon count called out.
  actions:
  - kind: wait_for
    target: css:.page
  - kind: click
    target: css:.navitem:has-text('Supplier registry')
  - kind: wait_for
    target: css:.data-table
  - kind: hold
    seconds: 1.6
    note: the registry unfiltered — every organisation holding a live qualification
  - kind: select
    target: css:.filter-row .filter-field:nth-of-type(1) select
    value: rutf
    note: Ada filters by commodity, as the narration says she does
  - kind: hold
    seconds: 1.2
  - kind: select
    target: css:.filter-row .filter-field:nth-of-type(2) select
    value: NG
    note: and by country — who can make RUTF for Nigeria today
  - kind: hold
    seconds: 2.6
    note: the count in the card title moves with the filters; this is the answer Ada acts on
  # A third of the voiceover is about expiry and lapse, and the third filter was
  # never touched — the expiry mechanism the screen exists to demonstrate had no
  # on-camera exercise at all. Widen back to all countries first: no NG RUTF
  # qualification expires within the window, and filming an empty table on the
  # load-bearing card reads as breakage, not as a demonstration.
  - kind: select
    target: css:.filter-row .filter-field:nth-of-type(2) select
    value: ''
    note: widen back to every country —
  - kind: select
    target: css:.filter-row .filter-field:nth-of-type(3) select
    value: '90'
    note: and ask the expiry question — who lapses out of the RUTF pool within ninety days
  - kind: hold
    seconds: 1.4
    note: one supplier, with the date its qualification runs out — the lapse mechanism, exercised
  - kind: hover
    target: css:.page-head h1
    note: park the cursor clear of the table so no expiry date is occluded on the closing frame
  - kind: hold
    seconds: 1.6
  impressive_because: The registry is not a list somebody maintains — it is the set of live qualifications,
    so it is current by construction. A lapsed certification drops a supplier out without anyone remembering
    to remove them.
  ai_quality: Expired qualifications are genuinely absent rather than greyed out.
- id: a-solicitation-reaches-only-qualified-suppliers
  concept_claim: Eligibility is enforced when the payload is built, so an unqualified supplier never receives
    the solicitation rather than seeing it with a hidden button.
  url: /supply/
  show: 'Ada''s solicitations list, where every call carries its lots on the row: sixty thousand cartons
    of RUTF into Maiduguri, twenty thousand into Djibo, thirty-five thousand into Damaturu — the concrete
    quantities the narration speaks, on the page of the person who published them, and the categories
    that decide which suppliers ever receive it.'
  actions:
  - kind: click
    target: css:.navitem:has-text('Solicitations')
  - kind: wait_for
    target: css:.data-table
  - kind: scroll_to
    target: css:tr:has-text('RUTF Northeast Nigeria Q3 2026')
  # NOT rescripted as an on-camera publish, deliberately. The narrated act
  # ("Ada publishes a solicitation") cannot be performed coherently: scenes 7-8
  # award this tender from priced, technically-scored bids, and bids need days
  # a fresh publication cannot have — publishing a duplicate on camera would
  # put two identical solicitations in the list and re-create the substituted-
  # record defect the judges caught before. The supplier-side absence beat needs
  # a mid-scene persona switch, which requires dev-login — a hard 403 on prod
  # by design. Both fixes fork the narrative itself; parked for the
  # concept_change gate.
  - kind: hover
    target: css:.page-head h1
    note: park the cursor clear of the row so no lot quantity is occluded during the hold
  - kind: hold
    seconds: 3.4
    note: the lots are on the row — 60,000 to Maiduguri, spoken and readable without opening anything
  impressive_because: 'Eligibility is decided on the server: an unqualified supplier''s page never receives
    the solicitation at all, rather than being shown it with the button hidden. It prevents the ordinary
    embarrassment of an ineligible bid excluded by hand after the fact.'
  ai_quality: Lot quantities and delivery places are concrete; the eligibility rule is enforced in the
    payload, not the styling.
- id: bids-priced-and-scored-lot-by-lot
  concept_claim: Pricing per lot surfaces a different leader on each corridor — information a per-tender
    comparison cannot show.
  url: /supply/
  show: 'The live tender — RUTF Northeast Nigeria Q3 2026 — opened to its per-lot comparison: rows ranked
    by unit price with each reviewer''s technical score inline, and a different leader on the Maiduguri
    lot (Savanna, out of Kano) than on Djibo (Faso NutriWorks, out of Ouagadougou).'
  actions:
  - kind: wait_for
    target: css:.page
  - kind: click
    target: css:.navitem:has-text('Solicitations')
  - kind: wait_for
    target: css:.data-table
  - kind: click
    target: css:tr:has-text('RUTF Northeast Nigeria Q3 2026') button:has-text('Compare & award')
    note: the live tender, still open — bids priced per lot
  - kind: wait_for
    target: css:.modal
  # .card-head, not .card. The recorder scrolls with Playwright's
  # scroll_into_view_if_needed, which does NOT honour the scroll-margin-top
  # rule added for this exact class of bug — it stops as soon as the element
  # is minimally visible, and for a card taller than the modal body that
  # leaves the TITLE above the top edge. Scene 7 framed a lot card whose
  # title the narration speaks aloud and the frame did not contain, twice.
  # Targeting the header makes the title and its due-date subtitle the thing
  # guaranteed to be in view.
  - kind: scroll_to
    target: css:.modal .card:has-text('60,000 cartons RUTF delivered to Maiduguri') .card-head
  - kind: hold
    seconds: 2.4
    note: Maiduguri — Savanna first on price at 42.29, technical 91
  - kind: scroll_to
    target: css:.modal .card:has-text('20,000 cartons RUTF delivered to Djibo') .card-head
  - kind: hold
    seconds: 2.6
    note: Djibo — Faso NutriWorks first at 41.85, and Savanna drops to second
  impressive_because: The leader on the Maiduguri lot is not the leader on Djibo, which is exactly the
    information a per-tender comparison would have hidden.
  ai_quality: Two distinct price leaders are actually visible in the data, not asserted in a caption.
- id: two-suppliers-two-corridors-one-tender
  concept_claim: One solicitation's lots can be awarded to two different suppliers, so a single plant
    or corridor failing does not take every district down at once.
  url: /supply/
  show: The same solicitation showing both lots awarded — Maiduguri to one supplier, Djibo to another,
    on purpose.
  actions:
  - kind: scroll_to
    target: css:.modal .card:has-text('60,000 cartons RUTF delivered to Maiduguri') .card-head
  - kind: hold
    seconds: 1.4
  - kind: click
    target: css:.card:has-text('60,000 cartons RUTF delivered to Maiduguri') tr:has-text('Savanna Nutrients
      Ltd') button:has-text('Award')
    note: Maiduguri to Savanna — cheapest into the Lake Chad corridor
  - kind: wait_for
    target: css:.toast
  - kind: hold
    seconds: 1.8
  - kind: scroll_to
    target: css:.modal .card:has-text('20,000 cartons RUTF delivered to Djibo') .card-head
  - kind: hold
    seconds: 1.4
  - kind: click
    target: css:.card:has-text('20,000 cartons RUTF delivered to Djibo') tr:has-text('Faso NutriWorks
      SA') button:has-text('Award')
    note: Djibo to Faso — a different plant on a different corridor
  - kind: wait_for
    target: css:.toast
  - kind: hold
    seconds: 2.4
    note: two corridors, two suppliers, one tender — awarded on camera
  impressive_because: 'Concentrating a four-country response on the cheapest single bidder is the classic
    humanitarian supply failure: when that plant or that corridor goes down, every district goes down
    at the same moment. Here the split costs nothing to make — each corridor''s cheapest bidder is a
    different plant, so the resilient award is also the lowest-cost one. The cheapest rule and the
    resilient rule happen to agree on this tender. Awarding lot by lot is what lets you tell when they
    do not, which a single blended price cannot show you at all.'
  ai_quality: Two different awarded organisations across one solicitation's lots.
- id: the-award-becomes-the-contract
  concept_claim: The award is immutable and the contract carries it out against a named appropriation,
    so the same record the tender produced is what the supply chain moves against.
  url: /supply/
  show: 'The contract the award just made produced — OES-C-2026-NG2, created by that award moments ago,
    carrying the 60,000 cartons at the price Savanna bid, obligated against a named funding envelope with
    its IATI activity identifier. The record the tender produced is the record the supply chain moves
    against.'
  actions:
  - kind: click
    target: css:.modal-close
    note: close the comparison — its backdrop otherwise intercepts the nav
  - kind: click
    target: css:.navitem:has-text('Command centre')
  - kind: wait_for
    target: css:.exception-list
  - kind: scroll_to
    target: css:.card:has-text('Pipeline by corridor')
  - kind: hold
    seconds: 1.6
  - kind: hover
    target: css:.card:has-text('Pipeline by corridor') tr:has-text('OES-C-2026-NG2')
    note: the row in context — the contract this award produced, visible IN the pipeline table before
      the modal covers it. The viewer previously never saw the row-in-context-to-record relation the
      narration depends on.
  - kind: hold
    seconds: 1.4
  - kind: click
    target: css:.card:has-text('Pipeline by corridor') tr:has-text('OES-C-2026-NG2')
    note: the contract THIS award produced, not the earlier Q2 one on the same corridor. Awarding
      a lot used to create nothing but the award, so the scene had to open somebody else's
      contract — same supplier, same city, tender names one character apart — and two judges
      independently caught the substitution.
  - kind: wait_for
    target: css:.modal
  # The closing beat lands on the funding envelope and the IATI id — content
  # that exists — rather than on the delivery schedule, which on a contract
  # created moments ago is honestly and necessarily empty.
  - kind: scroll_to
    target: css:.modal .card:has-text('Drawn against')
  - kind: snapshot
    note: 'the canonical frame: the named funding envelope and the IATI activity identifier the contract
      is obligated against'
  - kind: hold
    seconds: 3.2
    note: the funding envelope and the IATI activity id the award is carried out against
  impressive_because: 'Almost every procurement system stops at the award, which is why nobody can trace
    a dollar to a carton. This is the midpoint: from here the same record is what the supply chain moves
    against.'
  ai_quality: The contract links to a real appropriation and a real award, and disbursed never exceeds
    obligated.
