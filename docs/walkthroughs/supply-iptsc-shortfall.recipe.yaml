base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-09-23T23:47:06.560995+00:00'
prewarm: true
record_video: true
review_mode: autonomous
setup:
  command: python3 scripts/walkthroughs/supply-iptsc-shortfall/ensure_demo.py
  outputs: scripts/walkthroughs/supply-iptsc-shortfall/.run_ids.json
  rerun: per_render
  timeout_seconds: 900
tagline: A short order, covered locally, read as one record instead of a message thread
video_pace: medium
video_viewport_height: 900
video_viewport_width: 1440
why_brief: supply-iptsc-shortfall.why_brief.yaml
scenes:
- id: the-order-that-ran-short
  actions:
  - kind: wait_for
    target: text:SCHI district store
  - kind: wait_for
    must_succeed: true
    target: text:not counted as cover
  - kind: hold
    note: the partner's store at 0, and the 700 packets from Harmattan listed as expected, overdue, not counted as cover
    seconds: 3.0
  concept_claim: The stock page shows the SCHI district store holding 0 packets, with
    Harmattan Health Supplies' order of 700 packets listed beside it as expected, overdue
    since its due date, and not counted as cover.
  design_intent: Open on what is at stake — the store the school round draws from is
    empty and the one order that fills it is late — so every later scene is read as
    progress against that gap.
  role: overview
  show: Ngozi opens Stock across the network. The SCHI district store, where the school
    round's packets should be, holds 0; beside the balance the page lists 700 packets
    expected from Harmattan Health Supplies, overdue since their due date, and says
    they are not counted as cover.
  url: /supply/stock/?program_id=${program_id}
- id: one-packet-is-one-course
  actions:
  - kind: wait_for
    target: text:is one full course
  - kind: hold
    note: the course statement — one packet is one three-day course
    seconds: 1.5
  - kind: scroll_to
    target: text:What is inside
  - kind: hold
    note: the kit's components, counted in stock as whole packets
    seconds: 2.0
  concept_claim: The trade item page states that one packet is one full course and
    lists the kit's two components with their quantities.
  design_intent: Settle the unit before any quantity appears, so every later "450"
    and "700" is read as courses, not boxes.
  show: Ngozi opens the trade item "IPTSc three-day packet (standard)" and reads that
    one packet is one full course, then scrolls to the kit's contents — nine dihydroartemisinin-piperaquine
    tablets and one dosing card (illustrative contents).
  url: /supply/catalogue/items/${item_id}/?program_id=${program_id}
- id: the-distributor-says-what-it-sent
  actions:
  - kind: wait_for
    target: text:Updates for Harmattan Health Supplies
  - kind: click
    target: css:summary:has-text('Record a dispatch')
  - kind: select
    say: order
    target: css:#id_record_shipment-contract
    value: ${order_id}
  - kind: fill
    say: waybill
    target: css:#id_record_shipment-reference
    value: HHS-WB-3310
  - kind: fill
    say: carrier
    target: css:#id_record_shipment-carrier
    value: Kano Road Haulage
  - kind: fill
    say: nineteenth
    target: css:#id_record_shipment-dispatched_on
    value: '2026-09-19'
  - kind: fill
    say: twenty-second
    target: css:#id_record_shipment-expected_on
    value: '2026-09-22'
  - kind: fill
    say: '450'
    target: css:#id_record_shipment-quantity
    value: '450'
  - kind: select
    target: css:#id_record_shipment-unit_basis
    value: base
  - kind: fill
    target: css:#id_record_shipment-batch
    value: DP-2608-A
  - kind: hold
    note: the filled dispatch form, before it is recorded
    seconds: 1.5
  - kind: click
    must_succeed: true
    target: css:form:has(input[value='record_shipment']) button[type='submit']
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: 'text:Recorded:'
  - kind: hold
    note: the confirmation, and the dispatch now listed under the order
    seconds: 2.0
  concept_claim: A distributor with no labs login records a 450-packet dispatch against
    the programme's order through its update link, and the page confirms it was recorded.
  design_intent: The fact arrives from the party who knows it, marked as reported
    by them, instead of being asked for.
  show: On Harmattan's update link page Musa opens "Record a dispatch", chooses the
    order, enters waybill HHS-WB-3310 and the carrier, the dispatch and expected dates,
    450 single packets and the batch, and records it — the page confirms the dispatch
    is shared with the programme team.
  url: ${distributor_link_path}
- id: the-partner-receives-450
  actions:
  - kind: wait_for
    target: text:Updates for Sahel Community Health Initiative
  - kind: click
    target: css:summary:has-text('Record goods received')
  - kind: select
    say: order
    target: css:#id_record_receipt-contract
    value: ${order_id}
  - kind: select
    say: store
    target: css:#id_record_receipt-supply_point
    value: ${store_id}
  - kind: select
    target: css:#id_record_receipt-shipment
    value: HHS-WB-3310 — IPTSC-PO-0715 (dispatched)
    note: the dispatch Musa recorded — naming it is what marks that consignment delivered
  - kind: fill
    target: css:#id_record_receipt-reference
    value: SCHI-GRN-0922
  - kind: fill
    say: accepted
    target: css:#id_record_receipt-quantity_accepted
    value: '450'
  - kind: select
    target: css:#id_record_receipt-unit_basis
    value: base
  - kind: fill
    target: css:#id_record_receipt-batch
    value: DP-2608-A
  - kind: hold
    note: the filled goods received form, before it is recorded
    seconds: 1.5
  - kind: click
    must_succeed: true
    target: css:form:has(input[value='record_receipt']) button[type='submit']
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: 'text:Recorded:'
  - kind: hold
    seconds: 1.5
  concept_claim: The partner records a goods received note of 450 packets at the SCHI
    district store through its own update link, without a labs login.
  design_intent: Stock comes into existence where the goods land, recorded by the
    person who counted them.
  show: On SCHI's update link Hauwa opens "Record goods received", chooses the Harmattan
    order, the SCHI district store and the dispatch Musa recorded (HHS-WB-3310), enters
    goods received note SCHI-GRN-0922, 450 single packets accepted and the batch, and
    records it.
  url: ${partner_link_path}
- id: short-and-late
  actions:
  - kind: wait_for
    target: text:past the promised lead time
  - kind: hold
    note: the late banner — days past the promised lead time, 250 packets still to arrive
    seconds: 2.0
  - kind: scroll
    value: '380'
  - kind: hold
    note: the banner, the dispatch Musa reported and the receipt Hauwa recorded, and the
      ordered/received card with 700 ordered, 450 received and the due date passed — the
      frame the scene ends on
    seconds: 3.5
  concept_claim: The order page derives 700 ordered, 450 received and 250 outstanding
    from the receipt, and shows the order as past its promised lead time.
  design_intent: Shortfall and lateness are both derived from records, so neither
    has to be asked about or typed.
  show: Ngozi opens order IPTSC-PO-0715 and reads the late banner — days past the
    promised lead time with 250 packets still to arrive — then the ordered, received
    and invoiced table, and scrolls to the dispatch Musa reported and the receipt
    Hauwa recorded.
  url: /supply/orders/${order_id}/?program_id=${program_id}
- id: the-partner-bought-the-rest
  actions:
  - kind: wait_for
    target: css:#id_supplier-ts-control
  - kind: click
    target: css:#id_supplier-ts-control
  - kind: click_menu
    say: Tamarind
    target: "css:#id_supplier-ts-dropdown .option:has-text('Tamarind Pharmacy Wholesale')"
  - kind: click
    target: css:#id_commodity-ts-control
  - kind: click_menu
    target: "css:#id_commodity-ts-dropdown .option:has-text('IPTSc three-day treatment packet')"
  - kind: click
    target: css:#id_item-ts-control
  - kind: click_menu
    target: "css:#id_item-ts-dropdown .option:has-text('IPTSc three-day packet (standard)')"
  - kind: select
    say: buyer
    target: css:#id_buyer_of_record
    value: partner_org
  - kind: click
    target: css:#id_buyer_org-ts-control
  - kind: fill
    target: css:#id_buyer_org-ts-control
    value: Sahel Comm
    note: the organisation list is labs-wide and long, and only its first page renders until you search it
  - kind: click_menu
    say: SCHI
    target: "css:#id_buyer_org-ts-dropdown .option:has-text('Sahel Community Health Initiative')"
  - kind: fill
    target: css:#id_reference
    value: SCHI-LP-0921
  - kind: fill
    target: css:#id_signed_on
    value: '2026-09-21'
  - kind: select
    target: css:#id_status
    value: placed
  - kind: select
    say: bundled
    target: css:#id_consideration
    value: bundled
  - kind: fill
    target: css:#id_quantity
    value: '250'
  - kind: fill
    target: css:#id_quantity_unit
    value: packet
  - kind: click
    target: css:#id_delivery_supply_point-ts-control
  - kind: click_menu
    target: "css:#id_delivery_supply_point-ts-dropdown .option:has-text('SCHI district store')"
  - kind: click
    target: css:#id_covers_shortfall_of-ts-control
  - kind: fill
    target: css:#id_covers_shortfall_of-ts-control
    value: IPTSC
    note: she looks the short order up by its reference
  - kind: click_menu
    say: shortfall
    target: "css:#id_covers_shortfall_of-ts-dropdown .option:has-text('IPTSC-PO-0715')"
  - kind: select
    target: css:#id_source
    value: partner_reported
  - kind: hold
    note: the whole order, complete, before it is recorded
    seconds: 1.5
  - kind: click
    must_succeed: true
    target: role:button:Record order
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: text:Covers the shortfall on
  - kind: capture
    pattern: /supply/orders/(\d+)/
    source: url
    var: cover_id
  concept_claim: A new order records the partner as buyer of record, its consideration
    as bundled with no unit price, and names IPTSC-PO-0715 as the order whose shortfall
    it buys.
  design_intent: The local purchase is a first-class order joined to the short one,
    not a note on it.
  show: Ngozi opens New order and records Tamarind Pharmacy Wholesale selling the
    same standard packet, with "A partner is" buying and the organisation Sahel Community
    Health Initiative, "Bundled — paid out of another cost, such as a setup fee",
    250 packets with no unit price, delivered to the SCHI district store, "Buys the
    shortfall on" IPTSC-PO-0715, and "A partner told us" as the source, then records
    the order.
  url: /supply/orders/new/?program_id=${program_id}
- id: the-250-arrive-and-cost-says-why
  actions:
  - kind: wait_for
    target: text:Updates for Sahel Community Health Initiative
  - kind: wait_for
    must_succeed: true
    target: text:SCHI-LP-0921
  - kind: hold
    note: SCHI-LP-0921, created after the link was issued, already listed under the link's orders
    seconds: 2.5
  - kind: click
    target: css:summary:has-text('Record goods received')
  - kind: select
    say: picks it
    target: css:#id_record_receipt-contract
    value: ${cover_id}
    note: the new Tamarind order is on SCHI's link because the link covers everything involving SCHI
  - kind: select
    target: css:#id_record_receipt-supply_point
    value: ${store_id}
  - kind: fill
    target: css:#id_record_receipt-reference
    value: SCHI-GRN-0923
  - kind: fill
    say: accepted
    target: css:#id_record_receipt-quantity_accepted
    value: '250'
  - kind: select
    target: css:#id_record_receipt-unit_basis
    value: base
  - kind: fill
    target: css:#id_record_receipt-batch
    value: TPW-DP-0914
  - kind: hold
    note: the filled goods received form for the Tamarind order, before it is recorded
    seconds: 1.5
  - kind: click
    must_succeed: true
    target: css:form:has(input[value='record_receipt']) button[type='submit']
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: 'text:Recorded:'
  - kind: hold
    note: the confirmation, and SCHI-LP-0921 now listed under the link's orders as received
    seconds: 2.0
  concept_claim: SCHI's update link, issued to cover everything involving SCHI, offers
    the covering order SCHI-LP-0921 created after the link was issued, and records 250
    packets accepted against it.
  design_intent: The party who counted the goods records them, for every order it buys
    or receives, without the programme re-issuing a link or keying it for them.
  show: On SCHI's update link Hauwa opens "Record goods received", chooses the new
    Tamarind order SCHI-LP-0921 and the SCHI district store, enters goods received
    note SCHI-GRN-0923, 250 single packets accepted and the batch, and records it.
  url: ${partner_link_path}
- id: covered-not-late
  actions:
  - kind: wait_for
    must_succeed: true
    target: css:#fulfilment
  - kind: hold
    note: the header reads "short — covered by SCHI-LP-0921", with no late banner,
      and "How the order was filled" adds 450 from Harmattan and 250 from Tamarind
      to the 700 ordered
    seconds: 3.5
  concept_claim: With a covering order named, the short order reads "short — covered
    by SCHI-LP-0921" with no past-due banner, and one view adds the distributor's
    450 and the covering order's 250 to the 700 ordered.
  design_intent: Nobody is waiting on Harmattan for the 250 any more, so calling the
    order late would be a false alarm; and the reader should not have to add two
    order pages together to know all 700 arrived.
  show: Ngozi returns to IPTSC-PO-0715. Its header reads "short — covered by SCHI-LP-0921"
    with no past-due banner, and "How the order was filled" lists this order's 450
    packets from Harmattan and SCHI-LP-0921's 250 from Tamarind, each linked, adding
    up to 700 received against 700 ordered.
  url: /supply/orders/${order_id}/?program_id=${program_id}
- id: seven-hundred-on-the-shelf
  actions:
  - kind: wait_for
    target: text:SCHI district store
  - kind: click
    must_succeed: true
    target: css:td[data-ledger] a
    note: she opens the store's balance
  - kind: wait_for
    must_succeed: true
    target: text:What moved in and out of
  - kind: hold
    note: the two receipts, 450 from Harmattan on IPTSC-PO-0715 and 250 from Tamarind on
      SCHI-LP-0921, and the balance they add up to
    seconds: 3.0
  - kind: click
    must_succeed: true
    target: css:a.rounded-md:text-is('Stock')
    note: back to the network view she opened on
  - kind: wait_for
    must_succeed: true
    target: text:Stock across the network
  - kind: hold
    note: the opening frame answered — the SCHI district store at 700 packets, nothing expected
      or overdue beside it
    seconds: 3.5
  concept_claim: The SCHI district store's balance opens onto the two receipts it is made of,
    450 and 250, and the stock page shows the store holding 700 packets with no order still
    expected.
  design_intent: Close on the opening frame, answered — the empty store with a late order
    now reads 700 packets, 700 three-day courses, after the viewer has seen where each one
    came from.
  show: Ngozi opens the SCHI district store's balance to the movements behind it —
    SCHI-GRN-0922, 450 packets from Harmattan on IPTSC-PO-0715, and SCHI-GRN-0923, 250
    packets from Tamarind on SCHI-LP-0921 — then returns to Stock across the network, where
    the store that opened the story at 0 reads 700 packets with nothing expected or overdue.
  url: /supply/stock/?program_id=${program_id}
