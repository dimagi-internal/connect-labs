base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-09-24T14:00:00+00:00'
review_mode: autonomous
video_viewport_width: 1440
video_viewport_height: 900
setup:
  command: python scripts/walkthroughs/supply-dispenser-import/ensure_demo.py
  outputs: scripts/walkthroughs/supply-dispenser-import/outputs.json
  rerun: per_render
  timeout_seconds: 900
tagline: A donated import, from customs to the sites that hold it
why_brief: supply-dispenser-import.why_brief.yaml
scenes:
- id: the-checks-list-says-the-import-is-stuck
  role: overview
  url: /supply/checks/?program_id=10604
  actions:
  - kind: wait_for
    target: css:h2:has-text('What the record cannot answer'), h2:has-text('what is missing, in conflict')
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the checks list at rest, both entries for the consignment visible
  - kind: hover
    note: the lateness check, derived from the expected date on the consignment
    say: late
    seconds: 1.5
    target: css:a:has-text('Shipment past its expected date')
  - kind: hover
    note: the missing-documents check, naming who owes each
    say: not on file
    seconds: 2.0
    target: css:a:has-text('Documents it needs, not on file')
  concept_claim: A late import and its missing documents are stated by the record
    itself, so the programme officer does not have to chase anyone to learn that the
    dispensers are stuck.
  design_intent: 'Open on the problem, not on a form: the list reads as facts, grouped
    by kind, each linking to the consignment. The two entries for one consignment
    are the question the rest of the demo answers, and the list comes back at the end.'
  show: 'The programme''s checks list at /supply/checks/. Two entries are about the
    same ClearWater Action consignment, KEX-AWB-40981: one says it is past its expected
    date and not received, the other lists the three import documents that are not
    on file and the organisation that owes each.'
- id: uploading-clearwaters-papers
  url: /supply/shipments/${shipment_id}/
  actions:
  - kind: wait_for
    target: css:span:has-text('Documents it needs')
  - kind: hover
    say: who owes
    seconds: 1.4
    target: css:li:has-text('Packing list') span:has-text('owed by')
  - kind: click
    must_succeed: true
    say: packing list
    target: css:li:has-text('Packing list') a:has-text('Attach')
  - kind: wait_for
    target: css:#id_title
  - kind: fill
    target: css:#id_title
    value: Packing list CWA-PL-0412
  - kind: upload
    target: css:#id_upload
    value: ${files_dir}/packing-list-CWA-PL-0412.pdf
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Attach')
    timeout_ms: 30000
  - kind: wait_for
    target: css:li:has-text('Packing list') span:has-text('on file')
  - kind: hold
    seconds: 0.8
  - kind: click
    must_succeed: true
    say: commercial invoice
    target: css:li:has-text('Commercial invoice') a:has-text('Attach')
  - kind: wait_for
    target: css:#id_title
  - kind: fill
    target: css:#id_title
    value: Commercial invoice CWA-CI-0412
  - kind: upload
    target: css:#id_upload
    value: ${files_dir}/commercial-invoice-CWA-CI-0412.pdf
  - kind: hold
    seconds: 1.2
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Attach')
    timeout_ms: 30000
  - kind: wait_for
    target: css:li:has-text('Commercial invoice') span:has-text('on file')
  - kind: hover
    seconds: 1.4
    target: css:span:has-text('Documents it needs')
  - kind: snapshot
    note: the checklist after both uploads, packing list and commercial invoice on file, the customs declaration still owed
  concept_claim: Uploading a document from its checklist line files it as that kind
    against this consignment and marks the line on file.
  design_intent: 'Start from the outstanding line, not from a blank form: the form
    says which line it fills and who owes it, the kind is already chosen, and the
    only things added are a title and the file itself.'
  show: 'On the consignment page Halima reads the "Documents it needs" checklist, each
    line naming who owes it, then uses the packing list''s Attach link: the form opens
    saying it fills the "Packing list" line owed by ClearWater Action, with that kind
    already chosen; she gives it a title, uploads the PDF and attaches it. She does
    the same for the commercial invoice. The frame is the checklist after both uploads:
    three lines on file, the customs declaration still owed by the clearing agent.'
- id: the-checklist-is-complete
  url: /supply/shipments/${shipment_id}/
  actions:
  - kind: wait_for
    target: css:span:has-text('Documents it needs')
  - kind: click
    must_succeed: true
    say: customs declaration
    target: css:li:has-text('Customs declaration') a:has-text('Attach')
  - kind: wait_for
    target: css:#id_title
  - kind: fill
    target: css:#id_title
    value: Customs declaration LCF-2026-7731
  - kind: upload
    target: css:#id_upload
    value: ${files_dir}/customs-declaration-LCF-2026-7731.pdf
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Attach')
    timeout_ms: 30000
  - kind: wait_for
    target: css:li:has-text('Customs declaration') span:has-text('on file')
  - kind: scroll_to
    target: css:span:has-text('Documents it needs')
  - kind: hold
    seconds: 1.0
  - kind: hover
    say: every document
    seconds: 1.6
    target: css:li:has-text('Customs declaration') span:has-text('on file')
  - kind: snapshot
    note: the checklist with all four documents on file
  concept_claim: Once the last required document is uploaded, the consignment's checklist
    has nothing outstanding, each line linking to the file that satisfies it.
  design_intent: 'The paperwork beat ends on a complete list: four lines, four on-file
    chips, four files one click away. No separate "done" state to maintain.'
  show: Halima uploads the customs declaration the clearing agent sent, from its own
    line. The consignment page's checklist now shows the airway bill, packing list,
    commercial invoice and customs declaration all on file, each with its title and
    who owed it.
- id: paying-to-land-it
  url: /supply/shipments/${shipment_id}/
  actions:
  - kind: wait_for
    target: css:span:has-text('Charges paid to land it')
  - kind: click
    must_succeed: true
    say: customs fee
    target: css:a.rounded-md:has-text('Record a charge')
  - kind: wait_for
    target: css:#id_kind
  - kind: select
    target: css:#id_kind
    value: customs_fee
  - kind: click
    target: css:#id_payee_org-ts-control
  - kind: type
    value: Port customs
  - kind: hold
    seconds: 0.8
    note: let the picker filter to what was typed before choosing
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_amount
    value: '410000'
  - kind: click
    target: css:.ts-wrapper:has(#id_currency-ts-control) .ts-control
  - kind: press
    value: Backspace
    note: clear the order's own currency before choosing naira
  - kind: type
    value: NGN
  - kind: hold
    seconds: 0.8
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_fx_rate_to_usd
    value: '0.00065'
  - kind: fill
    target: css:#id_paid_on
    value: ${today}
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Record charge')
    timeout_ms: 30000
  - kind: wait_for
    target: css:td:has-text('Customs fee')
  - kind: click
    must_succeed: true
    say: clearing agent
    target: css:a.rounded-md:has-text('Record a charge')
  - kind: wait_for
    target: css:#id_kind
  - kind: select
    target: css:#id_kind
    value: clearing
  - kind: click
    target: css:#id_payee_org-ts-control
  - kind: type
    value: Lagoon
  - kind: hold
    seconds: 0.8
    note: let the picker filter to what was typed before choosing
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_amount
    value: '185000'
  - kind: click
    target: css:.ts-wrapper:has(#id_currency-ts-control) .ts-control
  - kind: press
    value: Backspace
    note: clear the order's own currency before choosing naira
  - kind: type
    value: NGN
  - kind: hold
    seconds: 0.8
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_fx_rate_to_usd
    value: '0.00065'
  - kind: fill
    target: css:#id_paid_on
    value: ${today}
  - kind: hold
    seconds: 1.0
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Record charge')
    timeout_ms: 30000
  - kind: wait_for
    target: css:td:has-text('Clearing')
  - kind: click
    must_succeed: true
    say: cleared
    target: css:a:has-text('Update status')
  - kind: wait_for
    target: css:#id_status
  - kind: select
    target: css:#id_status
    value: cleared
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Save')
    timeout_ms: 30000
  - kind: goto
    target: /supply/shipments/${shipment_id}/
  - kind: wait_for
    target: css:span:has-text('Charges paid to land it')
  - kind: hover
    seconds: 1.8
    note: the consignment now cleared, both charges itemised with their payees
    target: css:td:has-text('Clearing')
  - kind: snapshot
    note: the consignment cleared, the customs fee and the clearing charge itemised with their payees
  concept_claim: A charge is recorded against the consignment with its kind and payee,
    so what landing a donation cost is kept beside it rather than in a contract price
    that does not exist.
  design_intent: 'Payee is the point: these are paid to customs and a clearing agent,
    not to the donor, and the form says so.'
  show: 'The Record a charge form, twice: a customs fee paid to Port customs (duty
    account) and a clearing charge paid to Lagoon Clearing & Forwarding, each in naira
    with its rate to dollars and the date paid. Then Halima moves the consignment
    to cleared. The frame is the consignment afterwards: status cleared, both charges
    itemised with who was paid.'
- id: harmattan-receives-and-refuses-two
  url: ${distributor_link_path}
  actions:
  - kind: wait_for
    target: css:summary:has-text('Record goods received')
  - kind: hover
    say: own link
    seconds: 1.4
    target: css:h2:has-text('What this link covers')
  - kind: click
    must_succeed: true
    target: css:summary:has-text('Record goods received')
  - kind: select
    target: css:#id_record_receipt-contract
    value: ${contract_id}
  - kind: select
    target: css:#id_record_receipt-supply_point
    value: ${warehouse_id}
  - kind: select
    target: css:#id_record_receipt-shipment
    value: ${shipment_id}
  - kind: fill
    target: css:#id_record_receipt-received_on
    value: ${today}
  - kind: fill
    say: goods-received note
    target: css:#id_record_receipt-reference
    value: HHS-GRN-2231
  - kind: fill
    target: css:#id_record_receipt-quantity_accepted
    value: '118'
  - kind: fill
    say: refuses two
    target: css:#id_record_receipt-quantity_rejected
    value: '2'
  - kind: select
    target: css:#id_record_receipt-unit_basis
    value: base
  - kind: fill
    say: cracked
    target: css:#id_record_receipt-rejection_reason
    value: Tap housing cracked in transit; unit leaks
  - kind: hold
    seconds: 1.2
  - kind: click
    must_succeed: true
    target: css:form:has(input[value=record_receipt]) button[type=submit]
    timeout_ms: 30000
  - kind: wait_for
    target: css:h2:has-text('Recorded through this link')
  - kind: hover
    seconds: 1.6
    target: css:h2:has-text('What this link covers')
  - kind: snapshot
    note: Harmattan's own link after the note is recorded, its header and the confirmation of 118 accepted and 2 refused in view
  concept_claim: The distributor records what arrived through its own update link,
    accepted and refused separately with a reason, and only the accepted units become
    stock.
  design_intent: 'The page is Harmattan''s, not the programme''s: it covers one order
    and three places, needs no login, and marks everything as reported by Harmattan.
    The refusal is typed on the line, with the reason the donor will ask for.'
  show: 'Harmattan Health Supplies'' own update link, no labs login. Under "What this
    link covers" it lists the ClearWater order and consignment and its three supply
    points. It opens "Record goods received" and fills it: the order, received at
    the Harmattan warehouse, from the consignment, note HHS-GRN-2231, 118 accepted
    and 2 rejected in single units, because the tap housings cracked in transit.'
- id: harmattan-releases-to-the-sites
  url: ${distributor_link_path}
  actions:
  - kind: wait_for
    target: css:summary:has-text('Record a release')
  - kind: click
    must_succeed: true
    say: Dawaki
    target: css:summary:has-text('Record a release')
  - kind: select
    target: css:#id_record_release-from_supply_point
    value: ${warehouse_id}
  - kind: select
    target: css:#id_record_release-to_supply_point
    value: ${dawaki_id}
  - kind: select
    target: css:#id_record_release-item
    value: ${item_id}
  - kind: fill
    target: css:#id_record_release-occurred_on
    value: ${today}
  - kind: fill
    target: css:#id_record_release-quantity
    value: '60'
  - kind: select
    target: css:#id_record_release-unit_basis
    value: base
  - kind: fill
    target: css:#id_record_release-reference
    value: HHS-REL-118
  - kind: click
    must_succeed: true
    target: css:form:has(input[value=record_release]) button[type=submit]
    timeout_ms: 30000
  - kind: wait_for
    target: css:h2:has-text('Recorded through this link')
  - kind: click
    must_succeed: true
    say: Rimi
    target: css:summary:has-text('Record a release')
  - kind: select
    target: css:#id_record_release-from_supply_point
    value: ${warehouse_id}
  - kind: select
    target: css:#id_record_release-to_supply_point
    value: ${rimi_id}
  - kind: select
    target: css:#id_record_release-item
    value: ${item_id}
  - kind: fill
    target: css:#id_record_release-occurred_on
    value: ${today}
  - kind: fill
    target: css:#id_record_release-quantity
    value: '50'
  - kind: select
    target: css:#id_record_release-unit_basis
    value: base
  - kind: fill
    target: css:#id_record_release-reference
    value: HHS-REL-119
  - kind: click
    must_succeed: true
    target: css:form:has(input[value=record_release]) button[type=submit]
    timeout_ms: 30000
  - kind: wait_for
    target: css:h2:has-text('Recorded through this link')
  - kind: scroll_to
    target: css:h2:has-text('Recorded through this link')
  - kind: hold
    seconds: 1.0
  - kind: hover
    seconds: 1.6
    target: css:h2:has-text('Recorded through this link')
  - kind: snapshot
    note: the link's own record, the goods-received note and both releases, each as Harmattan reported it
  concept_claim: A release from the warehouse to a site is recorded by the distributor
    through its link as a transfer in the same ledger, so durable equipment moves
    between named supply points like any other stock.
  design_intent: 'Two releases, one per site, each with the release-note number Harmattan
    uses; the link keeps its own read-back of everything recorded through it, so
    the distributor can see what the programme now sees.'
  show: 'On the same link Harmattan records two releases out of its warehouse: 60 dispensers
    to the Dawaki project site (HHS-REL-118) and 50 to the Rimi project site (HHS-REL-119).
    Under "Recorded through this link" the page reads back the goods-received note
    and both releases, newest first.'
- id: the-checks-list-is-clear
  url: /supply/checks/?program_id=10604
  actions:
  - kind: wait_for
    target: css:h2:has-text('What the record cannot answer'), h2:has-text('what is missing, in conflict')
  - kind: hold
    seconds: 1.2
  - kind: hover
    say: nothing left
    seconds: 2.0
    target: text:Nothing to report
  - kind: snapshot
    note: the checks list that opened the story, with nothing left for the consignment
  concept_claim: The checks that said the import was stuck clear themselves once the
    documents are on file and the goods are received, because they are derived from
    the same records rather than closed by hand.
  design_intent: 'The callback to the opening frame: the same list, the same heading,
    now empty. Nobody ticked anything off; the record stopped disagreeing with itself.'
  show: 'The checks list from the opening, now reading 0 checks and "Nothing to report".
    The lateness entry went when Harmattan''s note received the consignment, and the
    missing-documents entry when the last document was uploaded.'
- id: the-import-reconciles
  url: /supply/orders/${contract_id}/
  actions:
  - kind: wait_for
    target: css:span:has-text('Ordered · received')
  - kind: scroll_to
    target: css:#cost
  - kind: hold
    seconds: 1.0
  - kind: hover
    say: donated
    seconds: 1.4
    target: css:#match td:has-text('Ordered')
  - kind: hover
    say: refused
    seconds: 1.6
    target: css:#match td:has-text('Refused on arrival')
  - kind: hover
    say: cost to land
    seconds: 1.4
    target: css:#cost td:has-text('Landed total')
  - kind: hover
    say: held
    seconds: 1.8
    target: css:#where-now td:has-text('Held across')
  - kind: snapshot
    note: the order reconciled on one screen, what came, what was refused, what it cost to land, where it is now
  concept_claim: A donated import reconciles on its order, with the units accepted and
    refused on arrival and none still to come, the charges paid to land them, and
    where each accepted unit is held now.
  design_intent: 'The closing frame is arithmetic a funder can check: 120 in, 2 refused,
    118 held across three named places, and the only money spent is the landing charges.
    Equipment gets no months-of-stock figure.'
  show: 'ClearWater Action''s in-kind order CWA-DISP-2026-01. Its cost panel says
    the goods were donated and lists the customs fee and the clearing charge with
    their payees and a total. "Ordered · received" reads 120 ordered, 118 received,
    2 refused on arrival and 0 still outstanding. "Where they are now" gives the
    Harmattan warehouse, the Dawaki project site and the Rimi project site, held across
    three places.'
