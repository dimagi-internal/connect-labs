  concept_claim: A release from the warehouse to a site is a transfer in the same
    ledger, so durable equipment moves between named supply points like any other
    stock.
  design_intent: 'The same ledger for equipment as for consumables: out of one named
    place and into another, with the document it answers to.'
  show: 'The Post a movement form, twice: a transfer out of the Harmattan warehouse
    into the Dawaki project site (60) and one into the Rimi project site (50), each
    with Harmattan''s release-note number and marked as reported by a partner.'
  url: /supply/stock/movements/new/
- id: where-the-dispensers-are
  actions:
  - kind: wait_for
    target: css:h2:has-text('Stock across the network')
  - kind: hold
    seconds: 1.2
  - kind: hover
    say: balance
    seconds: 1.5
    target: css:tr:has-text('Dawaki project site') td:nth-child(2)
  - kind: hover
    say: months-of-stock
    seconds: 1.5
    target: css:tr:has-text('Rimi project site') td:nth-child(5)
  - kind: hover
    say: durable
    seconds: 1.5
    target: css:tr:has-text('Harmattan warehouse') span:has-text('durable')
  - kind: snapshot
    note: balances per site, durable, not forecast
  concept_claim: For durable equipment the stock view shows the balance at each site
    and declines to forecast consumption, months of stock or resupply.
  design_intent: The closing frame answers the question Halima started with — where
    are the dispensers — and shows the product refusing a meaningless number rather
    than inventing one.
  show: The stock page. The Harmattan warehouse and the Dawaki and Rimi project sites
    each show a ledger balance of dispensers; consumption, months of stock and resupply
    read "durable — not forecast", and each row is marked DURABLE — held, not consumed.
  url: /supply/stock/
