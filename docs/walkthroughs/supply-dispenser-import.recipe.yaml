base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-09-23T23:49:08.636022+00:00'
review_mode: autonomous
video_viewport_width: 1440
video_viewport_height: 900
setup:
  command: python scripts/walkthroughs/supply-dispenser-import/ensure_demo.py
  outputs: scripts/walkthroughs/supply-dispenser-import/outputs.json
  rerun: per_render
  timeout_seconds: 900
tagline: A donated import, from customs to the sites that hold it
why_brief: supply-dispenser-import.why_brief.yaml
scenes:
- id: the-checks-list-says-the-import-is-stuck
  actions:
  - kind: wait_for
    target: css:h2:has-text('What the record cannot answer')
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the checks list at rest, both entries for the consignment visible
  - kind: hover
    note: the lateness check, derived from the expected date on the consignment
    say: late
    seconds: 1.5
    target: css:a:has-text('Shipment past its expected date')
  - kind: hover
    note: the missing-documents check, naming who owes each
    say: documents
    seconds: 2.0
    target: css:a:has-text('Documents it needs, not on file')
  concept_claim: A late import and its missing documents are stated by the record
    itself, so the programme officer does not have to chase anyone to learn that the
    dispensers are stuck.
  design_intent: 'Open on the problem, not on a form: the list reads as facts, grouped
    by kind, each linking to the consignment. The two entries for one consignment
    are the reason the rest of the demo happens.'
  role: overview
  show: 'The programme''s checks list at /supply/checks/. Two entries are about the
    same ClearWater Action consignment: one says it is past its expected date and
    not received, the other lists the import documents that are not on file and the
    organisation that owes each.'
  url: /supply/checks/?program_id=10604
- id: the-consignment-and-who-owes-what
  actions:
  - kind: wait_for
    target: css:span:has-text('Documents it needs')
  - kind: hold
    seconds: 1.2
  - kind: hover
    say: on file
    seconds: 1.2
    target: css:li:has-text('Airway bill') span:has-text('on file')
  - kind: hover
    say: who owes it
    seconds: 1.4
    target: css:li:has-text('Packing list') span:has-text('owed by')
  - kind: hover
    seconds: 1.4
    target: css:li:has-text('Customs declaration') span:has-text('owed by')
  - kind: snapshot
    note: the checklist with owners, the late banner above it
  concept_claim: Each required document is listed against the consignment with its
    status and the organisation that owes it, so a follow-up goes to the right party.
  design_intent: 'The checklist is the page''s centre of gravity: one row per document,
    a clear on-file or outstanding chip, and the owing organisation in the same line.'
  show: 'The shipment page for the consignment: status at customs and in transit (not
    counted as stock), a warning that it is past its expected date, and the "Documents
    it needs" checklist — airway bill on file, owed by Kestrel Express Couriers; packing
    list and commercial invoice outstanding, owed by ClearWater Action; customs declaration
    outstanding, owed by Lagoon Clearing & Forwarding.'
  url: /supply/shipments/${shipment_id}/
- id: attaching-the-donors-documents
  actions:
  - kind: wait_for
    target: css:span:has-text('Documents it needs')
  - kind: click
    must_succeed: true
    say: packing list
    target: css:li:has-text('Packing list') a:has-text('Attach')
  - kind: wait_for
    target: css:#id_title
  - kind: fill
    target: css:#id_title
    value: Packing list CWA-PL-0412
  - kind: fill
    target: css:#id_external_url
    value: https://files.example.org/clearwater/CWA-PL-0412.pdf
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Attach')
    timeout_ms: 30000
  - kind: wait_for
    target: css:li:has-text('Packing list') span:has-text('on file')
  - kind: hold
    seconds: 1.0
  - kind: click
    must_succeed: true
    say: commercial invoice
    target: css:li:has-text('Commercial invoice') a:has-text('Attach')
  - kind: wait_for
    target: css:#id_title
  - kind: fill
    target: css:#id_title
    value: Commercial invoice CWA-CI-0412 (value for customs only)
  - kind: fill
    target: css:#id_external_url
    value: https://files.example.org/clearwater/CWA-CI-0412.pdf
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Attach')
    timeout_ms: 30000
  - kind: wait_for
    target: css:li:has-text('Commercial invoice') span:has-text('on file')
  - kind: hold
    seconds: 1.2
  - kind: snapshot
    note: both donor documents on file, the customs declaration still outstanding
  concept_claim: Attaching a document from its checklist line files it as that kind
    against this consignment and marks the line on file.
  design_intent: 'Start from the outstanding line, not from a blank form: the kind
    is pre-selected, so the only thing typed is what the document is and where it
    lives.'
  show: From the packing-list row's Attach link, the attach form opens with the document
    kind already chosen; Halima gives it a title and the link to the file, attaches
    it, and is back on the consignment with that line on file. She does the same for
    the commercial invoice.
  url: /supply/shipments/${shipment_id}/
- id: the-declaration-clears-the-check
  actions:
  - kind: wait_for
    target: css:span:has-text('Documents it needs')
  - kind: click
    must_succeed: true
    say: customs declaration
    target: css:li:has-text('Customs declaration') a:has-text('Attach')
  - kind: wait_for
    target: css:#id_title
  - kind: fill
    target: css:#id_title
    value: Customs declaration LCF-2026-7731
  - kind: fill
    target: css:#id_external_url
    value: https://files.example.org/lagoon/LCF-2026-7731.pdf
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Attach')
    timeout_ms: 30000
  - kind: wait_for
    target: css:li:has-text('Customs declaration') span:has-text('on file')
  - kind: hold
    seconds: 1.2
  - kind: goto
    say: checks list
    target: /supply/checks/
  - kind: wait_for
    target: css:h2:has-text('What the record cannot answer')
  - kind: hold
    seconds: 1.5
  - kind: hover
    seconds: 1.5
    target: css:a:has-text('Shipment past its expected date')
  - kind: snapshot
    note: the missing-documents entry gone; the lateness entry remains
  concept_claim: Once every required document is attached, the missing-documents check
    stops reporting the consignment, because the checklist and the check read the
    same rule.
  design_intent: 'The payoff of the paperwork beat is subtraction: an entry leaving
    the checks list, with the lateness entry still there because the goods have not
    moved yet.'
  show: Halima attaches the customs declaration from its row; the checklist now has
    nothing outstanding. Back on the checks list, the missing-documents entry for
    the consignment is gone and only the lateness entry remains.
  url: /supply/shipments/${shipment_id}/
- id: paying-to-land-it
  actions:
  - kind: wait_for
    target: css:span:has-text('Charges paid to land it')
  - kind: click
    must_succeed: true
    say: customs fee
    target: css:a.rounded-md:has-text('Record a charge')
  - kind: wait_for
    target: css:#id_kind
  - kind: select
    target: css:#id_kind
    value: customs_fee
  - kind: click
    target: css:#id_payee_org-ts-control
  - kind: type
    value: Port customs
  - kind: hold
    seconds: 0.8
    note: let the picker filter to what was typed before choosing
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_amount
    value: '410000'
  - kind: fill
    target: css:#id_currency
    value: NGN
  - kind: fill
    target: css:#id_fx_rate_to_usd
    value: '0.00065'
  - kind: fill
    target: css:#id_paid_on
    value: ${today}
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Record charge')
    timeout_ms: 30000
  - kind: wait_for
    target: css:td:has-text('Customs fee')
  - kind: click
    must_succeed: true
    say: clearing agent
    target: css:a.rounded-md:has-text('Record a charge')
  - kind: wait_for
    target: css:#id_kind
  - kind: select
    target: css:#id_kind
    value: clearing
  - kind: click
    target: css:#id_payee_org-ts-control
  - kind: type
    value: Lagoon
  - kind: hold
    seconds: 0.8
    note: let the picker filter to what was typed before choosing
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_amount
    value: '185000'
  - kind: fill
    target: css:#id_currency
    value: NGN
  - kind: fill
    target: css:#id_fx_rate_to_usd
    value: '0.00065'
  - kind: fill
    target: css:#id_paid_on
    value: ${today}
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Record charge')
    timeout_ms: 30000
  - kind: wait_for
    target: css:td:has-text('Clearing')
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: both charges itemised with their payees on the consignment
  concept_claim: A charge is recorded against the consignment with its kind and payee,
    and the shipment page itemises every charge paid to land it.
  design_intent: 'Payee is the point: these are paid to customs and a clearing agent,
    not to the donor, and the form says so in its help text.'
  show: 'The Record a charge form, twice: a customs fee paid to Port customs (duty
    account) and a clearing charge paid to Lagoon Clearing & Forwarding, each in naira
    with its rate to dollars and the date paid. The consignment''s "Charges paid to
    land it" panel then lists both, each naming its payee.'
  url: /supply/shipments/${shipment_id}/
- id: what-landing-a-donation-cost
  actions:
  - kind: wait_for
    target: css:span:has-text('Landed cost')
  - kind: hold
    seconds: 1.2
  - kind: hover
    say: not bought
    seconds: 1.4
    target: css:td:has-text('Goods')
  - kind: hover
    say: itemised
    seconds: 1.4
    target: css:td:has-text('Customs fee')
  - kind: hover
    seconds: 1.6
    target: css:td:has-text('Charges to land it')
  - kind: snapshot
    note: in-kind landed cost with the itemised charges
  concept_claim: For a donated order, landed cost states that the goods were not purchased
    instead of reporting a missing price, and still itemises every charge paid to
    land them.
  design_intent: 'Two different kinds of "no number": not purchased is a statement,
    not a gap, and sits beside real money that was paid.'
  show: The order page for ClearWater Action's in-kind order. Its landed-cost panel
    reads "not purchased (in kind)" for goods, freight, duty and VAT, then lists the
    customs fee and the clearing charge with their payees and a charges-to-land-it
    total in dollars.
  url: /supply/orders/${contract_id}/
- id: arrival-and-the-two-broken-units
  actions:
  - kind: wait_for
    target: css:a:has-text('Update status')
  - kind: click
    must_succeed: true
    say: clears
    target: css:a:has-text('Update status')
  - kind: wait_for
    target: css:#id_status
  - kind: select
    target: css:#id_status
    value: delivered
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Save')
    timeout_ms: 30000
  - kind: wait_for
    target: css:a:has-text('Record a receipt')
  - kind: click
    must_succeed: true
    say: goods-received note
    target: css:a:has-text('Record a receipt')
  - kind: wait_for
    target: css:#id_supply_point-ts-control
  - kind: click
    target: css:#id_supply_point-ts-control
  - kind: type
    value: Harmattan
  - kind: hold
    seconds: 0.8
    note: let the picker filter to what was typed before choosing
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_received_on
    value: ${today}
  - kind: fill
    target: css:#id_reference
    value: HHS-GRN-2231
  - kind: select
    target: css:#id_source
    value: partner_reported
  - kind: click
    target: css:#id_lines-0-item-ts-control
  - kind: type
    value: ClearWater
  - kind: hold
    seconds: 0.8
    note: let the picker filter to what was typed before choosing
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_lines-0-quantity
    value: '118'
  - kind: fill
    target: css:#id_lines-0-quantity_unit
    value: unit
  - kind: fill
    say: refuses two
    target: css:#id_lines-0-quantity_rejected
    value: '2'
  - kind: fill
    say: reason
    target: css:#id_lines-0-rejection_reason
    value: Tap housing cracked in transit; unit leaks
  - kind: click
    must_succeed: true
    target: css:form button[type=submit]:has-text('Record receipt')
    timeout_ms: 30000
  - kind: wait_for
    target: css:td:has-text('HHS-GRN-2231')
  - kind: scroll_to
    target: css:td:has-text('HHS-GRN-2231')
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the goods-received note with 118 accepted, 2 refused and the reason
  concept_claim: A goods-received note records accepted and refused units separately,
    with a reason for the refusal, and only the accepted units count as received.
  design_intent: The rejection is typed where it happened, on the line, with a reason
    the donor will ask for; provenance says Harmattan told us, not that we counted.
  show: 'Halima moves the consignment to delivered, then records Harmattan''s goods-received
    note: 118 accepted at the Harmattan warehouse and 2 refused because their tap
    housings cracked in transit, marked as reported by a partner. The order''s received
    table shows the note with the refused units and their reason.'
  url: /supply/shipments/${shipment_id}/
