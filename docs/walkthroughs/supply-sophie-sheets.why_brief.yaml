spine:
- id: S1
  claim: 'In Sophie''s tenders about half the suppliers asked never answer (Jonathan''s
    account); this demo''s tender 2 reconstructs that: of six asked 17 days ago, with
    the deadline four days off, three are silent through two reminders, and the three
    who answered sent one complete quote, one missing its pack, and questions instead
    of a price.'
  status: grounded
  evidence:
  - ref: EV-024
    kind: documented
  - ref: EV-007
    kind: implemented
  rationale: The silence and the partial answers are what make a tender hard to read
    from an inbox.
- id: S2
  claim: 'The tender reads as one sheet: a row per supplier asked, one stored value
    to a column (asked, replied, last chased, price, delivery term, pack, what is
    missing), with what is ours to do and whom we are waiting on side by side above
    it.'
  status: grounded
  evidence:
  - ref: 'PR 2244: connect_labs/templates/supply_chain/procurement/tender_detail.html
      (Suppliers sheet)'
    kind: implemented
  rationale: A clean table is the view Jonathan asked for in place of the email-led
    walkthrough.
- id: S3
  claim: 'Every stored value in a supply table is edited where it is read: click the
    cell, type, Enter. The write runs the operation the record''s form runs, so it
    is validated, attributed and kept in the record''s history; a quote corrected
    in a cell is a new version whose reason names the field and both values.'
  status: grounded
  evidence:
  - ref: 'PR 2244: connect_labs/supply_chain/cells.py, static/supply_chain/cell_edit.js'
    kind: implemented
  - ref: connect_labs/supply_chain/tests/test_cells.py
    kind: implemented
  rationale: A record people correct in place stays true; one that needs a form for
    every fix does not.
- id: S4
  claim: 'What the AI records from a forwarded email can be wrong in the way the rehearsal
    found most often: the day it was forwarded recorded as the day the supplier wrote.
    Sophie sees it against the email in the tender''s history and fixes it in the
    Quotes sheet.'
  status: gap
  evidence:
  - ref: 'project memory: supply lead story = tracking reality (rehearsal findings,
      2026-10-01)'
    kind: documented
  rationale: The 2026-10-01 rehearsal (12 invented emails recorded by an AI) showed
    forward-date-for-reply-date as a recurring fault; correcting the AI is part of
    the job, not an exception.
- id: S5
  claim: 'The comparison is a quote to a row, a fact to a column. Each gap is a cell,
    and filling a cell moves the quote: settling import duty in the grid, typing our
    freight estimate and Sahel''s exchange rate, and the landed column fills as each
    quote becomes comparable.'
  status: grounded
  evidence:
  - ref: 'PR 2250: comparison.html (quotes as rows); status.py comparison_grid edit
      targets'
    kind: implemented
  rationale: The comparison's payoff is watching the record become decidable, one
    fact at a time.
- id: S6
  claim: 'Answering a supplier is still an email Sophie sends from her own mailbox:
    Northgate''s three questions are drafted into one reply, and she marks it sent.'
  status: grounded
  evidence:
  - ref: tender_detail.html Draft emails; procurement_reply_sent
    kind: implemented
  rationale: Email is how suppliers are reached; it is one move in the record, not
    the record.
- id: S7
  claim: 'The order from tender 1 reads as sheets too: its shipment held at customs
    and its invoice billed above the agreed price, each a row; when the forwarder
    gives a new date, Sophie types it into the shipment''s row.'
  status: grounded
  evidence:
  - ref: 'PR 2244 (second commit): order_detail.html invoices and shipments edit in
      place'
    kind: implemented
  - ref: 'PR 2253 + 2268: the Expected cell saves on labs (DDD run supply-sophie-sheets-2026-10-06-001,
      iteration 3 render against deployed main d7049d2a1, all actions ok)'
    kind: implemented
  rationale: The record keeps tracking after the award, and stays correctable there.
- id: S9
  claim: 'Once it is delivered, the RUTF can be followed into the field: a central
    store feeds a partner store, which feeds each worker, and each worker''s stock
    falls as their visits give a ration to a child. Shown on the synthetic clone of
    the real RUTF opportunity, where the deliveries to workers are invented for the
    demo and say so.'
  status: grounded
  evidence:
  - ref: docs/superpowers/specs/2026-09-28-supply-stock-from-visits-design.md (dispensing
      rules turn submitted visits into consumption; belief rolls stock up the network)
    kind: documented
  - ref: connect_labs/supply_chain/stock/services/belief.py; /supply/network/ and
      /supply/workers/ views (program 10110, opportunity 10111, seeded by supply_seed_clone_supply)
    kind: implemented
  rationale: Procurement ends at the warehouse door only on paper; the buyer of record
    also answers for whether the food reached children.
- id: S8
  claim: 'Sophie''s overview says what her corrections changed: tender 2 from none
    comparable to most of its quotes comparable, its next move hers, the order''s
    move hers too.'
  status: grounded
  evidence:
  - ref: connect_labs/templates/supply_chain/home.html (procurements overview)
    kind: implemented
  rationale: The overview is where the work of the session shows.
problem: 'Sophie runs RUTF procurement for the Connect-RUTF program. Half the suppliers
  she asks never answer, and the ones who do each leave something out, so the facts
  she buys on arrive in pieces, by email, and are recorded for her by an AI from what
  she forwards. Her inbox cannot show her where a tender stands, and a record she
  can only read -- every correction a trip to a form -- is one she stops keeping.
  She needs one clear view of each tender, its quotes and its order, that she can
  correct where she reads it, and that answers back at once: what is now comparable,
  and whose move it is.'
narrative_slug: supply-sophie-sheets
