auth:
  check: test -f ~/.ace/labs-session.json && echo 'ready'
  inject_url: /labs/
  login: bash ~/.claude/plugins/cache/ace/ace/$(cat ~/.claude/plugins/marketplaces/ace/VERSION)/bin/ace-labs-walkthrough-login
  type: command
base_url: https://labs.connect.dimagi.com
capabilities:
- See every opportunity's weekly review compliance as one grid — opp rows, week columns,
  and a pinned aggregate that calls out SOP MET vs BELOW.
- Click any week cell to see who was flagged that week and what was done about it,
  in an inline panel with no page navigation.
- Drill from a flag to the underlying weekly review, the audit photo session, the
  follow-up task, and the full AI coaching transcript.
- Distinguish resolved weeks from weeks with open audits or tasks at a glance via
  the cell status pills.
getting_started:
- Open your program's Program Admin Report run from the workflow list at /labs/workflow/.
- Set the report window to the weeks you want to review and refresh the rollup.
- Click any week cell to inspect that week's flags, audits, and tasks; use 'Open the
  run' to reach the underlying weekly review.
narrative_locked: true
narrative_locked_at: '2026-06-12T02:36:28.030788+00:00'
prewarm: true
record_video: true
review_mode: human
setup:
  command: python scripts/walkthroughs/program-admin-report/ensure_env.py
  outputs: scripts/walkthroughs/program-admin-report/realized.json
  rerun: per_render
  timeout_seconds: 1800
tagline: One grid that tells a program admin which network managers ran their weekly
  review — and lets her drill from any cell down to the audit photos, the follow-up
  task, and the AI coaching conversation that resolved it.
video_pace: medium
video_viewport_height: 900
video_viewport_width: 1440
why_brief: ../../.canopy/ddd/runs/program-admin-report-2026-06-11-001/why_brief.yaml
why_summary: A program admin overseeing several network managers shouldn't have to
  open eight separate weekly reviews and cross-reference audits and tasks by hand
  to know whether the SOP is being run and flagged workers are being coached. The
  Program Admin Report rolls all of it into one grid, and because every cell links
  to the primary records — photos, tasks, transcripts — the rollup is verifiable,
  not just summarized.
scenes:
- id: amani-opens-the-week-s-review-the-flags-surface-themselves
  actions:
  - kind: wait_for
    must_succeed: true
    note: review table rendered (never networkidle on labs - the page long-polls)
    seconds: 60
    target: ${flagged_flw_manager}
  - kind: wait_for
    must_succeed: true
    note: auto-flag round-trip on a fresh run takes 15-25s; matches the 'SAM rate
      < 1%' / 'MAM rate < 3%' pill text
    seconds: 45
    target: text:rate <
  - kind: scroll_to
    note: bring the freshly flagged row into frame
    target: css:tr:has-text("${flagged_flw_manager}")
  - kind: hold
    seconds: 2
  concept_claim: Opening an in-progress weekly review automatically computes and persists
    quality flags for any worker whose submitted data trips a flag-catalog rule, with
    flag pills appearing in the table without any reviewer action.
  design_intent: 'Flag derivation belongs to the review itself, not to a separate
    "run checks" button — the reviewer''s first look at the table is already the triaged
    view. Bet: auto-flags-on-mount makes the SOP self-enforcing.'
  show: 'The in-progress weekly review page: per-FLW table with MUAC distribution,
    SAM/MAM rates and gender split per worker. Within seconds of page load, flag pills
    appear on the flagged worker''s row as the review derives and persists its quality
    checks automatically.'
  url: ${wk4_url}
- id: amani-sends-the-flagged-worker-s-photos-to-audit
  actions:
  - kind: click
    must_succeed: true
    note: row-scoped trigger - a fresh generation guarantees Create (not View) menus
    target: css:tr:has-text("${flagged_flw_manager}") button:has-text("Create Audit")
  - kind: hold
    note: menu-open dwell so the options are readable on film
    seconds: 1.5
  - kind: click_menu
    must_succeed: true
    target: Audit Last 7 days
  - kind: wait_for
    must_succeed: true
    note: audit page header - never networkidle (GDrive image streaming)
    seconds: 30
    target: Total Assessments
  - kind: wait_for
    must_succeed: true
    note: first photo decoded before the scene's final frame - landing mid-load shows
      five blank tiles; later photos get per-photo waits
    seconds: 30
    target: css:img[src*="/audit/image/"]
  - kind: hold
    note: settle so the loaded photo grid is what the scene ends on
    seconds: 2
  concept_claim: Choosing "Audit Last 7 days" from a flagged row's Create Audit menu
    creates a real audit session over that worker's recent assessment photos and navigates
    to it in one step.
  design_intent: Audit creation lives inside the review at the moment of suspicion
    — one menu pick, scoped to the worker and window — rather than in a separate audit
    app the manager has to context-switch into.
  show: From the flagged row's Actions cell, the Create Audit split-menu opens (flipping
    upward — the row sits at the bottom of the table) and "Audit Last 7 days" creates
    an audit of the worker's last week of photo assessments, landing on the audit
    page with the photos loading.
- id: amani-reviews-the-evidence-photo-by-photo
  actions:
  - kind: scroll_to
    target: css:.assessment-widget:nth-of-type(1)
  - kind: wait_for
    note: photos cold-fetch from GDrive - wait per photo, never all 5 up front
    seconds: 8
    target: css:.assessment-widget:nth-of-type(1) img
  - kind: click
    target: css:.assessment-widget:nth-of-type(1) button:has-text("Pass")
  - kind: scroll_to
    target: css:.assessment-widget:nth-of-type(2)
  - kind: wait_for
    seconds: 8
    target: css:.assessment-widget:nth-of-type(2) img
  - kind: click
    target: css:.assessment-widget:nth-of-type(2) button:has-text("Pass")
  - kind: scroll_to
    target: css:.assessment-widget:nth-of-type(3)
  - kind: wait_for
    seconds: 8
    target: css:.assessment-widget:nth-of-type(3) img
  - kind: click
    target: css:.assessment-widget:nth-of-type(3) button:has-text("Pass")
  - kind: scroll_to
    target: css:.assessment-widget:nth-of-type(4)
  - kind: wait_for
    seconds: 8
    target: css:.assessment-widget:nth-of-type(4) img
  - kind: click
    target: css:.assessment-widget:nth-of-type(4) button:has-text("Pass")
  - kind: scroll_to
    target: css:.assessment-widget:nth-of-type(5)
  - kind: wait_for
    seconds: 8
    target: css:.assessment-widget:nth-of-type(5) img
  - kind: click
    target: css:.assessment-widget:nth-of-type(5) button:has-text("Pass")
  - kind: hold
    seconds: 0.6
  - kind: wait_for
    must_succeed: true
    note: 'gate on the BUTTON flip, scoped to button: the page also has a static <h2>Complete
      Image Review</h2> section header that is always present, so an unscoped text:Complete
      Image Review matches that heading instantly and never waits for anything. The
      submit button''s label is computed from stats.pending (optimistic) - it reads
      ''Save Progress'' until all five Pass clicks register, then flips to ''Complete
      Image Review''. Scoping to button:has-text makes this a real gate on the flip.
      This is also the scene''s end-frame: all five photos decided and the Complete
      button now lit, i.e. the review itself - NOT the post-completion redirect (that
      is scene 3b, so this scene shows the beat it narrates).'
    seconds: 15
    target: css:button:has-text("Complete Image Review")
  - kind: hold
    note: settle on the reviewed grid (5 passed badges + Complete button enabled)
      so the snapshot captures the photo review, not a later state
    seconds: 1.5
  concept_claim: An auditor can review each assessment photo individually with a pass/fail
    decision per photo, and the audit only offers "Complete Image Review" once every
    photo has a decision.
  design_intent: Per-photo decisions (not one blanket verdict) keep the audit honest;
    the complete button's label flips from "Save Progress" only when the review is
    actually finished, so partial reviews stay visibly partial.
  show: 'The bulk assessment view: one widget per photo. Amani scrolls to each widget,
    waits for its image, and clicks Pass; the scene ends on the fully-reviewed grid
    with all five Pass badges and the Complete button now enabled.'
- id: amani-records-his-verdict-and-closes-out-the-review
  actions:
  - kind: wait_for
    must_succeed: true
    note: continue-scene on the same audit page (no goto) - re-assert the lit Complete
      button before committing.
    seconds: 15
    target: css:button:has-text("Complete Image Review")
  - kind: click
    must_succeed: true
    note: click the BUTTON, not the static <h2> header. An unscoped text:Complete
      Image Review resolves to the always-present section heading (a non-interactive
      <h2>), so completeAudit() never fires and the page never redirects. Scope to
      the button so the completion POST + workflow redirect run.
    target: css:button:has-text("Complete Image Review")
  - kind: wait_for
    must_succeed: true
    note: 'commit signal - on success completeAudit() redirects to the workflow list
      (/labs/workflow/). The recorder has NO url: target prefix (supported prefixes
      are css/text/testid/aria/role), so an old url:**/labs/workflow/** target was
      parsed as an auto/text match for a DOM element literally containing that string
      - which never exists, so it ALWAYS timed out regardless of whether the redirect
      fired. Wait instead for ''Workflows'', the visible heading on the workflow-list
      page (absent from the audit page, which only has a singular ''Back to Workflow''
      link). This confirms the completion POST landed AND the redirect navigated.
      Generous timeout: completeAudit awaits a synchronous S3 upsert + run-state POST,
      then the heavy workflow-list page renders (~5-8s).'
    seconds: 60
    target: text:Workflows
  - kind: hold
    seconds: 1.5
  concept_claim: Completing the image review records the auditor's verdict and returns
    them to the program's workflow list, closing the loop from "flag spotted" to "evidence
    reviewed" in one sitting.
  design_intent: The complete action is a deliberate commit - it only unlocks once
    every photo is decided, then finalizes the audit and hands the auditor back to
    the workflow overview so the next flagged worker is one glance away.
  show: Amani clicks the lit "Complete Image Review" button; the audit saves and the
    page returns to the workflow list.
- id: amani-turns-the-flag-into-a-coaching-task
  actions:
  - kind: goto
    note: return to the review - the audit lives on its own page
    target: ${wk4_url}
  - kind: wait_for
    must_succeed: true
    seconds: 60
    target: ${flagged_flw_manager}
  - kind: wait_for
    note: flags persisted in scene 1 re-render from the store
    seconds: 45
    target: text:rate <
  - kind: scroll_to
    target: css:tr:has-text("${flagged_flw_manager}")
  - kind: hold
    seconds: 1
  - kind: click
    must_succeed: true
    target: css:tr:has-text("${flagged_flw_manager}") button:has-text("Create Task")
  - kind: hold
    note: menu flips up - last table row
    seconds: 1.5
  - kind: click_menu
    must_succeed: true
    target: Coach on Flag implications
  - kind: wait_for
    must_succeed: true
    note: task page rendered - it long-polls AI sessions, so wait on text
    seconds: 30
    target: Initiate AI Assistant
  - kind: hold
    seconds: 2
  concept_claim: The "Coach on Flag implications" task item only appears on rows carrying
    a flag, and the task it creates pre-fills its description and coaching prompt
    from that row's actual flag labels.
  design_intent: Coaching should inherit its content from the evidence — composing
    the task from flag labels means the worker gets told exactly what tripped, not
    a generic "do better" note.
  show: The weekly review again, flag pills still on the row. The Create Task menu
    on the flagged row includes the flag-aware "Coach on Flag implications" item;
    choosing it creates a follow-up task whose description and coaching prompt are
    composed from the row's actual flag labels, and navigates to the task page.
- id: amani-hands-the-coaching-to-the-ai-assistant
  actions:
  - kind: click
    must_succeed: true
    target: css:button:has-text("Initiate AI Assistant")
  - kind: wait_for
    must_succeed: true
    note: textarea pre-fills from the coaching prompt
    seconds: 15
    target: css:textarea[placeholder="Instructions for the bot..."]
  - kind: wait_for
    note: bot list loaded - wait on the SELECT containing the option, never the option
      itself (options in a closed select are invisible to visibility waits and burn
      the full timeout as frozen film)
    seconds: 10
    target: css:select:has(option[value="synthetic-muac-coaching"])
  - kind: select
    must_succeed: true
    note: native select - never click it; scope to the bot select (the task page has
      other <select>s, e.g. Status) or select_option lands nowhere
    target: css:select:has(option[value="synthetic-muac-coaching"])
    value: synthetic-muac-coaching
  - kind: hold
    seconds: 1
  - kind: click
    note: focus the prompt to edit it
    target: css:textarea[placeholder="Instructions for the bot..."]
  - kind: press
    note: caret to end of textarea - ControlOrMeta+End does NOT move the caret in
      a textarea on darwin (typed mid-word in iter0); Cmd+ArrowDown does
    value: ControlOrMeta+ArrowDown
  - kind: press
    note: then end-of-line, so the append lands after the final character
    value: End
  - kind: type
    note: the manager tailors the AI's tone
    value: ' Please be friendly.'
  - kind: hold
    seconds: 1
  - kind: click
    must_succeed: true
    note: exact-name match - NOT the outer 'Initiate AI Assistant' button
    target: role:button:Initiate AI
  - kind: wait_for
    must_succeed: true
    note: modal reloads the page ~2s after success
    seconds: 30
    target: Coaching Conversation
  - kind: scroll_to
    target: Coaching Conversation
  - kind: hold
    seconds: 3
  concept_claim: Initiating the AI assistant from a coaching task starts a bot conversation
    seeded from the task's pre-composed coaching prompt, and the resulting conversation
    is persisted on the task page.
  design_intent: 'The manager curates, the AI executes: a human-editable pre-filled
    prompt keeps the manager in control of tone while the bot does the follow-up legwork
    — and the transcript living on the task makes the coaching auditable upstream.'
  show: 'The "Initiate AI Assistant" modal: the instruction textarea arrives pre-filled
    from the task''s coaching prompt, the bot dropdown offers the MUAC coaching bot,
    Amani appends a short instruction of his own, clicks "Initiate AI", and the task
    page now shows the Coaching Conversation panel with the opening exchange.'
- id: priya-sees-the-whole-program-at-a-glance
  actions:
  - kind: wait_for
    must_succeed: true
    note: PAR content marker - the page background-polls its snapshot, never networkidle
    seconds: 60
    target: Window aggregate
  - kind: hover
    note: park the cursor on the top-strip window summary - neutral whitespace off
      the breadcrumb and off the grid cells
    target: text:opportunities watched
  - kind: hold
    note: let the viewer read both rows and the aggregate
    seconds: 4
  concept_claim: The Program Admin Report renders every watched opportunity's weekly
    reviews as one grid of week cells whose status pills distinguish clean runs, fully
    resolved weeks, weeks with open work, and missed weeks.
  design_intent: Compliance and follow-through are different questions — the cell
    separates "did the run happen" (RAN / NO RUN) from "was the work finished" (Clean
    / All resolved / N open) so neither hides the other.
  show: 'The completed Program Admin Report: opportunity rows by week columns plus
    the Window aggregate column. Each ran week is a card with a status pill (Clean
    run / All resolved / open-count) and Flagged/Audits/Tasks KPI bars; a missed week
    shows a red NO RUN card.'
  url: ${par_url}
- id: priya-clicks-into-a-resolved-week
  actions:
  - kind: click
    must_succeed: true
    note: the resolved-week card in the good cluster's row, targeted by its printed
      date (e.g. "May 25") — once resolved records are reconciled the good cluster
      can have more than one "All resolved" week, so click the exact drill week, not
      the first resolved cell (same precision scene 12 uses for the incomplete week).
    target: 'css:div[style*="grid-template-columns"]:has-text("${good_opp_label}")
      div[style*="cursor: pointer"]:has-text("${good_week_label}")'
  - kind: wait_for
    must_succeed: true
    note: panel header proves the intended run was selected
    seconds: 10
    target: 'text:Run #${good_run_id}'
  - kind: scroll_to
    target: 'text:Audit #${good_audit_id}'
  - kind: hover
    note: the panel insertion shifts rows under a parked cursor (it ended up on the
      OTHER cluster's cell in iter0) - re-park on the panel's header chrome
    target: text:Run detail
  - kind: hold
    seconds: 3
  concept_claim: Clicking a week cell opens an inline detail panel under that row
    listing each flagged worker with direct links to their audit and task records,
    without navigating away from the report.
  design_intent: 'Drill-down keeps the admin''s context: the grid stays on screen
    while the panel answers "who and what" — navigation is reserved for when she wants
    the primary records themselves.'
  show: 'Clicking the resolved week cell in the first cluster''s row opens the inline
    run-detail panel beneath the row: flagged workers sorted first, each with their
    flag labels and links to the exact audit and task records with their outcomes.'
- id: priya-opens-the-run-behind-the-cell
  actions:
  - kind: click
    must_succeed: true
    target: Open the run
  - kind: wait_for
    must_succeed: true
    seconds: 30
    target: FLW-Level Analysis
  - kind: wait_for
    seconds: 12
    target: css:tbody tr
  - kind: scroll_to
    note: the flagged row - its buttons flipped to View because the records exist
    target: css:tr:has-text("View Audit")
  - kind: hold
    seconds: 2.5
  concept_claim: The detail panel's "Open the run" link lands on the underlying weekly
    review, whose action buttons are state-aware — rows with an existing audit or
    task show View buttons instead of Create menus.
  design_intent: 'One artifact serves both roles: the manager''s working surface IS
    the admin''s evidence page, with button state encoding what happened so nobody
    re-opens records to learn the outcome.'
  show: 'The underlying weekly nutrition review: per-FLW table with the metrics and
    flag pills, and a state-aware Actions column — the flagged worker''s buttons read
    "View Audit" and "View Task" because those records now exist, while clean rows
    offer their usual actions.'
- id: priya-checks-the-photos-the-auditor-saw
  actions:
  - kind: click
    must_succeed: true
    target: View Audit
  - kind: wait_for
    note: assessment count header
    seconds: 15
    target: Showing 5 assessment
  - kind: wait_for
    note: GDrive cold fetch - generous budget, no pre-warm pass in the DDD render
    seconds: 20
    target: css:img[src*="/audit/image/"]
  - kind: hold
    seconds: 4
  concept_claim: The View Audit drill lands on the completed audit session where every
    reviewed photo and its per-photo pass/fail decision are visible on one page.
  design_intent: 'Verifiability is the product: the admin sees the same photos the
    auditor judged, so trust in the rollup is earned by inspection, not asserted.'
  show: 'The audit page for the drilled worker: the assessment count header and the
    photo thumbnails, each labeled with its per-photo decision, with the audit''s
    overall verdict.'
- id: priya-reads-the-coaching-conversation-that-closed-the-loop
  actions:
  - kind: goto
    note: 'direct drill - same record the panel''s Task # link points at'
    target: ${task_good_url}
  - kind: wait_for
    must_succeed: true
    seconds: 15
    target: Closed
  - kind: scroll_to
    must_succeed: true
    target: Coaching Conversation
  - kind: hold
    seconds: 5
  - kind: scroll
    note: reveal more of the transcript
    value: '350'
  - kind: hold
    seconds: 3
  concept_claim: A closed coaching task retains its full AI coaching transcript on
    the task page, so a resolution can be read end-to-end rather than trusted from
    a status label.
  design_intent: '"A task was created" is not accountability — the transcript surviving
    on the task is what lets the admin audit the quality of the coaching, not just
    its existence.'
  show: 'The closed task page: the Closed status with its outcome, and below it the
    Coaching Conversation panel with the full bot/worker back-and-forth that resolved
    the flag. Priya scrolls through the transcript.'
- id: now-the-harder-case-the-week-with-open-work
  actions:
  - kind: wait_for
    must_succeed: true
    seconds: 60
    target: Window aggregate
  - kind: click
    must_succeed: true
    note: the incomplete week's cell in the other cluster's row, targeted by its printed
      date (e.g. "Jun 1") so we land on the exact open-work week the drill scenes
      need — not merely the first cell that happens to say "open" (the incomplete
      opp can carry open work on several weeks).
    target: 'css:div[style*="grid-template-columns"]:has-text("${incomplete_opp_label}")
      div[style*="cursor: pointer"]:has-text("${incomplete_week_label}")'
  - kind: wait_for
    must_succeed: true
    seconds: 10
    target: 'text:Run #${incomplete_run_id}'
  - kind: scroll_to
    note: center the panel HEADER, not the audit link - scrolling to the link leaves
      a quarter-viewport of dead space below the panel; this keeps the amber cell
      and its panel co-visible
    target: 'text:Run #${incomplete_run_id}'
  - kind: hover
    note: park on the panel's header chrome, off the grid cells and record links
    target: text:Run detail
  - kind: hold
    seconds: 3
  concept_claim: The open-work cell's detail panel distinguishes flagged workers whose
    cases are closed from those still under investigation, naming the specific open
    audit and task records.
  design_intent: The amber path is where the report earns its keep — surfacing "the
    manager is doing the right things but this one worker is still pending" without
    Priya reading a single weekly review.
  show: Back on the report, the amber-bordered open-work cell in the second cluster's
    row. Clicking it opens the detail panel listing several flagged workers with different
    fates — suspended repeat offenders with closed records, and one worker whose audit
    and task are still open.
  url: ${par_url}
- id: priya-inspects-the-audit-still-in-review
  actions:
  - kind: click
    must_succeed: true
    note: the panel links audits by id
    target: 'text:Audit #${incomplete_audit_id}'
  - kind: wait_for
    must_succeed: true
    note: the in-review marker (vs Complete Image Review)
    seconds: 20
    target: Save Progress
  - kind: wait_for
    must_succeed: true
    note: first decoded thumbnail before the holds - some photos are pending placeholder
      cards by design, but a frame with NO decoded photos reads as a broken page
    seconds: 30
    target: css:img[src*="/audit/image/"]
  - kind: hold
    note: settle before the read hold
    seconds: 1.5
  - kind: hold
    seconds: 4
  concept_claim: An in-review audit page shows per-photo progress and offers "Save
    Progress" instead of "Complete Image Review" until every photo has a decision.
  design_intent: No ambiguity between "no decision yet" and "decision in progress"
    — the same per-photo model that drove the manager's review tells the admin exactly
    how much is left.
  show: 'The in-review audit page: photo cards in mixed states — decided ones carrying
    their badges, the rest undecided — and the action button reading "Save Progress"
    because the review isn''t finished.'
- id: priya-checks-on-the-coaching-mid-conversation
  actions:
  - kind: goto
    note: 'direct drill - same record the panel''s Task # link points at'
    target: ${task_incomplete_url}
  - kind: wait_for
    must_succeed: true
    note: the still-open task's action button
    seconds: 15
    target: Close Task
  - kind: scroll_to
    must_succeed: true
    target: Coaching Conversation
  - kind: hold
    seconds: 5
  concept_claim: An open coaching task shows its in-progress conversation transcript
    and its current investigation status, so the state of an unresolved case is readable
    directly from the task page.
  design_intent: 'Mid-flight visibility: the admin can distinguish "coaching is happening"
    from "coaching stalled" by reading the actual exchange, which is the difference
    between waiting and intervening.'
  show: 'The investigating task page: the task still open with its Close Task action
    available, and the Coaching Conversation panel showing the opening messages of
    an unfinished exchange.'
- id: priya-returns-to-the-aggregate-and-makes-her-call
  actions:
  - kind: wait_for
    must_succeed: true
    seconds: 60
    target: Window aggregate
  - kind: scroll_to
    target: Window aggregate
  - kind: hover
    note: northern's aggregate card (its runs-count line, beside the SOP MET pill)
      - the healthy side of the contrast; gives the closing beat motion distinct from
      scene 6
    seconds: 2
    target: text:4/4 runs
  - kind: hold
    seconds: 1.5
  - kind: hover
    note: southern's aggregate card - the BELOW side; cursor rests beside the pill,
      NOT on the WINDOW AGGREGATE header
    seconds: 2
    target: text:3/4 runs
  - kind: hold
    note: the demo's closing frame - the SOP MET vs BELOW contrast
    seconds: 3
  concept_claim: The aggregate column summarizes each opportunity's window with an
    SOP MET or BELOW verdict plus run, flag, and outcome counts, making the two clusters'
    health directly comparable on one screen.
  design_intent: 'The weekly ritual is the design target: sixty seconds on this screen
    tells the admin whether her managers are doing the work and where to intervene
    — and every claim on it has a drill path behind it.'
  show: 'The Program Admin Report with the Window aggregate column in frame: each
    cluster''s aggregate card carries its SOP MET or BELOW pill with runs completed,
    flag totals, and outcome counts side by side.'
  url: ${par_url}
