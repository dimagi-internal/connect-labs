auth:
  # Off-camera personas. dev-login is a hard 403 outside DEBUG — /supply/ has open
  # registration on a public host, so an endpoint that logs a caller in as a
  # procurement admin without a password is only defensible while it refuses in
  # production. So each persona is signed in through the REAL form before
  # recording starts, in a throwaway context, and the recorder swaps cookies
  # before a scene's nav when its `persona:` changes. No login is ever filmed.
  #
  # The password is read from $SUPPLY_DEMO_PASSWORD. The repo's own demo password
  # is deliberately rejected on the deployed site, and a committed spec must not
  # carry a credential either way.
  type: form
  login_url: /supply/login/
  fields:
    email: input[name="email"]
    password: input[name="password"]
  submit: button[type="submit"]
  # Only renders once signed in, so a failed login aborts the render instead of
  # filming a logged-out shell that reads as a product bug.
  success: .navitem
  password_env: SUPPLY_DEMO_PASSWORD
  personas:
    dale: usg@oes.example
    hauwa: gov-ng@oes.example
base_url: https://labs.connect.dimagi.com
narrative_locked: true
review_mode: autonomous
why_brief: oes-money-to-child.why_brief.yaml
tagline: What the money bought, without the collapse that makes most dashboards untrustworthy
setup:
  command: python scripts/walkthroughs/oes/ensure_demo.py
  rerun: per_render
  timeout_seconds: 600
scenes:
- id: what-the-money-bought-without-the-collapse
  concept_claim: Obligated, disbursed and delivered stay three separate figures per contract and are never
    summed into one completion number.
  role: overview
  url: /supply/
  show: Dale's funder view — obligated, disbursed and delivered as separate figures in the key row and
    as their own bars per contract in the table, never summed into a single completion percentage.
  actions:
  - kind: wait_for
    target: css:.keyfigures
  - kind: hold
    seconds: 2.2
  - kind: scroll_to
    target: css:.card:has-text('Stage by stage, per contract')
    note: the per-contract stage bars — the ACTUAL evidence for this scene's claim, and a
      shape used nowhere else in the run. Framing the key figures instead left scene 1 and
      scene 2 as the same capture 179px apart (mean abs diff 2.3/255), and the bars that
      carry the claim appeared in no frame at all.
  - kind: hold
    seconds: 2.6
  impressive_because: Money can be committed against a contract, paid to a supplier, and still not be
    food in a warehouse. The distance between those stages is exactly where the programmatic risk sits,
    and most reports fold them into whichever number looks best.
  ai_quality: Three stages are separately rendered per contract; disbursed never exceeds obligated.
- id: the-diagram-conserves-or-it-is-a-graphic
  concept_claim: Each contract links to its own appropriation so the funding flow conserves, and unattributable
    value is shown as its own band rather than dropped.
  url: /supply/
  show: The funding flow — appropriation to partner to country — where each contract links to its own
    envelope and the totals reconcile at every stage, with any unattributable value shown as its own labelled
    band.
  actions:
  - kind: scroll_to
    target: css:.sankey
  - kind: wait_for
    target: css:.sankey
  - kind: hold
    seconds: 2.6
  impressive_because: Attribute every contract to the first envelope and the diagram stops conserving
    the moment there is more than one — the specific failure that makes a funding chart decorative rather
    than checkable.
  ai_quality: Flows out of each appropriation sum to its obligated total; nothing is silently dropped.
- id: cost-per-child-with-its-method-on-screen
  concept_claim: The unit ladder carries its conversion and its exclusions in the same frame as the cost-per-child
    figure, so the number can be challenged.
  url: /supply/
  show: The unit ladder — dollars to metric tonnes to cartons to children — with the conversion and the
    cost per child treated written directly underneath it, including what it excludes.
  actions:
  - kind: scroll_to
    target: css:.card:has-text('What a dollar bought')
  - kind: hold
    seconds: 2.0
  - kind: scroll_to
    target: css:.card:has-text('What a dollar bought') .ladder-result
    note: the ladder's CONCLUSION — the cost per child, at figure size. It used to be one
      bolded number inside a five-line grey method paragraph, which was both the thing the
      scene is about and the least readable text on the page; the method now sits behind an
      "i" on that line. A bare .method-note also matched a later card and scrolled the frame
      onto the closing scene's payoff.
  # The scene is titled "with its method on screen" — so the method must BE on
  # screen: the "i" is opened on camera rather than left as an unopened 10px
  # affordance the trace never touches.
  - kind: click
    target: css:.card:has-text('What a dollar bought') .ladder-result-label .infonote-btn
    note: the method, opened on camera — the conversion, the exclusions, and what the figure does not claim
  - kind: hold
    seconds: 2.4
    note: the method, in the same frame as the number
  impressive_because: A reader who can see the conversion can see exactly what the figure claims and what
    it does not. That is what makes it a number you can argue with rather than one you either accept or
    discard.
  ai_quality: The stated method matches the rendered arithmetic, and names the exclusion (consignments
    in transit) rather than glossing it.
- id: nigerias-own-view-scoped-on-the-server
  concept_claim: A government observer's country filter is applied when the payload is built, so another
    country's consignments never reach the page.
  url: /supply/
  show: Hauwa's country view — the flows entering and moving within Nigeria, and nothing else. Another
    country's consignments are not hidden on this page; they were never in the payload.
  actions:
  - kind: wait_for
    target: css:.page
  - kind: hold
    seconds: 1.8
  - kind: click
    target: css:.navitem:has-text('Country overview')
    note: Hauwa opens her own country view
  - kind: wait_for
    target: css:.data-table
  # Two beats, and neither scrolls the PAGE sideways: scroll_to on the wide
  # .data-table itself horizontally scrolled the document, clipping the app
  # title and the left rail out of every frame from here to the end of the arc.
  # The page head carries the scope ('Nigeria — supply overview' + the KPI
  # band); the wrap is the table's own scroll container and sits inside the
  # content column, so targeting it keeps x at zero.
  - kind: scroll_to
    target: css:.page-head
  - kind: hold
    seconds: 1.4
  # The scope marker itself, opened. "Scoped to Nigeria" is a claim about a
  # filter applied off-screen, and a screenshot cannot distinguish a scoped
  # payload from a page that happens to hold less. The chip's own note states
  # where the boundary was drawn and that nothing on the page widens it.
  - kind: click
    target: css:.page-actions .infonote-btn
    note: the scope marker, opened on camera — the one artifact that can carry a server-side claim
  # THE CANONICAL FRAME IS THE OPEN SCOPE MARKER, and it has to be, because it is
  # the only element on the page that can carry the claim. A frame of the
  # consignment list cannot: a table with no other country in it looks exactly
  # like a table from a single-country programme, so an absence proves nothing.
  # The previous take opened the marker, CLOSED it, then scrolled away and
  # snapshotted the list — leaving the arc's strongest assertion resting entirely
  # on the voiceover.
  - kind: snapshot
    note: 'the canonical frame: the scope marker open — applied at source, from this account''s own
      country assignment, with nothing on the page that widens it'
  - kind: hold
    seconds: 3.2
    note: applied at source, from this account's own country assignment
  # Scrolling now dismisses the note by itself (see primitives.InfoNote), so it
  # cannot follow the camera into the frames that come after it.
  - kind: scroll_to
    target: css:.card:has-text('Who is delivering what, where') .card-head
    note: and then the consignments themselves — Nigeria only, framed with the header row
  - kind: hold
    seconds: 2.4
    note: Nigeria only — the rest was never in the payload
  impressive_because: The first question a government counterpart asks about a shared dashboard is what
    else it can see, and "the browser hides it" is not an answer that survives contact.
  ai_quality: Only Nigerian nodes and consignments appear; the scoping is evidently server-side rather
    than a filter control.
- id: coverage-by-district-not-tonnage-delivered
  concept_claim: Coverage measured against caseload tells apart two deliveries of the same size into
    different caseloads, which tonnage cannot.
  url: /supply/
  show: The Coverage by district card on the government view — Borno at IPC 5 with its caseload, the courses
    actually delivered, the coverage percent and the children still uncovered, beside Yobe which has received
    nothing at all.
  actions:
  - kind: scroll_to
    target: css:.card:has-text('Coverage by district')
  - kind: hold
    seconds: 2.6
  # The provenance moved off a native title= hover (OS-rendered, invisible in a
  # capture) onto the product's own InfoNote button — so the estimate's source
  # is now OPENED on camera and stays readable through the hold.
  - kind: click
    target: css:.card:has-text('Coverage by district') tr:has-text('Borno') .infonote-btn
    note: how this caseload was estimated — opened on camera, not a hover
  - kind: hold
    seconds: 1.6
  impressive_because: Two deliveries of the same size into different caseloads look identical in tonnes.
    With the caseload as the denominator they do not, and that difference is where the state puts its
    own resources.
  ai_quality: Coverage is computed over a stated window; every district carries the source note for its
    caseload.
- id: the-number-everyone-quotes-tested
  concept_claim: Courses delivered and recorded recoveries are reported side by side with their methods
    and never reconciled, so the gap between shipped and known-to-have-worked is visible.
  url: /supply/
  show: Back on the funder view — courses delivered and recorded recoveries side by side with their methods,
    the observed recovery rate and the discharge breakdown beneath, and one delivered batch followed through
    to a child's MUAC series climbing out of the red.
  actions:
  # An explicit settle on the funder page before anything is framed. The scene
  # opened on the PREVIOUS persona's scroll position, so its first frame was
  # stale Nigeria-view state under funder narration.
  - kind: wait_for
    target: css:.page
  - kind: wait_for
    target: css:.two-figures
  - kind: hold
    seconds: 1.2
  - kind: scroll_to
    target: css:.card:has-text('Children treated')
  - kind: hold
    seconds: 2.8
    note: two figures, two methods, never reconciled into one
  - kind: scroll_to
    target: css:.two-figures
  - kind: hold
    seconds: 1.8
  # THE CANONICAL FRAME IS THE TWO FIGURES AND THE DISCHARGE TABLE, not the
  # batch modal. The scene's claim is that the two numbers are reported side by
  # side and never reconciled — and the modal, when open, covers the entire card
  # that carries them. Snapshotting inside the modal left every figure the
  # narration names (the courses delivered, the recovered-of-discharged pair, the
  # observed rate, the defaulters and transfers) behind the thing the scene had
  # just opened. The modal is the payoff BEAT; the card is the frame.
  - kind: snapshot
    note: 'the canonical frame: the two figures, two methods, side by side and never reconciled
      into one'
  - kind: hold
    seconds: 1.6
  # The discharge breakdown gets its OWN framed beat rather than sharing the
  # canonical frame. The card is taller than a viewport, so a single scroll that
  # tries to hold both leaves whichever is second below the fold — the previous
  # take asked for both and captured only the figures, so the narration's
  # "defaulters and inpatient transfers shown alongside" landed on a frame that
  # did not contain them. The LAST row is the scroll target, because scrolling to
  # the table itself is a no-op once its first rows are already in view.
  - kind: scroll_to
    target: css:.card:has-text('Children treated') tr:has-text('Non-response')
  - kind: hold
    seconds: 2.6
    note: every discharge category, including the zeroes — the Sphere band the sector grades on
  - kind: scroll_to
    target: css:.figure-drill
  - kind: click
    target: css:.figure-drill button
    note: follow the batch to the children behind the gap. The endpoint and the chart both
      existed and were reachable only from the implementing partner's page, so the one
      human image in this narrative had no route to the funder who narrates it.
  - kind: wait_for
    target: css:.modal
  - kind: wait_for
    target: css:.outcome-row
  - kind: hold
    seconds: 1.4
  # The focused child leads the list and is the one with the largest climb; the
  # batch is now selected for having recorded recoveries in it (see
  # tab_funder.TwoFiguresAndTheGap), so the narrated "out of the red" has a
  # series that actually crosses 125 mm.
  - kind: hold
    seconds: 3.2
    note: one child's arm circumference climbing out of the red, with the sample size stated beside
      it rather than a rate implied from it
  impressive_because: '"Children treated" is almost always cartons divided by a treatment factor — arithmetic
    presented as an outcome. The gap between that and a measured recovery is the most useful thing on
    the screen, and a funder who can see it is being told the truth.'
  ai_quality: Both figures carry distinct labels and methods; the discharge breakdown sums to the observed
    cohort; the synthetic label is present in the same frame.
