auth:
  personas:
    sophie: scripts/walkthroughs/supply-sophie-unanswered-round/.sophie-storage-state.json
  type: storage_state
base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-10-06T14:45:55.637881+00:00'
review_mode: autonomous
setup:
  command: python3 scripts/walkthroughs/supply-sophie-unanswered-round/seed.py --outputs
    scripts/walkthroughs/supply-sophie-unanswered-round/outputs.json
  outputs: scripts/walkthroughs/supply-sophie-unanswered-round/outputs.json
  rerun: per_render
  timeout_seconds: 1200
tagline: The record, read and corrected where it sits
video_pace: medium
video_viewport_height: 900
video_viewport_width: 1440
why_brief: supply-sophie-sheets.why_brief.yaml
scenes:
- id: the-record-not-the-inbox
  actions:
  - kind: wait_for
    target: testid:stage-bar
  - kind: snapshot
  concept_claim: A tender where half the suppliers never answered becomes decidable
    when its record can be read at a glance and corrected where it is read.
  design_intent: Pose the question every later scene answers, before any screen is
    demoed.
  role: overview
  show: The tender's page, behind the opening title card.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}
- id: one-sheet
  actions:
  - kind: wait_for
    target: testid:supplier-table
  - kind: scroll
    value: top
  - kind: snapshot
  concept_claim: The tender's suppliers read as one sheet -- a row each, one value
    to a column -- so where every supplier stands is read without opening an email.
  show: The tender page's moves above the Suppliers sheet.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}
- id: fix-what-the-ai-recorded
  actions:
  - kind: click
    target: css:#quotes
  - kind: wait_for
    target: testid:quotes-table
  - kind: click
    target: css:[data-testid=quote-row]:has-text('Sahel') [data-edit$=':received_on']
  - kind: fill
    target: css:[data-edit$=':received_on'] input
    value: ${sahel_email_date_iso}
  - kind: press
    value: Enter
  - kind: wait_for
    target: css:.is-saved
  - kind: snapshot
  before: python3 scripts/walkthroughs/supply-sophie-unanswered-round/seed.py --sahel-replies --sahel-forward-date
  concept_claim: A fact the AI recorded wrongly is corrected in the cell that shows
    it, and the correction is kept as a new version with its reason.
  show: The tender's History beside the Quotes sheet, Sahel's Received cell corrected
    in place.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}#quotes
- id: kanems-pack
  actions:
  - kind: wait_for
    target: testid:supplier-table
  - kind: click
    target: css:[data-testid=supplier-row]:has-text('Kanem') [data-edit$=':base_per_pack_stated']
  - kind: fill
    target: css:[data-edit$=':base_per_pack_stated'] input
    value: '150'
  - kind: press
    value: Enter
  - kind: wait_for
    target: css:.is-saved
  - kind: snapshot
  concept_claim: A missing fact the supplier has given is filled in the row that lacked
    it, and the row stops saying it is missing.
  show: The Suppliers sheet, Kanem's Pack cell filled and its Missing chip gone.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}#outreach
- id: fill-the-comparison
  actions:
  - kind: wait_for
    target: testid:comparison-grid
  - kind: click
    target: css:[data-testid=grid-quote-row]:has-text('Harmattan') td[data-fact=duty]
  - kind: select
    target: css:td[data-fact=duty] select
    value: we import, under the program's duty waiver
  - kind: wait_for
    target: css:.is-saved
  - kind: click
    target: css:[data-testid=grid-quote-row]:has-text('Sahel') td[data-fact=freight]
  - kind: fill
    target: css:td[data-fact=freight] input
    value: '2.40'
  - kind: press
    value: Enter
  - kind: wait_for
    target: css:.is-saved
  - kind: click
    target: css:[data-testid=grid-quote-row]:has-text('Sahel') td[data-fact=fx]
  - kind: fill
    target: css:td[data-fact=fx] input
    value: '1.08'
  - kind: press
    value: Enter
  - kind: wait_for
    target: css:.is-saved
  - kind: snapshot
  concept_claim: Each gap in the comparison is a cell, and filling it moves that quote
    toward a landed price that can be compared with the others.
  show: The comparison, a quote to a row, as import duty, freight and the exchange
    rate are filled in its cells.
  url: /supply/procurement/tenders/${round2_tender_id}/compare/?program_id=${program_id}
- id: one-email
  actions:
  - kind: wait_for
    target: css:#drafts
  - kind: click
    target: css:[data-testid=reply-sent-form] button
  - kind: snapshot
  concept_claim: What the record says she owes a supplier is drafted as one email
    for her own mailbox, and sending it is one more fact in the record.
  show: The reply drafted to Northgate's three questions, marked sent.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}#drafts
- id: the-order-as-sheets
  actions:
  - kind: wait_for
    target: css:#invoices
  - kind: click
    target: 'css:#shipments-fold > summary'
  - kind: click
    target: css:[data-edit^='shipment:'][data-edit$=':expected_on']
  - kind: fill
    target: css:[data-edit$=':expected_on'] input
    value: '2026-10-14'
  - kind: press
    value: Enter
  - kind: wait_for
    target: css:.is-saved
  - kind: snapshot
  concept_claim: Once ordered, the purchase reads as sheets too, and a new date from
    the forwarder is typed into the shipment's row.
  show: The tender 1 order page's shipments and invoices, the shipment's expected
    date edited in its row.
  url: /supply/orders/${contract_id}/?program_id=${program_id}
- id: whose-move
  actions:
  - kind: wait_for
    target: css:main
  - kind: snapshot
  concept_claim: 'The overview shows what the session''s corrections changed: tender
    2 comparable and ready to decide, the order''s move dated.'
  show: Sophie's procurements overview.
  url: /supply/?program_id=${program_id}
