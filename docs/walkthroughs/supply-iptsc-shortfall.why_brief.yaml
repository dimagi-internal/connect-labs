gaps:
- id: G1
  type: RESEARCH
  detail: Whether the local vendor supplied the same standard packet (same trade item)
    as the distributor, or a different make that should be a second trade item, was
    not stated in the interview.
  claim_ref: S7
  proposed_action: Model it as the same standard packet for the walkthrough and confirm
    with the programme team; if it was a different make, record a second item of the
    same product and the stock page still totals 700 courses by product.
spine:
- id: S0
  claim: One IPTSc procurement — 700 packets ordered through the distributor, 450
    delivered, 250 bought locally by the partner — can be followed end to end in the
    programme's own order, check and stock screens instead of in message threads.
  status: grounded
  evidence:
  - ref: EV-001
    kind: documented
  - ref: EV-002
    kind: documented
  rationale: The programme team named this exact procurement in the requirements interview
    and said every status update was chased by message. Showing the whole chain in
    the live screens is the direct answer to that complaint.
- id: S1
  claim: The IPTSc packet is recorded as a kit whose contents are listed and which
    counts as exactly one treatment course, so 700 packets means 700 children's courses.
  status: grounded
  evidence:
  - ref: EV-003
    kind: documented
  - ref: EV-012
    kind: implemented
  rationale: The distributor prices per packet and the programme plans in courses.
    Before G1 an item could name only one product, so a packet could not state what
    it holds or that it is one course; with components and one_course_is it can.
- id: S2
  claim: The distributor records its own dispatch of the 450 packets it could source
    through its update link, without a labs login, so nobody has to ask it by message
    what it sent.
  status: grounded
  evidence:
  - ref: EV-002
    kind: documented
  - ref: EV-013
    kind: implemented
  rationale: The interview's universal complaint was that every update had to be requested.
    A supplier update link lets the distributor write the fact itself, marked as supplier-reported.
- id: S3
  claim: Once the 450 are received at the partner's store, the three-way match shows
    700 ordered, 450 received and 250 outstanding, and the order reads as past its
    promised lead time.
  status: grounded
  evidence:
  - ref: EV-005
    kind: documented
  - ref: EV-008
    kind: implemented
  - ref: EV-010
    kind: implemented
  rationale: The shortfall is a derived fact from the order and the receipt, and lateness
    is derived from the signed date and the promised lead time (G3). Neither is typed
    by anyone, so neither can be stale.
- id: S4
  claim: The partner's local purchase of the remaining 250 packets is recorded as
    its own order, with the partner as buyer of record, paid for as bundled in the
    setup fee, and named as buying the shortfall on the distributor's order.
  status: grounded
  evidence:
  - ref: EV-004
    kind: documented
  - ref: EV-006
    kind: documented
  - ref: EV-007
    kind: documented
  - ref: EV-009
    kind: implemented
  rationale: The party that decides is not always the party that buys (§17), and goods
    paid from a setup fee have no unit price to find (G2). Naming the short order
    it covers (G8) is what joins the two purchases into one story.
- id: S5
  claim: The covering order's cost view says "bundled in setup fee" rather than reporting
    a missing price.
  status: grounded
  evidence:
  - ref: EV-011
    kind: implemented
  - ref: EV-010
    kind: implemented
  rationale: Before G2 every contract was treated as priced, so a bundled purchase
    raised an unconfirmed cost forever. Saying why there is no price is the honest
    answer.
- id: S6
  claim: With the covering order recorded, the distributor's order reads as shortfall
    covered — naming the covering order — and is no longer reported as late.
  status: grounded
  evidence:
  - ref: EV-006
    kind: documented
  - ref: EV-008
    kind: implemented
  rationale: Nobody is waiting on the distributor for the 250 any more, so reporting
    it late would be a false alarm; the lateness check is suppressed exactly when
    a covering order is named.
- id: S7
  claim: Stock at the partner's store shows all 700 packets available — 700 courses
    — from the two receipts.
  status: grounded
  evidence:
  - ref: EV-015
    kind: implemented
  - ref: EV-014
    kind: assumed
  rationale: Stock is the ledger of receipts; if both purchases are received into
    the same store as the same packet, the balance is the programme's real answer
    to "can the partner treat 700 children".
- id: S8
  claim: The partner records the covering order's 250-packet receipt through its own
    update link, issued once to cover everything involving it, without the programme
    re-issuing a link or keying the receipt for it.
  status: grounded
  evidence:
  - ref: EV-016
    kind: implemented
  - ref: EV-002
    kind: documented
  rationale: The interview's complaint was that every update had to be chased; a link
    that follows the organisation keeps the party who counted the goods as the one
    who records them, even for an order created after the link was issued.
problem: When the programme's IPTSc order for 700 three-day treatment packets arrives
  250 packets short and the local partner buys the rest from its own vendor out of
  its setup fee, the programme team has no single record that says the order was short,
  that it is now covered and by whom, what the covering purchase cost, or how many
  courses the partner holds — so the order reads as either late forever or silently
  complete, and every status is chased by email and WhatsApp.
narrative_slug: supply-iptsc-shortfall
