auth:
  type: session
base_url: https://labs.connect.dimagi.com
tagline: Design a matched two-arm comparison study, right from the map
narrative_locked: false
setup:
  command: python scripts/walkthroughs/microplans-study-groups/ensure_demo.py
  rerun: per_render
  timeout_seconds: 300
why_brief: microplans-study-groups.why_brief.yaml
scenes:
- id: the-goal-measure-the-program-s-real-effect
  url: /microplans/program/10008/
  role: overview
  pace: teach
  concept_claim: 'From her Kaura vitamin-A program workspace — already holding several
    study rounds — Maya states her goal: measure the program''s real effect against
    a matched comparison group, using the Connect network to carry out the surveys
    and the Connect platform to design a statistically sound, ongoing comparison of
    household-reported outcomes in intervention versus matched non-intervention areas.'
  design_intent: 'Bet: lead with the WHY and the ambition — an ongoing, statistically
    sound matched comparison run on the Connect network/platform — so the build steps
    read as serving a real measurement goal, not a one-off.'
  show: 'Open on Maya''s Kaura program workspace and state the goal: measure the program''s
    real effect against a matched comparison group — leveraging the Connect network
    to carry it out and the Connect platform to design a statistically sound, ongoing
    study.'
  actions:
  - kind: wait_for
    target: Studies & plan groups
  - kind: hold
    seconds: 6
- id: maya-starts-a-study-from-scratch
  actions:
  - kind: wait_for
    target: Studies & plan groups
  - kind: scroll_to
    target: css:#new-study
  - kind: click
    must_succeed: true
    note: one click creates an "Untitled study" and routes to its empty manage page
      — no name dialog
    target: css:#new-study
  - kind: wait_for
    must_succeed: true
    note: 'terminal state: the empty study page'
    seconds: 20
    target: No plans in this group yet
  - kind: hold
    seconds: 1.5
  concept_claim: Maya creates an empty two-arm study from scratch on the labs-only
    Kaura programme with one click and lands on its manage page, ready to add a plan,
    before any wards are committed.
  design_intent: 'Bet: a study should start as an empty container the planner fills
    from the map, not a list of names committed up front — so “+ New study” creates
    it in one click, no name-first form.'
  show: From the Vitamin-A Kaura programme portfolio — already holding earlier study
    rounds — Maya starts a brand-new two-arm study with one click and lands on its
    empty study page, ready to add a plan.
  pace: flow
  url: /microplans/program/10008/
- id: maya-opens-the-plan-editor-on-the-empty-study
  actions:
  - kind: wait_for
    target: No plans in this group yet
  - kind: click
    must_succeed: true
    note: opens the single-plan editor at /program/10008/new/?group=<id>
    target: + Add a plan in the editor
  - kind: wait_for
    must_succeed: true
    note: the single-plan editor, area-definition section open by default
    seconds: 20
    target: Define boundaries
  - kind: scroll_to
    must_succeed: false
    note: frame the editor's LAYERS panel so the Service-delivery toggle (top-right,
      tiny) is legibly in-frame before Maya flips it
    target: css:[data-testid=layer-toggle-service-delivery]
  - kind: click
    must_succeed: false
    note: turn on the Service-delivery layer in the editor's LAYERS panel
    target: aria:toggle Service delivery
  - kind: scroll_to
    must_succeed: false
    note: keep the LAYERS panel framed after the toggle flips on (it now reads "on"
      blue + reveals the opportunity picker body)
    target: css:[data-testid=layer-toggle-service-delivery]
  - kind: hold
    note: the LAYERS panel with Service delivery toggled on — its toggle + picker
      body legibly framed, scoped to this study
    seconds: 4
  concept_claim: From the empty study, “+ Add a plan in the editor” opens the polished
    single-plan editor scoped to the study (?group=<id>), where Maya turns on the
    Kaura CHC opportunity's service-delivery data — one plan, built in the unified
    plan UI.
  design_intent: 'Bet: a matched study is designed in one real plan editor — the planner
    opens it on the study and grounds it in the opportunity''s own delivery data,
    rather than starting from a name list; scoping the editor to the study (?group=)
    files the finished plan back automatically.'
  full_page: false
  pace: flow
  show: From the empty study Maya opens the single-plan editor via “+ Add a plan in
    the editor”; it loads scoped to the study (?group=…) and she switches on the Kaura
    CHC opportunity's service-delivery layer.
- id: maya-sees-the-programme-covered-all-of-attakar
  actions:
  - kind: wait_for
    target: Define boundaries
  - kind: click
    must_succeed: false
    note: open the opportunity picker
    target: Pick opportunities
  - kind: wait_for
    must_succeed: false
    note: the opp row in the OPEN modal (the picker has a hidden template + the visible
      modal — :visible targets the real one, not the hidden duplicate)
    seconds: 15
    target: css:[data-testid=sd-opp-10010]:visible
  - kind: click
    must_succeed: false
    note: select the Kaura CHC service-delivery opp (10010, same programme)
    target: css:[data-testid=sd-opp-10010]:visible
  - kind: click
    must_succeed: false
    note: close the opportunity picker
    target: Done
  - kind: click
    must_succeed: false
    note: Show service delivery points (the visible button, not the hidden template
      duplicate); fitTo zooms the map to the Attakar delivery cloud (padding 60, maxZoom
      15)
    target: css:[data-testid=sd-show]:visible
  - kind: hold
    note: let the fitTo camera animation to the Attakar cloud fully settle before
      framing
    seconds: 4
  - kind: scroll_to
    must_succeed: false
    note: center the 50vh map pane in-frame so the fitted ~435-point Attakar delivery
      cloud (the narrated saturation) is the legible subject, not a thumbnail
    target: css:#map-pane
  - kind: hold
    note: the delivery cloud saturates the whole Attakar ward — legibly framed
    seconds: 5
  concept_claim: Inside the plan editor, the Kaura CHC opp's service-delivery visits
    saturate the WHOLE of Attakar — ward-wide delivery is why the entire ward is the
    honest survey unit.
  design_intent: 'Bet: the planner chooses the intervention ward from where the programme
    actually delivered, and ward-wide saturation is what justifies surveying the whole
    ward — so the delivery map, opened right inside the plan editor, is where she
    starts.'
  full_page: false
  pace: flow
  show: In the single-plan editor Maya picks the Kaura CHC opportunity for the Service
    delivery layer; its visits saturate the entire Attakar ward on the map.
- id: maya-compares-the-surrounding-wards-to-find-a-match
  actions:
  - kind: click
    target: css:#btn-area-admin
    must_succeed: false
    note: Boundaries tab — the boundary search + source controls mount in the map's
      LAYERS panel
  - kind: wait_for
    target: css:.mp-ab-search:visible
    seconds: 10
    must_succeed: false
    note: the boundary search box is ready
  - kind: click
    target: css:#btn-mode-sampling
    must_succeed: false
    note: Sampling mode — enables the two-arm workflow (Compare only offers once an
      intervention ward is picked in sampling mode)
  - kind: hold
    seconds: 1
    note: sampling mode engaged
  - kind: fill
    target: css:.mp-ab-search:visible
    value: Attakar
    must_succeed: false
    note: search Attakar by name (the ward the programme served) — the debounced geocode
      lists it
  - kind: wait_for
    target: css:.mp-ab-results:visible button
    seconds: 10
    must_succeed: false
    note: the search result appears
  - kind: hold
    seconds: 2
    note: let the debounced result settle before clicking
  - kind: click
    target: css:.mp-ab-results:visible button
    must_succeed: false
    note: click the Attakar result — adds it to the plan area tagged the intervention
      arm; this is the reference the Compare ranking needs
  - kind: wait_for
    target: css:.mp-ab-compare:visible
    seconds: 12
    must_succeed: false
    note: Compare surrounding boundaries surfaces once an intervention ward is selected
      in sampling mode
  - kind: hold
    seconds: 2
    note: Attakar tagged intervention; the Compare button is live
  - kind: click
    target: css:.mp-ab-compare:visible
    must_succeed: false
    note: run Compare — rank every neighbouring ward against Attakar by density overlap
  - kind: wait_for
    target: best match first
    seconds: 180
    must_succeed: false
    note: wait for the ranking to finish — the header flips from 'Processing N…' to
      'best match first' once every neighbour is scored
  - kind: scroll_to
    target: css:#surrounding-compare
    must_succeed: false
    note: frame the ranked comparison table — each neighbour's overlap %, distribution
      chart and row colour
  - kind: click
    target: css:.mp-ab-col-i[data-col="match"]:visible
    must_succeed: false
    note: highlight the Match column as the narration introduces 'Match is how similar
      the two wards look overall'
  - kind: hold
    seconds: 8
    note: Match column highlighted — the overall-similarity metric
  - kind: click
    target: css:.mp-ab-col-i[data-col="balance"]:visible
    must_succeed: false
    note: Matched balance — the column that decides the match
  - kind: hold
    seconds: 15
    note: Matched balance column highlighted
  - kind: click
    target: css:.mp-ab-col-i[data-col="common"]:visible
    must_succeed: false
    note: Common support — matching only draws from the shared density range
  - kind: hold
    seconds: 12
    note: Common support column highlighted
  concept_claim: With Attakar tagged intervention, "Compare surrounding boundaries"
    ranks every bordering ward by how much its building-density distribution overlaps
    Attakar's (best match first) and fills each candidate on the map in its row colour,
    so the match is chosen from evidence rather than picked by name.
  design_intent: 'Bet: a fair match is found by comparing the surrounding wards''
    settlement-density distributions against the intervention''s - surfaced as a ranked,
    on-map comparison - instead of picking an adjacent ward by name.'
  full_page: false
  show: In sampling mode Maya clicks "Compare surrounding boundaries"; a ranked table
    fills in below the map - each bordering ward with its density-overlap percentage,
    a shared-axis distribution chart, and a colour-matched fill on the map.
  pace: teach
- id: maya-rejects-the-closest-match-and-adds-the-right-match
  actions:
  - kind: click
    target: css:.mp-ab-col-i[data-col="common"]:visible
    must_succeed: false
    note: keep Common support highlighted as the narration weighs Sopp vs Gura
  - kind: hold
    seconds: 2
    note: Sopp and Gura both best-balanced at 0.02; Zankan was last cycle's own ward
  - kind: wait_for
    target: css:.mp-ab-addbnd[data-name="Gura"]:visible
    seconds: 10
    must_succeed: false
    note: Gura's row carries an Add-boundary button once the ranking is scored
  - kind: scroll_to
    target: css:.mp-ab-addbnd[data-name="Gura"]:visible
    must_succeed: false
    note: frame Gura's row so the rejected top row and Gura's Add button are both
      legible
  - kind: click
    target: css:.mp-ab-addbnd[data-name="Gura"]:visible
    must_succeed: false
    note: Add Gura — the closest un-served neighbour that shares the most common support
      — as the comparison arm
  - kind: hold
    seconds: 4
    note: Gura added as the match arm — the two-arm design is set
  concept_claim: The table ranks candidates by Matched balance, where Sopp and Gura
    tie best at 0.02 and Zankan trails at 0.03; Maya excludes Zankan because the programme
    treated it last cycle, then picks Gura over Sopp because Gura shares more Common
    support with Attakar, and clicks "Add boundary" on Gura's row so it joins the
    same plan tagged match. One plan now carries both study arms.
  design_intent: 'Bet: the tool ranks comparability, but the planner applies the constraint
    it cannot know - a match must be a ward the programme did not treat - and one
    click on the chosen row adds that ward as the match arm.'
  full_page: false
  show: Maya reads the ranked table, skips the top row (Zankan - already the programme's
    ward) and clicks "Add boundary" on Gura; Gura joins the left rail as the match
    arm beside Attakar, each with its Interv / Match pill.
  pace: teach
- id: maya-generates-the-two-arm-plan-in-place
  actions:
  - kind: click
    must_succeed: false
    note: a sampling study, not coverage
    target: css:#btn-mode-sampling
  - kind: scroll_to
    target: css:#sampling-config
  - kind: hold
    note: PSUs + building-footprint-size filter — one methodology for both arms
    seconds: 1
  - kind: click
    must_succeed: true
    note: ‘Generate plan’ — samples both arms and creates the plan in place
    target: css:#btn-generate-sample
  - kind: wait_for
    must_succeed: true
    note: 'create-in-place: sampling BOTH arms (two Overture fetches + PPS) creates
      the plan and flips the button Generate → Regenerate; that label is the visible
      terminal signal (the page <title> "Microplan review" is not body text)'
    seconds: 150
    target: Regenerate plan
  - kind: wait_for
    seconds: 20
    target: Work areas
  - kind: click
    target: css:.mp-panel-tabs button[data-tab="layers"]
    must_succeed: false
    note: open the Layers tab (panel auto-switches to Inspect after Generate) so the
      footprints toggle is visible
  - kind: click
    must_succeed: false
    note: turn ON the Building-footprints (rooftops) overlay in the map Layers panel
      so the sampled result reads in context — the PSU pins + cluster hulls the sample
      just drew, sitting over the ward's rooftops. The toggle is the footprints row
      in the right-hand Layers panel (map_panel.js).
    target: css:[data-testid="layer-toggle-footprints"]
  - kind: hold
    note: 'HOLD ON THE MAP. The sample auto-paints + the map fits to it (renderSample
      → PlanLayers.pins/hulls + Microplans.fitTo): each pin is one sampled settlement
      (a PSU); the hull is the cluster of buildings around it. Over the building-footprints/rooftops
      layer, this shows the survey only visits the rooftops inside the sampled PSUs,
      not the whole ward — explain the sample BEFORE the table.'
    seconds: 10
  - kind: map_zoom
    zoom: 16.0
    seconds: 2.5
    note: push in to the building footprints — the individual rooftops/households
      drawn from Overture
  - kind: hold
    seconds: 4
    note: 'hold on the rooftops: the households randomly sampled within the settlement'
  - kind: map_zoom
    zoom: 13.0
    seconds: 2.5
    note: pull back out to the whole ward
  - kind: hold
    seconds: 2
    note: back at the ward view
  - kind: scroll_to
    note: 'frame the create-in-place success state from the TOP of the study read-out
      — the ARM COMPARABILITY verdict/table leads, with the KPI strip following in
      the same viewport — not the PSU breakdown table far below it. Scrolling to #kpi-strip
      alone clipped the comparability panel''s header above the fold; #study-readout
      sits directly above the KPIs and frames both panels whole.'
    target: css:#study-readout
  - kind: hold
    note: both arms' sampled work areas + KPIs on one map, filed into the study
    seconds: 6
  full_page: false
  concept_claim: With the methodology set (size-balance bands + footprint-size filter),
    ‘Generate plan’ samples both arms in one action and creates the single two-arm
    plan in place (no reload) — the editor becomes the plan's review map, work areas
    and KPIs shown, and the ARM COMPARABILITY panel measures how closely the two arms
    match so the planner can judge the study, not assume it.
  design_intent: 'Bet: a two-arm plan should be selected, sampled, and reviewed in
    one continuous editor — ‘Generate plan’ draws both arms from one shared methodology
    and creates the plan in place (create-in-place) so the planner never loses context,
    and the editor measures and surfaces the arms'' comparability for the planner
    to judge rather than asserting it.'
  show: In Sampling mode Maya clicks ‘Generate plan’; the editor samples both arms
    and creates the single plan in place — the page becomes the plan's review map
    with work areas and KPIs, filed into the study.
- id: maya-completes-the-study
  actions:
  - kind: wait_for
    target: Candidate plans
    seconds: 20
    must_succeed: true
    note: the program board loaded; the Candidate plans inventory is open by default
      (loose drafts present)
  - kind: hold
    seconds: 2
    note: let the plan rows hydrate from the plans API
  - kind: scroll_to
    target: css:button[data-transition="4493"][data-to="in_review"]:visible
    must_succeed: false
    note: frame plan 4493's row — a finished draft ready to advance (NOT toggling
      the inventory, which is already open)
  - kind: wait_for
    target: css:button[data-transition="4493"][data-to="in_review"]:visible
    seconds: 20
    must_succeed: true
    note: plan 4493's 'Submit for review' button is visible — the board loaded its
      plans and 4493 is in draft
  - kind: click
    target: css:button[data-transition="4493"][data-to="in_review"]:visible
    must_succeed: true
    note: Submit for review — advance 4493 draft → in_review
  - kind: wait_for
    target: css:button[data-transition="4493"][data-to="approved"]:visible
    seconds: 20
    must_succeed: true
    note: the row's action flips to 'Approve' once in review
  - kind: hold
    seconds: 2
    note: in review
  - kind: click
    target: css:button[data-transition="4493"][data-to="approved"]:visible
    must_succeed: true
    note: Approve — advance in_review → approved; the study is ready for a survey
      firm
  - kind: wait_for
    target: css:button[data-transition="4493"][data-to="deployed"]:visible
    seconds: 20
    must_succeed: false
    note: the approved plan now offers Deploy → (confirms the transition landed)
  - kind: hold
    seconds: 4
    note: plan Approved — each area keeps its arm labs-side, but the Connect export
      carries no arm column
  concept_claim: Maya advances the single two-arm plan draft → in_review → approved
    from the workspace, completing a balanced study. Each work area stores its arm
    labs-side so future analysis can distinguish the arms, while the arm is kept out
    of the LLO/field-facing Connect case properties and export — so the arms carry
    forward labs-side without entering the field-facing data the surveyors receive.
  design_intent: 'Bet: completing the study is approving the one plan that holds both
    arms; blinding is a display choice, not data loss — each work area keeps its arm
    labs-side for analysis, while the LLO/field-facing surfaces never show it.'
  show: 'From the program workspace Maya advances the two-arm plan: Submit for review,
    then Approve, and the card settles into its finished Reviewed state. Each work
    area keeps its arm labs-side for analysis, but the Connect-facing export carries
    no arm column — so the field never sees which ward is which arm.'
  url: /microplans/program/10008/
