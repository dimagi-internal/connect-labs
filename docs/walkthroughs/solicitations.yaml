name: "Solicitations Walkthrough"
narrative: "Recruit an independent survey firm — mint a call from a finished study, score applications blind against a locked rubric, and award on a staged, verifiable contract"
base_url: "http://localhost:8000"

# NOTE (ACE / DDD v12): the per-scene `narrative` beats below are the voiceover
# for the create-survey-solicitation narrative, version 12 (canopy). They fold in
# Sophie's language review (RF Surveys, 2026-07-23) and the locked V2 design:
#   • the conflict-of-interest answer is STAGED CONTRACTING (start a firm on a
#     small verification contract → confirm quality → then scale), NOT separation
#     of duties;
#   • the scoring rubric is REVIEWED AND LOCKED before publish (fixed criteria for
#     every applicant);
#   • applications are scored BLIND (by response ID, not name) and UNIFORMLY (the
#     AI proposes a score against the locked rubric for every application, and its
#     suggestion stays HIDDEN until the reviewer records their own — no anchoring);
#   • the AI Application Coach is an EVIDENCE GUARDRAIL (pushes for verifiable
#     evidence, not unbacked claims).
# The `show` / `impressive_because` lines describe the on-screen state each beat
# needs. Beats marked (NET-NEW) require labs UI still to be built before a faithful
# render — see the connect-labs PR / ACE issue that tracks this spec.

auth:
  type: command
  check: "cd /Users/jjackson/emdash-projects/connect-labs && source .venv/bin/activate && python manage.py get_cli_token --list-profiles 2>&1 | grep -E 'ace.*no'"
  login: "cd /Users/jjackson/emdash-projects/connect-labs && source .venv/bin/activate && python manage.py get_cli_token --profile ace"
  inject_url: "/labs/test-auth/?profile=ace"

personas:
  maya:
    name: "Maya"
    role: "Program study planner"
    color: "#7C3AED"
    intro: "Maya designed the Round 6 two-arm Attakar-versus-Gura study for her Vitamin-A programme and now needs to recruit the independent firm that will run the household survey on it."
  firm:
    name: "Sahel Field Research"
    role: "Independent survey firm"
    color: "#059669"
    intro: "Sahel Field Research is an independent northern-Nigeria household-survey firm looking for survey work it can staff; it answers public solicitations with the coverage its enumerators can commit to."

scenes:
  - persona: firm
    title: "Browse public solicitations"
    narrative: "A survey firm opens Connect's public calls and finds Maya's — the household survey for her Vitamin-A programme's Round 6 study, open for applications."
    show: "Public solicitation listing page with active solicitations visible"
    impressive_because: "Clean card grid with type badges, deadlines, and scale — easy for an independent firm to find work it can staff"

  - persona: firm
    title: "Read solicitation details — the rubric is locked"
    narrative: "The call shows exactly how firms will be scored. The weighted rubric was locked before publishing, so every applicant sees the same fixed criteria before writing a word."
    show: "Public detail page for an active solicitation with description, the three required questions, and the LOCKED evaluation rubric (weights visible, marked fixed-before-publish)"
    impressive_because: "A locked, weighted rubric shown upfront means every firm is judged against the same fixed criteria — no moving the goalposts after applications arrive (NET-NEW: 'locked before publish' state/badge)"

  - persona: maya
    title: "Manager dashboard"
    narrative: "On Maya's side, the call sits alongside her others, each showing its status, deadline, and how many firms have applied."
    show: "Manage solicitations list showing solicitations with response counts"
    impressive_because: "At-a-glance view of all calls with status, deadline, and how many firms have applied"

  - persona: maya
    title: "Create the call from a finished study"
    narrative: "Maya minted this call straight from her finished study: the coverage carried over, she wrote three required questions — methodology, staffing, data quality — and the platform's AI drafted the weighted rubric, which she reviewed and locked before publishing."
    show: "Solicitation create form: title/scope/coverage carried from the study, three required questions, and the AI-drafted weighted rubric with a review-and-LOCK step before publish"
    impressive_because: "The call is minted from the finished study — coverage carries over — and the AI-drafted rubric is reviewed and locked, so the criteria are fixed before any firm responds (NET-NEW: review-and-lock rubric step)"

  - persona: firm
    title: "Submit a response — coached for evidence"
    narrative: "The firm drafts substantive answers to all three questions and sharpens them with the AI Application Coach, which pushes for verifiable evidence — real methods, named staff, data-quality controls — rather than unbacked claims, before submitting."
    show: "Response form with the three questions and the locked rubric shown inline, plus the AI Application Coach panel prompting for verifiable evidence (cite methods / named staff / real data), not unbacked claims"
    impressive_because: "The coach raises answer quality by demanding verifiable evidence, so reviewers score substance rather than salesmanship (NET-NEW: coach evidence-guardrail prompts)"

  - persona: maya
    title: "Deadline passes — three firms, scored blind"
    narrative: "When the window closes, three firms have applied — shown by response ID, not name, so scoring stays blind and no applicant is advantaged by who they are."
    show: "Responses list for the solicitation showing three submitted responses identified by RESPONSE ID (names withheld) with review status"
    impressive_because: "Applications are shown by response ID, not name, so scoring stays blind — no applicant is advantaged by who they are (NET-NEW: blind response-ID display)"

  - persona: maya
    title: "Score every application the same way"
    narrative: "Every application is scored the same way against the locked rubric: the AI proposes a score, but its suggestion stays hidden until Maya records her own, criterion by criterion, so it can't anchor her. Sahel Field Research comes out on top."
    show: "Review form with Q&A pairs and per-criterion scoring against the locked rubric; the AI's proposed score is HIDDEN until the reviewer records their own, then revealed for comparison"
    impressive_because: "Uniform AI-assisted scoring against the locked rubric, with the AI's suggestion hidden until the reviewer commits their own score — transparent and anchor-free (NET-NEW: hide-AI-score-until-scored)"

  - persona: maya
    title: "Award on a staged, verifiable contract"
    narrative: "Maya awards the top firm, notified on the spot. Because Connect lets her start it on a small contract to confirm quality before scaling to the full survey, the award is a first, verifiable step — firms demonstrate full performance of the tasks, not just their written response. Standing up that first, small verification contract as a live Connect opportunity is the honest next step, not yet built."
    show: "Award page for the top-scoring response showing the score and a STAGED-CONTRACTING framing: award a small verification contract first, scale to the full survey once quality is confirmed"
    impressive_because: "Connect answers conflict-of-interest with staged contracting — start small, verify real performance, then scale — so trust is earned on delivered work, not just a written response (NET-NEW: staged-contract award framing)"
