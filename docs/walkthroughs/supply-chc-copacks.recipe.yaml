base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-09-23T23:55:23.393665+00:00'
review_mode: autonomous
setup:
  command: python3 scripts/walkthroughs/supply-chc-copacks/ensure_demo.py
  outputs: scripts/walkthroughs/supply-chc-copacks/.realized.json
  rerun: per_render
  timeout_seconds: 600
tagline: Buy co-packs through a distributor and see every step without chasing it
why_brief: supply-chc-copacks.why_brief.yaml
scenes:
- id: where-the-co-pack-chain-stands
  actions:
  - kind: wait_for
    target: css:text=Contracts — who is actually buying
  - kind: hold
    seconds: 2.0
    note: 'the chain counts: source, order, deliver'
  - kind: scroll
    value: bottom
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the open round and the contracts, each with its buyer of record and status
  concept_claim: The supply overview shows the round, each contract with its buyer of record and status,
    and the open checks as counts derived from records.
  role: overview
  show: The supply overview for the synthetic CHC programme — the chain counts (source, order, deliver),
    the one open round, and the contracts table with CHC-2026-01 in draft.
  url: /supply/?program_id=${program_id}
- id: three-co-packs-one-set-aside
  actions:
  - kind: wait_for
    target: css:text=What this round buys
  - kind: hold
    seconds: 2.5
    note: 'the round names the contents it buys: 2 ORS sachets + 10 zinc tablets'
  - kind: scroll_to
    target: css:h2:has-text('Quotes')
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the three co-pack offers against the round's stated contents
  concept_claim: The round page states the contents its co-pack line buys (2 ORS sachets + 10 zinc tablets)
    and lists the distributor's three co-pack quotes against it.
  show: 'The round page: ''What this round buys'' naming the co-pack line''s contents (2 sachet ORS +
    10 tablet zinc), then the quotes table with Harmattan''s three co-pack offers.'
  url: /supply/procurement/rounds/${round_id}/
- id: two-co-packs-ranked-like-with-like
  actions:
  - kind: wait_for
    target: css:text=Comparable
  - kind: hold
    seconds: 2.5
    note: two co-packs with the round's contents, ranked; the chosen one marked
  - kind: scroll
    value: bottom
  - kind: hold
    seconds: 2.5
  - kind: snapshot
    note: the four-sachet co-pack refused a ranking, and why
  concept_claim: The comparison ranks the two co-pack quotes whose contents match the round's (2 ORS sachets
    + 10 zinc tablets) and refuses to rank the four-sachet co-pack, naming the difference in contents
    as the reason.
  show: 'The co-pack comparison: two ranked rows (Kaduna Pharma Works first, marked Chosen), then the
    four-sachet co-pack under ''Needs info'' refused a ranking — its contents are not what the round buys.'
  url: /supply/procurement/rounds/${round_id}/compare/?commodity=ors-zinc-copack
- id: amara-places-the-order
  actions:
  - kind: wait_for
    target: css:text=Bought by
  - kind: hold
    seconds: 1.5
  - kind: click
    target: css:a:has-text('Edit order')
  - kind: wait_for
    target: css:#id_status
  - kind: select
    note: draft to placed
    target: css:#id_status
    value: Placed
  - kind: hold
    seconds: 1.5
  - kind: click
    must_succeed: true
    target: role:button:Save changes
    timeout_ms: 30000
  - kind: wait_for
    target: css:text=Bought by
  - kind: scroll
    value: top
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the order, now placed, bought by the programme
  concept_claim: Placing the order changes the contract's status from draft to placed, with the programme
    organisation as buyer of record.
  show: The order page (draft, bought by Connect Child Health Programme as programme org), then Edit order
    → status Placed → Save.
  url: /supply/orders/${copack_order_id}/
- id: amara-pays-up-front
  actions:
  - kind: wait_for
    target: css:#id_paid_on
  - kind: fill
    target: css:#id_paid_on
    value: ${today}
  - kind: fill
    target: css:#id_method
    value: bank transfer
  - kind: fill
    target: css:#id_reference
    value: PAY-2026-014
  - kind: select
    target: css:#id_source
    value: We set this up ourselves
  - kind: hold
    seconds: 1.5
  - kind: click
    must_succeed: true
    target: role:button:Record payment
    timeout_ms: 30000
  - kind: wait_for
    target: css:text=Paid in advance
  - kind: scroll
    value: '520'
  - kind: hold
    seconds: 2.5
  - kind: snapshot
    note: paid in advance, awaiting delivery of the whole order
  concept_claim: Recording the payment on an order paid in advance shows it as paid in advance and awaiting
    delivery of the whole order, not as billed beyond what arrived.
  show: The payment form for invoice HHS-INV-2026-014 — paid on today, 18000 USD, bank transfer, reference
    — then the order page reading 'Paid in advance — awaiting delivery of 30000 co-pack'.
  url: /supply/invoices/${invoice_id}/payments/new/
- id: tunde-confirms-order-and-payment
  actions:
  - kind: wait_for
    target: css:text=Updates for Harmattan Health Supplies
  - kind: hold
    seconds: 2.0
  - kind: click
    target: css:summary:has-text('Confirm an order')
  - kind: wait_for
    target: role:button:Confirm this order
  - kind: hold
    seconds: 1.0
  - kind: click
    must_succeed: true
    target: role:button:Confirm this order
    timeout_ms: 30000
  - kind: wait_for
    target: css:summary:has-text('Confirm a payment was received')
  - kind: click
    target: css:summary:has-text('Confirm a payment was received')
  - kind: fill
    target: css:#id_confirm_payment-received_on
    value: ${today}
  - kind: hold
    seconds: 1.0
  - kind: snapshot
    note: order confirmed; the payment confirmation filled in
  - kind: click
    must_succeed: true
    target: role:button:Confirm payment received
    timeout_ms: 30000
  - kind: hold
    seconds: 2.0
  concept_claim: Through the update link, the distributor confirms the order and records the date it received
    the payment, both recorded as supplier reported.
  show: The public update-link page for Harmattan — covers CHC-2026-01, the warehouse and Sahel's store;
    Confirm this order; then confirm the payment received today.
  url: ${update_link_path}
- id: tunde-records-the-inspected-batch
  actions:
  - kind: click
    target: css:summary:has-text('Record goods received')
  - kind: select
    target: css:#id_record_receipt-supply_point
    value: Harmattan warehouse, Kano
  - kind: fill
    target: css:#id_record_receipt-reference
    value: GRN-HHS-0923
  - kind: fill
    target: css:#id_record_receipt-quantity_accepted
    value: '596'
  - kind: fill
    target: css:#id_record_receipt-quantity_rejected
    value: '4'
  - kind: fill
    target: css:#id_record_receipt-rejection_reason
    value: sachets punctured, found on opening
  - kind: fill
    target: css:#id_record_receipt-batch
    value: KPW-2609
  - kind: fill
    target: css:#id_record_receipt-expiry
    value: '2028-08-31'
  - kind: hold
    seconds: 1.0
  - kind: snapshot
    note: 596 accepted, 4 rejected, batch and expiry
  - kind: click
    must_succeed: true
    target: role:button:Record receipt
    timeout_ms: 30000
  - kind: hold
    seconds: 2.0
  concept_claim: The link's goods-received form records accepted and rejected cartons with a rejection
    reason, batch and expiry into the distributor's warehouse.
  show: The "Record goods received" form on the link — order CHC-2026-01, received at Harmattan warehouse,
    Kano, 596 accepted, 4 rejected with reason, batch and expiry.
- id: amara-reads-harmattan-updates
  actions:
  - kind: wait_for
    target: css:text=update link
  - kind: scroll
    value: top
  - kind: hold
    seconds: 2.5
    note: what Harmattan recorded through its own link
  - kind: scroll
    value: '300'
  - kind: hold
    seconds: 3.0
    note: 'the link''s updates above, and paid for and refused: 120 USD recoverable'
  - kind: snapshot
    note: the link's updates and the recoverable amount, in one frame
  concept_claim: The order page lists the distributor's link updates (order confirmed, payment received,
    receipt) and reports the refused cartons of an advance order as an amount recoverable from the supplier.
  show: 'The order page — the ''Recorded through the update link held by Harmattan Health Supplies'' panel (order confirmed,
    payment received, GRN-HHS-0923 596 accepted / 4 rejected), then the match panel: recoverable from
    the supplier 120 USD.'
  url: /supply/orders/${copack_order_id}/
- id: amara-subscribes-to-low-stock
  actions:
  - kind: wait_for
    target: css:#id_label
  - kind: fill
    target: css:#id_label
    value: Co-packs below a store's minimum
  - kind: click
    target: css:input[value=stock_below_minimum]
  - kind: click
    target: css:input[value=stock_stockout]
  - kind: click
    target: css:#id_commodity-ts-control
  - kind: click
    target: css:#id_commodity-ts-dropdown .option:has-text('ORS/zinc co-pack')
  - kind: hold
    seconds: 1.0
  - kind: click
    must_succeed: true
    target: role:button:Create alert
    timeout_ms: 30000
  - kind: wait_for
    target: css:text=Co-packs below a store's minimum
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the alert, standing
  concept_claim: An alert subscription watching stock_below_minimum and stock_stockout for the co-pack
    is saved for the programme.
  show: The new-alert form — label, the two stock checks ticked, product ORS/zinc co-pack, send to me,
    as it happens — then the alerts list with the subscription.
  url: /supply/alerts/new/
- id: sahel-stock-take-comes-in-short
  actions:
  - kind: wait_for
    target: css:#id_supply_point-ts-control
  - kind: click
    target: css:#id_supply_point-ts-control
  - kind: click
    target: css:#id_supply_point-ts-dropdown .option:has-text('Sahel CHI store')
  - kind: fill
    target: css:#id_counted_on
    value: ${today}
  - kind: select
    target: css:#id_kind
    value: override
  - kind: click
    target: css:#id_commodity-ts-control
  - kind: click
    target: css:#id_commodity-ts-dropdown .option:has-text('ORS/zinc co-pack')
  - kind: click
    target: css:#id_item-ts-control
  - kind: click
    target: css:#id_item-ts-dropdown .option:has-text('Kaduna Pharma Works ORS/zinc co-pack')
  - kind: fill
    target: css:#id_quantity
    value: '170'
  - kind: fill
    target: css:#id_quantity_unit
    value: carton
  - kind: fill
    target: css:#id_reason
    value: Sahel CHI stock take. 24 cartons short of the ledger — handed out at outreach days,
      visits not yet synced.
  - kind: select
    target: css:#id_source
    value: A partner told us
  - kind: hold
    seconds: 1.0
  - kind: snapshot
    note: the stock take, filled in
  - kind: click
    must_succeed: true
    target: role:button:Record count
    timeout_ms: 30000
  - kind: hold
    seconds: 2.0
  concept_claim: Recording the partner's stock take as an override sets the store's co-pack balance to
    the counted 170 cartons.
  show: The record-a-count form — Sahel CHI store, today, "Replace the ledger with this count", the co-pack
    and its Kaduna Pharma Works trade item, 170 carton, notes, "A partner told us".
  url: /supply/stock/counts/new/
- id: the-check-trips
  actions:
  - kind: wait_for
    target: css:text=Sent log
  - kind: hold
    seconds: 1.5
  - kind: click
    must_succeed: true
    target: role:button:Check now
    timeout_ms: 30000
  - kind: wait_for
    target: css:td a:has-text('Sahel CHI store')
    timeout_ms: 60000
  - kind: scroll_to
    target: css:h2:has-text('Sent log')
  - kind: hold
    seconds: 3.0
  - kind: snapshot
    note: the notice the stock take tripped, sent to Amara
  concept_claim: The alert's sent log records a 'Below its own minimum' notice for Sahel CHI store, found
    after the stock take and sent to the subscriber.
  show: The alerts page — Check now, then the sent log's row for Sahel CHI store, Wudil, 'Below its own
    minimum', under the co-pack alert, marked sent.
  url: /supply/alerts/
- id: the-resupply-plan-names-the-quantity
  actions:
  - kind: wait_for
    target: css:text=Stock across the network
  - kind: hold
    seconds: 3.0
  - kind: snapshot
    note: how much to send, and why
  concept_claim: The stock page states Sahel's consumption per month, months of stock, the below-minimum
    band and a send quantity of 194 cartons.
  show: The stock network table — Sahel CHI store 170 carton, 3033 co-pack/month, 2.80 (min 3 / max 6),
    send 194 carton, BELOW MIN; the warehouse holding 720 cartons.
  url: /supply/stock/
- id: tunde-records-the-collection
  actions:
  - kind: wait_for
    target: css:text=Updates for Harmattan Health Supplies
  - kind: click
    target: css:summary:has-text('Record a release')
  - kind: scroll_to
    target: css:summary:has-text('Record a release')
  - kind: select
    target: css:#id_record_release-from_supply_point
    value: Harmattan warehouse, Kano
  - kind: select
    target: css:#id_record_release-to_supply_point
    value: Sahel CHI store, Wudil
  - kind: fill
    target: css:#id_record_release-quantity
    value: '194'
  - kind: fill
    target: css:#id_record_release-batch
    value: KPW-2609
  - kind: fill
    target: css:#id_record_release-reference
    value: REL-HHS-0923
  - kind: hold
    seconds: 1.0
  - kind: snapshot
    note: 194 cartons, warehouse to store
  - kind: click
    must_succeed: true
    target: role:button:Record release
    timeout_ms: 30000
  - kind: hold
    seconds: 2.5
    note: the release, recorded as reported by Harmattan
  concept_claim: The link's release form records a transfer of 194 cartons from the distributor's warehouse
    to the partner's store.
  show: The "Record a release" form on the link — from Harmattan warehouse, Kano to Sahel CHI store, Wudil,
    194 cartons, batch KPW-2609, release note.
  url: ${update_link_path}
- id: back-inside-its-band
  actions:
  - kind: wait_for
    target: css:text=Stock across the network
  - kind: hold
    seconds: 3.0
  - kind: snapshot
    note: the loop closed
  concept_claim: After the release the Sahel store reads six months of stock, inside its band, and the
    warehouse — rated on its releases — shows its own months of stock and a send quantity.
  show: The stock network table after the release — Sahel CHI store 364 carton, 6.00 months, inside its
    band; the Harmattan warehouse rated on releases, with its months of stock and a send quantity.
  url: /supply/stock/
