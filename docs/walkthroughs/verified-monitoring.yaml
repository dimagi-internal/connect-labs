name: verified-monitoring
narrative: 'Since the independent survey is what verifies Maya''s program, Maya can
  also inspect the quality of the survey itself — the focus shifts from reviewing program
  performance to reviewing the surveyors. Maya manages a Connect program delivering
  vitamin-A home visits across rural Kaduna; her frontline workers log every visit
  through Connect, and Maya gets a clean coverage figure back each cycle — but to know
  whether those visits are actually changing anything, Maya stood up an independent
  rooftop survey that re-measures the same households, cycle after cycle, in a ward
  her program works and in an adjacent ward it doesn''t.


  Maya opens the survey''s dashboard and starts with the six-round trend. It confirms
  a real rise in independent survey-estimated coverage — 72.1%, against the 89.7% her
  program''s own records report — with each round''s confidence interval and sample
  size shown, so a change reads as real rather than sampling noise. Each round re-surveys
  a fresh representative household sample within the same matched ward pair, so the
  trend follows the same comparison over time. On the map, program delivery points
  fill only the intervention ward, but the survey covered both wards — so the gap between
  program-reported and survey-estimated coverage is real, not an artifact of where
  the survey looked. Maya toggles the layers to see where each one looked. This machinery
  raises confidence in the integrity of the survey data, though it doesn''t by itself
  validate the study''s design.


  Maya checks the surveyors, one row each — the quality signals are the photos, the
  on-primary rate, and the back-checks: a separate quality-control enumerator from
  the survey firm re-visited a random subset of each surveyor''s households. One surveyor
  trips the quality threshold and is flagged. Maya opens that surveyor''s back-check
  — the QC enumerator''s re-visit against the original: sex, age, roof, location, vitamin-A
  result — and the answers don''t match. Looking closer, the flagged surveyor''s interviews
  ran impossibly fast and their roof-type answers collapse onto one value — statistical
  warning signs of possible fabrication that trigger further investigation, not a verdict;
  everyone else varies normally. The flagged work is held for investigation and re-survey
  before it can count toward the coverage estimate — so a single bad surveyor can''t
  quietly move the number.'
