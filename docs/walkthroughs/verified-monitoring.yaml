    intro: 'Maya manages a Connect program delivering vitamin-A home visits. Her frontline
      workers log every visit through Connect and the coverage figure looks good —
      but Maya wants independent, drillable proof her program is actually reaching households,
      and because the independent survey is what verifies the program, she also wants
      to inspect the quality of the survey itself: the survey''s own per-surveyor quality
      and a back-check she can read row by row, including whether any one surveyor''s
      data can be trusted.'
    name: Maya Okafor
    role: Program Manager, Connect Program
