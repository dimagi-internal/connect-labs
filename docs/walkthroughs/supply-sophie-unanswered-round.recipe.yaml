  full_page: false
  concept_claim: The tender's status view records each quote from the supplier's own
    email with a mark saying the AI recorded it, names the fact each quote left out,
    shows when each silent supplier was last chased with a link to the reminder already
    drafted for it, and gives the step the tender is on with its deadline in days, the
    answered and silent counts, and that its import duty terms are not settled.
  design_intent: 'Bet: framing the demo around silence, the normal case, makes every
    later scene answer a question Sophie actually has; one opening scene carries the
    stage, the counts, the supplier table and the unsettled duty terms that scene 5 settles.'
  pace: teach
  role: overview
