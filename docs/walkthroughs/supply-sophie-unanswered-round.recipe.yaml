    note: the canonical frame is the count of comparable quotes, the duty terms (not settled), and the grid with each quote's state, its gaps marked, and the Import duty row waiting on our terms
  concept_claim: The comparison states the tender's import duty terms, holds every quote
    whose Incoterm leaves the import to us until those terms are settled, and marks
    each fact a quote has not stated, without ranking quotes that cannot be compared.
  design_intent: The comparison earns its place by saying what is missing, not by
    ranking quotes that cannot be ranked; seen before the duty terms are settled, it shows what
    an unsettled duty question costs.
  show: Sophie opens the tender's comparison, side by side; no quote is comparable
    yet, for more than one reason. The import duty terms are not settled, so Harmattan's
    carriage-paid quote waits on them, Kanem has not stated its pack, and Sahel's new
    quote is in euros with no exchange rate recorded.
  url: /supply/procurement/tenders/${round2_tender_id}/compare/?program_id=${program_id}
