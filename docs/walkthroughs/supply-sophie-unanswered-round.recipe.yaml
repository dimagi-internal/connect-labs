    note: the canonical frame is the round's duty terms (not settled), the banner saying none of the three quotes can be compared and that the round's own duty terms come first, and the Needs info cards -- Harmattan's and Sahel's Duty lines both reading ours to cost (round terms not settled), Kanem's pack size and Sahel's freight still owed, and Sahel's price in euros with no exchange rate recorded yet
  concept_claim: The comparison states the round's import duty terms, holds every quote
    whose Incoterm leaves the import to us until those terms are settled, whatever duty
    figure its supplier wrote, and names the missing facts on each quote, without ranking
    across them or guessing a figure.
  design_intent: The comparison earns its place by saying what is missing, not by
    ranking quotes that cannot be ranked; seen before the duty answer, it shows what
    an unsettled duty question costs.
  show: Sophie opens the round's comparison and reads that none of the three quotes
    can be compared yet; the round's own import duty terms come first, because Harmattan's
    carriage-paid and Sahel's ex-works quotes both leave the import to us, and each card
    names what its supplier still owes -- Kanem's pack size, Sahel's freight -- and Sahel's
    price is in euros, with no exchange rate recorded yet.
  url: /supply/procurement/tenders/${round2_tender_id}/compare/?program_id=${program_id}
