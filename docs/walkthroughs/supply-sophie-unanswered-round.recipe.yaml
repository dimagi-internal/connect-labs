    target: css:a[href*="#draft-supplier-${sahel_supplier_id}"]
  - kind: wait_for
    target: css:#drafts[open]
  - kind: wait_for
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=record-chase]
  - kind: scroll_to
    note: centre Sahel's drafted reminder, its asked/last-reminded line and its Chased on field with Record chase all in view
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}']
  - kind: hold
    seconds: 0.8
  full_page: false
  concept_claim: The round's page says it is past its deadline and that its import
    duty terms are not settled, and shows, for every supplier asked, whether they
    replied or how long they have been silent and when they were last chased.
  design_intent: 'Bet: framing the demo around silence, the normal case, makes every
    later scene answer a question Sophie actually has; one opening scene carries the
    goal, the table, and the unsettled duty terms that scene 5 settles.'
