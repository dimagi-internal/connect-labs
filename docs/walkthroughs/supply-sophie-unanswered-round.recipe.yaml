scenes:
- id: half-the-round-is-silent
  actions:
  - kind: hold
    note: a settle before the first wait_for, so the opening scene's before-frame is the painted tender page, not a blank one still loading
    seconds: 0.5
  - kind: wait_for
    target: testid:stage-bar
  - kind: hold
    seconds: 1.5
  - kind: hover
    note: the stage bar's current step, Collecting quotes, its note saying the deadline has passed
    say: deadline
    seconds: 2.0
    target: css:[data-testid=stage-bar] li[aria-current=step]
  - kind: hover
    say: half
    seconds: 1.8
    target: css:[data-testid=tile]:has-text('Answered')
  - kind: hover
    say: silent
    seconds: 1.8
    target: css:[data-testid=tile]:has-text('Silent')
  - kind: scroll
    note: frame from the tender's header card -- its title, the stage bar and tiles, then the whole Suppliers table, On us and On suppliers beside
    value: '230'
  - kind: hover
    note: the tender's Terms box, under the Suppliers table, its import duty not settled -- the line scene 5 changes
    say: duty
    seconds: 1.8
    target: testid:tender-duty-terms
  - kind: hover
    note: Sahel's row, its state chip counting the days it has been silent
    say: Sahel
    seconds: 1.8
    target: css:[data-testid=supplier-row][data-supplier-id='${sahel_supplier_id}'] [data-testid=supplier-state]
  - kind: hover
    note: the suppliers still to reply, listed On suppliers, each with when it was asked and last chased
    say: chased
    seconds: 1.8
    target: testid:on-suppliers
  - kind: scroll
    note: settle on the same frame -- the tender's title, stage bar, tiles and the whole Suppliers table, On us and On suppliers beside
    value: '230'
  - kind: hover
    note: park the cursor in the top bar's blank middle, off the page content; the bar is fixed, so hovering cannot scroll the page
    seconds: 0.6
    target: css:header.fixed
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the canonical frame is the stage bar and the Answered / Silent tiles, the Suppliers table with each supplier's state and last chase, the Terms card with import duty not settled, and On us and On suppliers beside
  - kind: click
    note: Sahel's row's own Remind link opens the tender's draft emails at Sahel's drafted reminder, so scene 2 starts (and its before-frame is taken) on the open draft
    target: css:[data-testid=supplier-row][data-supplier-id='${sahel_supplier_id}'] [data-testid=supplier-action]
  - kind: wait_for
    target: css:#drafts[open]
  - kind: wait_for
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=record-chase]
  - kind: scroll_to
    note: centre Sahel's drafted reminder, its asked/last-reminded line and its Chased on field with Record chase all in view
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}']
  - kind: hold
    seconds: 0.8
  full_page: false
  concept_claim: The tender's status view shows the step it is on with its deadline
    passed, how many of the suppliers asked have answered and how many are silent,
    each supplier's state, the suppliers it waits on with when each was last chased,
    and that its import duty terms are not settled.
  design_intent: 'Bet: framing the demo around silence, the normal case, makes every
    later scene answer a question Sophie actually has; one opening scene carries the
    stage, the counts, the supplier table and the unsettled duty terms that scene 5 settles.'
  pace: teach
  role: overview
  show: 'Sophie opens tender 2 past its deadline and reads its stage bar, the Answered
    and Silent tiles, the Suppliers table with Sahel silent, the suppliers listed On
    suppliers with when each was chased, and the Terms box saying import duty is not settled.'
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}
- id: sophie-chases-sahel
  full_page: false
  actions:
