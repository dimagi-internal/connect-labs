  concept_claim: Settling the tender's import duty terms from its Terms box is one choice;
    the tender then lists the reply still owed to Northgate with a drafted email, and
    the comparison costs every quote that leaves the import to us under the terms set.
  design_intent: A question in an email stalls the tender with nobody on the hook;
    as a move on us it is Sophie's to-do with its email drafted, and one setting of
    the tender's terms settles how any quote that leaves the import to us is costed.
  show: Sophie settles the tender's import duty in its Terms box as the program's duty
    waiver, opens the reply to Northgate drafted from On us -- its three questions, an
    answer to write under each -- then opens the comparison, which now costs the quotes
    we import under the waiver; Harmattan's is comparable, Kanem's and Sahel's still
    miss facts of their own.
