    note: the canonical frame is the reminder marked sent -- Sahel's row in the Suppliers table marked just changed, its Last chased cell reading Reminder sent today, the 3rd reminder, and no further reminder before the deadline
  concept_claim: The tender drafts a reminder for each silent supplier that says when
    they were asked and last reminded, with a Sent on field holding today's date and
    a Mark sent button on the draft itself; once marked, the supplier's row reads Reminder
    sent with that day, and no further reminder is scheduled past the tender's deadline.
  design_intent: Chasing is most of the work in a half-silent tender; the record drafts
    the reminder and stamps the day only when it is marked sent, so the date is the
    day it went, and the cadence stops at the deadline.
  show: Sophie reads the reminder drafted for Sahel, its line on when Sahel was asked
    and last reminded, and the Sent on field beside Mark sent; marking it sent returns
    her to the tender's Suppliers table, Sahel's row reading Reminder sent today, its 3rd
    reminder, with no further reminder before the deadline.
