auth:
  personas:
    sophie: scripts/walkthroughs/supply-sophie-unanswered-round/.sophie-storage-state.json
  type: storage_state
base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-10-02T19:55:17.670760+00:00'
review_mode: autonomous
setup:
  command: python3 scripts/walkthroughs/supply-sophie-unanswered-round/seed.py --outputs
    scripts/walkthroughs/supply-sophie-unanswered-round/outputs.json
  outputs: scripts/walkthroughs/supply-sophie-unanswered-round/outputs.json
  rerun: per_render
  timeout_seconds: 1200
tagline: Half the suppliers never answered, and the record says so
video_pace: medium
video_viewport_height: 900
video_viewport_width: 1440
why_brief: supply-sophie-unanswered-round.why_brief.yaml
scenes:
- id: half-the-round-is-silent
  actions:
  - kind: wait_for
    target: text:Where the goods go
  - kind: hold
    seconds: 2.0
  - kind: hover
    note: open, past its deadline
    seconds: 2.0
    target: text:deadline passed
  - kind: hover
    say: half
    seconds: 1.8
    target: testid:outreach-replied-count
  - kind: hover
    say: silent
    seconds: 1.8
    target: text:Sahel Nutrition Industries
  - kind: hover
    say: chased
    seconds: 1.5
    target: text:Last chased
  - kind: hover
    note: the round has not yet settled who handles import duties -- the line scene 5 changes
    say: duties
    seconds: 1.5
    target: testid:tender-duty-terms
  - kind: scroll
    note: back to the top, so the held frame opens on the round's title, its status and duty-terms lines, and the whole Outreach table with its column headings
    value: top
  - kind: hover
    note: park the cursor in the blank middle of the Outreach heading row, inside the header block, so hovering cannot scroll the page
    seconds: 0.6
    target: css:div:has(> h2#outreach)
  - kind: hold
    seconds: 1.5
  concept_claim: The round's page says it is past its deadline and that its import
    duty terms are not settled, and shows, for every supplier asked, whether they
    replied or how long they have been silent and when they were last chased.
  design_intent: 'Bet: framing the demo around silence, the normal case, makes every
    later scene answer a question Sophie actually has; one opening scene carries the
    goal, the table, and the unsettled duty terms that scene 5 settles.'
  pace: teach
  role: overview
  show: 'Sophie opens round 2''s tender page past its deadline and reads the Outreach
    table: three replied, three silent with the days since she asked and the day she
    last chased each, and the header line saying import duties are not settled.'
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}
- id: sophie-chases-sahel
  actions:
  - kind: wait_for
    target: css:#drafts
  - kind: click
    note: open Sahel's drafted reminder from Sahel's own row, which opens the draft emails at Sahel's card, its heading just under the top bar
    say: drafts
    target: css:tr:has-text('Sahel Nutrition Industries') [data-testid=row-draft-reminder]
  - kind: wait_for
    target: css:#drafts[open]
  - kind: hold
    seconds: 0.8
  - kind: hover
    note: the line that says when she asked Sahel and when she last reminded them
    say: reminder
    seconds: 2.0
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=draft-why]
  - kind: hover
    note: today's date, ready in Chased on beside Record chase, at the foot of the card after the email
    say: today
    seconds: 1.8
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=chase-date]
  - kind: hover
    note: park the cursor on the To line's blank right, off the message, the facts row and the date field
    seconds: 0.6
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=draft-to-line]
  - kind: hold
    note: the drafted reminder, open, with today's date ready to record
    seconds: 2.5
  - kind: snapshot
    note: the canonical frame is Sahel's whole drafted reminder card, its facts row, and Chased on reading today beside Record chase -- the only chase control in frame
  - kind: click
    must_succeed: true
    note: record the day she chased Sahel, from the draft itself; the round lands on Sahel's row, which scene 3 opens on
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=record-chase]
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: css:tr[data-changed]
  - kind: hover
    note: park the cursor on the Draft reminders button above the table, clear of "3 of 6 replied" and Sahel's row
    seconds: 0.6
    target: testid:draft-reminders
  - kind: hold
    note: the chase recorded -- Sahel's Last chased reads today, the 3rd reminder, and when the next falls due
    seconds: 2.0
  concept_claim: The round drafts a reminder for each silent supplier that says when
    they were asked and last reminded, with a Chased on field holding today's date
    and a Record chase button on the draft itself.
  design_intent: Chasing is most of the work in a half-silent round; the record drafts
    the reminder and records the chase from the same card, so the day is kept.
  show: Sophie opens the round's draft emails and reads the reminder drafted for
    Sahel, its line on when Sahel was asked and last reminded, and the Chased on field
    beside Record chase.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}
- id: sahel-finally-answers
  actions:
  - kind: wait_for
    target: css:#history
  - kind: goto
    must_succeed: true
    note: 'land on the round''s History, its heading just under the top bar, before the first hold'
    target: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}#history
  - kind: wait_for
    target: testid:history-replies-only
  - kind: hold
    seconds: 0.8
  - kind: click
    must_succeed: true
    note: replies only goes on at once, so the emails lead with Sahel's first
    target: testid:history-replies-only
  - kind: hold
    seconds: 0.8
  - kind: click
    must_succeed: true
    note: open Sahel's own email, recorded by the AI
    say: email
    target: css:[data-testid=email-event]:has-text('Sahel Nutrition Industries') [data-testid=source-toggle]
  - kind: wait_for
    target: css:[data-testid=email-event]:has-text('Sahel Nutrition Industries') [data-testid=source-excerpt]
  - kind: hold
    note: the camera stays on History, its heading under the top bar and Sahel's opened email whole below it
    say: wrote
    seconds: 2.0
  - kind: hover
    note: the history line that says Sahel replied with a quote, and on what day
    say: answers
    seconds: 1.8
    target: text:Replied with a quote on 3 Oct 2026
  - kind: hover
    note: park the cursor on the day row's blank middle, off the heading, the filter and Sahel's email
    seconds: 0.6
    target: css:[data-testid=timeline-day]:visible
  - kind: hold
    seconds: 1.2
  - kind: snapshot
    note: the canonical frame is Sahel's email opened -- sender, excerpt and what the AI recorded from it
  before: python3 scripts/walkthroughs/supply-sophie-unanswered-round/seed.py --sahel-replies
  concept_claim: When a silent supplier's forwarded email is recorded, the round's
    history, turned to replies only, shows that email first with its sender, the excerpt
    of what they wrote behind an opened Source email toggle, and the quote and the reply
    the AI recorded from it, dated the day it came in.
  design_intent: 'A real event between scenes: the record changes because the world
    did, and Sophie drills into the email itself to check it, so the change carries
    its own evidence.'
  show: Sophie lands on the round's history turned to replies only, with Sahel's
    email first, opens the Source email toggle on Sahel's email, and reads the excerpt
    and sender beside what the AI recorded from it, the reply dated 3 Oct 2026.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}#history
- id: whats-still-missing
  actions:
  - kind: wait_for
    target: text:Kanem Foods
  - kind: hover
    say: Harmattan
    seconds: 2.0
    target: text:Harmattan Therapeutics
  - kind: scroll
    note: down to the Needs info cards, Kanem's pack size and Sahel's three blockers (a scroll_to here is clamped at the page's foot)
    say: Kanem
    value: bottom
  - kind: hover
    note: park the cursor in the Needs info heading's blank right, off the cards
    seconds: 0.6
    target: css:h2:has([data-testid=needs-info-title])
  - kind: hold
    say: Sahel
    seconds: 2.5
  - kind: scroll
    note: back up to the round's duty terms note and the summary banner naming every missing fact (a scroll_to here cannot move the page, it is already near the top)
    value: top
  - kind: hover
    say: not settled
    seconds: 2.0
    target: testid:comparison-duty-terms
  - kind: hover
    note: park the cursor in the fixed top bar's blank middle, off the Comparable heading, the duty note and the panel; the bar is fixed, so hovering cannot scroll the page
    seconds: 0.6
    target: css:header.fixed
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the canonical frame is the duty terms note (not settled), the "1 of 3 quotes can be compared" banner naming each missing fact, and Harmattan under Comparable
  concept_claim: The comparison states the round's import duty terms and names the
    missing facts on each quote that cannot be compared, including a reply that has
    only just arrived, without ranking across them or guessing a figure.
  design_intent: The comparison earns its place by saying what is missing, not by
    ranking quotes that cannot be ranked; seen before the duty answer, it shows what
    an unsettled duty question costs.
  show: Sophie opens the round's comparison, reads the fact each quote is missing
    and from whom, and the note that the round's import duty terms are not settled.
  url: /supply/procurement/tenders/${round2_tender_id}/compare/?program_id=${program_id}
- id: what-we-owe-northgate
  actions:
  - kind: wait_for
    target: text:What we owe them
  - kind: scroll_to
    target: css:#owed
  - kind: hold
    seconds: 1.0
  - kind: click
    must_succeed: true
    note: Mark answered on the importer question
    target: css:[data-commitment-id='${importer_question_id}'] a
    timeout_ms: 30000
  - kind: fill
    say: import
    target: css:#id_resolution
    value: We import, under the program's duty waiver; please state freight to Kano.
  - kind: select
    note: this answer sets the round's import duty terms
    say: waiver
    target: css:[data-testid=answer-duty-terms]
    value: buyer_waiver
  - kind: click
    must_succeed: true
    target: role:button:Save
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: css:[data-changed]
  - kind: hover
    note: the importer question, answered into her reply to Northgate
    seconds: 2.0
    target: css:[data-commitment-id='${importer_question_id}']
  - kind: goto
    must_succeed: true
    note: on to the round's comparison, which now costs quotes by the terms just set
    target: /supply/procurement/tenders/${round2_tender_id}/compare/?program_id=${program_id}
  - kind: wait_for
    must_succeed: true
    target: testid:comparison-duty-terms
  - kind: hover
    note: the duty terms note now reads the waiver
    say: comparison
    seconds: 2.0
    target: testid:comparison-duty-terms
  - kind: scroll_to
    note: the Needs info heading to the top (the section is at least a screen tall, so the scroll is not clamped at the page foot), the Round terms line right under it and Sahel's card below, its duty line citing her answer to Northgate -- cause and effect in one frame
    target: css:#needs-info
  - kind: hover
    note: the card's own Duty line -- waived because we import, the round's terms set from her answer to Northgate
    say: waived
    seconds: 2.0
    target: css:[data-testid=needs-info] [data-quote-id]:has-text('Sahel Nutrition Industries') [data-testid=card-duty]
  - kind: hover
    note: park the cursor in the fixed top bar's blank middle (empty space, x about 750, y about 32), off the Needs info heading, the Round terms line and every card; the bar is fixed, so hovering cannot scroll the page
    seconds: 0.6
    target: css:header.fixed
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the canonical frame is the Needs info heading with the Round terms line under it (the waiver, set from her answer to Northgate), and Sahel's Needs info card under the waiver -- its Duty line reading duty waived (our import), set from her answer to Northgate, with only the exchange rate and freight left blocking it
  concept_claim: Answering a supplier's question about who imports can set the round's
    import duty terms, and the round's comparison then states those terms and costs
    a quote that leaves duty out under them, so duty is no longer among what blocks
    that quote.
  design_intent: A question in an email stalls the round with nobody on the hook;
    as a record it is Sophie's to-do, and one answer to it settles how any quote that
    leaves duty out is costed.
  show: Sophie marks Northgate's importer question answered with her answer, picks
    the program's duty waiver as the round's import duty terms, then opens the round's
    comparison, which now costs a quote that leaves duty out under the waiver.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}#owed
- id: held-on-us
  actions:
  - kind: wait_for
    target: testid:waiting-on-us
  - kind: hover
    say: permit
    seconds: 2.0
    target: testid:waiting-on-us
  - kind: click
    must_succeed: true
    note: 'the forwarder''s message: held at the border on our import permit'
    say: forwarder
    target: css:[data-testid=revision-line]:has-text('Shipment · DMG-PO-2026-031 ·
      Status dispatched') [data-testid=source-toggle]
  - kind: scroll_to
    target: css:[data-testid=revision-line]:has-text('Shipment · DMG-PO-2026-031 ·
      Status dispatched') [data-testid=source-excerpt]
  - kind: hold
    note: the forwarder's email, centred and read
    seconds: 2.0
  - kind: scroll_to
    note: centre the invoice's Freight line, so the Invoices heading and its column headers sit whole under the top bar, with the history's Waiting on us line and why it is ours (we are the consignee) below
    target: css:tr:has([data-testid=above-agreed-tag]):has-text('Freight')
  - kind: hover
    say: invoice
    seconds: 1.8
    target: testid:above-agreed-tag
  - kind: hover
    note: the Dispute action beside Pay on the invoice billed above agreed
    seconds: 1.2
    target: testid:invoice-dispute
  - kind: hover
    note: park the cursor in the Total row's empty Issued cell, off the figures, the headers and the email
    seconds: 0.6
    target: css:[data-testid=invoice-above-agreed-row] td:nth-child(2)
  - kind: hold
    seconds: 1.5
  concept_claim: The order says it is waiting on us for the import permit, with the
    forwarder's email saying the trucks are held at the border until it is provided,
    and flags an invoice above the agreed price with billed against agreed.
  design_intent: The screens must blame the right party; a shipment held on our paperwork
    is our move, and being the importer is what makes it ours.
  show: Sophie opens the round 1 order, reads the Waiting on us banner, opens the
    forwarder's email in the order's history, and reads the invoice flagged above
    the agreed price.
  url: /supply/orders/${contract_id}/?program_id=${program_id}
- id: whose-move
  actions:
  - kind: wait_for
    target: testid:standing-table
  - kind: scroll_to
    note: frame the whole standing table, the order row and its "bought by" line included
    target: testid:standing-table
  - kind: hover
    say: silent
    seconds: 1.8
    target: text:No reply
  - kind: hover
    note: Sahel's missing facts, now without a duty figure
    say: duty figure
    seconds: 1.8
    target: text:Missing facts
  - kind: hover
    note: the round 1 order's Waiting on cell -- the import permit and the invoice dispute, both lines in frame
    say: permit
    seconds: 1.8
    target: css:[data-testid=standing-table] td:nth-child(3):has-text('import permit')
  - kind: hold
    say: invoice
    seconds: 1.5
  - kind: hover
    note: park the cursor on the table's caption, off the table and the View as of control
    seconds: 0.6
    target: text:Where everything stands
  - kind: hold
    seconds: 1.5
  concept_claim: The overview names each supplier who has not replied with the day
    we asked them, lists the facts each quote still lacks, which under the round's
    waiver no longer include a duty figure, and says when the next move is ours, for
    the order, the import permit and disputing an invoice above the agreed price.
  design_intent: The overview is where Sophie starts her day; it must already say
    who is silent, what is missing and whose move it is.
  show: Sophie returns to the overview and reads the Waiting on column for round 2,
    Sahel's quote short only its exchange rate and freight, and the round 1 order
    waiting on us for the import permit and the invoice dispute.
  url: /supply/?program_id=${program_id}
