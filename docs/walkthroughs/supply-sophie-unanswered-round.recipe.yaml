    seconds: 1.2
  - kind: hover
    note: the line that says when she asked Sahel and when she last reminded them
    say: reminder
    seconds: 2.0
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=draft-why]
  - kind: hover
    note: today's date, ready in Chased on beside Record chase, at the foot of the card after the email
    say: today
    seconds: 1.8
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=chase-date]
  - kind: hover
    note: park the cursor in the top bar's blank middle, off the message, the facts row and the date field
    seconds: 0.6
    target: css:header.fixed
  - kind: hold
    note: the drafted reminder, open, with today's date ready to record -- the scene's before-frame
    seconds: 2.5
  - kind: click
    must_succeed: true
    note: record the day she chased Sahel, from the draft itself; the tender lands on its Invitations, Sahel's row marked
    target: css:[data-testid=draft][data-supplier-id='${sahel_supplier_id}'] [data-testid=record-chase]
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: css:tr[data-changed]
  - kind: scroll_to
    note: centre Sahel's Invitations row, marked as just changed, with the table's headings above it
    target: css:tr[data-changed]
  - kind: hover
    note: the payoff of the chase -- Sahel's Last chased cell reads today, the 3rd reminder, and when the next falls due
    say: recorded
    seconds: 2.0
    target: css:tr[data-changed] td:has-text('3rd reminder')
  - kind: hover
    note: park the cursor in the top bar's blank middle, clear of every button and of Sahel's row
    seconds: 0.6
    target: css:header.fixed
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the canonical frame is the recorded chase -- Sahel's Invitations row marked just changed, its Last chased cell today, the 3rd reminder, and when the next falls due
  concept_claim: The tender drafts a reminder for each silent supplier that says when
    they were asked and last reminded, with a Chased on field holding today's date
    and a Record chase button on the draft itself.
  design_intent: Chasing is most of the work in a half-silent tender; the record drafts
    the reminder and records the chase from the same card, so the day is kept.
  show: Sophie reads the reminder drafted for Sahel, its line on when Sahel was asked
    and last reminded, and the Chased on field beside Record chase; recording the chase
    returns her to the tender's Invitations, Sahel's row marked with its 3rd reminder.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}#draft-supplier-${sahel_supplier_id}
