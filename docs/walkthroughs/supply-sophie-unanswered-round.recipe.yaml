  concept_claim: Answering a supplier's question about who imports can set the round's
    import duty terms, and the round's comparison then states those terms and costs
    a quote that leaves duty out under them, so duty is no longer among what blocks
    that quote.
  design_intent: A question in an email stalls the round with nobody on the hook;
    as a record it is Sophie's to-do, and one answer to it settles how any quote that
    leaves duty out is costed.
  show: Sophie marks Northgate's importer question answered with her answer, picks
