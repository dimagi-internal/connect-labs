    seconds: 0.6
    target: css:header.fixed
  - kind: hold
    seconds: 1.2
  - kind: snapshot
    note: the canonical frame is Sahel's email opened -- sender, excerpt and what the AI recorded from it
  before: python3 scripts/walkthroughs/supply-sophie-unanswered-round/seed.py --sahel-replies
  concept_claim: When a silent supplier's forwarded email is recorded, the tender's
    history, turned to replies only, shows that email first with its sender, the excerpt
    of what they wrote behind an opened Source email toggle, and the quote and the reply
    the AI recorded from it, dated the day it came in.
  design_intent: 'A real event between scenes: the record changes because the world
    did, and Sophie drills into the email itself to check it, so the change carries
    its own evidence.'
  show: Sophie lands on the tender's history turned to replies only, with Sahel's
    email first, opens the Source email toggle on Sahel's email, and reads the excerpt
    and sender beside what the AI recorded from it, the reply dated the day it came in.
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}#history
