auth:
  type: url
  url: /supply/dev-login/?persona=ada
base_url: http://localhost:8009
narrative_locked: true
review_mode: autonomous
why_brief: oes-command-centre.why_brief.yaml
tagline: Which children are about to go without, and what can still be done about it
setup:
  command: python scripts/walkthroughs/oes/ensure_demo.py
  rerun: per_render
  timeout_seconds: 600
scenes:
- id: which-children-are-about-to-go-without
  concept_claim: The command centre opens on a severity-ranked exception queue rather than a status board,
    so the first thing read is which children go without and by when.
  role: overview
  url: /supply/
  show: The Command centre tab — the severity-ranked exception queue beside the live corridor map, with
    the key figures above it leading on children at risk rather than consignment count.
  actions:
  - kind: click
    target: css:.navitem:has-text('Command centre')
  - kind: wait_for
    target: css:.exception-list
  - kind: hold
    seconds: 2.2
  impressive_because: A status board tells you a consignment is nine days late. This tells you which children
    go without because of it, where, and by when — which is the difference between a screen you look at
    and a screen you act on.
  ai_quality: The queue is ordered by children at risk; the map is context beside it rather than the product.
- id: three-ways-the-data-arrives-and-the-honest-one
  concept_claim: Every event carries its ingestion tier and hand-keyed data is marked wherever it appears,
    so the picture is honest about being brightest where access is easiest.
  url: /supply/
  show: The Sudan corridor's contract opened to its delivery schedule, every consignment carrying how it
    is known — EPCIS from a plant, a despatch advice, or a driver's phone check-in — so the picture says
    where it is bright and where it is thin. (The network map is the natural home for this and renders
    blank without a Mapbox token, so the tier is shown where it is legible instead.)
  actions:
  - kind: scroll_to
    target: css:.card:has-text('Pipeline by corridor')
  - kind: click
    target: css:.card:has-text('Pipeline by corridor') tr:has-text('OES-C-2026-SD1')
    note: the Sudan corridor — no domestic producer, so it runs on paper waybills
  - kind: wait_for
    target: css:.modal
  - kind: scroll_to
    target: css:.modal .card:has-text('Delivery schedule')
  - kind: hold
    seconds: 3.0
    note: every consignment carries how it is known — EPCIS from the plant, a despatch advice,
      a driver's phone check-in — and the lowest tier is the one serving the worst famine phase

  impressive_because: The picture is brightest exactly where access is easiest. Sudan has no domestic
    producer and its corridor runs on paper waybills, so the lowest tier is not a fallback — it is the
    honest case, and it serves the worst famine phases.
  ai_quality: Hand-keyed data carries its marker wherever it appears; the flows follow real road and sea
    corridors rather than straight lines.
- id: late-is-a-measurement-not-an-argument
  concept_claim: Planned, estimated and actual are kept as three separate timestamps per milestone, so
    a delay is a measurement that survives the conversation.
  url: /supply/
  show: A late consignment opened to its milestone rail — planned, estimated and actual kept as three
    separate timestamps per leg, with the resulting delta.
  actions:
  - kind: click
    target: css:.modal-close
    note: close scene 2's contract. Closing it at the END of scene 2 meant that scene
      captured after its own source badges were dismissed — the three-tier claim was
      argued over a frame that no longer contained it.
  - kind: scroll_to
    target: css:.exception-list
  - kind: click
    target: css:.exception:has-text('El Fasher Distribution Hub')
    note: expand the row it ranks first
  - kind: hold
    seconds: 1.4
  - kind: click
    target: css:.exception:has-text('El Fasher Distribution Hub') span:has-text('Open SHP')
    note: the consignment itself — the queue named it and could not open it until now
  - kind: wait_for
    target: css:.modal
  - kind: scroll_to
    target: css:.modal .card:has-text('Milestones')
  - kind: hold
    seconds: 3.0
    note: planned, estimated and actual kept as three separate timestamps per leg — the
      estimate is what has moved, which is why this is nine days late while still on the road
  impressive_because: If the plan is overwritten each time the estimate moves then nothing is ever late
    and any number can be argued away. Keeping all three means the figure survives the conversation.
  ai_quality: Three distinct timestamps are visible, not one field relabelled.
- id: nobody-can-clear-a-red-row-by-editing-a-field
  concept_claim: Shipment status and milestone actuals are derived from an append-only event log with
    no write path that sets them directly.
  url: /supply/
  show: The same consignment's event log — append-only, each entry carrying how it reached us, and no
    field anywhere on the page that sets the status directly.
  actions:
  - kind: scroll_to
    target: css:.modal .card:has-text('Event log')
  - kind: hold
    seconds: 3.0
    note: append-only, with the provenance of every entry beside it. Nothing here is a status
      field; the status is what this log adds up to.
  impressive_because: A red row goes away when the situation changes, not when somebody decides it looks
    bad before a Monday meeting. That single constraint is what makes the queue beside it worth trusting.
  ai_quality: Status is presented as derived; no edit control for it exists on the page.
- id: the-caseload-underneath-the-map
  concept_claim: A caseload per district turns delivery from tonnage into coverage, and every figure carries
    the method that produced it.
  url: /supply/
  show: The Requirement from caseload card — every district with its famine phase, the children needing
    treatment across the response window, the courses actually delivered into it, and coverage. North
    Darfur at IPC 5 sits at 0% with everything still in transit; Borno at 31% with 33,232 children uncovered.
  actions:
  - kind: click
    target: css:.modal-close
    note: close the consignment — scene 4 ends inside it
  - kind: scroll_to
    target: css:.card:has-text('Requirement from caseload')
  - kind: hold
    seconds: 2.6
  - kind: scroll_to
    target: css:tr:has-text('Kassala')
    note: the contrast the scene exists for — Kassala at 91% of a small caseload beside Borno at 34% of
      one seven times larger, on more than twice the cartons. A hover on a native title tooltip used to
      sit here; it renders nothing in a headless capture.
  - kind: hold
    seconds: 1.6
  impressive_because: With a denominator, delivery stops being tonnage and becomes coverage. Volume alone
    could never distinguish a large delivery into a small caseload from a small delivery into a huge one.
  ai_quality: Every district carries a source note for its caseload; coverage is bounded by a stated window
    rather than comparing a cumulative total to a monthly rate.
- id: twelve-thousand-children-by-the-ninth-of-september
  concept_claim: All four exception kinds are ranked in one unit — children who miss a full course — with
    the derivation shown on the expanded row.
  url: /supply/
  show: The exception queue read properly — every row carrying children who miss a full course, an expanded
    row showing the derivation behind its rank, and the Weeks of cover card below giving the date each
    node runs dry.
  actions:
  - kind: scroll_to
    target: css:.exception-list
  - kind: click
    target: css:.exception:first-child
  - kind: wait_for
    target: css:.exception-derivation
  - kind: hold
    seconds: 2.4
    note: how this row was ranked
  - kind: scroll_to
    target: css:.card:has-text('Weeks of cover')
  - kind: hold
    seconds: 1.8
  impressive_because: A late truck, a short receipt, an expiring batch and a partner's shortfall are not
    comparable in tonnage. In children they are, which is the only thing that makes the ordering of this
    queue defensible.
  ai_quality: Every row states children at risk and its derivation; the ordering matches those figures.
- id: the-signal-came-from-the-ground
  concept_claim: A partner-raised exception is marked as such and names the organisation, distinguishing
    a coordination product from a monitoring one.
  url: /supply/
  show: The top row of the queue — the Kukawa shortfall, marked as raised by Komadugu Health Initiative
    four days ago, sitting above every exception the system derived for itself.
  actions:
  - kind: scroll_to
    target: css:.exception-list
  - kind: hover
    target: css:.exception:has-text('Komadugu')
  - kind: hold
    seconds: 2.2
  impressive_because: A centre that invents its own alerts is running a monitoring product. A centre responding
    to what the people holding the cartons reported is running a coordination product, and that is the
    actual shape of the relationship.
  ai_quality: The partner-raised marker names the organisation and the report date; a centrally-derived
    row does not carry it.
- id: ada-reallocates-and-the-numbers-move
  concept_claim: A reallocation creates a real consignment with planned milestones, so cover, the pipeline
    gap and the map recompute from it rather than being adjusted.
  url: /supply/
  show: Ada reallocates cartons from the Kassala forward store — which holds more than its own caseload
    needs — to El Fasher, on camera. The source list offers only nodes genuinely holding surplus and what
    each could spare without dropping below its own threshold; the reason is required; and the exception
    the reallocation answers leaves the queue when it lands.
  actions:
  - kind: scroll_to
    target: css:.exception-list
  - kind: click
    target: css:.exception:has-text('El Fasher') span.btn:has-text('Reallocate to')
    note: the row's own advice, now something that can be done
  - kind: wait_for
    target: css:.modal
  - kind: hold
    seconds: 2.4
    note: only nodes holding surplus, each with what it can spare without causing the next stockout
  - kind: fill
    target: css:.modal textarea
    value: Khartoum leg nine days behind and El Fasher has nothing on hand. Kassala is carrying fifteen
      weeks against its own caseload.
  - kind: hold
    seconds: 1.4
  - kind: click
    target: css:.modal button:has-text('Reallocate')
    note: a real consignment, with planned milestones, against a named contract
  - kind: wait_for
    target: css:.toast
  - kind: hold
    seconds: 1.6
  - kind: scroll_to
    target: css:.exception-list
  - kind: hold
    seconds: 3.0
    note: the row is marked answered with the effect and the reason on it, the headline
      counts only what nobody has acted on, and it has stopped leading a queue that asks
      what is still outstanding
  impressive_because: The decision and the evidence that prompted it are now the same record — the thing
    a messaging group can never give you afterwards. And the numbers moved because a consignment moved,
    not because a status was edited.
  ai_quality: A real shipment with planned milestones appears; the resolved exception references the action
    id rather than simply disappearing.
