name: supply-sophie-rutf
narrative: >-
  Sophie runs Connect-RUTF procurement for Dimagi, and she is the only person inside the
  record: suppliers and the freight forwarder email her, and an AI she forwards that email
  to does the typing. She opens her program and reads, line by line, where round 1 and
  round 2 stand, which suppliers have been silent for two weeks, and which rows the AI
  wrote last. Sophie opens round 1's timeline and finds the day the shipment's arrival
  moved from 5 Sep to 19 Sep, entered by the ACE agent from an email she forwarded twice
  yet recorded once, and opens the forwarder's own words behind it. Sophie sets the date back to 20 Aug and reads what her program believed
  then: round 1 in transit, due 5 Sep, and no round 2 at all; then she comes back to today.
  Sophie opens round 2's comparison and reads, for each of the three quotes, the one thing that
  keeps it out of the ranking and the question already written out to ask that supplier. The
  supplier that had not said how many sachets a carton holds replies, 150 per carton; the AI
  reading Sophie's forwarded mail records the answer against its quote, and Sophie finds the
  correction on round 2's timeline with the reply quoted beside it, then sees that quote ranked
  with a cost per carton and per child treated. Sophie opens round 2 on the market as a supplier
  would and reads the request she published, and nothing she keeps private. Sophie awards round 2
  provisionally to the quote that answered, writing why, and her overview shows round 2 awarded,
  by her, today.
base_url: https://labs.connect.dimagi.com
why_brief: supply-sophie-rutf.why_brief.yaml
review_mode: autonomous
tagline: Every change on the record says who made it, on what evidence, and what we believed before it
video_pace: medium
video_viewport_width: 1440
video_viewport_height: 900
setup:
  command: python3 scripts/walkthroughs/supply-sophie-rutf/seed.py --outputs scripts/walkthroughs/supply-sophie-rutf/outputs.json
  outputs: scripts/walkthroughs/supply-sophie-rutf/outputs.json
  rerun: per_render
  timeout_seconds: 900
personas:
  sophie:
    name: Sophie
    role: Program manager, Connect-RUTF (Dimagi, buyer of record)
    color: '#4F46E5'
    intro: Sophie buys therapeutic food for Connect-RUTF and, since suppliers will not log into anything, is the only person inside the record while an AI types in what their emails say.
scenes:
- id: sophie-reads-her-program
  persona: sophie
  title: Sophie reads where her program stands today
  role: overview
  url: /supply/?program_id=${program_id}
  narrative: >-
    Suppliers email Sophie and an AI types what they say, so she is the only person inside
    Connect-RUTF's record. Sophie opens her program and reads, line by line, where round 1 and round 2 stand,
    which suppliers have been silent for two weeks, and which rows the AI wrote last.
  show: >-
    Sophie opens /supply/ for Connect-RUTF. The header reads "Connect-RUTF · Dimagi, buyer of
    record". One line per tender and order: round 1 delivered and paid; round 2 open, waiting on
    quotes, with a stale flag for the suppliers who have not replied in two weeks and for quotes
    missing a basis; each line says when it last changed and who changed it, and rows last written
    through the AI carry the AI badge.
  actions:
  - kind: wait_for
    target: buyer of record
  - kind: hold
    seconds: 1.0
    note: the program's rows, round 1 above round 2
  - kind: hover
    target: css:[data-testid=overview-row][data-round='2'] [data-testid=stale-flag]
    seconds: 2.0
    say: silent
    note: the stale flag on round 2, naming the unanswered suppliers and the quotes missing a basis
  - kind: hover
    target: css:[data-testid=overview-row] [data-testid=ai-badge]
    seconds: 1.8
    say: AI
    note: a row whose last change came through the AI
  - kind: hover
    target: text:buyer of record
    seconds: 0.8
    note: park the cursor off the rows
  - kind: snapshot
    note: the program on one screen, today
  concept_claim: The supply overview for program Connect-RUTF names Dimagi as buyer of record and lists only this program's tenders and orders, each with its stage, what it is waiting on, when and by whom it last changed, a stale flag on round 2 for unanswered outreach and quotes missing a basis, and an AI badge on rows last written over MCP.
  provenance: S1
  design_intent: Sophie manages one program; the first screen answers "where does each round stand and what needs chasing" without her opening anything, and tells her which of what she reads the AI typed.
  full_page: false
  features:
  - id: overview-program-header
    description: The /supply/ header names the program and the buyer-of-record org in its role ("Connect-RUTF · Dimagi, buyer of record"), per design spec §4.1.
    verify: 'pytest: GET /supply/?program_id=10672 as a program member returns 200 and the body contains "buyer of record" and the program name'
  - id: overview-rows
    description: One overview row per open or recent tender and order in the program (data-testid=overview-row), showing stage, what it is waiting on, last change time and actor; other programs' records never appear.
    verify: 'pytest: seed two programs, GET /supply/?program_id=A and assert every overview-row belongs to program A and shows a last-changed actor'
  - id: overview-stale-flag
    description: A stale flag (data-testid=stale-flag) when an outreach has no reply 14+ days after sent_on, an expected_on has passed with no receipt, or a quote has a not_specified basis the comparison needs.
    verify: 'pytest: outreach sent 15 days ago with responded=False makes its tender row carry stale-flag; one sent 13 days ago does not'
  - id: overview-ai-badge
    description: Rows whose latest revision has channel mcp or api show an AI badge (data-testid=ai-badge); web-channel rows do not.
    verify: 'pytest: a tender last updated through call_operation(channel="mcp") renders ai-badge on its overview row; one updated with channel="web" does not'
- id: the-eta-that-moved
  persona: sophie
  title: Sophie finds the day round 1's arrival slipped
  url: /supply/procurement/tenders/${round1_tender_id}/?program_id=${program_id}
  narrative: >-
    Sophie opens round 1's timeline and finds the day the shipment's arrival moved from 5 Sep
    to 19 Sep, entered by the ACE agent from an email she forwarded twice yet recorded once, and
    opens the forwarder's own words behind it.
  show: >-
    Sophie opens round 1. Under its current state, a timeline reads newest first, from payment back
    to the first quote, one plain sentence per change; lines she typed herself carry her name and no
    excerpt. She scrolls to "ETA 5 Sep → 19 Sep", badged "ACE (agent)", which appears once although
    the forwarder's email reached the AI twice, and opens the badge: the forwarder's email excerpt
    that justified the change.
  actions:
  - kind: wait_for
    target: testid:timeline
  - kind: scroll_to
    target: css:[data-testid=revision-line][data-field=expected_on]
  - kind: hover
    target: css:[data-testid=revision-line][data-field=expected_on]
    seconds: 1.5
    say: 19 Sep
    note: the ETA change, in words, with its actor badge
  - kind: click
    target: css:[data-testid=revision-line][data-field=expected_on] [data-testid=actor-badge]
    note: open the source behind the AI's entry
  - kind: wait_for
    target: testid:source-excerpt
  - kind: hold
    seconds: 2.0
    note: the forwarder's words, quoted
    say: words
  - kind: snapshot
    note: the ETA slip and the evidence for it
  concept_claim: Round 1's tender page shows a newest-first timeline of its changes from quote to payment in plain sentences, including exactly one line "ETA 5 Sep → 19 Sep" badged "ACE (agent)" although its source email was submitted twice, and clicking that badge shows the quoted email excerpt the agent recorded as its source, while lines Sophie entered on the web show her name and no excerpt.
  provenance: S2
  design_intent: An overwrite erased what the program had believed; a revision with actor, channel and source makes the change, who made it and why visible, so an AI-typed change can be checked rather than trusted.
  features:
  - id: revision-model
    description: Append-only Revision model (program_id, content_type, object_id, action, changes, recorded_at, actor, actor_is_agent, channel, operation, source_ref, source_excerpt, result_ref) that raises on update and delete, per design spec §3.1.
    verify: 'pytest: Revision.objects.create(...) then .save() again raises, and .delete() raises'
  - id: revision-capture
    description: call_operation opens a write context (actor, channel, operation, source) and pre_save/post_save/post_delete receivers on every supply_chain model write one Revision with a field diff excluding created/modified; saves outside a context write channel="command".
    verify: 'pytest: call_operation("shipment_update", ..., channel="mcp", source={"ref":"m1","excerpt":"x"}) writes one Revision with changes {"expected_on": [old, new]}, channel "mcp" and source_excerpt "x"'
  - id: source-idempotency
    description: Every write operation schema accepts optional source {ref, excerpt}; a repeated source.ref for the same operation in the program writes nothing and returns replayed true.
    verify: 'pytest: two identical shipment_update calls with source.ref "m1" produce one Revision and the second returns {"replayed": true}'
  - id: tender-timeline
    description: Tender detail renders a newest-first timeline (data-testid=timeline) of the tender and its children (quotes, outreach, contract, shipments, invoices, payments), one plain-language line per revision (data-testid=revision-line, data-field) from a per-model field formatter.
    verify: 'Playwright: open round 1 tender detail, assert timeline has a revision-line[data-field=expected_on] whose text contains "5 Sep" and "19 Sep"'
  - id: actor-badge-excerpt
    description: Each timeline line carries an actor badge (data-testid=actor-badge) reading "Sophie", "via AI · Sophie" or "ACE (agent)" (agent per LABS_AGENT_ACCOUNT_EMAILS); clicking it reveals the source excerpt (data-testid=source-excerpt).
    verify: 'Playwright: click the actor-badge on the expected_on line, assert text "ACE (agent)" and a visible source-excerpt'
  - id: seed-round1-history
    description: seed_rutf_rounds replays round 1 as dated history through its operations with synthetic Message-IDs and excerpts, some steps as the ACE agent over mcp and some as Sophie over web, using a seed-only recorded_at override refused unless scopes.is_synthetic(program_id).
    verify: 'pytest: seeding program 10672 yields a shipment Revision with channel "mcp", actor_is_agent true and changes on expected_on; the override on a non-synthetic program raises'
- id: back-to-twenty-august
  persona: sophie
  title: Sophie looks at her program as it stood on 20 Aug
  url: /supply/?program_id=${program_id}
  narrative: >-
    Sophie sets the date back to 20 Aug and reads what her program believed then: round 1 in
    transit, due 5 Sep, and no round 2 at all; then she comes back to today.
  show: >-
    From the overview Sophie sets the header's date control to 20 Aug. A banner reads "Viewing as
    of 20 Aug 2026 — back to today"; the write controls are gone; round 1 reads in transit with an
    expected arrival of 5 Sep, and round 2 is not on the page. She clicks "back to today" and the
    present overview returns.
  actions:
  - kind: wait_for
    target: testid:as-of-control
  - kind: fill
    target: css:[data-testid=as-of-control] input[type=date]
    value: ${as_of_date}
    say: 20 Aug
  - kind: click
    target: css:[data-testid=as-of-control] button
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: testid:as-of-banner
    must_succeed: true
  - kind: hover
    target: css:[data-testid=overview-row][data-round='1']
    seconds: 2.0
    say: in transit
    note: round 1 in transit, due 5 Sep, as believed that day
  - kind: hold
    seconds: 1.5
    note: no round 2 row, and no write controls
  - kind: snapshot
    note: the program on 20 Aug
  - kind: click
    target: text:back to today
    note: the banner's way out
  - kind: wait_for
    target: css:[data-testid=overview-row][data-round='2']
  - kind: hold
    seconds: 1.0
  concept_claim: Setting the supply header's date control to 20 Aug reloads the overview with a banner naming that date and no write controls, showing round 1 in transit with an expected arrival of 5 Sep and no round 2 row, and the banner's "back to today" link restores the current overview.
  provenance: S3
  design_intent: '"What did we think on 20 Aug?" becomes a page, not an argument; hiding every write control keeps a look at the past from becoming an edit to the present.'
  full_page: false
  features:
  - id: as-of-rewind
    description: A request carrying as_of=YYYY-MM-DD renders inside a transaction that undoes this program's revisions recorded after the end of that day (updates restored, creations deleted children first, deletions re-inserted) and is always rolled back, per design spec §3.5.
    verify: 'pytest: after changing a shipment expected_on on 2026-09-02, GET /supply/?program_id=10672&as_of=2026-08-20 shows the old date and the database row still holds the new one afterwards'
  - id: as-of-control-banner
    description: A header date control (data-testid=as-of-control) that sets ?as_of=, carried forward by supply links, with a persistent banner (data-testid=as-of-banner) "Viewing as of <date> — back to today" and all write controls hidden.
    verify: 'Playwright: set the control to 2026-08-20, assert the as-of-banner text contains "20 Aug 2026" and no form with method=post is on the page'
  - id: as-of-refuses-writes
    description: The server refuses any POST carrying as_of, on every supply write view and the operation API.
    verify: 'pytest: POST to a supply write view with ?as_of=2026-08-20 returns 400 or 403 and writes no Revision'
- id: round-two-cannot-be-compared
  persona: sophie
  title: Sophie reads the one thing each round 2 quote is missing
  url: /supply/procurement/tenders/${round2_tender_id}/compare/?program_id=${program_id}
  narrative: >-
    Sophie opens round 2's comparison and reads, for each of the three quotes, the one thing that
    keeps it out of the ranking and the question already written out to ask that supplier.
  show: >-
    Sophie opens round 2's comparison. The banner reads that none of the three quotes can be compared
    yet. Under Needs info, each quote names what is missing in words: one supplier did not say how
    many sachets a carton holds; one priced per sachet on a larger lot than the round asked for,
    with freight still to be agreed; one excluded import duties. Under each, "Ask the supplier"
    spells out the question, and each quote that came in through the AI carries the AI badge.
  actions:
  - kind: wait_for
    target: Needs info
  - kind: hold
    seconds: 1.2
    note: three quotes, none comparable yet
  - kind: hover
    target: css:[data-quote-id='${quote_pack_missing_id}']
    seconds: 2.0
    say: sachets
    note: the quote that never said how many sachets a carton holds, with the AI badge
  - kind: hover
    target: css:[data-quote-id='${quote_pack_missing_id}'] >> text=Ask the supplier
    seconds: 1.8
    say: question
    note: the question to send, written out
  - kind: hover
    target: text:Needs info
    seconds: 0.8
    note: park the cursor off the rows
  - kind: snapshot
    note: every blocked quote with the one thing it lacks and the question to ask
  concept_claim: Round 2's comparison lists all three quotes under Needs info, each naming in words the fact that blocks it (sachets per carton not stated; a per-sachet price on a different lot size with freight to be agreed; duties excluded) with the question to ask that supplier written out, and shows the AI badge on each quote that came in through the AI.
  provenance: S4
  design_intent: The product refuses to fake a comparison; the missing fact is stated and the next question is already phrased, while the badge tells Sophie which of those facts a model read rather than a person.
  full_page: false
  features:
  - id: compare-ai-badge
    description: The comparison marks each quote row (data-quote-id) whose create revision came over mcp or api with the AI badge (data-testid=ai-badge).
    verify: 'Playwright: on round 2 compare, the row data-quote-id=<pack-missing quote> contains [data-testid=ai-badge]'
  - id: seed-round2-quotes
    description: seed_rutf_rounds records round 2's three quotes as the ACE agent over mcp, each with a synthetic source excerpt, recorded recently, blocked exactly as the Drive document says (one on sachets per carton, one on lot size plus freight, one on duties).
    verify: 'pytest: after seeding, compare_tender on round 2 returns 3 blocked rows and the pack-missing quote''s only question key is the pack configuration'
- id: the-answer-arrives
  persona: sophie
  title: A supplier answers, and the quote joins the ranking
  url: /supply/procurement/tenders/${round2_tender_id}/?program_id=${program_id}
  narrative: >-
    The supplier that had not said how many sachets a carton holds replies, 150 per carton; the AI
    reading Sophie's forwarded mail records the answer against its quote, and Sophie finds the
    correction on round 2's timeline with the reply quoted beside it, then sees that quote ranked
    with a cost per carton and per child treated.
  show: >-
    Sophie opens round 2. At the top of its timeline is a new line, the quote corrected to 150
    sachets per carton, badged "ACE (agent)"; she opens the badge and reads the supplier's reply
    quoted as its source. She opens the comparison: that quote now sits under Comparable, ranked,
    with a landed cost per carton and per child treated, while the other two stay under Needs info.
  actions:
  - kind: wait_for
    target: testid:timeline
  - kind: hover
    target: css:[data-testid=revision-line][data-field=base_per_pack_stated]
    seconds: 1.5
    say: '150'
    note: the answer, recorded as a correction to the quote
  - kind: click
    target: css:[data-testid=revision-line][data-field=base_per_pack_stated] [data-testid=actor-badge]
    note: open the reply the agent recorded as its source
  - kind: wait_for
    target: testid:source-excerpt
  - kind: hold
    seconds: 2.0
    say: reply
    note: the supplier's own words
  - kind: goto
    target: /supply/procurement/tenders/${round2_tender_id}/compare/?program_id=${program_id}
    note: the same quote, now in the ranking
  - kind: wait_for
    target: Ranked by
    must_succeed: true
  - kind: capture
    var: answered_quote_id
    source: element
    target: css:[data-testid=ranked-row]
    attr: data-quote-id
  - kind: hover
    target: text:USD per child treated
    seconds: 2.0
    say: per child
    note: landed cost per carton and per child treated, provisional while two are blocked
  - kind: snapshot
    note: one quote comparable, two still waiting
  concept_claim: After the supplier's reply is recorded through the AI as a correction to its quote, round 2's timeline shows that correction badged "ACE (agent)" with the reply quoted as its source, and the comparison ranks that quote under Comparable with a landed cost per carton and a cost per child treated while the other two remain under Needs info.
  provenance: S4
  design_intent: Suppliers answer by email, not in the product; the AI records the answer through the same correction a person would make, with the reply as evidence, so the ranking moves only on a fact someone can read.
  full_page: false
  features:
  - id: mcp-correction-with-source
    description: quote_correct called over MCP with source {ref, excerpt} writes the new quote version and a Revision (channel mcp, actor_is_agent true, source_excerpt the reply) on the new version.
    verify: 'pytest: call_operation("quote_correct", ..., channel="mcp", source={"ref":"reply-1","excerpt":"150 sachets"}) as the agent account writes a Revision with channel "mcp" and that excerpt'
  - id: tender-timeline-children
    description: Round 2's tender timeline includes revisions on its quotes, including corrections, rendered as plain lines (data-testid=revision-line, data-field) with the actor badge and source excerpt.
    verify: 'Playwright: open round 2 tender detail after the correction; the first revision-line has data-field=base_per_pack_stated and actor-badge text "ACE (agent)"'
  - id: seed-supplier-answer
    description: A seeder step records the supplier's reply (pack configuration stated, synthetic Message-ID and excerpt) as an MCP quote_correct by the ACE agent, run off camera between the comparison scene and this one.
    verify: 'pytest: after the answer step, compare_tender on round 2 returns 1 comparable row with usd_per_child_treated set and 2 blocked rows'
  - id: between-scene-seed-hook
    description: The walkthrough can run a setup command off camera between two scenes (a canopy recorder step, or a split render), so the reply lands after the comparison scene is filmed.
    verify: 'recorder run: the comparison scene snapshot shows 0 comparable and this scene''s snapshot shows 1 ranked-row'
- id: her-tender-on-the-market
  persona: sophie
  title: Sophie sees exactly what a supplier sees of round 2
  url: /supply/market/
  narrative: >-
    Sophie opens round 2 on the market as a supplier would and reads the request she published,
    and nothing she keeps private.
  show: >-
    Sophie opens the market and her round 2 listing. It shows the request: the quantity, the
    delivery point, the deadline, and the pack and shelf-life asks. It shows no supplier's price, no
    AI source excerpt and no history; those open only to members of her program.
  actions:
  - kind: wait_for
    target: css:a[href*='/market/tenders/${round2_tender_id}/']
  - kind: click
    target: css:a[href*='/market/tenders/${round2_tender_id}/']
    must_succeed: true
  - kind: wait_for
    target: css:body:not(:has([data-testid=timeline]))
  - kind: hover
    target: text:Deadline
    seconds: 2.0
    say: request
    note: quantity, delivery point, deadline, pack and shelf-life asks
  - kind: hold
    seconds: 1.5
    note: no prices, no excerpts, no history
    say: private
  - kind: snapshot
    note: round 2 as a supplier sees it
  concept_claim: Round 2's public market listing shows the quantity, delivery point, deadline and pack and shelf-life requirements, and shows no supplier's price, no source excerpt and no timeline, because quotes, revisions and excerpts are shown only to members of the owning program.
  provenance: S5
  design_intent: History, excerpts and prices are the program's private working evidence; the listing is what every supplier sees, so the boundary is drawn where Sophie can check it.
  features:
  - id: market-no-history
    description: The market tender page and its serializer carry no revisions, source excerpts or other suppliers' quotes, and ignore as_of.
    verify: 'pytest: GET /supply/market/tenders/<round2>/ as a non-member contains no source_excerpt text, no data-testid=timeline and no quoted amount'
  - id: revisions-member-only
    description: Revisions and excerpts are visible only to members of the program, following access to the underlying records.
    verify: 'pytest: a non-member requesting round 2 tender detail gets 404 and no Revision is serialized for them'
  - id: seed-round2-public
    description: The seeder publishes round 2 on the market with its quantity, delivery point, deadline, pack requirement and minimum shelf life; no other buyer organisations are invented.
    verify: 'pytest: after seeding, visible_tender(round2) succeeds for an anonymous visitor and the page shows the deadline and shelf-life minimum'
- id: sophie-awards-with-a-reason
  persona: sophie
  title: Sophie awards round 2 and says why she will not wait
  url: /supply/procurement/tenders/${round2_tender_id}/compare/?program_id=${program_id}
  narrative: >-
    Sophie awards round 2 provisionally to the quote that answered, writing why, and her overview
    shows round 2 awarded, by her, today.
  show: >-
    On round 2's comparison the quote that answered ranks alone, marked provisional because two
    quotes are still blocked. Sophie types her reason into its row (it states everything needed to
    cost it, and it is the same manufacturer as round 1) and awards it. She returns to the overview:
    round 2 reads awarded, provisional, last changed today by Sophie.
  actions:
  - kind: wait_for
    target: Ranked by
  - kind: scroll_to
    target: css:form:has(input[name=quote_id][value='${answered_quote_id}'])
  - kind: fill
    target: css:form:has(input[name=quote_id][value='${answered_quote_id}']) input[name=rationale]
    value: States everything needed to cost it; same manufacturer as round 1
    say: why
  - kind: fill
    target: css:form:has(input[name=quote_id][value='${answered_quote_id}']) input[name=decided_by]
    value: Sophie
  - kind: click
    target: css:form:has(input[name=quote_id][value='${answered_quote_id}']) button:has-text('Award')
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: css:a[href*='/procurement/awards/']
  - kind: goto
    target: /supply/?program_id=${program_id}
    note: back to the program, where the decision now sits
  - kind: wait_for
    target: css:[data-testid=overview-row][data-round='2']
  - kind: hover
    target: css:[data-testid=overview-row][data-round='2']
    seconds: 2.0
    say: awarded
    note: round 2 awarded, provisional, by Sophie, today
  - kind: snapshot
    note: the award on the overview, with who and when
  concept_claim: Awarding the quote that answered on round 2's comparison with a typed reason records a provisional award, and the supply overview then shows round 2 as awarded, provisional, last changed today by Sophie.
  provenance: S6
  design_intent: A decision is recorded with its reason, frozen beside the comparison, and marked provisional because two suppliers were left out; the overview closes the loop on the same who-and-when record the story opened on.
  full_page: false
  features:
  - id: overview-award-row
    description: After award_create the tender's overview row shows stage "awarded (provisional)" when the award is provisional, with last change "today · Sophie" from the award's web-channel revision.
    verify: 'pytest: award_create via the comparison view as Sophie, then GET /supply/?program_id=10672 shows round 2 row text containing "provisional" and "Sophie"'
  - id: award-rationale-timeline
    description: The award's creation, with its rationale, appears as a line on round 2's tender timeline badged "Sophie".
    verify: 'Playwright: after awarding, open round 2 tender detail and assert a revision-line containing the rationale text and actor-badge "Sophie"'
