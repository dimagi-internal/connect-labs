base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-09-24T00:28:44.614155+00:00'
prewarm: true
review_mode: autonomous
setup:
  command: python3 scripts/walkthroughs/supply-chlorine-stopgap/seed.py
  outputs: scripts/walkthroughs/supply-chlorine-stopgap/outputs.json
  rerun: per_render
  timeout_seconds: 900
tagline: When the donated chlorine is late, bridge it without losing the record
video_viewport_height: 900
video_viewport_width: 1440
why_brief: supply-chlorine-stopgap.why_brief.yaml
scenes:
- id: the-donated-chlorine-is-ninety-days-late
  actions:
  - kind: hold
    seconds: 1.0
    note: let the checks load before the first frame, so the opening is never a half-drawn page
  - kind: wait_for
    target: Delivery past the promised lead time
  - kind: click
    target: text:threshold — past a bound you set
    note: only the figures past a bound
  - kind: wait_for
    target: Below its own minimum
  - kind: hold
    seconds: 2.5
    note: ClearWater's contract, ninety days past its promised lead time
  - kind: scroll_to
    target: Below its own minimum
  - kind: hold
    seconds: 3.0
    note: and the Kano store under its own two-month floor
  concept_claim: The checks page reports ClearWater's in-kind consignment as ninety days past both its
    promised lead time and its shipment's expected date, and the Kano store as below its own two-month
    minimum, with no one having entered a lateness flag.
  design_intent: Lateness is derived from dates the records already hold, so the first thing the programme
    sees is the fact it used to learn by chasing.
  role: overview
  show: Ngozi opens the checks and reads, without asking anyone, that ClearWater's consignment is past
    both its promised lead time and its shipment's expected date, and that the Kano store is below its
    own minimum months of stock.
  url: /supply/checks/?program_id=10603
- id: the-donation-owes-nothing-but-its-arrival
  actions:
  - kind: wait_for
    target: In kind — donated
  - kind: hover
    note: 'every cost line reads not purchased: there was never a price to find'
    seconds: 2.0
    target: text:Goods and landing
  - kind: hover
    note: 400 jerry cans promised, none received
    seconds: 2.0
    target: text:Still outstanding
  - kind: hover
    note: the donation, ninety days past its promised lead time
    seconds: 2.0
    target: text:90 days past the promised lead time
  concept_claim: An in-kind order shows every cost line as "not purchased (in kind)" instead of Unconfirmed,
    while its ordered and outstanding quantities and its lateness are shown on the same page.
  design_intent: A donation is a real supply line with no price. Saying so stops the missing-cost check
    from crying wolf for ever.
  show: Ngozi opens ClearWater's donated order and reads its landed cost as not purchased rather than
    missing, the 400 jerry cans still outstanding, and the note that it is ninety days past its promised
    lead time.
  url: /supply/orders/${late_contract_id}/?program_id=10603
- id: ngozi-points-the-alert-at-clearwater
  actions:
  - kind: wait_for
    target: css:#id_label
  - kind: fill
    say: alert
    target: css:#id_label
    value: Kano chlorine → ClearWater supply desk
  - kind: click
    note: the store falling under its own floor
    say: minimum
    target: css:input[name=check_kinds][value=stock_below_minimum]
  - kind: click
    note: and their shipment passing its expected date
    say: date
    target: css:input[name=check_kinds][value=shipment_overdue]
  - kind: click
    note: only the Kano store
    target: css:#id_supply_point-ts-control
  - kind: type
    value: Sahel
  - kind: click_menu
    target: css:#id_supply_point-ts-dropdown .option:has-text('Sahel CHI')
  - kind: click
    target: css:#id_commodity-ts-control
  - kind: type
    value: chlorine
  - kind: click_menu
    target: css:#id_commodity-ts-dropdown .option:has-text('Dispenser chlorine')
  - kind: click
    note: an address outside labs
    target: css:#id_recipient_2
  - kind: fill
    target: css:#id_recipient_email
    value: supply-desk@clearwater-action.example
  - kind: click
    must_succeed: true
    target: role:button:Create alert
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: supply-desk@clearwater-action.example
  - kind: wait_for
    target: Check now
  - kind: click
    target: role:button:Check now
    must_succeed: true
    timeout_ms: 60000
    say: once
    note: the same pass the five-minute run makes, now
  - kind: wait_for
    target: css:section:has(h2:has-text('Sent log')) tbody tr:has-text('Below its own minimum')
    must_succeed: true
    seconds: 60
  - kind: hover
    target: css:section:has(h2:has-text('Sent log')) tbody tr:has-text('Below its own minimum')
    seconds: 2.0
    note: the store below its minimum, sent to ClearWater's desk
  - kind: hover
    target: css:section:has(h2:has-text('Sent log')) tbody tr:has-text('Shipment past its expected date')
    seconds: 2.0
    note: and their own shipment, overdue
  concept_claim: A programme member can subscribe an outside email address to the below-minimum and shipment-overdue
    checks for one store and one product, and Check now sends what is already true at once, listed in
    the sent log with its delivery status and address.
  design_intent: For chlorine the low-stock signal belongs to the donor, so the alert is addressed to
    them, and the team can see it went rather than wonder.
  show: 'Ngozi names the alert, ticks stock below minimum and shipment overdue, narrows it to the Kano
    store and dispenser chlorine, sends it to ClearWater''s supply desk address, creates it, and presses
    Check now: the sent log shows both facts sent to that address.'
  url: /supply/alerts/new/?program_id=10603
- id: ngozi-files-the-registration-beside-the-quote
  actions:
  - kind: wait_for
    target: What they stated
  - kind: hover
    target: text:Quantity priced
    seconds: 1.5
    note: 90 jerry cans at NGN 6,800 each
  - kind: hover
    target: text:Lead time
    seconds: 1.5
    note: within a week of the order
  - kind: hover
    target: text:Harmattan quotation HHS-Q-2291
    seconds: 1.5
    note: the quotation, already filed
  - kind: click
    target: text:+ Attach document
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: css:#id_kind ~ .ts-wrapper .ts-control
  - kind: click
    target: css:#id_kind ~ .ts-wrapper .ts-control
  - kind: type
    value: registration
  - kind: hold
    seconds: 0.8
  - kind: click_menu
    target: css:#id_kind-ts-dropdown .option:has-text('Product registration')
    note: a product registration
  - kind: fill
    target: css:#id_title
    value: Aquaguard 1.25% — national registration WTP-04-1187, valid to March 2028
    say: registration
  - kind: upload
    target: css:#id_upload
    value: scripts/walkthroughs/supply-chlorine-stopgap/documents/registration-WTP-04-1187.pdf
    say: files
    note: the certificate as Harmattan sent it
  - kind: hold
    seconds: 1.0
  - kind: click
    target: role:button:Attach
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: Evidence for this quote
    must_succeed: true
  - kind: hover
    target: text:Aquaguard 1.25% — national registration WTP-04-1187, valid to March 2028
    seconds: 2.5
    note: the registration, filed beside the quotation
  concept_claim: From the quote page a programme member can upload a product registration certificate
    against the quote, and the quote page then lists it beside the quotation under "Evidence for this
    quote".
  design_intent: The stop-gap is acceptable only because the product is registered, so the certificate
    is filed with the quote it justifies rather than living in an inbox.
  show: Ngozi reads Harmattan's quote (90 jerry cans of Aquaguard 1.25% at NGN 6,800 each, within a week),
    attaches the product's registration certificate to it as a product registration, uploading the PDF,
    and sees it listed beside the quotation under the quote's evidence.
  url: /supply/procurement/quotes/${quote_id}/?program_id=10603
- id: ngozi-awards-the-stop-gap
  actions:
  - kind: wait_for
    target: Gidan Ruwa Traders
  - kind: hover
    target: css:tr:has-text('Gidan Ruwa Traders')
    seconds: 2.0
    note: the cheaper quote, ranked first
  - kind: fill
    target: css:tr:has-text('Harmattan Health Supplies') input[name=decided_by]
    value: Ngozi Eze
    say: name
    note: the person deciding, not the account
  - kind: fill
    target: css:tr:has-text('Harmattan Health Supplies') input[name=rationale]
    value: Only registered 1.25% chlorine available within a week
    say: why
  - kind: hold
    seconds: 1.5
    note: her name and her reason, written before the award is made
  - kind: click
    target: css:tr:has-text('Harmattan Health Supplies') button:has-text('Award')
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: Chosen
    must_succeed: true
  - kind: hover
    target: text:Chosen
    seconds: 2.0
    note: Harmattan chosen over the cheaper quote
  concept_claim: Awarding from the comparison takes a written reason and the name of the person deciding,
    and can go to a quote that is not the cheapest; the comparison then marks the chosen quote.
  design_intent: The award is a decision a named person made for a stated reason, not a click an account
    made.
  show: On the comparison Ngozi passes over Gidan Ruwa Traders' cheaper quote, ranked first, types her
    own name as the decider and her reason beside Harmattan's quote, awards it, and the comparison marks
    Harmattan Chosen.
  url: /supply/procurement/tenders/${tender_id}/compare/?commodity=dispenser-chlorine&program_id=10603
- id: the-regulators-approval-rests-on-the-registration
  actions:
  - kind: click
    target: css:a[href*='/procurement/awards/']
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: Awarded to
    must_succeed: true
  - kind: capture
    var: award_id
    source: url
    pattern: /awards/(\d+)/
  - kind: hover
    target: text:by Ngozi Eze
    seconds: 1.5
    note: decided by Ngozi, with her reason
  - kind: click
    target: text:+ Ask for an approval
    must_succeed: true
  - kind: wait_for
    target: css:#id_approver_org-ts-control
  - kind: click
    target: css:#id_approver_org-ts-control
  - kind: type
    value: National Products
  - kind: hold
    seconds: 0.8
  - kind: click_menu
    target: css:#id_approver_org-ts-dropdown .option:has-text('National Products Registration Agency')
    say: regulator
  - kind: select
    target: css:#id_role
    value: regulatory
  - kind: fill
    target: css:#id_note
    value: Registration of Aquaguard 1.25% for dispenser use
  - kind: click
    target: css:#id_rests_on_document-ts-control
  - kind: type
    value: registration
  - kind: hold
    seconds: 0.8
  - kind: click_menu
    target: css:#id_rests_on_document-ts-dropdown .option:has-text('Product registration')
    say: resting
    note: the certificate she just filed
  - kind: click
    target: role:button:Record the request
    must_succeed: true
    timeout_ms: 30000
  - kind: click
    target: text:Record their answer
    must_succeed: true
    timeout_ms: 30000
  - kind: select
    target: css:#id_status
    value: approved
    say: approval
  - kind: click
    target: role:button:Record the answer
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: Rests on
    must_succeed: true
  - kind: hover
    target: text:Rests on
    seconds: 2.5
    note: approved, resting on registration WTP-04-1187
  concept_claim: An award's approval names its approver and role and can rest on a document already on
    file; the award page shows the regulator's approval as approved with a Rests on link to the product
    registration.
  design_intent: 'A licence is evidence, not an opinion: the regulator''s yes points at the certificate
    it was given against, so anyone reading the award can open it.'
  show: Ngozi opens the award (decided by Ngozi Eze, with her reason), asks the National Products Registration
    Agency for its approval in the regulatory role resting on the registration certificate filed with
    Harmattan's quote, and records their answer as approved.
- id: place-order-waits-for-northstar
  actions:
  - kind: click
    target: text:+ Ask for an approval
    must_succeed: true
  - kind: wait_for
    target: css:#id_approver_org-ts-control
  - kind: click
    target: css:#id_approver_org-ts-control
  - kind: type
    value: Northstar
  - kind: hold
    seconds: 0.8
  - kind: click_menu
    target: css:#id_approver_org-ts-dropdown .option:has-text('Northstar Fund')
    say: Northstar
  - kind: select
    target: css:#id_role
    value: funder
  - kind: fill
    target: css:#id_note
    value: Programme funds for 90 jerry cans of stop-gap chlorine while ClearWater's donation is late
    say: spend
  - kind: click
    target: role:button:Record the request
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: This award cannot be ordered yet
    must_succeed: true
  - kind: hover
    target: css:button[disabled]:has-text('Place order')
    seconds: 2.0
    say: greys
    note: Place order, disabled
  - kind: hover
    target: text:Place order is waiting on
    seconds: 2.5
    say: waiting
    note: and the answer it is waiting for
  - kind: hover
    target: text:Approvals
    seconds: 1.0
    note: cursor off the banner
  concept_claim: While a funder approval is requested, the award page shows Place order disabled with
    a reason naming the approver, the role and the date it was asked.
  design_intent: A disabled button with its reason says what to wait for and from whom; the server refuses
    the same order anyway, so the control cannot be bypassed.
  show: Ngozi asks Northstar Fund for its approval in the funder role; the award's Place order button
    greys out and the line beneath it says it is waiting on the funder approval from Northstar Fund, asked
    today and not yet answered.
- id: northstar-says-yes-and-the-order-goes-through
  actions:
  - kind: wait_for
    target: This award cannot be ordered yet
  - kind: click
    must_succeed: true
    target: text:Record their answer
    timeout_ms: 30000
  - kind: select
    say: 'yes'
    target: css:#id_status
    value: approved
  - kind: fill
    target: css:#id_note
    value: Approved by Northstar's programme officer by email
  - kind: click
    must_succeed: true
    target: role:button:Record the answer
    timeout_ms: 30000
  - kind: wait_for
    target: css:a:has-text('Place order')
    must_succeed: true
  - kind: hover
    target: css:a:has-text('Place order')
    seconds: 2.5
    say: back
    note: Place order is back
  - kind: click
    target: css:a:has-text('Place order')
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: css:#id_buyer_of_record
  - kind: select
    target: css:#id_buyer_of_record
    value: programme_org
  - kind: click
    target: css:#id_buyer_org-ts-control
  - kind: type
    value: Dimagi
  - kind: click_menu
    target: css:#id_buyer_org-ts-dropdown .option[data-value='2']
  - kind: fill
    target: css:#id_reference
    value: HHS-PO-0147
  - kind: select
    target: css:#id_status
    value: placed
  - kind: select
    target: css:#id_freight_basis
    value: included
  - kind: select
    target: css:#id_duties_basis
    value: included
  - kind: select
    target: css:#id_vat_basis
    value: included
  - kind: click
    target: css:#id_delivery_supply_point-ts-control
  - kind: type
    value: Sahel
  - kind: click_menu
    target: css:#id_delivery_supply_point-ts-dropdown .option:has-text('Sahel CHI')
  - kind: fill
    target: css:#id_promised_lead_time_days
    value: '7'
  - kind: click
    must_succeed: true
    target: role:button:Record order
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: Record a receipt
  - kind: capture
    pattern: /orders/(\d+)/
    source: url
    var: stopgap_contract_id
  - kind: hover
    note: a price the donation never had
    seconds: 2.5
    target: text:Landed total
  concept_claim: Recording the funder's approval enables Place order on the award page, and an order against
    the award is then accepted and opens as a placed order with a landed cost.
  design_intent: The control releases the moment the condition is met, with nothing else to reset.
  show: Ngozi records Northstar Fund's answer as approved, Place order comes back on the award, and she
    places the order for 90 jerry cans delivered to the Kano store within seven days and reads its landed
    cost.
  url: /supply/procurement/awards/${award_id}/?program_id=10603
- id: the-stop-gap-reaches-kano
  actions:
  - kind: wait_for
    target: What this link covers
  - kind: hover
    target: text:HHS-PO-0147
    seconds: 2.0
    say: link
    note: the stop-gap order, on Sahel CHI's own link the moment it was placed
  - kind: click
    target: css:summary:has-text('Record goods received')
    must_succeed: true
  - kind: select
    say: order
    target: css:#id_record_receipt-contract
    value: ${stopgap_contract_id}
  - kind: select
    target: css:#id_record_receipt-supply_point
    value: ${store_id}
  - kind: fill
    say: note
    target: css:#id_record_receipt-reference
    value: GRN-KANO-0431
  - kind: fill
    say: '90'
    target: css:#id_record_receipt-quantity_accepted
    value: '90'
  - kind: select
    target: css:#id_record_receipt-unit_basis
    value: pack
  - kind: fill
    say: batch
    target: css:#id_record_receipt-batch
    value: AQ-2609-14
  - kind: fill
    say: expiry
    target: css:#id_record_receipt-expiry
    value: ${stopgap_expiry}
  - kind: hold
    note: the filled goods received note, before it is recorded
    seconds: 1.5
  - kind: click
    must_succeed: true
    target: css:form:has(input[value='record_receipt']) button[type='submit']
    timeout_ms: 30000
  - kind: wait_for
    must_succeed: true
    target: 'Recorded: receipt GRN-KANO-0431'
  - kind: scroll
    value: top
  - kind: hover
    target: 'text:Recorded: receipt GRN-KANO-0431'
    seconds: 2.5
    note: 90 jerry cans accepted, batch and expiry, in Sahel CHI's name
  concept_claim: Through its own organisation-wide update link, with no labs login, the receiving partner
    records the goods received note against an order placed after the link was issued, with batch and
    expiry, and the page confirms the receipt it recorded in the partner's name.
  design_intent: 'Stock exists only once someone at the store says it arrived: the partner says it
    itself, so the record credits the partner rather than the programme officer who used to type it in.'
  show: Sahel CHI's storekeeper opens the store's own update link, finds the stop-gap order already listed
    on it, records the goods received note for 90 jerry cans of Aquaguard with batch and expiry, and the
    page confirms the receipt recorded in Sahel CHI's name.
  url: ${partner_link_path}
- id: the-stop-gap-bridges-but-does-not-replace
  actions:
  - kind: wait_for
    target: Stock across the network
  - kind: hover
    note: what the ledger holds now
    seconds: 2.0
    target: text:Sahel CHI — Kano chlorine store
  - kind: hover
    note: what it was before the goods received note
    seconds: 2.5
    say: before
    target: css:[data-cover-before]
  - kind: hover
    note: better than it was, still under its floor
    seconds: 2.0
    say: floor
    target: text:BELOW MIN
  - kind: hover
    note: ClearWater's 400 jerry cans, owed and overdue, beside the balance and not counted in it
    seconds: 3.0
    say: ClearWater
    target: text:from ClearWater Action
  - kind: hover
    note: cursor off the figures
    seconds: 1.5
    target: text:MONTHS OF STOCK
  concept_claim: After the receipt, the stock page recomputes the Kano store's months of stock from its
    ledger and its own consumption, says what it was before the latest goods received note, still marks
    it below its two-month minimum, and lists the donor's outstanding consignment beside the balance
    without counting it as cover.
  design_intent: Showing the rise and the floor together, with the late donation named beside them,
    keeps the donation the thing the programme is waiting on, which is exactly what the donor has been
    told.
  show: 'Ngozi reads the Kano store on the stock page: what the ledger holds now against its monthly
    consumption, what its cover was before the goods received note, still marked below its minimum, and
    ClearWater''s 400 jerry cans listed beside the balance as expected and overdue.'
  url: /supply/stock/?program_id=10603
