gaps:
- id: G1
  type: CAPABILITY
  detail: The tender's Outreach table shows days waiting but not the day each supplier
    was last chased (Outreach.last_reminder_on); only the supplier page shows it,
    so the reminders sent are not visible on the round.
  claim_ref: S2
  proposed_action: Add a "Last chased" column to the Outreach table on the tender
    page, reading last_reminder_on, with a test that a chased silent supplier's row
    shows the day.
- id: G2
  type: CAPABILITY
  detail: No walkthrough seeder replays a half-silent round 2 and the round 1 order
    as dated history on a labs-only program of its own (10672 must stay intact).
  claim_ref: S1
  proposed_action: 'Build scripts/walkthroughs/supply-sophie-unanswered-round/seed.py:
    register a new labs-only program, guarded purge, Sophie''s setup and reminders
    over the web channel, each supplier email as the ACE agent over the mcp channel
    with source ref, excerpt and sender, each on its own day.'
- id: G3
  type: RESEARCH
  detail: The emails are invented reconstructions (real supplier mail cannot enter
    this public repo); that a real round splits about half silent rests on Jonathan's
    account.
  claim_ref: S1
  proposed_action: Validate in the working session with Sophie (rehearsal Part 3)
    against her real rounds' emails.
spine:
- id: S1
  claim: 'Silence is the normal case. This demo reconstructs a round 2 on Jonathan''s
    account of Sophie''s rounds: of six suppliers asked on 15 Sep, three never replied
    despite reminders on 22 and 29 Sep, and the three who did sent one complete quote,
    one quote missing a fact, and a page of questions instead of a price.'
  status: grounded
  evidence:
  - ref: EV-024
    kind: documented
  - ref: EV-001
    kind: documented
  - ref: EV-002
    kind: documented
  rationale: Jonathan's account of Sophie's rounds is that about half the suppliers
    simply ignore the request. A tool that only records what arrives would show three
    tidy replies and hide the half of the round that matters most; the record has
    to hold the silence too.
- id: S2
  claim: The round's page shows every supplier Sophie asked, how many days each has
    been silent, the day she last chased them, and for the three who answered the
    day and kind of reply.
  status: gap
  evidence:
  - ref: EV-007
    kind: implemented
  - ref: EV-026
    kind: implemented
  - ref: EV-027
    kind: implemented
  rationale: '"Who has not answered, and have I chased them?" is the first question
    of any round. Days silent and the reply day are facts in the record; the day she
    last chased is recorded but today shows only on each supplier''s own page (G1).'
- id: S3
  claim: 'Sophie chases from the record: it drafts a reminder for each supplier who
    has not replied, and when she sends one she records the day, which the round keeps
    and the next reminder quotes.'
  status: grounded
  evidence:
  - ref: EV-026
    kind: implemented
  - ref: EV-007
    kind: implemented
  rationale: Chasing is most of the work in a half-silent round; drafting it from
    the record and keeping the day she chased turns 'did I already chase Sahel?' into
    a fact on the page. The drafts panel tells her to record the day, and the reminder
    text says when we last wrote.
- id: S4
  claim: What the three who answered said is on the record with the email excerpt,
    the sender's name and an AI mark, because Sophie forwards each email and an AI
    records it through the supply_chain operations.
  status: grounded
  evidence:
  - ref: EV-008
    kind: implemented
  - ref: EV-016
    kind: implemented
  - ref: EV-014
    kind: implemented
  rationale: Sophie checks what the AI recorded against what the supplier said; the
    excerpt and sender make that a glance. Closed schemas mean an undeclared field
    is refused rather than silently dropped.
- id: S5
  claim: 'With one complete quote, the comparison says what is still missing rather
    than ranking: Harmattan''s quote states everything, Kanem''s is missing its pack
    size, and nothing guesses it.'
  status: grounded
  evidence:
  - ref: EV-021
    kind: implemented
  - ref: EV-004
    kind: documented
  rationale: Once replies are on the record, what is missing is what the record does
    not hold. Saying it per supplier turns the round into the next emails to send,
    not a spreadsheet to rebuild.
- id: S6
  claim: 'Northgate''s questions are answers we owe: each is recorded as owed by us
    with who asked and when, and the round reads as waiting on us for them.'
  status: grounded
  evidence:
  - ref: EV-009
    kind: implemented
  - ref: EV-010
    kind: implemented
  rationale: A supplier that asks questions instead of quoting cannot quote until
    we answer; as a record the question is Sophie's to-do, not an email that stalls
    the round with nobody on the hook.
- id: S7
  claim: 'The one round 1 supplier who did answer, Harmattan, shows the record keeps
    tracking after the award: its order is waiting on us for an import permit the
    forwarder says holds the trucks at the border, Sophie''s advance of 28 Jul is
    recorded before any invoice existed, and the invoice above the agreed price is
    flagged.'
  status: grounded
  evidence:
  - ref: EV-011
    kind: implemented
  - ref: EV-010
    kind: implemented
  - ref: EV-013
    kind: implemented
  - ref: EV-012
    kind: implemented
  - ref: EV-023
    kind: implemented
  rationale: Who answers is also who gets paid, waited on and reconciled; a late ETA
    must not read as the supplier's fault when the hold is a document we owe, and
    an invoice above the price must not need a spreadsheet.
- id: S8
  claim: 'Sophie''s overview names who is silent and whose move each thing is: round
    2 waiting on three suppliers who have not replied and on our answers to Northgate,
    the order waiting on our permit.'
  status: grounded
  evidence:
  - ref: EV-025
    kind: implemented
  - ref: EV-010
    kind: implemented
  rationale: The overview is where Sophie starts her day; it reads from the same records
    as the round and the order, so it cannot disagree with them about who owes the
    next move.
problem: Sophie, who runs RUTF procurement for the Connect-RUTF program, asks six
  suppliers for a quote and half of them never answer, however often she chases; her
  inbox shows only who wrote, so it cannot tell her who has gone silent and for how
  long, what the ones who did answer left out, what she owes them, and whose move
  each delay is.
narrative_slug: supply-sophie-unanswered-round
schema_version: 1
