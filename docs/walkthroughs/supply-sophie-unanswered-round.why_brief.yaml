gaps:
- id: G1
  type: CAPABILITY
  detail: The tender's Outreach table did not show the day each supplier was last
    chased.
  resolved: 'Shipped: the tender Outreach table shows Last chased with the reminder
    count (PRs 2152 and 2154).'
  claim_ref: S1
  proposed_action: Add a Last chased column with the reminder count.
- id: G2
  type: CAPABILITY
  detail: The walkthrough has no off-camera step in which a silent supplier answers
    between the chase and the next scene; the AI must record that reply over the labs
    MCP with its source, so the record moves on camera without a seeded fake.
  claim_ref: S3
  proposed_action: 'seed.py --sahel-replies: the AI records Sahel''s emailed quote
    (quote_record + outreach_update with source ref, excerpt and sender) over the
    labs MCP as the scene''s before: hook.'
- id: G3
  type: RESEARCH
  detail: The emails are invented reconstructions (real supplier mail cannot enter
    this public repo). Round 2 reuses the rehearsal's round 1 replies (Northgate's
    questions, Kanem's partial quote, Harmattan's pro-forma) moved to September dates,
    and that a real round splits about half silent rests on Jonathan's account.
  claim_ref: S1
  proposed_action: Validate in the working session with Sophie (rehearsal Part 3)
    against her real rounds' emails.
- id: G4
  type: CAPABILITY
  detail: A tender had no structured record of how import duties are handled for
    the round, so a duty-excluded quote was blocked on a duty amount even when the
    program imports under a duty waiver.
  claim_ref: S5
  proposed_action: 'Tender duty terms (not settled / buyer_waiver / buyer_pays / supplier_ddp),
    set from the owed-answer form ([data-testid=answer-duty-terms]) or the tender''s
    Edit page, shown on the tender header ([data-testid=tender-duty-terms]) and honoured
    by the comparison and the overview.'
spine:
- id: S1
  claim: 'In Sophie''s rounds about half the suppliers asked never answer (Jonathan''s
    account); this demo''s round 2 reconstructs that: of six asked on 15 Sep, three
    stayed silent through two reminders (18 Sep, then 23 to 25 Sep), and the three
    who answered sent one complete quote, one missing a fact, and questions instead
    of a price.'
  status: grounded
  evidence:
  - ref: EV-024
    kind: documented
  - ref: EV-007
    kind: implemented
  - ref: EV-026
    kind: implemented
  rationale: Jonathan's account of Sophie's rounds is that about half the suppliers
    simply ignore the request. A tool that only records what arrives would show three
    tidy replies and hide the half of the round that matters most; the record has
    to hold the silence too, and the round's own page has to say who is silent, for
    how long, and when she last chased them.
- id: S2
  claim: 'Sophie chases from the record: the round drafts a reminder for each silent
    supplier, quoting when we last wrote, and she records the chase from the draft
    itself, so the round keeps the day.'
  status: grounded
  evidence:
  - ref: EV-026
    kind: implemented
  - ref: EV-007
    kind: implemented
  rationale: Chasing is most of the work in a half-silent round; drafting it from
    the record and keeping the day she chased turns "did I already chase Sahel?" into
    a fact on the round's page.
- id: S3
  claim: 'A chase gets an answer: Sahel replies to Sophie''s reminder, she forwards
    the email, and the AI records Sahel''s quote from it with the excerpt and the
    sender, so the record moves Sahel from silent to replied; the earlier replies
    stay on record the same way.'
  status: gap
  evidence:
  - ref: EV-008
    kind: implemented
  - ref: EV-016
    kind: implemented
  - ref: EV-014
    kind: implemented
  rationale: 'The record earns trust when it changes as the world does: a supplier
    who was silent and then answers must stop reading as silent, and the answer must
    carry its own evidence. Recording through the supply_chain operations with a source
    means the excerpt and sender are on the record, not a claim about it.'
- id: S4
  claim: 'An answer is not yet a usable quote: the comparison ranks only the quotes
    whose cost it can confirm and names, for each of the rest, the facts still missing
    and from whom -- Harmattan''s states everything, Kanem''s lacks its pack size,
    and Sahel''s new quote leaves out freight, duty and the exchange rate, while
    the round has not yet settled how import duties are handled.'
  status: grounded
  evidence:
  - ref: EV-021
    kind: implemented
  - ref: EV-004
    kind: documented
  - ref: EV-028
    kind: implemented
  rationale: Once replies are on the record, what is missing is what the record does
    not hold. Saying it per supplier turns the round into the next emails to send,
    not a spreadsheet to rebuild.
- id: S5
  claim: 'Northgate''s questions are answers we owe: each is recorded as owed by us
    with who asked and when, the supplier''s row says the round is waiting on us,
    and answering one records the answer. The answer to who imports is a fact about
    the whole round: Sophie marks it as the round''s import duty terms (we import,
    under the program''s duty waiver), so no quote is held up waiting on a duty figure
    from its supplier.'
  status: gap
  evidence:
  - ref: EV-009
    kind: implemented
  - ref: EV-010
    kind: implemented
  rationale: A supplier that asks questions instead of quoting cannot quote until
    we answer; as a record the question is Sophie's to-do, not an email that stalls
    the round with nobody on the hook. Who imports decides who owes the duty, for
    every supplier at once, so the record holds it on the round rather than in one
    reply.
- id: S6
  claim: 'The round 1 order with Harmattan shows the record keeps tracking after the
    award: it is waiting on us for an import permit the forwarder says holds the trucks
    at the border -- being the importer makes the permit ours -- and the invoice
    above the agreed price is flagged.'
  status: grounded
  evidence:
  - ref: EV-011
    kind: implemented
  - ref: EV-010
    kind: implemented
  - ref: EV-013
    kind: implemented
  - ref: EV-012
    kind: implemented
  - ref: EV-023
    kind: implemented
  - ref: EV-002
    kind: documented
  rationale: 'The supplier who answers fully is the one who is then paid, waited on
    and reconciled, so the record has to keep telling the truth after the award: a
    late ETA must not read as the supplier''s fault when the hold is a document we
    owe, and an invoice above the price must not need a spreadsheet. The order''s
    dates are the seeded history of round 1 (Appendix A of the rehearsal).'
- id: S7
  claim: 'Sophie''s overview names who is still silent and whose move each thing is:
    round 2 waiting on the suppliers who have not replied and on our answers to Northgate,
    the facts each quote still lacks (no duty figure, once the round imports under
    the waiver), the order waiting on our permit.'
  status: grounded
  evidence:
  - ref: EV-025
    kind: implemented
  - ref: EV-010
    kind: implemented
  rationale: The overview is where Sophie starts her day; it reads from the same records
    as the round and the order, so it cannot disagree with them about who owes the
    next move.
problem: Sophie, who runs RUTF procurement for the Connect-RUTF program, asks six
  suppliers for a quote and half of them never answer, however often she chases; her
  inbox shows only who wrote, so it cannot tell her who has gone silent and for how
  long, what the ones who did answer left out, what she owes them, and whose move
  each delay is.
narrative_slug: supply-sophie-unanswered-round
