base_url: http://localhost:8000
auth:
  type: command
  check: cd ~/emdash-projects/connect-labs && source .venv/bin/activate
    && python manage.py get_cli_token --list-profiles 2>&1 | grep -E 'main.*no'
  login: cd ~/emdash-projects/connect-labs && source .venv/bin/activate
    && python manage.py get_cli_token --profile main
  inject_url: /labs/test-auth/?profile=main
scenes:
- id: here-s-your-fund
  show: Fund dashboard with KPIs, charts, delivery map — all loaded and interactive
  impressive_because: Data streams in real-time, KPIs animate, map shows actual grantee
    locations
- id: post-a-solicitation-with-ai-criteria
  show: Create an RFP describing a CHW training program, generate evaluation criteria
    with AI
  impressive_because: AI writes relevant, well-weighted criteria she'd spend hours
    on manually
  ai_quality: Criteria specific to CHW training scope, not generic grant criteria.
    Weights should be balanced. Scoring guides should distinguish strong vs weak clearly.
- id: ai-helps-applicants-write-stronger-responses
  show: Amina sees the solicitation with criteria upfront, starts a response, gets
    AI coaching
  impressive_because: Coach gives specific feedback tied to evaluation criteria —
    tells her how to score higher
  ai_quality: Coaching must reference specific evaluation criteria, not just say 'add
    more detail'. Suggestions should be actionable and encouraging.
- id: ai-reviews-all-responses
  show: James triggers AI comparative review of all submitted responses
  impressive_because: AI ranks applicants, flags risks, recommends a shortlist — like
    having a grants analyst
  ai_quality: Analysis is comparative (not per-response), flags real differentiators
    between applicants. Should include risk flags and a recommended shortlist.
- id: select-your-grantees
  show: James awards the winning response, allocation auto-created
  impressive_because: One click from review to award — budget allocated, org assigned
- id: monitor-delivery
  show: Return to fund dashboard, filter by delivery type and region, explore charts
    interactively
  impressive_because: Cross-chart filtering lets Sarah explore the data like a dashboard,
    not a static report
- id: forecast-your-impact
  show: Delivery pace chart showing projected completion date
  impressive_because: Positive framing — 'on track to deliver full impact by August'
    — not burn rate language
- id: report-to-bloomberg
  show: AI generates narrative report, export to PDF one-pager
  impressive_because: AI writes the donor report in minutes — highlights, risks, recommendations
  ai_quality: Report should reference specific grantee performance and delivery data,
    not generic language. Framing should use 'delivery pace' not 'burn rate'.
