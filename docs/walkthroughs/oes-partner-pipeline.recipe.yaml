auth:
  # Off-camera personas. dev-login is a hard 403 outside DEBUG — /supply/ has open
  # registration on a public host, so an endpoint that logs a caller in as a
  # procurement admin without a password is only defensible while it refuses in
  # production. So each persona is signed in through the REAL form before
  # recording starts, in a throwaway context, and the recorder swaps cookies
  # before a scene's nav when its `persona:` changes. No login is ever filmed.
  #
  # The password is read from $SUPPLY_DEMO_PASSWORD. The repo's own demo password
  # is deliberately rejected on the deployed site, and a committed spec must not
  # carry a credential either way.
  type: form
  login_url: /supply/login/
  fields:
    email: input[name="email"]
    password: input[name="password"]
  submit: button[type="submit"]
  # Only renders once signed in, so a failed login aborts the render instead of
  # filming a logged-out shell that reads as a product bug.
  success: .navitem
  password_env: SUPPLY_DEMO_PASSWORD
  personas:
    zara: zara@komadugu.example
base_url: https://labs.connect.dimagi.com
narrative_locked: true
review_mode: autonomous
why_brief: oes-partner-pipeline.why_brief.yaml
tagline: The organisation that feeds the children finally sees the supply it depends on
setup:
  command: python scripts/walkthroughs/oes/ensure_demo.py
  rerun: per_render
  timeout_seconds: 600
scenes:
- id: the-organisation-that-feeds-the-children-sees-the-least
  concept_claim: The organisation admitting the children is the only actor touching both the carton and
    the child, and it is the one with no instrument to see its own supply.
  role: overview
  url: /supply/
  show: 'Komadugu Health Initiative''s own surface at /supply/ — the key figures row showing eleven feeding
    sites, the distributions not covered, the thinnest cover in the network and the shortfall already
    raised. This is the whole argument in four numbers: they know their caseload exactly and, until now,
    nothing about the supply behind it.'
  actions:
  - kind: wait_for
    target: css:.keyfigures
    note: role-scoped payload lands
  - kind: hold
    seconds: 3.4
    note: the four figures ARE this scene's evidence — eleven sites, distributions not
      covered, the thinnest cover in the network, the shortfall already raised. It used
      to scroll away from them onto the batch card, which is scene 6's subject.
  impressive_because: Every other screen in this product looks outward from the centre. This one belongs
    to the organisation actually admitting the children, and it opens with what they can now see rather
    than what they are being asked to report.
  ai_quality: Site count, cover and shortfall are real derived figures, not placeholders; the org name
    is the partner's own.
- id: inbound-supply-in-the-calendar-they-plan-in
  concept_claim: Inbound supply rendered against planned distribution days reads as covered, at risk or
    uncovered per site and date — the frame a partner actually plans in.
  url: /supply/
  show: 'The Distribution calendar card — a day, a site, the children booked in for it, and whether inbound
    supply covers it. Three states are visible at once: covered rows, Askira at risk, and Biu with nothing
    assigned to it at all.'
  actions:
  - kind: scroll_to
    target: css:.card:has-text('Distribution calendar') thead
    note: the grid's own header row. Targeting the legend below it pushed the date headers and the only two informative cells — amber Askira, red Biu — off the top, so the binding scene framed its own footnote. Targeting the card title scrolled zero pixels — it
      was already on screen at scroll 0 — so this scene captured the same frame as scene
      1 twice running. A scroll_to an element already in the viewport is a silent no-op.
  - kind: hold
    seconds: 2.4
    note: title, the sentence reconciling this card with the cover table, the column
      headers, and the covered / at risk / uncovered spread
  impressive_because: A shipment table sorted by arrival date is the supplier's view of the world. This
    is the frame a partner actually plans in, and the cover state is resolved on the server so it cannot
    disagree with the projection below it.
  ai_quality: All three cover states appear; children expected and cartons required are consistent with
    the site's own burn rate.
- id: weeks-of-cover-and-the-date-it-runs-dry
  concept_claim: Weeks of cover and a projected stockout date are derived per site from receiving events
    and the admission rate, with the method stated on screen.
  url: /supply/
  show: The Weeks of cover card — every site with its stock on hand, the children it serves a month, its
    weeks of cover and the date it runs dry, ranked worst first. Biu at zero and awaiting its first
    consignment, Askira at 0.6, Kukawa at 1.6 and eleven days out, Dikwa comfortable at 5.5.
  actions:
  - kind: scroll_to
    target: css:.card:has-text('Weeks of cover by site')
  - kind: hold
    seconds: 2.2
    note: the spread from empty to comfortable
  - kind: scroll_to
    target: css:.card:has-text('Stock on hand is receipts minus despatches')
    note: the method, on screen
  - kind: hold
    seconds: 1.4
  impressive_because: At four weeks you plan; at one you start triaging admissions. Knowing that three
    weeks early is the entire point, and the method is printed under the table so the number can be argued
    with.
  ai_quality: Weeks of cover is consistent with stock divided by the stated weekly burn; the method note
    names the derivation rather than gesturing at it.
- id: the-storekeeper-counts-it-and-the-short-count-is-evidence
  concept_claim: A receipt recorded at the loading bay against the despatch advice raises the discrepancy
    as evidence from the person holding the cartons, labelled hand-keyed.
  url: /supply/
  show: 'The Receiving tab — the partner''s own capture surface: the consignments arriving at their eleven
    sites, each marked with how it was reported, the ones still awaiting a count, and the short count
    already raised — 900 advised against 840 counted, and the 60 children behind the difference.'
  actions:
  - kind: click
    target: css:.navitem:has-text('Receiving')
  - kind: wait_for
    target: css:.keyfigures
  - kind: hold
    seconds: 1.6
    note: what is inbound to their own sites, and how each was reported
  - kind: scroll_to
    target: css:.card:has-text('Arriving at your sites') tr:has-text('SHP-2026-0909')
    note: the counted row itself, so the provenance chip the narration calls out ("entered by
      hand" against "despatch advice") and the REPORTED BY header are both in frame. The scene
      used to jump straight to the short-count card, which carries no provenance at all, so the
      punchline was argued over a frame that did not contain it.
  - kind: hold
    seconds: 2.0
  - kind: scroll_to
    target: css:.card:has-text('Short counts you have raised')
  - kind: hold
    seconds: 3.0
    note: the REPORTED BY column and the short count in one frame — three consignments
      arrived on a despatch advice and the rest as a phone call, and the one that came up
      60 short says which it was. Opening the consignment modal here covered the column
      that carries the whole claim, so it does not.
  impressive_because: A shortfall asserted from a capital city is a dispute. The same shortfall recorded
    at the loading bay against the despatch advice is evidence — and it is labelled hand-keyed, because
    it was.
  ai_quality: The provenance marker is visible; the form posts the same payload as the machine-to-machine
    tier rather than a parallel shape.
- id: zara-raises-a-shortfall-and-the-centre-answers
  concept_claim: A partner raises a shortfall from their own screen and it enters the central queue ranked
    by the children behind it, marked as partner-raised.
  url: /supply/
  show: Zara raises a shortfall on Kukawa from the cover table — the site, the children affected, the
    cartons short and the date it is needed by — and it lands in the OES command centre ranked by the
    children behind it.
  actions:
  - kind: click
    target: css:.navitem:has-text('Sites & distributions')
    note: back to the partner surface — scene 4 left the SPA on another tab
  - kind: wait_for
    target: css:.keyfigures
  - kind: scroll_to
    target: css:.card:has-text('Weeks of cover by site')
  - kind: click
    target: css:tr:has-text('Kukawa Nutrition Centre') button:has-text('Raise a shortfall')
  - kind: wait_for
    target: css:.modal
  - kind: hold
    seconds: 2.0
    note: the form is pre-filled from the site's own projection
  - kind: fill
    target: css:textarea
    value: Admissions above plan for three weeks since the Baga road reopened. Stock will not reach Thursday's
      distribution.
  - kind: hold
    seconds: 1.2
  - kind: click
    target: css:.modal button:has-text('Raise it')
    note: raise it — the signal enters the OES queue
  - kind: wait_for
    target: css:.toast
    note: confirmation
  - kind: hold
    seconds: 2.0
    note: it is now in the command centre queue
  - kind: scroll_to
    target: css:.card:has-text('Weeks of cover by site')
    note: the row that changed — Kukawa's button is now a dated stamp, so a duplicate
      raise is structurally impossible
  - kind: hold
    seconds: 1.8
  - kind: scroll_to
    target: css:.card:has-text('Shortfalls you have raised') tr:has-text('Kukawa')
    note: the row this scene just CREATED. The table is newest-first, so `tr:last-child`
      pointed the camera's closing gesture at the OLD Askira row — the one record the demo
      did not make — while Kukawa's sat off-frame. Naming the site is stable against ordering.
      It also keeps the batch card below under the fold —
      it is scene 6's reveal and targeting the heading left it filling the bottom third
  - kind: hold
    seconds: 2.2
  impressive_because: 'This inverts the direction a monitoring product runs in: the ground reports upward
    into a system that can respond, rather than the centre reporting downward about the ground.'
  ai_quality: The form is pre-filled from the site's real cover projection rather than blank, so the numbers
    are the ones the screen already computed.
- id: from-a-batch-to-the-child-who-recovered
  concept_claim: A received batch resolves forward to the distributions it fed and to a child's MUAC series
    crossing the recovery threshold, labelled synthetic.
  url: /supply/
  show: 'The batch table at the bottom of the partner surface, and one batch opened: the consignment it
    arrived on, the distribution it fed, and the children admitted on it — each with a MUAC series drawn
    against the WHO red, amber and green bands, climbing out of the red.'
  actions:
  - kind: click
    target: css:.navitem:has-text('Sites & distributions')
    note: back to the partner surface — scene 4 left the SPA on another tab
  - kind: wait_for
    target: css:.keyfigures
  - kind: scroll_to
    target: css:.card:has-text('From a batch to the children it treated')
  - kind: hold
    seconds: 1.6
  # A MATURE batch, not last week's. The Monguno row opened LOT2609B — two
  # weeks old, every child still In Treatment, '0 of 16 recovered' printed in
  # bold while the narration said 'Recovered'. LOT2504A (May 1, Gwoza, 22
  # recorded outcomes) is the batch whose children have had the months a
  # recovery takes; the table itself sorts outcome-recorded batches first.
  - kind: click
    target: css:.card:has-text('From a batch to the children it treated') tr:has-text('LOT2504A')
  - kind: wait_for
    target: css:.outcome-list
  - kind: hold
    seconds: 2.6
    note: the recovery curves, and the synthetic label above them
  impressive_because: This is the chain the funding standards describe and the sector achieves as far
    as the contract and then abandons — appropriation to carton to batch to a named child's arm circumference.
    Both ends already exist; nothing currently holds them as one record.
  ai_quality: The synthetic label is present in the same frame as the series; at least one curve crosses
    the 125 mm discharge threshold; the batch resolves to a real consignment reference.
