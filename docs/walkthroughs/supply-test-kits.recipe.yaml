base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-09-24T04:52:56.885102+00:00'
review_mode: autonomous
setup:
  command: python3 scripts/walkthroughs/supply-test-kits/seed.py --outputs scripts/walkthroughs/supply-test-kits/outputs.json
  outputs: scripts/walkthroughs/supply-test-kits/outputs.json
  rerun: per_render
  timeout_seconds: 600
tagline: Buy the test kit the technical partner specified — and only once they have said yes
video_pace: medium
video_viewport_height: 900
video_viewport_width: 1440
why_brief: supply-test-kits.why_brief.yaml
scenes:
- id: the-specification-is-on-the-product
  actions:
  - kind: wait_for
    target: Requirements every trade item is checked against
  - kind: scroll_to
    target: text:+ Add a requirement
  - kind: click
    target: text:+ Add a requirement
    note: a third row
  - kind: select
    target: css:#id_requirements-2-field
    value: range_max_mg_per_l
    say: Range maximum
    note: picked from the figures the catalogue knows, in words
  - kind: select
    target: css:#id_requirements-2-operator
    value: '>='
  - kind: fill
    target: css:#id_requirements-2-value
    value: '2.0'
  - kind: fill
    target: css:#id_requirements-2-rationale
    value: must still read at the 2 mg/L dispenser dose
    say: dose
  - kind: hold
    seconds: 1.2
  - kind: click
    target: role:button:Save changes
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: What you can actually order
  - kind: scroll_to
    target: text:Requirements every trade item is checked against
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the three requirements, the dose one just added, its unit filled from the figure
  concept_claim: A requirement whose figure is picked by name from the catalogue's known figures is saved
    on the product with its unit filled in, and the product then lists all three requirements every trade
    item is checked against.
  design_intent: The specification is data on the product, not a PDF in an email — so the later spec check
    has something to check against.
  full_page: false
  role: overview
  show: Hauwa edits the Free chlorine test kit product, adds a requirement row, picks "Range maximum (mg/L)"
    from the figures the catalogue knows, sets it to at least 2.0 with the reason — must still read at
    the 2 mg/L dispenser dose — saves, and the product lists Aqualytic's three requirements against AQ-TK-1.
  url: /supply/catalogue/chlorine-test-kit/edit/?program_id=${program_id}
- id: two-kits-side-by-side
  actions:
  - kind: wait_for
    target: 'Spec: 1 of 3 fail'
  - kind: hold
    seconds: 1.5
    note: two offers, same contents, cheaper first
  - kind: hover
    target: 'text:Spec: 1 of 3 fail'
    seconds: 2.0
    note: the failing requirement, in words, under the Brightwell row
    say: 1.5 mg/L
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: two kits ranked by price; the cheaper one fails its range
  concept_claim: The comparison ranks both kits because their contents match, names the kit on each row
    with a per-test and per-kit price, ranked by landed total, cheapest first, and states under the Brightwell
    row that it fails 1 of 3 requirements because its range maximum is 1.5 mg/L.
  design_intent: Kits are only ranked against kits of the same composition, and the specification outcome
    is stated beside the price — the product does not re-rank or advise; the buyer decides with the fact
    in front of her.
  full_page: false
  show: 'Hauwa opens the round''s comparison: Harmattan''s two kits ranked by landed total, each naming
    its kit, its contents and its price per test and per kit — and under the cheaper Brightwell row, "Spec:
    1 of 3 fail" with the failing requirement in words: its range maximum is 1.5 mg/L, short of 2.0.'
  url: /supply/procurement/rounds/${round_id}/compare/?commodity=chlorine-test-kit&program_id=${program_id}
- id: hauwa-awards-the-compliant-kit
  actions:
  - kind: wait_for
    target: Ranked by
  - kind: scroll_to
    target: css:form:has(input[name=quote_id][value='${quote_lumen_id}'])
  - kind: fill
    note: the reason, on the Lumen row
    say: why
    target: css:form:has(input[name=quote_id][value='${quote_lumen_id}']) input[name=rationale]
    value: Only kit that reads the 2 mg/L dispenser dose
  - kind: fill
    note: the person who decided, not the account recording it
    target: css:form:has(input[name=quote_id][value='${quote_lumen_id}']) input[name=decided_by]
    value: Hauwa
  - kind: click
    must_succeed: true
    target: css:form:has(input[name=quote_id][value='${quote_lumen_id}']) button:has-text('Award')
    timeout_ms: 30000
  - kind: wait_for
    target: text:approvals and the order are on the award
  - kind: click
    must_succeed: true
    note: open the award just made
    target: css:a[href*='/procurement/awards/']
  - kind: wait_for
    target: Ordered against it
  - kind: capture
    pattern: /awards/(\d+)/
    source: url
    var: award_id
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the award, its reason, nothing yet asked of anyone
  concept_claim: Pressing Award on the Lumen row of the comparison, with a reason typed into that row,
    records an award with that reason, and the comparison then links to the award.
  design_intent: The award is a decision with a reason, frozen beside the comparison — not a purchase.
  show: On the comparison Hauwa types her reason into the Lumen kit's row — only kit that reads the 2
    mg/L dispenser dose — presses Award, and opens the award.
  url: /supply/procurement/rounds/${round_id}/compare/?commodity=chlorine-test-kit&program_id=${program_id}
- id: hauwa-asks-aqualytic
  actions:
  - kind: click
    must_succeed: true
    target: text:+ Ask for an approval
  - kind: wait_for
    target: Who has to agree
  - kind: click
    note: pick the technical partner
    target: css:#id_approver_org ~ .ts-wrapper .ts-control
  - kind: type
    say: Aqualytic
    value: Aqualytic
  - kind: hold
    note: let the picker filter to the typed name
    seconds: 1.0
  - kind: press
    value: Enter
  - kind: select
    say: technical
    target: css:#id_role
    value: technical
  - kind: fill
    target: css:#id_note
    value: Please confirm the Lumen FC-50 kit meets AQ-TK-1 before we buy.
  - kind: hold
    note: who is asked, as what, and what they are asked to confirm
    seconds: 1.5
  - kind: snapshot
    note: the request, before it is recorded
  - kind: click
    must_succeed: true
    target: role:button:Record the request
    timeout_ms: 30000
  - kind: wait_for
    target: cannot be ordered yet
  concept_claim: The approval request Hauwa records on the award names Aqualytic as approver, its role
    as technical partner, and a note saying what it is asked to confirm.
  design_intent: The approver is a third party, not the decider; the request says what they are asked
    to agree to.
  show: From the award Hauwa asks for an approval — Aqualytic, as technical partner, asked to confirm
    the Lumen kit meets AQ-TK-1 before anything is bought — and records the request.
- id: the-order-waits-for-aqualytic
  actions:
  - kind: scroll_to
    target: text:Ordered against it
  - kind: hover
    target: css:button[disabled][aria-describedby='order-blocked']
    seconds: 1.5
    note: Place order, disabled while Aqualytic has not answered
  - kind: wait_for
    target: cannot be ordered yet
  - kind: hold
    seconds: 2.0
    note: the reason, beside the disabled button
  - kind: snapshot
    note: no order until Aqualytic answers
  concept_claim: While Aqualytic's approval is pending, the page offers no way to place the order and
    names Aqualytic's technical approval as the reason.
  design_intent: The gate is where the order action would be, stated as a fact, not a hidden button.
  show: 'On the award Hauwa looks for the order action and finds it held back, with the reason: Aqualytic''s
    technical approval has not been answered since it was asked.'
- id: hauwa-gives-aqualytic-a-link
  actions:
  - kind: wait_for
    target: Update links
  - kind: hold
    seconds: 1.5
    note: Harmattan's standing link is already here
  - kind: click
    target: role:link:Issue a link
    must_succeed: true
  - kind: wait_for
    target: Issue an update link
  - kind: click
    target: css:#id_org ~ .ts-wrapper .ts-control
  - kind: type
    value: Aqualytic
  - kind: hold
    seconds: 1.0
    note: let the picker filter
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_label
    value: Aqualytic — Lumen FC-50 confirmation
  - kind: click
    target: css:input[name=approvals]
    note: the one approval asked of Aqualytic
    say: question
  - kind: click
    target: role:button:Issue link
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: Link issued for Aqualytic
  - kind: capture
    source: element
    target: css:#issued-link
    attr: value
    pattern: https?://[^/]+(/supply/u/[^/]+/)
    var: aqualytic_link
  - kind: hold
    seconds: 1.5
  - kind: click
    target: role:link:Done
    note: back to the programme's update links
  - kind: wait_for
    target: Aqualytic — Lumen FC-50 confirmation
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: 'two links, two scopes: Harmattan''s standing one and Aqualytic''s one question'
  concept_claim: An update link issued to Aqualytic covers exactly the approval asked of it, is shown
    once, and then sits on the Update links page beside Harmattan's standing link, each with its own scope.
  design_intent: The approver answers the question itself, so the answer is its word, not ours.
  show: Hauwa opens Update links, where Harmattan's standing link already sits, issues a link to Aqualytic
    that covers only its pending technical approval on the Lumen award, and returns to the list where
    the two links show their different scopes.
  url: /supply/links/?program_id=${program_id}
- id: kemi-answers-for-aqualytic
  actions:
  - kind: goto
    target: ${aqualytic_link}
    note: Aqualytic's own link — no labs login
  - kind: wait_for
    target: Updates for Aqualytic
  - kind: hold
    seconds: 1.5
    note: what Aqualytic is asked to confirm
  - kind: click
    target: css:summary:has-text('Record your answer')
  - kind: select
    target: css:#id_record_answer-status
    value: approved
    say: approves
  - kind: fill
    target: css:#id_record_answer-note
    value: 'Lumen FC-50 meets AQ-TK-1: 50 tests, reads 0.1 to 3.5 mg/L.'
  - kind: upload
    target: css:#id_record_answer-document_file
    value: scripts/walkthroughs/supply-test-kits/aqualytic-aq-tk-1-confirmation.pdf
    say: signed
    note: the signed confirmation, from Kemi's own machine
  - kind: hold
    seconds: 1.5
    note: Aqualytic's answer, in its own words, with its letter
  - kind: click
    target: role:button:Record my answer
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: 'text:Recorded: answer'
    must_succeed: true
    seconds: 30
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: recorded as Aqualytic's own answer
  concept_claim: Through its own link, with no labs login, Aqualytic records its approval of the Lumen
    kit with a note and an uploaded signed confirmation, and the page confirms it was recorded.
  design_intent: The gate is cleared by the party it waits on, not by the buyer it gates.
  show: 'Kemi opens Aqualytic''s link, reads what she is asked to confirm — the Lumen FC-50 kit awarded
    to Harmattan — and records her answer: approved, in her own words, uploading her signed confirmation
    as a PDF.'
- id: hauwa-places-the-order
  actions:
  - kind: wait_for
    target: own link
  - kind: hover
    target: text:own link
    seconds: 1.5
    note: the answer is Aqualytic's own, with its signed letter
    say: own link
  - kind: hover
    target: role:link:Place order
    seconds: 1.5
    note: the button that was disabled is live
    say: Place order
  - kind: click
    target: role:link:Place order
    must_succeed: true
  - kind: wait_for
    target: New order
  - kind: select
    target: css:#id_buyer_of_record
    value: programme_org
  - kind: click
    target: css:#id_buyer_org ~ .ts-wrapper .ts-control
  - kind: type
    value: Dimagi
  - kind: hold
    seconds: 1.0
    note: let the picker filter to the typed name
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_reference
    value: PO-TK-2026-01
  - kind: fill
    target: css:#id_signed_on
    value: ${today}
  - kind: select
    target: css:#id_status
    value: placed
  - kind: select
    target: css:#id_vat_basis
    value: included
  - kind: click
    target: css:#id_delivery_supply_point ~ .ts-wrapper .ts-control
  - kind: type
    value: Harmattan
  - kind: hold
    seconds: 1.0
    note: let the picker filter to the typed name
  - kind: press
    value: Enter
  - kind: press
    value: Tab
    note: leave the picker before saving
  - kind: click
    target: role:button:Record order
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: text:Record an invoice
    must_succeed: true
    seconds: 30
    note: the saved order page, not the form
  - kind: hover
    target: css:[data-incoterm]
    seconds: 2.0
    note: DAP, in words
    say: delivered at place
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the placed order, 20 kits, DAP in words, against the approved award
  concept_claim: Once Aqualytic has approved through its own link, the award's Place order button is enabled,
    and an order opened from it arrives prefilled with the quoted kit, quantity, price, freight included,
    Incoterm and lead time, and saves as a placed order of 20 kits whose header explains DAP in words.
  design_intent: 'The approval is what releases the order: the same button, disabled a moment ago, is
    now live — and the order carries the award, so the quote''s terms travel into the commitment.'
  show: 'Back on the award, Aqualytic''s approval reads as given through its own link with the signed
    letter attached, and Place order — disabled until now — is live. Hauwa places the order: twenty Lumen
    kits at 38 dollars, filled from the quote, delivered to Harmattan''s Kano warehouse, and the order
    header reads "DAP — delivered at place: the supplier pays freight to the named place".'
  url: /supply/procurement/awards/${award_id}/?program_id=${program_id}
- id: ibrahim-receives-the-kits
  actions:
  - kind: goto
    target: ${update_link}
    note: Harmattan's standing link — it needs no labs login and already covers the new order
  - kind: wait_for
    target: Updates for Harmattan Health Supplies
  - kind: hold
    seconds: 1.5
  - kind: click
    target: css:summary:has-text('Confirm an order')
  - kind: click
    target: role:button:Confirm this order
    must_succeed: true
    timeout_ms: 30000
    say: confirms
  - kind: wait_for
    target: 'text:Recorded: order confirmation'
    seconds: 30
  - kind: click
    target: css:summary:has-text('Record goods received')
  - kind: fill
    target: css:#id_record_receipt-reference
    value: GRN-HHS-1108
  - kind: fill
    target: css:#id_record_receipt-quantity_accepted
    value: '20'
    say: twenty
  - kind: select
    target: css:#id_record_receipt-unit_basis
    value: pack
  - kind: fill
    target: css:#id_record_receipt-batch
    value: LFC-2609
  - kind: fill
    target: css:#id_record_receipt-expiry
    value: '2028-08-31'
  - kind: hold
    seconds: 1.2
    note: twenty kits accepted, with batch and expiry
  - kind: click
    target: role:button:Record receipt
    must_succeed: true
    timeout_ms: 30000
  - kind: wait_for
    target: 'text:Recorded: receipt'
    must_succeed: true
    seconds: 30
  - kind: scroll_to
    target: text:Recorded through this link
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the confirmation and the receipt, recorded as Harmattan's own entries
  concept_claim: Through Harmattan's standing link, with no labs login, the distributor confirms the new
    order and records a receipt of 20 kits into its Kano warehouse, both marked as reported by Harmattan.
  design_intent: The status updates chased by email become the distributor's own entries, on a link that
    follows the organisation rather than one issued per order.
  full_page: false
  show: Ibrahim opens Harmattan's standing update link, which already covers the order just placed, confirms
    it, and when the kits reach the Kano warehouse records twenty kits received with the batch and expiry.
- id: stock-in-kits-and-tests
  actions:
  - kind: wait_for
    target: Stock across the network
  - kind: hover
    target: css:[data-standing]
    seconds: 2.5
    note: 'which kit: meets AQ-TK-1, approved by Aqualytic'
    say: approved
  - kind: hover
    target: css:[data-ledger]
    seconds: 2.0
    note: 20 kits = 1,000 tests
    say: thousand tests
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the balance in kits and tests, of the kit Aqualytic approved against AQ-TK-1
  concept_claim: The stock page for the Lumen kit states that it meets the AQ-TK-1 specification and was
    approved by Aqualytic through its own link, and shows the Kano warehouse holding 20 kits, restated
    as 1,000 tests.
  design_intent: The store counts kits and the programme plans in tests; the balance is only worth planning
    on because the line above it says this is the kit the technical partner specified and confirmed.
  full_page: false
  show: 'Hauwa opens stock for the Lumen kit: a line above the table reads that it meets all three requirements
    of AQ-TK-1 and was approved by Aqualytic through its own link, and Harmattan''s Kano warehouse holds
    twenty kits — a thousand tests.'
  url: /supply/stock/?item_id=${item_lumen_id}&program_id=${program_id}
