base_url: https://labs.connect.dimagi.com
narrative_locked: true
narrative_locked_at: '2026-09-24T04:52:56.885102+00:00'
review_mode: autonomous
setup:
  command: python3 scripts/walkthroughs/supply-test-kits/seed.py --outputs scripts/walkthroughs/supply-test-kits/outputs.json
  outputs: scripts/walkthroughs/supply-test-kits/outputs.json
  rerun: per_render
  timeout_seconds: 600
tagline: Buy the test kit the technical partner specified — and only once they have said yes
video_pace: medium
video_viewport_height: 900
video_viewport_width: 1440
why_brief: supply-test-kits.why_brief.yaml
scenes:
- id: the-specification-is-on-the-product
  actions:
  - kind: wait_for
    target: Requirements every trade item is checked against
  - kind: scroll_to
    target: text:+ Add a requirement
  - kind: click
    note: a third row
    target: text:+ Add a requirement
  - kind: fill
    target: css:#id_requirements-2-field
    value: range_max_mg_per_l
  - kind: select
    target: css:#id_requirements-2-operator
    value: '>='
  - kind: fill
    say: dose
    target: css:#id_requirements-2-value
    value: '2.0'
  - kind: fill
    target: css:#id_requirements-2-unit
    value: mg/L
  - kind: fill
    target: css:#id_requirements-2-rationale
    value: must still read at the 2 mg/L dispenser dose
  - kind: hold
    seconds: 1.2
  - kind: click
    must_succeed: true
    target: role:button:Save changes
    timeout_ms: 30000
  - kind: wait_for
    target: What you can actually order
  - kind: scroll_to
    target: text:Requirements every trade item is checked against
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the three requirements, the dose one just added
  concept_claim: A requirement typed into the product form is saved on the product, which then lists all
    three requirements every trade item is checked against.
  design_intent: The specification is data on the product, not a PDF in an email — so the later spec check
    has something to check against.
  full_page: false
  role: overview
  show: Hauwa edits the Free chlorine test kit product, adds a requirement row — range max at least 2.0
    mg/L, must still read at the 2 mg/L dispenser dose — saves, and the product lists Aqualytic's three
    requirements against the reference AQ-TK-1.
  url: /supply/catalogue/chlorine-test-kit/edit/?program_id=${program_id}
- id: two-kits-side-by-side
  actions:
  - kind: wait_for
    target: Ranked by
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: two offers from one distributor, same contents, ranked by price
  concept_claim: The comparison ranks both kits because their contents match, names the kit on each row
    with a per-test and per-kit price, cheaper first, and notes under the Brightwell row that it fails
    1 of its 3 requirements.
  design_intent: Kits are only ranked against kits of the same composition, so the per-test price is a
    fair comparison.
  full_page: false
  show: Hauwa opens the round's comparison and reads the two Harmattan offers ranked by landed total,
    each row naming its kit, its contents, its price per test and per kit, and whether it meets the specification
    — the Brightwell row noting that its 1.5 mg/L range maximum fails.
  url: /supply/procurement/rounds/${round_id}/compare/?commodity=chlorine-test-kit&program_id=${program_id}
- id: the-check-names-the-failing-kit
  actions:
  - kind: wait_for
    target: Fails the commodity specification
  - kind: hold
    note: 1 of 3 fail; stated range max 1.5 against a 2.0 requirement
    seconds: 2.5
  - kind: snapshot
    note: the spec check naming the kit and the requirement it fails
  concept_claim: The checks page names the Brightwell kit as failing 1 of 3 requirements and shows its
    stated 1.5 mg/L range maximum against the 2.0 mg/L requirement.
  design_intent: The product states the failure and does not re-rank or advise — the buyer decides with
    the fact in front of her.
  full_page: false
  show: Hauwa opens the checks and reads the one open check — the Brightwell kit fails the specification,
    1 of 3, with its stated range maximum of 1.5 beside the 2.0 requirement.
  url: /supply/checks/?program_id=${program_id}
- id: hauwa-awards-the-compliant-kit
  actions:
  - kind: wait_for
    target: Ranked by
  - kind: scroll_to
    target: css:form:has(input[name=quote_id][value='${quote_lumen_id}'])
  - kind: fill
    note: the reason, on the Lumen row
    say: why
    target: css:form:has(input[name=quote_id][value='${quote_lumen_id}']) input[name=rationale]
    value: Only kit that reads the 2 mg/L dispenser dose
  - kind: click
    must_succeed: true
    target: css:form:has(input[name=quote_id][value='${quote_lumen_id}']) button:has-text('Award')
    timeout_ms: 30000
  - kind: wait_for
    target: text:approvals and the order are on the award
  - kind: click
    must_succeed: true
    note: open the award just made
    target: css:a[href*='/procurement/awards/']
  - kind: wait_for
    target: Ordered against it
  - kind: capture
    pattern: /awards/(\d+)/
    source: url
    var: award_id
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: the award, its reason, nothing yet asked of anyone
  concept_claim: Posting a reason on the Lumen row of the comparison records an award with that reason,
    and the comparison then links to the award.
  design_intent: The award is a decision with a reason, frozen beside the comparison — not a purchase.
  show: On the comparison Hauwa types her reason into the Lumen kit's row — only kit that reads the 2
    mg/L dispenser dose — presses Award, and opens the award.
  url: /supply/procurement/rounds/${round_id}/compare/?commodity=chlorine-test-kit&program_id=${program_id}
- id: hauwa-asks-aqualytic
  actions:
  - kind: click
    must_succeed: true
    target: text:+ Ask for an approval
  - kind: wait_for
    target: Who has to agree
  - kind: click
    note: pick the technical partner
    target: css:#id_approver_org ~ .ts-wrapper .ts-control
  - kind: type
    say: Aqualytic
    value: Aqualytic
  - kind: hold
    note: let the picker filter to the typed name
    seconds: 1.0
  - kind: press
    value: Enter
  - kind: select
    say: technical
    target: css:#id_role
    value: technical
  - kind: fill
    target: css:#id_note
    value: Please confirm the Lumen FC-50 kit meets AQ-TK-1 before we buy.
  - kind: click
    must_succeed: true
    target: role:button:Record the request
    timeout_ms: 30000
  - kind: wait_for
    target: cannot be ordered yet
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: requested, and the order held back with Aqualytic named
  concept_claim: Recording a technical approval request from Aqualytic makes the award page list it as
    requested and state that the award cannot be ordered yet.
  design_intent: The approver is a third party, not the decider; the pending request is visible exactly
    where the order action would be.
  show: From the award Hauwa asks for an approval — Aqualytic, as technical partner, asked today to confirm
    the Lumen kit meets AQ-TK-1 — and the award now shows the request and says it cannot be ordered yet.
- id: the-order-waits-for-aqualytic
  actions:
  - kind: scroll_to
    target: text:Ordered against it
  - kind: hover
    target: css:button[disabled][aria-describedby='order-blocked']
    seconds: 1.5
    note: Place order, disabled while Aqualytic has not answered
  - kind: wait_for
    target: cannot be ordered yet
  - kind: hold
    seconds: 2.0
    note: the reason, beside the disabled button
  - kind: snapshot
    note: no order until Aqualytic answers
  concept_claim: While Aqualytic's approval is pending, the page offers no way to place the order and
    names Aqualytic's technical approval as the reason.
  design_intent: The gate is where the order action would be, stated as a fact, not a hidden button.
  show: 'On the award Hauwa looks for the order action and finds it held back, with the reason: Aqualytic''s
    technical approval has not been answered since it was asked.'
- id: hauwa-gives-aqualytic-a-link
  actions:
  - kind: wait_for
    target: Issue an update link
  - kind: click
    target: css:#id_org ~ .ts-wrapper .ts-control
  - kind: type
    value: Aqualytic
  - kind: hold
    note: let the picker filter
    seconds: 1.0
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_label
    value: Aqualytic — Lumen FC-50 confirmation
  - kind: click
    note: the one approval asked of Aqualytic
    target: css:input[name=approvals]
  - kind: click
    must_succeed: true
    target: role:button:Issue link
    timeout_ms: 30000
  - kind: wait_for
    target: Link issued for Aqualytic
  - attr: value
    kind: capture
    pattern: https?://[^/]+(/supply/u/[^/]+/)
    source: element
    target: css:#issued-link
    var: aqualytic_link
  - kind: hold
    seconds: 1.5
  - kind: snapshot
    note: a link that covers one approval
  concept_claim: An update link issued to Aqualytic covers exactly the approval asked of it and is shown
    once.
  design_intent: The approver answers the question itself, so the answer is its word, not ours.
  show: Hauwa issues an update link to Aqualytic that covers only its pending technical approval on the
    Lumen award, and the link is shown once to send.
  url: /supply/links/new/?program_id=${program_id}
- id: kemi-answers-for-aqualytic
  actions:
  - kind: goto
    note: Aqualytic's own link — no labs login
    target: ${aqualytic_link}
  - kind: wait_for
    target: Updates for Aqualytic
  - kind: hold
    note: what Aqualytic is asked to confirm
    seconds: 1.5
  - kind: click
    target: css:summary:has-text('Record your answer')
  - kind: select
    say: approves
    target: css:#id_record_answer-status
    value: approved
  - kind: fill
    target: css:#id_record_answer-note
    value: 'Lumen FC-50 meets AQ-TK-1: 50 tests, reads 0.1 to 3.5 mg/L.'
  - kind: fill
    target: css:#id_record_answer-document_url
    value: https://files.aqualytic.example/confirmations/aq-tk-1-lumen-fc50.pdf
  - kind: hold
    seconds: 1.2
  - kind: snapshot
    note: Aqualytic's answer, in its own words
  - kind: click
    must_succeed: true
    target: role:button:Record my answer
    timeout_ms: 30000
  - kind: wait_for
    target: Recorded
  - kind: hold
    seconds: 1.5
  concept_claim: Through its own link, with no labs login, Aqualytic records its approval of the Lumen
    kit, and the page confirms it was recorded.
  design_intent: The gate is cleared by the party it waits on, not by the buyer it gates.
  show: 'Kemi opens Aqualytic''s link, reads what she is asked to confirm — the Lumen FC-50 kit awarded
    to Harmattan — and records her answer: approved, with a note and a link to her signed confirmation.'
- id: hauwa-places-the-order
  actions:
  - kind: wait_for
    target: own link
  - kind: hover
    note: the answer is Aqualytic's own
    seconds: 1.5
    target: text:own link
  - kind: click
    must_succeed: true
    target: role:link:Place order
  - kind: wait_for
    target: New order
  - kind: select
    target: css:#id_buyer_of_record
    value: programme_org
  - kind: click
    target: css:#id_buyer_org ~ .ts-wrapper .ts-control
  - kind: type
    value: Dimagi
  - kind: hold
    note: let the picker filter to the typed name
    seconds: 1.0
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_reference
    value: PO-TK-2026-01
  - kind: fill
    target: css:#id_signed_on
    value: '2026-09-23'
  - kind: select
    target: css:#id_status
    value: placed
  - kind: select
    target: css:#id_vat_basis
    value: included
  - kind: select
    note: Harmattan is paid before the kits ship
    target: css:#id_payment_terms
    value: advance
  - kind: scroll_to
    note: 'the quote''s terms, already filled: DAP, freight and duties included, 21 days'
    target: css:#id_incoterm
  - kind: hold
    seconds: 2.0
  - kind: click
    target: css:#id_delivery_supply_point ~ .ts-wrapper .ts-control
  - kind: type
    value: Harmattan
  - kind: hold
    note: let the picker filter to the typed name
    seconds: 1.0
  - kind: press
    value: Enter
  - kind: click
    must_succeed: true
    target: role:button:Record order
    timeout_ms: 30000
  - kind: wait_for
    target: Landed cost
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the placed order, 20 kits, landed cost
  concept_claim: An order opened from the approved award arrives prefilled with the quoted supplier, kit,
    quantity, price, Incoterm, freight and duties basis and lead time, and saves as a placed order of
    20 kits.
  design_intent: The order carries the award, so the quote's terms travel into the commitment.
  show: Hauwa opens the order from the award — supplier, kit, twenty kits at 38 dollars, delivered at
    place with freight and duties included and a 21-day lead time, all filled from the quote — confirms
    those terms, sets who is buying, the reference, the date, that it is placed and that it is delivered
    to Harmattan's Kano warehouse, and records it.
  url: /supply/procurement/awards/${award_id}/?program_id=${program_id}
- id: hauwa-pays-harmattan
  actions:
  - kind: click
    must_succeed: true
    target: css:a[href$='/invoices/new/']
  - kind: wait_for
    target: Invoice number
  - kind: fill
    say: invoice
    target: css:#id_reference
    value: HHS-INV-0412
  - kind: fill
    target: css:#id_issued_on
    value: '2026-09-23'
  - kind: fill
    target: css:#id_amount
    value: '760.00'
  - kind: fill
    target: css:#id_currency
    value: USD
  - kind: fill
    target: css:#id_quantity_billed
    value: '20'
  - kind: fill
    target: css:#id_quantity_unit
    value: kit
  - kind: select
    target: css:#id_source
    value: supplier_reported
  - kind: click
    must_succeed: true
    target: role:button:Record invoice
    timeout_ms: 30000
  - kind: wait_for
    target: HHS-INV-0412
  - kind: click
    must_succeed: true
    target: css:a[href*='/payments/new/']
  - kind: wait_for
    target: Record a payment
  - kind: fill
    target: css:#id_paid_on
    value: '2026-09-23'
  - kind: fill
    target: css:#id_amount
    value: '760.00'
  - kind: fill
    target: css:#id_currency
    value: USD
  - kind: fill
    say: transfer
    target: css:#id_method
    value: bank transfer
  - kind: fill
    target: css:#id_reference
    value: TRF-88213
  - kind: click
    must_succeed: true
    target: role:button:Record payment
    timeout_ms: 30000
  - kind: wait_for
    target: not confirmed by the payee
  - kind: scroll_to
    note: 'the invoice row and the payment line: paid, not confirmed by the payee'
    target: text:+ Record an invoice
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: paid, and not yet confirmed by Harmattan
  concept_claim: Recording an invoice and a full payment against the order shows the payment as not yet
    confirmed by the payee.
  design_intent: 'We paid is not they received it: the payee''s confirmation is its own fact.'
  full_page: false
  show: On the order Hauwa records Harmattan's invoice for 760 dollars and twenty kits, then the bank
    transfer against it, and the payment line reads not confirmed by the payee.
- id: hauwa-issues-a-link
  actions:
  - kind: wait_for
    target: Issue a supplier update link
  - kind: click
    target: css:#id_org ~ .ts-wrapper .ts-control
  - kind: type
    value: Harmattan
  - kind: hold
    note: let the picker filter to the typed name
    seconds: 1.0
  - kind: press
    value: Enter
  - kind: fill
    target: css:#id_label
    value: Harmattan — test kit order
  - kind: click
    note: this one order
    target: css:input[name=contracts]
  - kind: click
    note: and its Kano warehouse
    target: css:input[name=supply_points]
  - kind: click
    must_succeed: true
    target: role:button:Issue link
    timeout_ms: 30000
  - kind: wait_for
    target: Link issued for Harmattan Health Supplies
  - attr: value
    kind: capture
    pattern: https?://[^/]+(/supply/u/[^/]+/)
    source: element
    target: css:#issued-link
    var: update_link
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: the link and what it covers
  concept_claim: Issuing an update link for Harmattan scoped to one order and one warehouse shows the
    link once with exactly that scope.
  design_intent: A link covers the rows it was issued for and nothing else, and needs no labs account.
  show: Hauwa issues a supplier update link for Harmattan Health Supplies covering order PO-TK-2026-01
    and Harmattan's Kano warehouse, and the link is shown once to send.
  url: /supply/links/new/?program_id=${program_id}
- id: ibrahim-confirms-order-and-payment
  actions:
  - kind: goto
    note: the link Hauwa just issued, opened as Harmattan would — it needs no labs login
    target: ${update_link}
  - kind: wait_for
    target: Updates for Harmattan Health Supplies
  - kind: hold
    note: what this link covers — one order, one warehouse
    seconds: 1.5
  - kind: click
    target: css:summary:has-text('Confirm an order')
  - kind: click
    must_succeed: true
    target: role:button:Confirm this order
    timeout_ms: 30000
  - kind: wait_for
    target: confirmed
  - kind: click
    target: css:summary:has-text('Confirm a payment was received')
  - kind: fill
    target: css:#id_confirm_payment-received_on
    value: '2026-09-23'
  - kind: click
    must_succeed: true
    target: role:button:Confirm payment received
    timeout_ms: 30000
  - kind: wait_for
    target: Updates for Harmattan Health Supplies
  - kind: hold
    seconds: 2.0
  - kind: snapshot
    note: order confirmed and payment confirmed by Harmattan
  concept_claim: From the update link, with no labs login, the distributor confirms the order and confirms
    the payment was received, and the page's forms submit from an ordinary browser with no labs session.
  design_intent: The status updates chased by email become the supplier's own entries.
  show: Ibrahim opens Harmattan's update page, sees the one order and warehouse it covers, confirms the
    order, then confirms the payment was received.
- id: ibrahim-receives-the-kits
  actions:
  - kind: click
    target: css:summary:has-text('Record goods received')
  - kind: fill
    target: css:#id_record_receipt-reference
    value: GRN-HHS-1108
  - kind: fill
    say: twenty
    target: css:#id_record_receipt-quantity_accepted
    value: '20'
  - kind: select
    target: css:#id_record_receipt-unit_basis
    value: pack
  - kind: fill
    target: css:#id_record_receipt-batch
    value: LFC-2609
  - kind: fill
    target: css:#id_record_receipt-expiry
    value: '2028-08-31'
  - kind: hold
    note: twenty kits accepted, in packs, with batch and expiry
    seconds: 1.5
  - kind: snapshot
    note: the receipt Ibrahim is about to record
  - kind: click
    must_succeed: true
    target: role:button:Record receipt
    timeout_ms: 30000
  - kind: wait_for
    target: Updates for Harmattan Health Supplies
  - kind: hold
    seconds: 2.0
  concept_claim: Recording a receipt of 20 kits through the link posts a receipt movement of 20 kits —
    the pack unit, not tests — into the warehouse, marked as reported by Harmattan.
  design_intent: A receipt is the event that creates stock; the unit comes off the kit's own ladder, never
    typed.
  full_page: false
  show: On the same page Ibrahim records goods received against the order at the Kano warehouse — twenty
    kits accepted, counted in packs, with the batch and expiry.
- id: stock-in-kits-and-tests
  actions:
  - kind: wait_for
    target: Stock across the network
  - kind: hold
    note: 20 kit, and the tests they hold
    seconds: 3.0
  - kind: snapshot
    note: the balance in kits and tests
  concept_claim: The stock page shows the Kano warehouse holding 20 kits and restates that balance as
    1000 tests from the kit's 50-tests-per-kit pack size.
  design_intent: The store counts kits and the programme plans in tests; the item's pack size is the only
    bridge between them.
  full_page: false
  show: Hauwa opens stock for the Lumen kit and reads Harmattan's Kano warehouse — twenty kits on the
    ledger, the same balance restated as a thousand tests.
  url: /supply/stock/?item_id=${item_lumen_id}&program_id=${program_id}
