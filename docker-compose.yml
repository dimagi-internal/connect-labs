version: '3.8'

services:
  db:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    # persist data beyond lifetime of container
    volumes:
      - postgres18_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=connect_labs
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      # Bind to loopback only so the trivial dev creds aren't reachable from the LAN.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 2s
      retries: 10
  redis:
    image: redis
    # persistent storage
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: bash -c 'exec 6<>/dev/tcp/redis/6379'
      interval: 2s
      retries: 10

volumes:
  postgres18_data:
  redis_data:
