fix_recommendation: |
  Overall 2/5. Nothing here is a concept failure — why_groundedness is a uniform 4 and
  the product's arithmetic is genuinely defensible. The score is bound by scene 2, where
  a mis-framed capture and a narration written against a different dataset compound into
  a scene that falsifies itself.

  Fix in this order:

  1. [PRODUCT · scripting · mechanical] Re-frame scene 2. Change the scroll target from
     `css:.card:has-text('Distribution calendar') .method-note` to the calendar's
     `thead` (or the card element), so the date header row and the amber Askira / red
     Biu cells are settled in frame BEFORE any day is named. This single change fixes
     concept_clarity, motion_friction and most of claim_reality_coherence for the
     binding scene.

  2. [DEFER -> narration · options] Scene 2's narration names a Tuesday Monguno
     distribution of eight hundred cartons and an at-risk Kukawa Thursday. On screen
     Monguno is Sun Aug 2 (532 booked / 840 on hand, covered) and Kukawa Thu Aug 6 is
     covered (235 / 375). Either renarrate to the cells that exist ("Sunday at Monguno,
     five hundred and thirty-two children booked in against eight hundred and forty
     cartons") and drop "on the road" until an in-transit state is on screen, OR reshape
     the seeded week so a genuinely at-risk and a genuinely uncovered distribution fall
     inside the visible seven days. Do not ship the current pairing.

  3. [PRODUCT · mechanical] Make the calendar's cover state legible and reproducible.
     The covered fill is ~1.03:1 against white, so the encoding is invisible on a
     projector; and the stated binary rule cannot produce three colours because the cell
     shows three numbers while the state uses only the on-hand figure. Replace the tint
     with a saturated status bar plus a text state chip per cell, label the operands
     in-cell ("532 children booked" / "840 cartons on hand" / "+94 scheduled, does not
     cover this day"), and restate the legend as the three-way rule the code implements.

  4. [PRODUCT · mechanical] Give the shortfall record a destination state so the
     narration's central claim stops being prose. ShortfallSignal.resolved_by_action
     already exists on the model and rides the wire; seed the Askira Jul 24 signal as
     answered by a SupplyAction, render the actor/effect/date on the row, and add an
     acknowledged state between open and answered. Until then, change the card lede from
     "answered against the same record" to something both rows can support.

  5. [PRODUCT · mechanical] Fix the batch-to-distribution join. seed_distribution_records
     (demo/demand.py:493-525) round-robins the first six delivered ShipmentLines
     GLOBALLY across all eleven sites and dates them TODAY-21-index, so every
     distribution references a SHP-2026-01xx/02xx/03xx shipment that never appears on
     the partner's own Receiving tab, every distribution predates every receipt, and Biu
     — which has no delivered consignment at all — shows 280 children served. Seed from
     the partner's own delivered SHP-2026-09xx consignments, date them after arrival,
     and skip sites with no receipts. This is the walkthrough's payoff claim ("each
     distribution resolves to the batch that supplied it"); it is currently the least
     grounded data on the screen.

  6. [PRODUCT · mechanical] Give scene 6's payoff the presentation it has earned — this
     is the highest value-per-line fix in the list, because the content is already the
     most credible thing in the walkthrough and only its rendering lets it down. The
     MUAC spark is `width:100%; height:56px` (css/06-visualisation.css:318) but its SVG
     uses a viewBox with default preserveAspectRatio, so it scales to fit its HEIGHT and
     letterboxes to ~220px inside a ~700px column. Add `preserveAspectRatio="none"` (or
     match the viewBox ratio) so the series fills its column; pin the selected child as
     a full-width detail panel above the cohort list with a labelled visit axis and
     y-ticks at 115/125/135 mm at body type; put the cohort list in a scroll container
     with a record count ("33 treatment records") so the fifth row stops being
     hard-clipped by the footer; restyle Close as a neutral control so green stays
     semantically reserved for "Recovered"; and extend the modal scrim over the top
     header bar.

  7. [PRODUCT · mechanical] Cheap credibility repairs elsewhere: bind the
     weeks-of-cover badge bands to the thresholds the card actually states (red below 1,
     not below 2); seed the Askira signal's needed_by from its stockout date — it is
     currently TODAY+7 = Aug 4, three days AFTER the site runs dry on Aug 1
     (demo/demand.py:481); add a SITE column to the batch modal's record rows and lead
     with the site the user actually clicked (clicking MONGUNO currently opens a list
     whose first 22 rows are Dikwa children).

  8. [DEFER · entity-realism, low] Four synthetic tells a CMAM adviser would catch, none
     urgent, all in the seeded outcome series: DIK-2607-002 discharges at exactly
     112 -> 112 mm (real MUAC carries 2-3 mm observer noise, so an identical pair does not
     occur); no Recovered child discharges at 125 or 126 mm although real programmes
     discharge on FIRST crossing, so the absence of any at-threshold discharge is a
     distribution artifact in exactly the place the scene asks to be believed; every one
     of the six defaulters GAINED MUAC (+5, +7, +4, +6, +9, +4) whereas real defaulters
     commonly present flat or declining; and MON-2606-001 is "Transferred to inpatient
     care" while RISING 113 -> 118 mm, which reads backwards since transfer normally
     follows deterioration or a complication (and no reason field is shown).
     Optional strengthening of an already-strong caveat: print the interval instead of
     the adjective — 25/33 is 75.8%, Wilson 95% CI roughly 58-89% — and name SELECTION
     rather than size as the limitation, since at 5% coverage "which 33 of 657 got
     outcome records" threatens the inference more than n does. Both are objective data,
     not editorialising, so neither violates the standing rule.
