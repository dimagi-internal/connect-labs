# ─────────────────────────────────────────────────────────────
# THE QUESTION ASKED: is the OES-command-centre claim visible on the partner screen?
# ─────────────────────────────────────────────────────────────
command_centre_claim_assessment:
  narration: "it lands in the OES command centre ranked against every other
    exception by the children behind it, and marked as raised by Komadugu"
  marked_as_raised_by_komadugu: EVIDENCED — the REPORTED BY badge now carries it.
  lands_in_the_command_centre: ASSERTED IN PROSE, NEVER DEMONSTRATED.
    The claim appears as modal copy ("This lands in the OES command centre ranked by
    the children behind it...", tab_partner.jsx:379-382) and as a toast string, both
    of which the viewer sees mid-scene. Neither is a state. The record's only status
    is an amber "open" pill, identical to the pre-existing Askira row.
  ranked_by_children_behind_it: NOT VISIBLE. No rank, no queue position, no
    acknowledgement, no destination link anywhere on the partner surface.
  the_sharpest_form_of_the_problem: The card's own lede reads "Reported upward from
    this screen, and answered against the same record" — sitting 40px above two rows
    both stamped "open". The card promises an answered state the product never shows,
    and the scene is titled "Zara raises a shortfall, and the centre answers".
  should_it_be_visible: YES, in a bounded form — and the product is already most of
    the way there. The narration's thesis is precisely "it does not go into a message
    queue somebody may or may not read", which is the one thing this screen fails to
    demonstrate. Showing the full central ordering would leak other partners' data,
    so the right shape is (a) an acknowledgement/arrival state on the row, and (b) the
    answered state the model ALREADY supports — ShortfallSignal.resolved_by_action
    exists on the model (models/demand.py:139) and rides the wire as
    resolved_by_action_id (serializers/demand.py:72), but no seeded signal is resolved
    and the UI never renders it. Seeding the Askira Jul 24 signal as answered by a
    SupplyAction and rendering the actor/effect/date on the row would make both the
    lede and the narration self-evidencing without inventing a new concept.

dimensions:
  concept_clarity:
    score: 2
    weight: 0.15
    justification: >-
      Bound by scene 2, whose whole concept is cover state per site AND date and whose
      frame carries neither: the date header row (FRI JUL 31 ... THU AUG 6) is scrolled
      off the top, and every visible cell renders the identical covered green, so the
      three-state read the scene exists to show is absent from its own frame. Scene 1
      also fails its five-second read — the opening frame is dominated by a 7x11 grid in
      which 11 of 77 cells carry data, so a cold viewer's impression is "there isn't
      much data here", the inverse of the narrated "they know their caseload to the
      child". Scenes 3 and 6 are genuinely clear (4).
  use_case_soundness:
    score: 3
    weight: 0.15
    justification: >-
      Scored once for the whole story, attached to scene 2. The underlying use is real
      and at genuine scale — eleven sites, a 0-to-5.5-week cover ladder, a live
      shortfall with a named deadline, a batch resolving to 657 children fed — and no
      skeptic would call it a toy. Held at 3 because two independent judges fired the
      same rule from opposite ends: the demonstrated week contains ZERO non-covered
      cells inside the narrated viewport, so the calendar never has to discriminate on
      camera; and the shortfall's payoff (the centre responding) is explicitly deferred
      to another narrative, so the loop the concept is built on never closes on screen.
    route_note: per rubric, ALWAYS route CONCEPT / fix_kind redesign.
  design_soundness:
    score: 3
    weight: 0.20
    justification: >-
      The core chains hold — the raise button sits on the row that is actually short,
      modal to toast to record is clean, and the cover-table button correctly converts
      to a dated "Raised Jul 28, 2026" stamp so a duplicate raise is structurally
      impossible. Three interactions do not hold. (1) The calendar tells the user how to
      read it ("a cell is short exactly when the second number is below the first") and
      then renders three colours that binary rule cannot produce; two independent judges
      each tried to reproduce the encoding from the stated rule and each failed, because
      the cell shows THREE numbers ("38 on hand +94") and the state uses only the first
      of them (serializers/demand.py:33-45). (2) The justification Zara types on camera
      is captured and then rendered nowhere. (3) A cross-scene data contradiction: Biu
      reads "0 cartons · awaiting first consignment" in the cover table and, two cards
      below, "Jul 6, 2026 · Biu Nutrition Centre · LOT2601A · 280 children served".
    scene_4_moderation: >-
      The scene-4 judge scored this 2 under "narration describes a core interaction the
      action_trace never performs". Moderated to 3: the narration's subject is "the
      storekeeper", describing off-camera how the record on screen came to exist — it
      does not claim the demo performs a capture. The weaker true finding (the
      "Record the count" affordance is on screen eight times and never exercised, so the
      concept's stated low-tech capture tier is never demonstrated) is retained as a
      finding. This moderation does not affect the overall score, which is bound at 2
      by scene 2.
  visual_polish:
    score: 2
    weight: 0.12
    justification: >-
      Bound by scene 2, where the load-bearing encoding fails outright: the covered cell
      fill is #E9F3F0 on #FFFFFF, roughly 1.03:1, so at projector distance the calendar
      reads as white boxes with an outline and the cover state — the entire point of the
      card — is invisible. Compounding it in the same frame, one column stacks five
      identical filled primary "Raise a shortfall" buttons beside one inert grey text
      cell (inconsistent control styling within a scene), and rows are clipped mid-cell
      at both edges. Elsewhere: scene 3's weeks-of-cover badges paint red through 1.6
      while the card's own stated triage threshold is 1 week (tab_partner.jsx:112-114
      bands at 2 and 4 against a subhead that says 4 and 1), which is alarm-colouring
      beyond the stated rule.
      Scene 6 is independently bound at 2 from the opposite end: the MUAC series the
      whole walkthrough builds toward renders as a ~220px sparkline occupying ~17% of
      the frame while 35-40% of the modal width is dead whitespace, with ~7px threshold
      labels on one row of 33, no time axis anywhere, no shared y-scale visible across
      the cohort rows, and the fifth record hard-clipped mid-chart by the footer with no
      scroll cue for the other 28. Root cause confirmed in source: .muac-spark is
      width:100%/height:56px (css/06-visualisation.css:318) but the SVG carries a
      viewBox with default preserveAspectRatio, so the chart scales to fit its HEIGHT
      and letterboxes horizontally. The primary green Close button also reuses the
      legend's "Recovered" green for a dismiss action, and the modal scrim does not
      cover the top header bar or the orange "open" pill behind it.
  why_groundedness:
    score: 4
    weight: 0.15
    justification: >-
      The strongest dimension, uniformly 4 across all six scenes. Every scene's
      provenance resolves to a real spine item (S0-S5) and the built surface instantiates
      it field-for-field rather than gesturing at it: S1's "distribution day at a named
      site with children expected" IS the grid's axes, S3's stated method is printed
      under the table, S4's REPORTED BY is a first-class field not a caption, and S5's
      partner attribution is the literal content of "the ground reports upward". Short of
      5 because the three spine items carrying the product's novelty (S1, S2, S4) are
      status "gap" with empty evidence[] in the why_brief, so their assumed halves — the
      at-risk/uncovered states, and the central ranking — are asserted rather than
      demonstrated.
  claim_reality_coherence:
    score: 1
    weight: 0.10
    blocking: false
    advisory: true
    justification: >-
      Bound by scene 2, where four of five narrated specifics are falsified by the
      artifact. "Next Tuesday at Monguno": as of Jul 28 the next Tuesday is Aug 4, which
      belongs to Gwoza; Monguno's only cell in the week is Sun Aug 2. "needs eight
      hundred cartons": the string never appears — Monguno's cell reads 532 booked over
      840 on hand, and 800 is a loose round of the SUPPLY figure, the opposite quantity
      from the one the sentence names. "the consignment covering it is on the road":
      no in-transit or ETA state exists anywhere on the page. "The Thursday distribution
      at Kukawa reads as at risk": Kukawa is 235 booked against 375 on hand and its cell
      fill is byte-identical to every covered cell. Scene 4 (2) narrates "labelled as
      hand-keyed" while SHP-2026-0909's row and the REPORTED BY header are both out of
      frame; scene 5 (2) claims central ranking with no on-screen referent. Scenes 3 and
      6 verify cleanly (4) — every figure reconciles arithmetically.
  motion_friction:
    score: 2
    weight: 0.13
    justification: >-
      The same fits-but-mis-framed miss fires in three of six scenes, each a scripting
      fix rather than a product defect. Scene 2 scrolled to the calendar's FOOTNOTE,
      pushing the date headers, the card title and the only two informative cells (the
      amber Askira and red Biu) above the fold — the grid demonstrably fits one 720px
      viewport. Scene 4 scrolled past SHP-2026-0909, the one row carrying the
      "hand-keyed" punchline. Scene 5's final target `tr:last-child` resolves, in a
      newest-first table, to the OLD Askira Jul 24 row — the camera's last gesture points
      at the record the demo did NOT just create — and Kukawa's changed cover row, the
      scripted duplicate-raise proof, is off the top while the three rows in frame all
      still read "Raise a shortfall". Scenes 3 and 6 frame their subjects correctly (4).

