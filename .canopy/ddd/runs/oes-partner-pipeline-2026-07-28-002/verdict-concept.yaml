strengths_worth_protecting:
  - >-
    Scene 6's statistical honesty is exemplary and arithmetically exact. The modal
    states that 25 of 33 children in the recorded sample were discharged as recovered,
    that the sample is 33 of the 657 children this batch fed, and that a rate from 33
    children carries a wide interval and is not the batch's recovery rate. Verified
    independently by two passes: 18 DIK + 7 MON = 25 recovered of 33 listed rows, and
    332 + 325 = 657. It refuses to publish a headline recovery rate it cannot support.
    A nutrition epidemiologist would accept it. This is the single most credible thing
    in the walkthrough — do not let a polish pass dilute it.
  - Clinical fidelity in scene 6 holds across all 33 rows. Every admission MUAC is
    98-113 mm (correctly below the 115 mm severe threshold for a SAM admission), every
    row labelled Recovered discharges at or above 127 mm, and every Defaulted /
    Non Response row ends below 125 mm. No row's label contradicts its numbers.
  - Scene 3's cover table reconciles exactly on all eleven rows against
    on_hand / (children_per_month x 7/30), and "Kukawa is eleven days out" is both on
    screen and arithmetically correct. The method is printed under the table.
  - The receiving surface is now fully self-consistent — the regression the previous
    judge reported is genuinely fixed, and every key figure reconciles.
  - The "Demonstration environment — all data is synthetic" and "Treatment records in
    this environment are synthetic" markers are correct, honest framing and were scored
    as neutral throughout, per the standing rule. Entity-level data (org names, site
    names, consignment references, MUAC series) reads as real.

