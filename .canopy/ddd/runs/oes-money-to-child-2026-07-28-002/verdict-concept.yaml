fix_recommendation: |
  Three of the four changes this iteration set out to make landed cleanly — cost per child
  is confirmed-over-confirmed at $41.80 with haulage excluded, the Sankey labels every band
  on one obligated scale with the $65.6M unobligated balance explained in the caption, and
  scene 5 proves the tonnage/coverage inversion (Gombe 91% on 9,464 courses vs Borno 34% on
  16,399 with 31,833 uncovered). The delivered-counts-once rule also shipped correctly at
  the contract level. What blocks the verdict is that the SAME class of defect the
  iteration targeted survived in two other places, both on camera:

  [PRODUCT] Scene 3 — make the unit ladder reproduce its own cost figure. Drive all four
  rungs off the confirmed basis (confirmedCartons and the MT derived from it) so
  $502k → 12,000 cartons → 12,000 children → $41.80 checks out end to end, and move the
  delivered-volume figures (455 MT / 33,000) into their own clearly-labelled rung or into
  the wider card below. Today rung 1 is confirmed and rungs 2-4 are delivered
  (tab_funder.jsx:25-35 vs :131-152), so the card's own "every step can be checked"
  promise fails the first check a skeptic performs.

  [PRODUCT] Scenes 4/5 — stop the government view collapsing cartons into children.
  Compute the "Children treated" tile from coverage.coverage_by_district's courses
  (cross-boundary, delivered/confirmed only) instead of the raw leg sum, so it agrees with
  the coverage table 90px below it (25,863, not 53,246), and drop or re-scope the per-row
  "Children covered" column so a 20,000-carton warehouse-to-warehouse transfer and
  in-transit/planned consignments are not credited as children covered.

  [PRODUCT] Scene 5 — the method note is wrong, in the one card whose claim is that the
  method is checkable. Replace "the district's monthly SAM caseload" with the actual
  window and render window_months / window_from (already on the row) beside the
  denominator; CASELOAD_MONTHS = 4.

  [PRODUCT/scripting] Scene 4 — add `scroll_to css:.data-table` before the 2.2s hold so
  the consignment table that evidences server-side scoping is what the viewer sees, and
  supply a Mapbox token to the walkthrough environment (or collapse the map card when
  unavailable) so half the frame is not an empty panel.

  [CONCEPT] Reserve the phrase "Children treated" for the measured figure. It currently
  labels 33,000 (funder tile), 53,246 (government tile) and a card whose lead number is
  58,251. Rename the carton-derived tiles "Courses delivered — contract ladder" and
  "Courses delivered — all sources", which is the distinction the page already explains in
  prose but contradicts in its own headings.
