findings:
- detail: Vida's audit (scene 10) badges all 5 MUAC photos 'Hyperzoomed' with high
    AI confidence (0.88-0.93) and the scene claims the badge marks photos 'where the
    child's arm is not visible'. Inspecting the images, only ~2 of 5 are literally
    hyperzoomed (tape window fills the frame, no arm/context); the other ~3 show finger
    obstruction, backlight glare, or tape mispositioning where the arm IS partly visible.
    The uniform 'Hyperzoomed' label overclaims a single AI defect category across
    images that show varied defects, so 'verify the machine's finding against the
    images' does not literally hold for 3/5 photos. The overall story (AI caught misleading
    photos -> all fail -> suspension) is true and the human review note 'framing makes
    the reading impossible to verify' is accurate.
  dimension: claim_reality_coherence
  fix_kind: options
  fix_recommendation: 'Align the AI badge to the image content by one of: (a) re-seed
    Vida''s audit with a bounded 2-photo pure-hyperzoom corpus so every ''Hyperzoomed''
    badge matches its image; (b) relabel the 3 non-hyperzoom photos with their true
    AI defect category (tape-usage / equipment / misleading); or (c) soften the scene-10
    narration and concept_claim to ''framing-flagged'' rather than the specific ''Hyperzoomed''.
    Advisory / non-blocking; operator pre-scoped option (a).'
  route: DEFER
  scene: 10
  severity: medium
- detail: On the drilled weekly-review table (scene 3) the scene narration calls out
    'a state-aware Actions column where her buttons read View Audit and View Task',
    but the scene scrolls only vertically to the flagged row; the far-right Actions
    column is horizontally clipped at a 1440px viewport so View Task renders as 'View
    Ta'. View Audit and the rest of the flagged row (distribution, SAM/MAM, flags)
    are fully legible, so the point still lands.
  dimension: motion_friction
  fix_kind: options
  fix_recommendation: 'Options: (a) add a horizontal scroll / scroll_to the flagged
