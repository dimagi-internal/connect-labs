changed_claim_verification:
  scene: 8
  claim: >-
    "Here the split costs nothing to make: each corridor's cheapest bidder is a different
    plant, so the resilient award is also the lowest-cost one."
  status: TRUE
  evidence: >-
    From the bid book on screen: Maiduguri (60,000 cartons) cheapest is Savanna Nutrients
    Ltd at USD 42.29 (lot value USD 2,537,400); Djibo (20,000 cartons) cheapest is Faso
    NutriWorks SA at USD 41.85 (USD 837,000). Different suppliers, and both are the ones
    actually awarded on camera. Split total USD 3,374,400 = USD 42.18/carton blended.
    Cheapest single-supplier consolidation is Savanna at 2,537,400 + 918,000 = USD
    3,455,400 = USD 43.19/carton (Kano 3,554,600; Lagos 3,693,600; Faso 3,755,400). The
    split is USD 81,000 / USD 1.01 per carton CHEAPER. Holds for the three-RUTF-lot variant
    too (4,838,450 split vs 4,919,450 Savanna-consolidated). All 15 unit-price x quantity
    products on the page reconcile exactly. The previous narration ("costs a little more
    per carton") was false; this one is true and in fact conservative.
  consistency_with_scene_7: >-
    Consistent over one bid book. Scene 7 claims a different price leader per corridor —
    Savanna leads Maiduguri at 42.29 (technical 91), Faso leads Djibo at 41.85 (technical
    88), and Faso is actually LAST at Maiduguri (48.64) while Savanna drops to second at
    Djibo. The corridors genuinely invert, and the seed data encodes the reason (a plant is
    cheapest into its own corridor and dearer across a border). Scene 7 and scene 8 tell the
    same true story about the same numbers.
  residual_concern: >-
    The claim is now factually right but conceptually weaker. If the resilient split is ALSO
    the cost minimum, the scene shows no trade-off at all — any naive cheapest-per-lot
    system reaches the same answer, and the narration's stated failure mode (concentrating
    on one bidder) is never instantiated because concentrating is dearer. See finding
    CONCEPT-8-usecase.

fix_recommendation: |
  Five fixes, in leverage order.

  1. [PRODUCT/mechanical] Scenes 2, 3, 4, 6 — perform the acts the narration names, or
     re-narrate to what is shown. The cheapest and highest-value single one is scene 4:
     append a click on ".modal button:has-text('Record decision')" after the Reject, then
     wait_for and capture the committed state. That one change lifts design_soundness,
     motion_friction and claim_reality_coherence together. Scene 3 and scene 6 need a
     decision (perform vs re-narrate) — routed as options.

  2. [PRODUCT/options] Scene 9 — the contract shown is not the award just watched (Q2 2026,
     45,000 cartons at USD 42.10, vs the Q3 award of 60,000 at USD 42.29), same supplier and
     same destination, tender names differing by one character, and the narration never
     signals the substitution. Either create and open the contract from the on-camera award,
     or say plainly in the narration that this is an earlier award on the same corridor
     already in execution. Independently: render "awarded under RUTF Northeast Nigeria Q2
     2026" as a link to the award, since record continuity is the scene's whole claim.

  3. [PRODUCT/mechanical] Scene 9 — DISBURSED USD 0.00 sits above twelve Delivered
     consignments and self-disclaims with "AGAINST CONFIRMED DELIVERY ONLY". The model is
     internally defensible (disbursed_value = confirmed_quantity x unit_price, and
     _quantity_in_contract_unit deliberately counts only legs ARRIVING at the contract's
     delivery place), but the Delivery schedule card lists the hub-to-centre legs that by
     construction can never move that figure. Group the schedule into "inbound against this
     contract" vs "onward distribution", and show the confirmed-vs-delivered distinction, so
     the closing payoff ("trace a dollar to a carton") is not narrated over a zero.

  4. [PRODUCT/mechanical] Scene 7 — add scroll-padding-top to the bid-comparison modal's
     scroll container (or scroll-margin-top on the lot cards) equal to the sticky header
     height, so scroll_to lands a lot card's title below the header instead of under it.
     This is the single visual_polish floor.

  5. [CONCEPT/redesign] Scene 8 — the rewritten cost claim is now true, but the climax
     demonstrates a free decision. Re-price the fixture so the resilient split genuinely
     costs something (make one supplier cheapest on both corridors), so Ada is seen paying a
     premium for corridor independence — or accept the current framing and stop calling it
     "the decision the lot structure exists to make possible", since in this data it is an
     automatic optimum. This is a concept_change gate; do not auto-apply.

  Two verified data defects worth fixing regardless, both mechanical:
   - connect_labs/supply/demo/solicitations.py:299 sets unit="truck-months" for country
     "SD" while data.py:170-171 supplies the quantity 40,000 from a lot described as
     "Inland haulage of 40,000 cartons" — so the solicitations table renders "40,000
     truck-months to Khartoum" beside a 6-truck-month haulage lot in the same view.
   - The seeded tender "RUTF Sahel and Lake Chad Corridors Q3 2026" (data.py:107-127) carries
     the exact same two lot lines as the live tender (60,000 to Maiduguri, 20,000 to Djibo),
     already 2/2 Awarded, one row above it. Rename or re-scope it.
