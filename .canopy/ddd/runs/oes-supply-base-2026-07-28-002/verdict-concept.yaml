dimensions:
  concept_clarity:
    score: 2
    weight: 0.15
    justification: >-
      Weakest link is scene 6 and scene 9. Scene 6's whole claim is that an unqualified
      supplier never receives the solicitation, but the frame is the publisher's own list
      of six tenders — nothing on screen shows or implies restricted visibility, and the
      product's own supplier-side "Solicitations open to you" card (which exists, in
      static/supply/tab_supplier_home.jsx, with the hint "Solicitations are visible once
      your organisation holds a live qualification in a matching category") was not shown.
      Scene 9's five-second read is wrong on two axes: a viewer believes the contract shown
      is the one produced by the award they just watched (it is not — Q2 2026, 45,000
      cartons at 42.10, vs the Q3 award of 60,000 at 42.29), and the hero DISBURSED figure
      reads USD 0.00 under a narration about tracing a dollar to a carton. Mid-walkthrough
      scenes (4, 7, 8) are clear at 4/5.
  use_case_soundness:
    score: 3
    weight: 0.15
    justification: >-
      Scored once for the whole story, attached to scene 8. Two-stage EOI-into-registry
      procurement is genuinely load-bearing work at real scale (USD 3.37M across two
      countries, four lots, four bidders). But the climax demonstrates a decision that is
      free: the split award as made is the global cost MINIMUM (USD 3,374,400 vs USD
      3,455,400 for the cheapest single-supplier consolidation), so no trade-off between
      cost and corridor resilience is ever exercised — greedy cheapest-per-lot lands on the
      identical answer, and the narration's own stated failure mode (concentrating on the
      cheapest single bidder) is never instantiated because concentrating is dearer here.
      The lot structure is shown working, not shown buying anything.
  design_soundness:
    score: 2
    weight: 0.20
    justification: >-
      Four scenes hit the action-fidelity cap: the narration describes a core interaction
      the trace never performs. Scene 2 "Ada opens a round and names the categories" — the
      only effecting action is a nav click; both rounds pre-exist with identical categories.
      Scene 3 "Amina applies... the moment they submit" — no fill/select/type/submit
      anywhere; an already-Qualified 2026-A application is opened and read. Scene 4 "a pass
      stamps a qualification onto the organisation" — Qualify and Reject are clicked but
      "Record decision" never is, so nothing is committed. Scene 6 "Ada publishes a
      solicitation" — the row is already Published. Scene 9 adds a genuine model-vs-UI
      incoherence: DISBURSED USD 0.00 sits directly above twelve consignments marked
      Delivered.
  visual_polish:
    score: 2
    weight: 0.12
    justification: >-
      Weakest link is scene 7: the modal's sticky header occludes the Maiduguri lot card —
      its bold title is entirely hidden and the subtitle sliced mid-glyph — which is a
      scroll-container layout bug (missing scroll-padding-top / scroll-margin-top), not a
      scroll position. The corridor label is the load-bearing identifier for a claim that is
      about corridors. Elsewhere the app is genuinely well made: consistent chip system,
      semantic status colour, real type hierarchy, nothing garish, no editorialising. Other
      recurring notes are ordinary craft ones — native unstyled selects inside a custom UI
      (scene 5), a truncated modal column hiding the therapeutic-milk commitment (scene 4),
      category chips wrapping mid-phrase (scene 1).
  why_groundedness:
    score: 3
    weight: 0.15
    justification: >-
      Provenance is strong across the walkthrough — every scene names a real spine item and
      most cite implemented code plus a passing test (EOISubmission.profile_snapshot,
