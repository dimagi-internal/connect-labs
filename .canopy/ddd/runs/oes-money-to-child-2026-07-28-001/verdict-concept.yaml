fix_recommendation: |
  Fix the denominator first — everything else is downstream of it.

  [PRODUCT / mechanical] ONE DELIVERED-CARTON FIGURE. The funder page renders two answers to
  the same stated computation: 115,170 children given a full course (ladder + key row) and
  48,787 courses delivered (outcome card + coverage table, which sum to exactly 48,787).
  Verified cause: connect_labs/supply/services/coverage.py::_delivered_cartons_by_district
  counts only legs crossing a district boundary — it de-duplicates multi-hop redistribution,
  and its own docstring documents the double-count it exists to fix — while the funder ladder
  (serializers/execution.py) sums every hop. Consequences: 48,787 x 13.8kg = 673 MT, not the
  displayed 1,589 MT; and cost per child on the page's own other denominator is ~USD 49-50,
  not the displayed USD 21.27. Derive the ladder from the same confirmed-delivery record, or
  state each figure's scope explicitly. The same defect appears on the government view
  (43,782 vs 16,399 for Nigeria).

  [PRODUCT / mechanical] STAGE BAR ORDER. tab_funder.jsx:365-382 renders obligated -> delivered
  -> disbursed; tab_funder.jsx:87 labels the column "Obligated -> disbursed -> delivered". A
  funder reading row NG1 concludes "97% disbursed, 44% delivered" when the truth is the inverse,
  on the one screen whose stated purpose is to stop those three being confused. Also add a
  DELIVERED money column — today the third of the three promised figures exists only as a native
  title tooltip.

  [CONCEPT / redesign] SCENE 5 MUST CONTAIN THE INVERSION IT NARRATES. The narrated 91% district
  does not exist, and with Yobe at 0/0% and Borno at 16,399/34% the screen demonstrates the
  trivial monotone case — tonnage and coverage rank identically, so the feature looks redundant.
  Render the coverage table at LGA granularity using the per-destination volumes already on the
  same page (Ngala 1,627 / Dikwa 1,635 / Gwoza 1,126 / Bama 1,399 / Askira 38 ...), sorted by
  coverage, so a high-volume/low-coverage row sits visibly beneath a low-volume/high-coverage
  one. This simultaneously fixes the DISTRICT-vs-state taxonomy error, the two-row thinness, and
  the unrenderable 91%. Then re-record the narration against real values.

  [CONCEPT / redesign] SCENE 6 MUST PERFORM ITS PAYOFF. The batch -> distributions -> one child's
  MUAC drill is the stated reason to build this product, and it is narrated as if performed while
  the action_trace contains zero effecting actions and the drill's entry button ("follow batch ...
  to the children it treated") returns zero occurrences in the captured page text — the BatchDrill
  component exists in JSX but has no data to render. Seed the batches, script the click, and end
  the demo on an act rather than a scroll. Until it ships, cut the sentence.

  [CONCEPT / options] SCENE 2 CLAIMS SOFTWARE THAT ISN'T THERE. The Sankey renders no numbers, so
  "totals reconcile at every stage" is unverifiable; its left column is sized in appropriated
  dollars and its middle/right in obligated dollars, so ~93% of the mass vanishes at the first
  stage with no residual band — the exact failure the narration mocks. And "unattributable value
  is shown as its own band" describes behaviour the code does not have (it excludes such
  contracts and discloses them in a sentence). Put values on the nodes, reconcile the units, and
  either build the band or amend spine S1 and the narration.

  [DEFER] claim_reality_coherence findings are recorded per scene and routed DEFER; they do not
  gate convergence, but scenes 5 and 6 contain narrated figures with no on-screen referent and
  should not be shown to an external audience in their current form.

