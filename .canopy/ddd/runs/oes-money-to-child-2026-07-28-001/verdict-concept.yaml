dimensions:
  concept_clarity:
    score: 2
    weight: 0.15
    justification: >-
      The premise is unusually well written and two concrete roles are named on screen, but
      four of six scenes fail the five-second test with an inverted read. Scene 1 reads
      "97% disbursed, 44% delivered" when the truth is the reverse (the stage bars render in
      a different order from their own column header). Scene 6 reads "81.1%, it's working" —
      the exact opposite of its thesis that the headline should be distrusted. Scene 3's
      load-bearing cost-per-child figure is the smallest number in its frame. A viewer cannot
      state in one sentence what the product's headline "children treated" number is, because
      the page carries two of them 2.36x apart.
  use_case_soundness:
    score: 2
    weight: 0.15
    justification: >-
      The underlying problem — funding traceability from appropriation to child outcome in
      famine response — is genuinely load-bearing and worth demonstrating. But the walkthrough
      never shows the features at the scale where their value is felt: 4 contracts and 2
      envelopes for the Sankey (the contract table beside it is strictly more checkable), and
      2 district rows, one of them all zeros, for a 37-state national allocation. Worse, scene
      5's data actively refutes its own claim: Yobe (0 cartons, 0%) and Borno (16,399 cartons,
      34%) rank identically on volume and on coverage, so tonnage would have produced the same
      answer coverage does. And scene 6 never exercises the batch-to-child traceability that is
      the stated payoff of the whole product.
  design_soundness:
    score: 2
    weight: 0.20
    justification: >-
      The product's own logic contradicts itself on its central quantity. Under one stated
      method ("one carton = one child's full course") the funder page renders 115,170 children
      given a full course and, ~180px below in the same frame, 48,787 courses delivered — with
      no annotation and no affordance to resolve them. Root cause verified in source:
      coverage.py's _delivered_cartons_by_district counts only legs crossing a district
      boundary (deliberately de-duplicating multi-hop redistribution) while the funder ladder
      sums every delivery hop. Separately, scene 1's StageBars renders obligated/delivered/
      disbursed under a header reading obligated/disbursed/delivered; scene 6 narrates a
      batch-to-MUAC drill the product does not surface; scene 5's sole provenance affordance is
      a native title attribute that renders nothing; scene 2's Sankey instructs the viewer to
      verify a reconciliation and supplies no values to verify it with.
  visual_polish:
    score: 2
    weight: 0.12
    justification: >-
      Baseline craft is genuinely competent — consistent card system, restrained palette, real
      whitespace rhythm, a well-set discharge table. Two scenes drop to 2 on product-side
      defects: the Sankey draws white node labels on ~5px bars sliced mid-glyph on 8 of 10
      nodes, truncates a one-line label inside a box with 140px of unused fill, and gives both
      envelopes one hue so crossings are untraceable; scene 1's sticky header slices the rail's
      active nav pill to a 2px sliver and its three-colour bar chart carries no legend or
      values; scene 3 inverts hierarchy, putting the scene's subject in 11px prose beneath seven
      larger numbers. Recurring: unstated alarm-colour on coverage pills, left-aligned numerics,
      and a stock bar rendering ~48% fill against a value of 0.
  why_groundedness:
    score: 2
    weight: 0.15
    justification: >-
      Provenance is real and traceable — every scene's concept_claim maps to a named spine item
      (S0-S5), and four scenes score 3-4. Scene 6 drops to 2: its provenance is spine S5 (status
      GAP), only half of S5 was built, and the narration re-asserts the unbuilt half (batch to
      one child's MUAC) as delivered. S5 also promises "children treated stops being a division
      sum" while that division sum stands intact and is presented approvingly two cards up in the
      same frame. Scene 2 is a related but milder case: the "unattributable band" half of S1 has
      no artifact path — the code computes unattributed contracts and appends a caption sentence
      saying they "are excluded from this diagram" (disclosure of a drop, not a band), and with
      this seed there are zero, so even the sentence does not render.
  claim_reality_coherence:
    score: 1
    weight: 0.10
    blocking: false
    advisory: true
    justification: >-
      ADVISORY — excluded from overall_score. Systematic overstatement across the run. Scene 5
      narrates "ninety-one percent of need" when the page's only percentages are 0% and 34%, and
      narrates that the 34% district "received more cartons" when on screen the 34% district IS
      the higher-volume one and its comparator received zero. Scene 6 narrates a batch-to-MUAC
      drill absent from the product, and frames a 122-child sample against a 48,787-course count
      as "two figures that do not agree" — a category error, since the sample is drawn from that
      population. Scene 2 narrates conservation over a diagram rendering zero numbers, and an
      unattributable band that does not exist. Scene 4 narrates server-side scoping with no
      on-screen referent while showing "3 Consignments inbound" against "5 consignments with
      routed corridors" in the same frame. Credit where due: scene 3's ladder arithmetic and
      scene 6's discharge table are exactly right.
  motion_friction:
    score: 2
    weight: 0.13
    justification: >-
      Scripting is competent in places (scene 3 lands the ladder and its method note in one
      settled frame; scene 5 frames its card fully), but four scenes mis-frame or under-perform
      the narrated subject. Scene 2's offset decapitates the four hero KPI numbers — leaving only
      their labels — while the voiceover says the totals reconcile. Scene 4 waits for
      css:.data-table and then holds on a viewport that does not contain it, so the claim's only
      on-screen support is never framed. Scene 5's hover fires ok:true and produces no visible
      tooltip. Scene 6's closing beat of the entire narrative is two scrolls and a hold while the
      narration describes a multi-step drill. A stray cursor sits mid-frame in several scenes.

