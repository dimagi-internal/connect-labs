iteration_changes_verified:
  contract_delivered_counted_once:
    landed: true
    evidence: >
      Pipeline by corridor shows no over-delivery — NG1 45,000/15,000/15,000 gap
      30,000; SD1 40,000/14,000/14,000 gap 26,000. models/execution.py
      _quantity_in_contract_unit() now filters to legs arriving at the contract's
      own delivery_place, so the plant->warehouse and hub->centre hops no longer
      double-count.
    residue: >
      SHIPPED equals DELIVERED in all four rows while the KPI beside it reads
      "7 In transit · 652 MT moving", because every in-flight leg is last-mile
      past the delivery place. Arithmetically correct, but the card and the KPI
      tell a reader opposite stories about whether anything is moving.
  milestone_rail_pln_est_act:
    landed: true
    evidence: >
      Scene 3 renders three labelled timestamps per leg (PLANNED / ESTIMATED /
      ACTUAL) with a per-leg delta, and the featured leg reads "+9d vs plan"
      against Jul 28 planned / Aug 6 estimated. This is the strongest single
      frame in the walkthrough.
    residue: >
      "0d vs plan" on a leg with no ACTUAL is computed from the estimate; the
      label does not say which timestamp the delta is measured against.
  late_row_with_no_children_at_risk:
    landed: true
    evidence: >
      Two rows read "No children go without at Maiduguri Distribution Hub,
      despite 2 days late" (5.4 weeks of cover) and "...at Djibo Distribution
      Hub, despite 6 days late" (25.2 weeks of cover), and both sort BELOW the
      1-day-late Nyala row that costs 47 courses.
  expiry_risk_exception_fires:
    landed: true
    evidence: >
      "Expiry risk — 907 cartons at Djibo Distribution Hub expire before they can
      be used · 907 children lose a full course by Dec 25, 2026" is present, so
      all four exception kinds (Late, Expiry risk, Short receipt, Partner
      shortfall) appear in one queue.
    residue: >
      The expiry row is where the reallocation direction bug is visible (see
      finding 1) and where the magnitude-only ranking is least defensible.
  scene8_closes_scene7_signal:
    landed: true
    evidence: >
      The same Komadugu Health Initiative row is marked Closed, carrying the
      effect ("87 cartons from Gombe Distribution Hub to Askira Nutrition Centre,
      planned to arrive 3 August"), the typed reason verbatim, and the actor and
      date; it has sunk to the bottom of the queue; the headline recomputed
      2,428 -> 2,341 across 7 unanswered · 1 closed; and the map caption's
      consignment count moved 17 -> 18. Cover deliberately did not move.
    residue: >
      The actor renders as "oes-lead@oes.example" rather than the signed-in Ada
      Nwosu, and the headline decrement — the sentence the scene ends on — is
      scrolled off-frame.

dimensions:
  concept_clarity:
    score: 3
    weight: 0.20
    justification: >
      The spine idea — rank by the children behind each exception, not by tonnage
      — is stated on the frame itself ("Ranked by the children behind each one,
      not by tonnage"; "2,428 Children at risk across 8 unanswered exceptions")
      and scene 1 establishes the problem cleanly for a cold viewer. It is held
      to 3 by the screen contradicting its own unit: two of four row titles are
      headlined in cartons ("907 cartons at Djibo...", "240 cartons short at
      Maiduguri") in a queue whose whole claim is one common unit, and scene 2's
      "three ways the data arrives" is narrated over a frame where all four rows
      read the same tier.
  use_case_soundness:
    score: 4
    weight: 0.15
    gating: false
    justification: >
      The demonstrated use is load-bearing, not a toy: a four-country famine
      response where a partner-raised shortfall is answered by a reallocation
      from a documented surplus node, the reason is required, and the signal
      closes against the action that answered it — an artifact a WhatsApp thread
      cannot produce afterwards. Held to 4 because the supporting machinery is
      shown thin (10 of 12 nodes in Weeks of cover read "awaiting first
      consignment", and the featured event log has one entry).
  design_soundness:
    score: 2
    weight: 0.20
    justification: >
      A core interaction shown on camera is incoherent and it is systemic, not a
      one-off: the expiry-risk row advises "Reallocate the surplus to a node with
      cover below plan" and offers only a button reading "Reallocate to Djibo
      Distribution Hub" — Djibo is the surplus node, which the page itself says
      holds 25.2 weeks of cover. tab_command.jsx posts target_node_id =
      exception.node_id unconditionally, so following the product's own advice
      moves stock into the node that already cannot consume what it has.
      Compounded in scene 8 by the closing actor (oes-lead@oes.example)
      contradicting the signed-in user (Ada Nwosu).
  visual_polish:
    score: 2
    weight: 0.15
    justification: >
      In 4 of 8 scenes (1, 6, 7, 8) a dead "Map unavailable — no Mapbox access
      token configured" panel occupies roughly 45% of the viewport while the
      load-bearing exception queue is squeezed into a ~27% column, so the opening
      frame and the payoff frame are both dominated by an unavailable state.
      Independent defects compound it: the exception card repeats its impact line
      verbatim ("1,087 children lose a full course at El Fasher Distribution Hub"
      then "1,087 children lose a full course"), one card carries two date
      formats ("by Dec 25, 2026" above "before 2026-12-25"), coverage percentages
      mix precision (34% / 67.6% / 91% / 145.8%), one KPI tile lacks the
      sub-caption its three siblings have, and the page prints "1 days behind".
  why_groundedness:
    score: 3
    weight: 0.20
    justification: >
      Every scene carries a resolvable provenance and no concept_claim
      contradicts the spine. But three of the eight scenes (5, 6, 8) hang off
      spine items S4/S5/S6 that are still status:gap with evidence:[] in the
      why_brief, even though this build shipped them with named passing tests
      (test_demand.py, test_cover.py) declared in the narrative lock's features[].
      The provenance chain is therefore broken exactly where the walkthrough is
      strongest. S5 also promises "the map, the pipeline gap and the forecast all
      move in response" and scene 8 delivers none of the three moving on camera.
  claim_reality_coherence:
    score: 2
    weight: 0.10
    blocking: false
    advisory: true
    justification: >
      Non-blocking, but the largest cluster. Scene 2's narration names a Kano
      EPCIS feed and a Lagos despatch advice; neither is in the frame (all four
      rows read "Phone check-in") and no Lagos consignment exists in the seed
      data at all. Scene 5 opens on "the famine-phase colouring under the map" on
      a page rendering "Map unavailable", and its "where that estimate comes
      from" is hover-gated with no hover in the trace. Scene 7's "raised four
      days ago" appears nowhere on the card. Scene 8's headline decrement and the
      deliberately-static cover are both off-frame. Separately, the KPI hint
      "47,000 children treated" equates cartons delivered with children treated —
      the exact conflation the product's own funder tab calls out as "arithmetic
      presented as an outcome" — and disagrees with the caseload table's 58,251
      courses delivered on the same page.
  motion_friction:
    score: 2
    weight: 0.15
    justification: >
      Four scenes narrate an artifact that would have fitted the viewport but is
      mis-framed. Scene 5 is the clearest: the second scroll_to (the Kassala row)
      undid the first, pushing the "Requirement from caseload" title, subtitle
      and ALL FOUR column headers off the top, so the scene's payoff column
      ("gap to need", the children with no carton assigned) is an unlabelled
      integer column — for Séno, 660 and 660 are indistinguishable. Scene 6's
      final scripted move (scroll_to Weeks of cover, ok:true) is not what the
      frame shows, and its closing narration is about the expiry card instead.
      Scene 8 ends on the closed row while the voiceover's last sentence is about
      a headline that is off-screen. Scene 2 holds a Sudan-only table through two
      thirds of a voiceover about Kano and Lagos. Action fidelity itself is
      exemplary: 43/43 actions ok, real fill+click, genuine before/after deltas.

