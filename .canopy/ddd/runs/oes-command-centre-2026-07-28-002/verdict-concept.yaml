fix_recommendation: |
  All five changes this iteration set out to make DID land — verified on screen
  and in source. The verdict is driven by defects that survived them, three of
  which are one-line fixes.

  [PRODUCT] Fix the reallocation direction (the only thing here that is a real
  bug, visible in scenes 1, 6 and 8). tab_command.jsx renders "Reallocate to
  {e.node_name}" and posts target_node_id = exception.node_id for any row whose
  action text matches /reallocate/i. For the expiry-risk class the row's node is
  the SOURCE: the button must read "Reallocate from Djibo Distribution Hub" and
  post source_node_id = exception.node_id, with the target chosen by the
  cover-below-plan rule the recommendation already states. Today the product's
  own advice, followed literally, moves stock into the node that cannot consume
  what it already holds — and Djibo is offered in its own source list.

  [PRODUCT] Stop the unavailable map from owning the frame. Collapse the Network
  panel to a one-line inline notice when no token is present and let Exceptions
  take the full width, so the load-bearing queue owns the opening and payoff
  frames instead of a 45%-width grey box. (Configuring a Mapbox token for the
  demo environment fixes the same frames and additionally makes spine S5's "the
  map moves in response" demonstrable.)

  [PRODUCT] Stamp the session user as the actor. Scene 8's whole claim is
  "carrying who decided"; the record reads "oes-lead@oes.example" while the
  chrome reads "Ada Nwosu". Render the staff display name (and retire the
  .example domain from seeded actors — entity-level data must read as real even
  in a labelled synthetic environment).

  [PRODUCT — scene scripting] Re-frame three scenes. Scene 5: drop the second
  scroll_to(Kassala); the single scroll to the "Requirement from caseload" card
  frames its title, subtitle, all four headers and all ten rows in one viewport,
  and add a hover on a district cell so "where that estimate comes from" is on
  screen when the voiceover says it. Scene 6: drop the trailing scroll_to(Weeks
  of cover) — the closing narration is about the expiry card, which is already in
  frame. Scene 8: append a scroll_to the KPI strip plus a hold, so 2,341 · 7
  unanswered · 1 closed is visible when the narration says the headline stops
  counting its eighty-seven children.

  [PRODUCT — scene scripting] Scene 2 cannot evidence a three-tier gradient from
  the one contract where every row reads "Phone check-in". Open OES-C-2026-NG1
  first (its legs carry epcis and asn tiers in the seed data) while the Kano and
  Lagos lines are spoken, then open OES-C-2026-SD1 for the honest-case line. The
  narration's "Lagos despatch" also has no referent in the data — there is no
  Lagos consignment — so either seed one or drop Lagos from the line.

  [CONCEPT] The queue ranks by magnitude alone (services/exceptions.py sorts by
  -children_at_risk), so 907 children due 25 December outrank 87 children due 4
  August, in a demo whose narration promises "where, and by when" and asserts
  that ranking any other way "is not an ordering". by_date already exists on
  every row. Either add a time-to-impact term or state the horizon the queue is
  ranked within. This changes what the walkthrough demonstrates, so it routes to
  the concept_change gate rather than auto-apply.

  [RESEARCH] Update why_brief spine S4, S5 and S6 from status:gap / evidence:[]
  to grounded, citing the tests this build shipped (test_demand.py::
  test_the_queue_ranks_everything_in_one_unit, test_cover.py::
  test_expiry_risk_flags_stock_the_caseload_cannot_consume,
  test_demand.py::test_a_resolved_signal_closes_on_the_queue_rather_than_vanishing).
  Three of the strongest scenes currently trace to spine items the brief still
  calls unbuilt.

  [DEFER] Reconcile the two meanings of "delivered" on one screen: the KPI reads
  "47,000 Delivered to date · 47,000 children treated" (contract-scoped, counted
  once at the delivery place) while the caseload card's courses-delivered column
  sums to 58,251 (district-scoped, every boundary-crossing leg). Relabel the KPI
  to "courses delivered" — the product's own funder tab already argues that
  cartons divided by a factor is not an outcome.
