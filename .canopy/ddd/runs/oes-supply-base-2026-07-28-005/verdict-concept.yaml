fix_recommendation: |
  Three of the previous run's dimensions moved up (concept_clarity, design_soundness,
  visual_polish all 2 → 3) and all three declared changes verify on these frames. The
  weakest link did not move: the walkthrough still narrates acts it does not perform.

  Highest value first:

  [PRODUCT/scripting] Scene 4 — add `click css:.modal button:has-text('Record decision')`
  after the two decision clicks, then `wait_for css:.toast`. Verified in
  connect_labs/static/supply/tab_rounds.jsx: Qualify/Reject only call setDecisions() on
  local state; nothing reaches the server until "Record decision" POSTs to
  /supply/api/eoi/submissions/<id>/review/. Today the registry in scene 5 shows Savanna's
  earliest expiry as Feb 18, 2027 — the Jan 20, 2028 qualification the viewer just watched
  Tomas grant is simply not there. This is the pivotal act of the whole narrative and it
  currently leaves no trace.

  [PRODUCT/scripting] Scene 3 — open the 2026-B application (submitted Jul 19, 2026), the
  one Tomas actually reviews in scene 4, instead of the 2026-A one. As it stands the same
  supplier's declared capacity changes from 34,000 cartons/month · 28d to 39,000 · 14d
  between two consecutive scenes that the narration presents as one story.

  [PRODUCT] Scene 6 — the Sudan lot renders "40,000 truck-months → Khartoum", one row above
  "6 truck-months → Maiduguri". connect_labs/supply/demo/data.py describes the lot as
  "Inland haulage of 40,000 cartons from Port Sudan to Khartoum" at USD 3.20; only
  demo/solicitations.py:299 (`"unit": "truck-months" if country == "SD" else "cartons"`)
  relabels it. Scene 9's pipeline table already calls the same contract 40,000 cartons.
  Drop the SD special case so the lot is denominated in the unit its own description and
  its own contract use.

  [PRODUCT/scripting] Scene 6 — add a persona hop to a supplier holding no matching
  qualification and show "Solicitations & bids" without this tender in it. The surface
  exists (tab_bids.jsx over world.eligible_rfps, empty state "No solicitations are open to
  you yet."). Right now the strongest server-side claim in the demo is the one thing the
  camera never corroborates.

  [PRODUCT] Scene 7 — the sticky modal header occludes the narrated lot title. Scroll to
  the card with a header-height offset (or scroll_to the card's parent), as scene 8 already
  achieves for the identical card.

  [CONCEPT/options] Scene 9 — the closing beat lands on "No consignments raised against this
  contract yet." Making the contract genuinely award-produced was the right fix, but it
  traded a populated payoff frame for an empty one while OES-C-2026-NG1/BF1/SD1 sit in the
  background table with real shipped and delivered numbers. Either seed a first consignment
  against the new contract, or add a short second beat that opens NG1 to show what this
  record looks like once it is moving.
