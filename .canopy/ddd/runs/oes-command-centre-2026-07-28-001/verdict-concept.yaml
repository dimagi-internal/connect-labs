arithmetic_verified_by_judge:
  scene_6_queue_ordering:
    verdict: "ORDERING IS CORRECT AND THE DERIVATIONS RECONCILE"
    rows:
      - { rank: 1, kind: Late, node: El Fasher, children: 1087, check: "846 wk-burn / 7 x 9 days dry = 1087.7 -> 1,087 OK" }
      - { rank: 2, kind: Short receipt, node: Maiduguri, children: 240, check: "15,000 - 14,760 = 240 cartons = 240 courses OK" }
      - { rank: 3, kind: Partner shortfall, node: Askira, children: 87, check: "partner-reported; NOT reconstructible from 38 on hand / 63 wk burn" }
      - { rank: 4, kind: Short receipt, node: Monguno, children: 60, check: "900 - 840 = 60 OK" }
      - { rank: 5, kind: Late, node: Nyala, children: 47, check: "327 wk-burn / 7 x 1 day = 46.7 -> 47 OK" }
      - { rank: 6, kind: Late, node: Maiduguri, children: "NOT STATED", check: "genuinely 0 - delay absorbed by cover on hand; row prints days instead" }
      - { rank: 7, kind: Late, node: Djibo, children: "NOT STATED", check: "genuinely 0 - same; row prints days instead" }
    monotone_descending: true
    kpi_reconciles: "1,087+240+87+60+47 = 1,521 = the 'Children at risk' KPI exactly"
    finding: >-
      The ranking is defensible and the arithmetic is exact. The defect is presentational:
      the two zero-consequence rows print "N days behind plan" instead of "0 children -
      the delay is absorbed by N weeks of cover", so the product hides its single
      strongest argument (a 6-day delay outranked by a 1-day delay, correctly). Only
      three of the four claimed exception kinds are present; expiry risk never fires.
  scene_5_coverage_table:
    verdict: "BOTH PERCENTAGES AND THE 'MORE CARTONS' CLAIM ARE CORRECT AND ON SCREEN"
    kassala: { requirement: 7020, delivered: 6388, coverage_shown: "91%", computed: "91.00%", gap_shown: 632, computed_gap: 632 }
    borno:   { requirement: 48232, delivered: 16399, coverage_shown: "34%", computed: "34.00%", gap_shown: 31833, computed_gap: 31833 }
    more_cartons_claim: "TRUE - Borno received 16,399 courses vs Kassala's 6,388 = 2.57x, i.e. more than twice, at 34% vs 91%"
    caseload_ratio: "48,232 / 7,020 = 6.87x, matching the spec's 'seven times larger'"
    other_rows: "Somali 20,000/29,576 = 67.62% OK; Soum 6,000/4,116 = 145.77% OK, gap clamped to 0 OK"
    both_visible_in_one_frame: true
    finding: "No arithmetic defect. Scene 5 is the strongest scene in the walkthrough."
  scene_8_reallocation:
    verdict: "OUTCOME IS ASSERTED, NOT SHOWN - three of four narrated outcomes are contradicted by the after-frame"
    changed:
      - "map fallback copy: '16 consignments with routed corridors' -> '17' (buried in grey disabled-feature prose)"
      - "a green toast: 'Reallocated - a consignment is on the map with planned milestones.'"
    unchanged:
      - "'1,521 Children at risk / across 7 exceptions' KPI - identical"
      - "'7 In transit / 652 MT moving' KPI - identical"
      - "the El Fasher exception row - still rank 1, still 1,087 children, Reallocate button still live"
      - "Weeks of cover, El Fasher: 0 on hand / 'Not yet served' / 'awaiting first consignment'"
      - "Pipeline by corridor, OES-C-2026-SD1 GAP: still 19,612"
    root_cause_verified_in_source: >-
      services/exceptions.py:185-243 already implements exactly the right idea - an
      exception whose node has an undelivered inbound reallocation is ANSWERED (not
      resolved), carries action_id / effect / actor / rationale, and sorts to the bottom.
      bootstrap.py:254 ships it to the client in world["exceptions"]. But `answered_by`
      appears in NO template and NO JSX anywhere in the repo - grep returns only the two
      lines in exceptions.py that create and sort on it. The payoff has no renderer.
      Separately the row did not re-sort after the action even though the consignment
      count did refresh, which points at a partial refetch of the world payload.
    honest_reading: >-
      The product is RIGHT and the narration is WRONG. Cover and the pipeline gap
      deliberately do not move, because the cartons have not arrived - which is the app's
      own stated invariant and the more impressive claim. The narration promises movement
      the model correctly refuses to produce.

verdict: fail
