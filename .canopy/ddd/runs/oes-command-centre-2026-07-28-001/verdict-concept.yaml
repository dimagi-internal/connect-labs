fix_recommendation: |
  Overall 2/5 — FAIL. The concept is strong and the arithmetic underneath it is, where it
  is shown, exact: the queue's ranking reconciles to the digit and the coverage table's
  percentages are all correct. The failures are that the product does not render its own
  best evidence, and the narration repeatedly asserts past it.

  Fix in this order.

  1. [PRODUCT/mechanical] Render `answered_by`. services/exceptions.py already computes
     action_id, effect, actor and rationale per exception and sorts answered rows to the
     bottom; nothing in the UI reads it. Add an "Answered by <actor> — <effect>" block to
     the exception card and let the row visibly demote. This single change turns scene 8
     from an assertion into a demonstration, and it is the walkthrough's entire payoff.
     Also confirm the world payload refetches the exception list after an action — the
     row did not re-sort even though the consignment count did.

  2. [CONCEPT/options] Re-narrate scene 8 to the truth, which is better than the claim.
     Drop "El Fasher's weeks of cover moves out of the red" and "the pipeline gap for that
     corridor closes" — the product deliberately refuses both because the cartons have not
     landed, and saying so is the stronger, more credible line. Alternative worth
     considering: reallocate against the Komadugu partner shortfall instead, which IS a
     ShortfallSignal, so `resolved_by_action` fires, the exception genuinely resolves, and
     scenes 7 and 8 close the loop the why_brief's S6 exists to make.

  3. [PRODUCT/mechanical] Render the estimated timestamp. shipment_detail.jsx renders
     `Actual X` OR `Planned X` and never `estimated_at`, under a card whose own subtitle
     reads "Planned, estimated and actual — the three are never collapsed." Render all
     three so the +9d delta is subtractable on screen. Also fix the Kassala leg, five days
     past its planned arrival with no actual, still reporting "0d vs plan".

  4. [PRODUCT/mechanical] Fix the exception-card text overflow. The partner-shortfall
     card's headline collapses to a one-character-wide vertical column that escapes the
     card border into the map gutter, in scenes 6, 7 and 8.

  5. [PRODUCT/mechanical] Print the zero. Give the two zero-consequence Late rows an
     explicit "0 children — the delay is absorbed by N weeks of cover on hand". A 6-day
     delay correctly ranked below a 1-day delay is the most persuasive thing on the
     screen and the product currently hides it.

  6. [PRODUCT/mechanical] Seed an expiry-risk exception. cover.expiry_risk and
     exceptions.expiry_exceptions are implemented and unit-tested, but the only lot in
     the demo expires Jan 2028, far outside the 180-day horizon, so the fourth exception
     kind never fires and the narration names a row that does not exist.

  7. [PRODUCT/mechanical] Fix the "115,170 children treated" KPI. It equates cartons
     arrived at contract destinations with children treated, and it sits on the same page
     as a coverage card totalling 48,787 courses delivered and 82,857 children uncovered.
     Label it "delivered to date" only, or reconcile the two.

  8. [PRODUCT/mechanical — spec edits] Re-frame five scenes on the artifact they narrate:
     move scene 2's `.modal-close` to the head of scene 3 so the ingestion tiers survive
     to the captured frame; hold scene 5 where the card title and the Borno/Kassala
     contrast are both visible; verify scene 6's final scroll to "Weeks of cover" actually
     lands; un-clip the exception card in scenes 7 and 8.

  9. [DEFER] Reconcile the narrative against the data: the locked narrative and scene 6's
     title both say "twelve thousand children" and "the ninth of September"; the product
     says 1,521 and August. The partner row is 3rd of 7, not top, is at Askira not Kukawa,
     and carries no report date to back "four days ago".

next_step: >-
  Findings 1 and 2 are the run. Everything else is cleanup. Do NOT re-render before
  fixing 1 — the payoff scene cannot pass while the product has no renderer for the
  outcome it claims.
