dimensions:
  concept_clarity:
    score: 2
    weight: 0.15
    binding_scene: 6
    justification: >-
      Scene 6's frame cannot support its own claim. The queue's premise — every exception
      ranked in one unit — is contradicted on screen by two of seven rows that report in
      days and carry no children figure, and the fourth exception kind the narration
      names (an expiring batch) is absent from the queue entirely. Elsewhere the concept
      reads clearly to someone already in the space, but SAM / IPC / "full course" are
      never glossed on screen.
  use_case_soundness:
    score: 3
    weight: 0.15
    binding_scene: 4
    scored_once_for_the_story: true
    justification: >-
      The use case itself is genuinely substantive — a multi-country famine response,
      real caseload denominators, exceptions ranked by children rather than tonnage. It
      is held to 3 by the rubric's "never shown at the scale where its value would be
      felt" rule: the append-only invariant is demonstrated on a ONE-ROW event log, and
      the reallocation payoff is demonstrated on the one exception kind whose resolution
      the data model cannot express. Both are casting/data choices, not concept flaws.
  design_soundness:
    score: 2
    weight: 0.20
    binding_scenes: [3, 6, 8]
    justification: >-
      Three independent interaction-model breaks. (1) Scene 3's milestone rail claims
      "planned, estimated and actual — the three are never collapsed" and renders exactly
      one timestamp per row; estimated_at is never rendered at all. (2) Scene 6's queue
      silently switches unit for two rows. (3) Scene 8's reallocation leaves the exception
      it answers first in the queue with its Reallocate button still live, inviting a
      second click on a problem already acted on — because answered_by, which the server
      computes and sorts on, has no renderer anywhere in the UI.
  visual_polish:
    score: 2
    weight: 0.12
    binding_scenes: [6, 7]
    justification: >-
      A real content-overflow defect on the partner-shortfall exception card: its headline
      collapses into a one-character-wide vertical column of fragments that escapes the
      card border into the map gutter. Present in scenes 6, 7 and 8, and worst in 7 where
      it destroys the headline of the very row the scene exists to show. Secondary:
      coverage pills mix 0- and 1-decimal precision and colour 145.8% the same green as
      91%, contradicting the demo's own expiry-risk argument.
  why_groundedness:
    score: 2
    weight: 0.15
    binding_scenes: [6, 8]
    justification: >-
      Two scenes assert past their evidence. Scene 6 is titled "Twelve thousand children,
      by the ninth of September"; the screen shows 1,521 children at risk and no date
      later than 8 August — an order-of-magnitude gap that also sits in the locked
      top-level narrative. Scene 8's spine item S5 is status GAP, and three of the four
      outcomes it narrates are contradicted by the page's own text rather than merely
      unshown.
  claim_reality_coherence:
    score: 1
    weight: 0.10
    blocking: false
    advisory: true
    excluded_from_overall: true
    binding_scenes: [2, 8]
    justification: >-
      Scene 2's entire subject — three ingestion tiers, hand-keyed data marked wherever it
      appears — is absent from the graded frame and from the full page-text dump, because
      the scene's last scripted action dismisses the modal that held it. Scene 8 narrates
      four recomputes and three are contradicted by the after-frame. Also unbacked: "four
      days ago" on the partner row (no report date exists on any card), and the +9d delta
      in scene 3 (no second date on screen to subtract from).
  motion_friction:
    score: 2
    weight: 0.13
    binding_scenes: [2, 5, 6, 7, 8]
    justification: >-
      Five of eight scenes mis-frame the artifact they narrate, and in every case the
      artifact would have fit. Scene 2 closes the modal before capture; scene 5's second
      scroll pushes the card's own title off-screen; scene 6's final scroll_to "Weeks of
      cover" is not reflected in the frame at all; scenes 7 and 8 clip the acted-on
      exception card at the top of the viewport.

overall_score: 2
