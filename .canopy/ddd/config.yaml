# Pins this repo's DDD artifacts to the "connect" canopy-web workspace tenant.
# Read by scripts/ddd/auth.py:resolve_ddd_workspace — every /canopy:ddd run here
# publishes under /w/connect/ddd/… instead of the default (dimagi) flat routes.
workspace: connect

# v1-mode loop (canopy >= 0.2.525): backlog mode harvests findings from one full
# judge and fixes them as one batch; convergence is still only declared on a full
# pass. The deploy gate refuses to judge until labs /health/ reports the fix
# PR's merge SHA on every sample (record it: python -m scripts.ddd.judge_gate
# set-fix-sha <run_id> <sha>).
#
# Objective (canopy >= 0.2.559): labs products are v1 — the demo is a PROBE and
# the product getting better is the goal. Blocking = product findings at
# medium/high severity (incl. the product lens + product lint); polish, arc and
# framing findings are deferred to ONE final polish pass. Switch a narrative to
# `demo` only when the walkthrough itself is the deliverable.
loop:
  objective: product
  mode: auto
  backlog_min_findings: 8
  full_rejudge_every: 3
  judge_tiering: auto
deploy_gate:
  health_url: https://labs.connect.dimagi.com/health/
  sha_field: git_sha
  samples: 5
  interval_seconds: 5
  attempts: 12
  retry_seconds: 30
# Inner loop (canopy >= 0.2.554): between checkpoints a fix batch renders against
# THIS checkout served locally (tools/ddd_demo.py): no PR, CI or deploy. The
# recipe's own seed.py still runs before every render; the recorder exports the
# origin it films (CANOPY_RENDER_BASE_URL), so on a localhost render the seeder
# reseeds the local build instead of labs. Checkpoints still go through
# deploy_gate above. Change NARRATIVE when the active narrative changes; a
# narrative's seeder needs a `seed_local` (see scripts/walkthroughs/_lib/local_seed.py).
inner_loop:
  base_url: http://localhost:8000
  setup: make serve-demo DEMO_PORT=8000 NARRATIVE=supply-sophie-unanswered-round
  health_url: http://localhost:8000/health/
  ready_timeout_seconds: 300
# Product objective (canopy >= 0.2.559). The lint runs on every render; the
# glossary and fonts are the two drifts the 2026-10-03 human review caught that
# no judge had: "round" put back after #2037 renamed it "tender", and supply
# screens off the labs typeface (tailwind/tailwind.css --font-sans).
product:
  floor: 3
  block_severities: [high, medium]
  lint:
    glossary: { round: tender }
    fonts: [Work Sans]
# Sub-step watchdog (canopy >= 0.2.533): a render, seed or fixer that runs past
# its budget, or a fixer that stops touching its heartbeat file, ends as
# timed_out instead of stalling the loop (run 1's batch 3 sat 4 h on a shared
# test database).
timeouts:
  default_minutes: 45
  heartbeat_minutes: 15
  fixer_minutes: 45
# Checked before every iteration: seeding runs over ECS exec (AWS profile labs)
# and every fix batch merges and deploys through gh.
auth_preflight:
  timeout_seconds: 20
  commands:
    # Seeding needs ONE live route: ECS exec (AWS SSO, needs a person to renew)
    # or the run-labs-command Actions workflow (GitHub OIDC) seed.py falls back to.
    - name: labs-seed-route
      run: aws sts get-caller-identity --profile labs >/dev/null 2>&1 || gh workflow view run-labs-command.yml --repo dimagi-internal/connect-labs >/dev/null
    - name: gh
      run: gh auth status
